<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Create account — Reasoning Hub</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="alternate icon" href="/favicon.ico">
<link rel="apple-touch-icon" href="/favicon-180.png">
<link rel="stylesheet" href="/css/theme.css">
<script>(function(){try{var t=localStorage.getItem('rh_theme');if(t==='dark'){document.documentElement.setAttribute('data-theme','dark');}}catch(e){}})();</script>
<link rel="manifest" href="/site.webmanifest">
<meta name="theme-color" content="#0E9E68" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#07080B" media="(prefers-color-scheme: dark)">
</head>
<body class="hub-body">
  <div class="auth-shell">
    <div class="auth-card">
      <h1>Create your account</h1>
      <p class="auth-sub">One account covers all three trackers. If your email is listed in this server's <span class="mono">ADMIN_EMAILS</span>, you'll be an admin from the moment you sign up.</p>
      <div class="auth-error" id="authError"></div>
      <form id="registerForm">
        <div class="auth-field">
          <label for="name">Name (optional)</label>
          <input type="text" id="name" autocomplete="name">
        </div>
        <div class="auth-field">
          <label for="email">Email</label>
          <input type="email" id="email" required autocomplete="email">
        </div>
        <div class="auth-field">
          <label for="password">Password</label>
          <input type="password" id="password" required minlength="6" autocomplete="new-password">
        </div>
        <button class="auth-submit" type="submit" id="submitBtn">Create account</button>
      </form>
      <div class="auth-switch">Already have an account? <a href="/login.html">Log in</a></div>
    </div>
  </div>

<script>
  const form = document.getElementById('registerForm');
  const errBox = document.getElementById('authError');
  const submitBtn = document.getElementById('submitBtn');

  // Pre-check so someone without an admin-listed email sees "closed" right
  // away instead of filling out the whole form first. Anyone with an
  // ADMIN_EMAILS address can still register even while this shows closed —
  // the server is the real gate, this is just a friendlier heads-up.
  (async () => {
    try {
      const res = await fetch('/api/public/settings');
      if (!res.ok) return;
      const data = await res.json();
      if (data.registrationOpen === false) {
        errBox.textContent = 'New sign-ups are currently closed. If you have an admin-issued email, you can still submit the form below.';
        errBox.classList.add('show');
      }
    } catch (e) { /* server may just be starting up — don't block the form over it */ }
  })();

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    errBox.classList.remove('show');
    submitBtn.disabled = true; submitBtn.textContent = 'Creating account…';
    try {
      const res = await fetch('/api/auth/register', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          name: document.getElementById('name').value,
          email: document.getElementById('email').value,
          password: document.getElementById('password').value
        })
      });
      let data;
      try { data = await res.json(); }
      catch (e) { throw new Error('The server sent back something unexpected (not JSON). Make sure the backend is actually running.'); }
      if (!res.ok) throw new Error(data.error || 'Could not create account');
      localStorage.setItem('rh_token', data.token);
      location.href = '/dashboard.html';
    } catch (err) {
      errBox.textContent = err.message;
      errBox.classList.add('show');
      submitBtn.disabled = false; submitBtn.textContent = 'Create account';
    }
  });
</script>
<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function () {
      navigator.serviceWorker.register('/sw.js').catch(function () {});
    });
  }
</script>
</body>
</html>
