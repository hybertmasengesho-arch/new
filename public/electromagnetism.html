{type:"Engineering reasoning", q:"An antenna's radiation resistance is often matched against the free-space impedance of ~377Ω conceptually. Explain, in outline, why this specific number (rather than 50Ω or some other value) is the natural reference impedance for a wave radiating into open space, tracing it back to η0=√(μ0/ε0)."},
{type:"Reasoning", q:"If E and H are ALWAYS mutually perpendicular for a plane wave, and you're given only the direction of E and the direction of propagation, is H's direction uniquely determined, or is there ambiguity? Justify using the transverse-wave structure."}
]},

{d:38,week:8,title:"Waves in Lossy Media & Loss Tangent",big:true,steps:6,
diagram:"waveLossy",
facts:[{tag:"KEY FACT", text:"tan(delta) = sigma/(omega eps) classifies a medium as low-loss dielectric, lossy, or good conductor at a given frequency."}, {tag:"CAUTION", text:"The SAME material can behave as a conductor at one frequency and a dielectric at another -- loss tangent is frequency-dependent."}],
mcqs:[
{q:"Loss tangent is defined as:", options:["tanδ=σ/(ωε)", "tanδ=ωε/σ", "tanδ=σε", "tanδ=1/σ"], correct:0, explain:"Ratio of conduction to displacement current."},
{q:"tanδ >> 1 indicates the medium behaves as a:", options:["Good (low-loss) dielectric", "Good conductor", "Perfect vacuum", "Perfect insulator"], correct:1, explain:"Conduction current dominates."},
{q:"tanδ << 1 indicates:", options:["A good conductor", "A good (low-loss) dielectric", "Infinite loss", "Zero permittivity"], correct:1, explain:"Displacement current dominates, minimal loss."},
{q:"Loss tangent depends on:", options:["Only the material, never frequency", "Both material properties AND frequency", "Only frequency", "Nothing physical"], correct:1, explain:"ω appears explicitly in the formula."},
{q:"The attenuation constant α governs:", options:["Phase advance only", "How fast wave amplitude decays", "Wavelength only", "Frequency only"], correct:1, explain:"α controls the exponential decay envelope."}
],
core:"Real media absorb energy from EM waves; the loss tangent quantifies exactly how 'lossy' a medium is at a given frequency — critical for cable, waveguide, and antenna design.",
notes:[
"Real materials have finite conductivity σ, which introduces energy loss into wave propagation. Incorporating σ into the wave equation via a COMPLEX permittivity leads to a complex propagation constant γ=α+jβ, where α (attenuation constant) governs how fast the wave amplitude decays, and β (phase constant) governs how fast the phase advances.",
"The LOSS TANGENT, tanδ=σ/(ωε), is the single number that classifies a medium's behavior at a given frequency: tanδ<<1 means the medium behaves as a GOOD (low-loss) DIELECTRIC (conduction current negligible compared to displacement current); tanδ>>1 means the medium behaves as a GOOD CONDUCTOR (conduction current dominates); tanδ≈1 is the intermediate 'lossy dielectric' regime.",
"The crucial insight is that tanδ DEPENDS ON FREQUENCY (since ω appears in the denominator) — the SAME physical medium can behave as a good conductor at low frequency and a good (lower-loss) dielectric at high frequency, or vice versa, depending on how σ and ε individually scale with frequency for that material. This is precisely why 'is this material a conductor or an insulator' is not always a frequency-independent question in RF engineering.",
"<strong>Worked example:</strong> For σ=0.01 S/m, ε=5ε0, f=1MHz, tanδ=σ/(ωε)≈36. Since tanδ>>1, this medium behaves as a GOOD CONDUCTOR at this frequency — even though it might behave as a dielectric at a much higher frequency where ωε grows large enough to dominate.",
"<strong>Self-check:</strong> always recompute tanδ at the SPECIFIC frequency given — a material's conductor-vs-dielectric classification is frequency-dependent, not a fixed label.",
"<strong>Application:</strong> Loss-tangent analysis governs underground and underwater communication system design (where conductivity dominates) and PCB dielectric material selection for high-speed digital signal integrity, where even small losses accumulate over long traces."
],
formulas:["γ = α + jβ = jω√(με) √(1 - jσ/(ωε))","tanδ = σ/(ωε)"],
questions:[
{type:"Conceptual", q:"Given that tanδ depends on frequency, what practical design consequence does this have for choosing carrier frequencies in undersea or underground telecom cables, where the surrounding medium (water, soil) has fixed σ but frequency-dependent behavior relative to it?"},
{type:"Engineering reasoning", q:"A dielectric substrate used for a PCB at low frequency (audio) might behave as an excellent insulator, but at microwave frequency it introduces measurable signal loss. Explain this shift using the loss-tangent formula — what's happening to the RELATIVE size of conduction versus displacement current as frequency increases?"},
{type:"Reasoning", q:"Seawater is a famously poor medium for long-range RF communication, yet ELF (extremely low frequency) submarine communication does work through it. Using tanδ=σ/(ωε), explain why LOWERING the frequency specifically helps here, even though lower frequency usually means less bandwidth and larger antennas."}
]},

{d:39,week:8,title:"Poynting Vector & Power Flow",big:false,steps:5,

{q:"S points in the direction of:", options:["Charge motion", "Energy flow", "Zero flow always", "Force only"], correct:1, explain:"Instantaneous direction of EM power transport."},

{q:"S_avg = ½Re(E×H*) requires:", options:["Real E and H only, no complex math", "Complex phasor E and H", "Zero field", "Static fields"], correct:1, explain:"Phasor analysis with the complex conjugate of H."}
],
core:"The Poynting vector quantifies instantaneous power flow direction and magnitude in an EM wave — the direct link between field theory and transmitted/received power in real systems.",
notes:[
"The Poynting vector, S=E×H, points in the direction of energy flow at every point in space, with magnitude equal to the instantaneous power density (power per unit area) carried by the wave. This is the field-theoretic origin of every 'power budget' calculation used in antenna and link-design work.",
"For a sinusoidal plane wave, the TIME-AVERAGED Poynting vector, S_avg=½Re(E×H*), is what's actually useful in practice — instantaneous power oscillates rapidly, but average power (over one cycle) is the physically meaningful quantity for link budgets, thermal design, and safety exposure limits.",
"Poynting's theorem more generally expresses energy conservation for the EM field, accounting for energy flowing in/out through a surface, energy stored in the field, and energy dissipated as heat (in lossy media, connecting directly back to Day 38) — a complete accounting exactly analogous to power balance in circuit theory.",
"<strong>Worked example:</strong> For a plane wave in free space with E0=100 V/m, S_avg=E0²/(2η0)=100²/(2×377)≈13.3 W/m² — the kind of power-density figure used directly in antenna link-budget and exposure calculations.",
"<strong>Self-check:</strong> S_avg=E0²/(2η) only applies to a single traveling plane wave in a lossless medium — for standing waves or lossy media, use the general S_avg=½Re(E×H*) instead.",
"<strong>Application:</strong> Poynting-vector power calculations are exactly how EIRP (effective isotropic radiated power) is computed for antenna certification, and how RF exposure/safety compliance testing verifies a device meets radiation limits."
],
formulas:["S = E × H","S_avg = ½ Re(E × H*)"],
questions:[

{type:"Engineering reasoning", q:"A link-budget calculation for a wireless communication system ultimately reduces to tracking average power density (S_avg) from transmitter to receiver. Explain, conceptually, how the intrinsic impedance η from Day 37 connects the E-field amplitude a receiver measures to the actual power density arriving — why can't you get power from E alone?"},

{d:40,week:8,title:"Capstone — Foundations for Transmission Lines & Antennas",big:true,steps:7,
diagram:{type:"conceptmap", nodes:["Fields","Waves","Transmission Line","Antenna"]},
facts:[{tag:"KEY FACT", text:"Z0 = sqrt(L/C) is the transmission-line analog of eta = sqrt(mu/eps) -- both are geometry/material-determined impedance ratios."}, {tag:"INSIGHT", text:"Every result in transmission-line and antenna theory is Maxwell's four equations applied to a new geometry -- nothing new is being invented."}],
mcqs:[
{q:"Characteristic impedance of a transmission line is:", options:["Z0=√(L/C)", "Z0=LC", "Z0=L/C²", "Z0=√(LC)"], correct:0, explain:"Per-unit-length inductance and capacitance ratio."},
{q:"Z0 is structurally analogous to:", options:["Capacitance C", "Intrinsic impedance η=√(μ/ε)", "Charge Q", "Current I"], correct:1, explain:"Both are geometry/material-determined impedance ratios."},
{q:"An impedance mismatch at a boundary causes:", options:["No effect", "A reflected wave", "Infinite transmission", "Zero transmission"], correct:1, explain:"Boundary conditions force a reflected component."},
{q:"The telegrapher's equations originate from:", options:["Ohm's Law alone", "The EM wave equation applied to a transmission-line geometry", "Coulomb's Law only", "Nothing related to Maxwell's equations"], correct:1, explain:"A specific-geometry case of the general wave equation."},
{q:"The deepest lesson of the 40-day course is that transmission lines and antennas are:", options:["A completely separate theory from electrostatics/magnetostatics", "Special cases of the same four Maxwell's equations", "Unrelated to Weeks 1-35", "Purely empirical with no theoretical basis"], correct:1, explain:"Everything traces back to the same unified theory."}
],
core:"Close the loop: every tool from Weeks 1–7 reappears directly in transmission-line and antenna theory, your very next courses in the ETE sequence.",
notes:[
"A transmission line's per-unit-length capacitance and inductance are computed using the EXACT SAME Gauss's-Law (Day 9) and Ampère's-Law (Day 22) techniques you mastered in electrostatics and magnetostatics — the line is simply a distributed version of the lumped C and L elements from Days 19 and 29.",
"The line's characteristic impedance, Z0=√(L/C), is structurally identical to the intrinsic wave impedance η=√(μ/ε) from Day 37 — both are 'how much voltage per unit current/field' ratios determined purely by geometry and material, reinforcing that a transmission line is really just a GUIDED version of the plane wave you studied in free space.",
"Boundary conditions (Day 35) directly explain REFLECTION at an impedance mismatch — when Z0 changes abruptly (e.g., cable meets antenna), the E/H field boundary conditions cannot be satisfied by a purely forward-traveling wave alone, forcing a reflected wave to appear, exactly the way a dielectric boundary (Day 18) forced bound charge to appear.",
"The wave equation (Day 36) becomes the telegrapher's equations governing voltage/current waves ON a transmission line, and the Poynting vector (Day 39) becomes the radiated power calculation for an antenna — at every step, the SAME four Maxwell's equations from Day 34 are simply being applied to a new, more specific geometry.",
"The deepest lesson of the full 40 days: there was never a moment where the subject 'changed' from electrostatics to magnetostatics to waves — you were building ONE theory (Maxwell's equations) one special case at a time, and everything from here in your ETE curriculum (transmission lines, antennas, waveguides, RF circuits) is simply MORE special cases of the exact same four equations.",
"<strong>Worked example:</strong> A transmission line has L=250nH/m, C=100pF/m. Z0=√(L/C)=√(2500)=50Ω — exactly the standard 50Ω used throughout RF engineering, showing how a familiar textbook number comes from real per-unit-length geometry.",
"<strong>Self-check:</strong> whenever Z0 doesn't match the source or load impedance, expect a reflected wave — quantifying it via Γ=(ZL−Z0)/(ZL+Z0) is the very next tool your transmission-lines course builds on today's boundary-condition reasoning.",
"<strong>Application:</strong> Everything from this capstone — impedance matching, reflection at discontinuities, radiated power — is the daily toolkit of RF/microwave engineers designing the antennas, cables, and matching networks inside every wireless product you use."
],
formulas:["Z0 = √(L/C)","η = √(μ/ε)","Telegrapher's equations ← wave equation ← Maxwell's equations"],
questions:[
{type:"Conceptual", q:"Every result in transmission-line and antenna theory you will learn next semester is, structurally, a special case of Maxwell's equations applied to a new geometry. What does this tell you about why deeply understanding Weeks 1–7 (rather than memorizing formulas) pays off across your ENTIRE ETE degree, not just this course?"},
{type:"Engineering reasoning", q:"A cable with characteristic impedance Z0=50Ω is connected to an antenna with input impedance 75Ω. Using the boundary-condition reasoning from today, explain WHY this mismatch necessarily produces a reflected wave — what physical requirement (continuity of what quantities?) cannot be satisfied without one?"},
{type:"Reasoning", q:"If you had to remove exactly ONE of Maxwell's four equations and still wanted a self-consistent (if incomplete) theory, which one could be removed with the LEAST structural damage to everything you've learned across all 40 days — and which one is truly IRREPLACEABLE? Defend both choices explicitly."}
]}
];

<text x="320" y="105" style="${T}">e^(-αz) decay envelope</text>`),

<text x="195" y="90" style="${T}">E = 0</text>
${[0,45,90,135,180,225,270,315].map(a=>{const r=Math.PI/180*a; return `<circle cx="${230+Math.cos(r)*47}" cy="${85+Math.sin(r)*47}" r="2" fill="#1F5FA8"/>`;}).join('')}

function boundarySVG(top, bottom, caption){
  return svg(`
<line x1="60" y1="85" x2="380" y2="85" stroke="#5B6470" stroke-width="1.5"/>
<text x="240" y="35" style="font:11px monospace;fill:#1F8A57">${top}</text>
<text x="240" y="150" style="font:11px monospace;fill:#1F5FA8">${bottom}</text>
<line x1="200" y1="85" x2="200" y2="40" stroke="#1F8A57" stroke-width="2" marker-end="url(#ac)"/>
<line x1="200" y1="85" x2="200" y2="130" stroke="#1F5FA8" stroke-width="2" marker-end="url(#ao)"/>
<line x1="200" y1="85" x2="250" y2="55" stroke="#1F8A57" stroke-width="2" stroke-dasharray="3 2" marker-end="url(#ac)"/>
<text x="55" y="20" style="${T}">${caption}</text>`);
}

function conceptMapSVG(nodes){
  const n = nodes.length, totalW = 420, boxW = Math.min(96, (totalW-(n-1)*16)/n), gap = (totalW-n*boxW)/(n-1);
  let x = 20, boxes='', arrows='';
  nodes.forEach((label,i)=>{
    boxes += `<rect x="${x}" y="68" width="${boxW}" height="38" rx="3" fill="#121D2C" stroke="#1F5FA8" stroke-width="1.5"/><text x="${x+7}" y="91" style="font:9.5px 'IBM Plex Mono',monospace;fill:#E7EDF3">${label.length>13?label.slice(0,13):label}</text>`;
    if(i<n-1){ arrows += `<line x1="${x+boxW}" y1="87" x2="${x+boxW+gap-4}" y2="87" stroke="#1F8A57" stroke-width="2" marker-end="url(#ac)"/>`; }
    x += boxW+gap;
  });
  return svg(boxes+arrows);
}

function diagramHTML(spec){
  if(typeof spec === 'string') return DIAGRAMS[spec] || '';
  if(spec.type === 'conceptmap') return conceptMapSVG(spec.nodes);
  if(spec.type === 'boundary') return boundarySVG(spec.top, spec.bottom, spec.caption);
  return '';
}

// ---------- Rendering ----------
const weekListEl = document.getElementById('week-list');
const contentEl = document.getElementById('content');
const crumbEl = document.getElementById('crumb');
const TOTAL_DAYS = 40;
let currentDay = 1;

/* ---------------- progress persistence (real account, via storage-shim.js) ---------------- */
let progress = {};
async function loadProgress(){
  if(!(window.storage && typeof window.storage.get === 'function')) return;
  try{
    const res = await window.storage.get('progress', false);
    if(res && res.value){ progress = JSON.parse(res.value); }
  }catch(e){}
}
async function saveProgress(){
  if(!(window.storage && typeof window.storage.set === 'function')) return;
  try{ await window.storage.set('progress', JSON.stringify(progress), false); }catch(e){}
}
function isDayComplete(dayNum){
  const day = DAYS.find(x=>x.d===dayNum);
  const entry = progress[dayNum];
  return !!(day && entry && entry.total === day.mcqs.length && entry.correct !== undefined);
}

function buildSidebar(){
  WEEKS.forEach(w=>{
    const det = document.createElement('details');
    det.className = 'week';
    det.open = (w.n===1);
    const sum = document.createElement('summary');
    sum.innerHTML = `<span>Week ${w.n} — ${w.title}</span><span class="wk-range">${w.range}</span>`;
    det.appendChild(sum);
    const list = document.createElement('div');
    list.className = 'day-list';
    DAYS.filter(d=>d.week===w.n).forEach(d=>{
      const btn = document.createElement('button');
      btn.className = 'day-btn';
      btn.id = 'nav-' + d.d;
      btn.innerHTML = `<span class="num">${String(d.d).padStart(2,'0')}</span><span>${d.title}</span>${d.big?'<span class="flag">7-STEP</span>':''}<span class="flag" id="done-${d.d}" style="display:${isDayComplete(d.d)?'':'none'};">✓</span>`;
      btn.onclick = ()=>renderDay(d.d, true);
      list.appendChild(btn);
    });
    det.appendChild(list);
    weekListEl.appendChild(det);
  });
}

function renderDay(n, scrollNav){
  const d = DAYS.find(x=>x.d===n);
  if(!d) return;
  currentDay = n;
  document.querySelectorAll('.day-btn').forEach(b=>b.classList.remove('active'));
  const activeBtn = document.getElementById('nav-'+n);
  if(activeBtn){
    activeBtn.classList.add('active');
    const parentDetails = activeBtn.closest('details');
    if(parentDetails) parentDetails.open = true;
    if(scrollNav) activeBtn.scrollIntoView({block:'nearest'});
  }
  const week = WEEKS.find(w=>w.n===d.week);
  crumbEl.textContent = `WEEK ${d.week} · ${week.title.toUpperCase()}`;

  const notesHtml = d.notes.map(p=>`<p>${p}</p>`).join('');
  const formulaHtml = d.formulas.map(f=>`<div class="formula">${f}</div>`).join('');
  const qHtml = d.questions.map(q=>`<div class="qcard"><div class="qtype">${q.type}</div><p>${q.q}</p></div>`).join('');
  const diagramSvg = diagramHTML(d.diagram);
  const factsHtml = d.facts.map(f=>{
    const cls = f.tag==='INSIGHT' ? 'insight' : (f.tag==='CAUTION' ? 'caution' : 'key');
    return `<div class="fact ${cls}"><span class="tag">${f.tag}</span>${f.text}</div>`;
  }).join('');
  const mcqHtml = d.mcqs.map((m,qi)=>{
    const opts = m.options.map((opt,oi)=>
      `<button class="mcq-opt" data-day="${d.d}" data-q="${qi}" data-o="${oi}">${String.fromCharCode(65+oi)}. ${opt}</button>`
    ).join('');
    return `<div class="mcq-card" id="mcq-${d.d}-${qi}">
      <div class="mcq-q">${qi+1}. ${m.q}</div>
      <div class="mcq-options">${opts}</div>
      <div class="mcq-explain" id="exp-${d.d}-${qi}">${m.explain}</div>
    </div>`;
  }).join('');

  contentEl.innerHTML = `
    <div class="day-meta">
      <span class="day-tag">DAY ${String(d.d).padStart(2,'0')} / 40</span>
      <span class="step-tag ${d.big?'big':''}">${d.steps}-step ${d.big?'(big topic)':''}</span>
    </div>
    <h2 class="day-title">${d.title}</h2>
    <p class="core-idea">${d.core}</p>
    <div class="diagram-wrap">${diagramSvg}<div class="diagram-cap">figure — Day ${d.d} concept sketch (animated)</div></div>
    <section class="block">
      <h3>KEY FACTS</h3>
      <div class="facts">${factsHtml}</div>
    </section>
    <section class="block notes">
      <h3>NOTES</h3>
      ${notesHtml}
    </section>
    <section class="block">
      <h3>IMPORTANT FORMULAS</h3>
      <div class="formula-list">${formulaHtml}</div>
    </section>
    <section class="block">
      <h3>CRITICAL-THINKING &amp; ENGINEERING REASONING</h3>
      <div class="qlist">${qHtml}</div>
    </section>
    <section class="block">
      <h3>QUICK CHECK — 5 MULTIPLE CHOICE</h3>
      <div class="mcq-score" id="mcq-score-${d.d}">0 / ${d.mcqs.length} answered</div>
      <div class="mcq-list">${mcqHtml}</div>
    </section>
    <div class="daynav">
      <button id="prevBtn" ${n<=1?'disabled':''}>&larr; Day ${n-1}</button>
      <button id="nextBtn" ${n>=TOTAL_DAYS?'disabled':''}>Day ${n+1} &rarr;</button>
    </div>
  `;
  const prevBtn = document.getElementById('prevBtn');
  const nextBtn = document.getElementById('nextBtn');
  if(prevBtn) prevBtn.onclick = ()=>{renderDay(n-1,true); window.scrollTo(0,0);};
  if(nextBtn) nextBtn.onclick = ()=>{renderDay(n+1,true); window.scrollTo(0,0);};
  restoreAnswerState(d);
  window.scrollTo(0,0);
}

// Re-applies the same visual "answered" state the click handler below
// applies live — so revisiting a day, or reloading the page, shows your
// past answers instead of a blank quiz every time.
function restoreAnswerState(d){
  const entry = progress[d.d];
  if(!entry || !entry.answers) return;
  Object.keys(entry.answers).forEach(qiStr=>{
    const qi = parseInt(qiStr);
    const oi = entry.answers[qiStr];
    const m = d.mcqs[qi];
    if(!m) return;
    const card = document.getElementById('mcq-'+d.d+'-'+qi);
    if(!card || card.classList.contains('answered')) return;
    card.classList.add('answered');
    const opts = card.querySelectorAll('.mcq-opt');
    opts.forEach((o,i)=>{
      o.classList.add('disabled');
      if(i===m.correct) o.classList.add('correct');
      else if(i===oi) o.classList.add('incorrect');
    });
    const exp = document.getElementById('exp-'+d.d+'-'+qi);
    if(exp) exp.classList.add('show');
  });
  const scoreEl = document.getElementById('mcq-score-'+d.d);
  if(scoreEl && entry.total !== undefined){
    scoreEl.textContent = `${entry.total} / ${d.mcqs.length} answered — ${entry.correct} correct so far`;
  }
}

(async function init(){
  await loadProgress();
  buildSidebar();
  renderDay(1, true);
})();

// ---------- MCQ interaction (event delegation) ----------
contentEl.addEventListener('click', function(e){
  const btn = e.target.closest('.mcq-opt');
  if(!btn) return;
  const card = btn.closest('.mcq-card');
  if(card.classList.contains('answered')) return;
  card.classList.add('answered');

  const dayNum = parseInt(btn.dataset.day);
  const qi = parseInt(btn.dataset.q);
  const oi = parseInt(btn.dataset.o);
  const day = DAYS.find(x=>x.d===dayNum);
  const m = day.mcqs[qi];

  const opts = card.querySelectorAll('.mcq-opt');
  opts.forEach((o,i)=>{
    o.classList.add('disabled');
    if(i===m.correct) o.classList.add('correct');
    else if(i===oi) o.classList.add('incorrect');
  });
  const exp = document.getElementById('exp-'+dayNum+'-'+qi);
  if(exp) exp.classList.add('show');

  const scoreEl = document.getElementById('mcq-score-'+dayNum);
  let answered = 0, correctCount = 0;
  if(scoreEl){
    answered = card.parentElement.querySelectorAll('.mcq-card.answered').length;
    correctCount = Array.from(card.parentElement.querySelectorAll('.mcq-card.answered')).reduce((acc,c)=>{
      const chosenIncorrect = c.querySelector('.mcq-opt.incorrect');
      return acc + (chosenIncorrect ? 0 : 1);
    },0);
    scoreEl.textContent = `${answered} / ${day.mcqs.length} answered — ${correctCount} correct so far`;
  }

  if(!progress[dayNum]) progress[dayNum] = { answers: {} };
  progress[dayNum].answers[qi] = oi;
  progress[dayNum].total = answered;
  progress[dayNum].correct = correctCount;
  saveProgress();
  if(answered === day.mcqs.length){
    const doneFlag = document.getElementById('done-'+dayNum);
    if(doneFlag) doneFlag.style.display = '';
  }
});
</script>
