{q:"Bound charge appears at a boundary due to:", options:["Free charge injection", "A discontinuity in polarization P", "Zero permittivity", "Conductor presence"], correct:1, explain:"Polarization change at the interface produces bound charge."},
{q:"D tracks:", options:["Total charge (free+bound)", "Free charge only", "Bound charge only", "Neither"], correct:1, explain:"This is precisely why D is useful across dielectric boundaries."}
],
core:"Dielectrics respond to applied fields via bound charge, and this response makes E and D behave differently across a material boundary.",
notes:[
"Unlike conductors, dielectrics have no free charge carriers — but their molecules polarize (stretch/align) in response to an applied field, producing an internal polarization P and associated BOUND charge densities ρ_pv (volume) and ρ_ps (surface), distinct from free charge.",
"This leads to D = ε0E + P, which simplifies to D = εE = ε0εrE for LINEAR dielectrics (where P is proportional to E). The key insight: D tracks only FREE charge, while E responds to the TOTAL charge (free + bound) — this is precisely why D remained useful across Week 2 and now shows its real purpose.",
"At a boundary between two different dielectrics (or dielectric and free space), two conditions apply: tangential E is always continuous (E_t1 = E_t2), while normal D is continuous ONLY if there's no free surface charge at the interface (D_n1 - D_n2 = ρS,free). Solving two-dielectric problems means applying BOTH conditions simultaneously.",
"Physically, bound charge appears at a dielectric boundary even though the dielectric is overall neutral because the polarization vector P changes abruptly at the boundary — a discontinuity in P produces an effective surface charge, exactly as ∇·P relates to bound volume charge in the bulk.",
"<strong>Worked example:</strong> A parallel-plate region has free surface charge ρS=4nC/m² on a conductor plate, with a dielectric εr=2 filling the gap. By Gauss's Law at the conductor surface, D=ρS=4nC/m² throughout the gap. Inside the dielectric, E=D/(ε0εr)≈226 V/m — half what it would be in free space at the same D.",
"<strong>Self-check:</strong> always identify FIRST whether your boundary is conductor–dielectric or dielectric–dielectric — the applicable condition differs, and confusing them is the most common Week 4 exam error.",
"<strong>Application:</strong> Dielectric properties directly drive PCB substrate selection (FR4 vs. Rogers laminates) — a material's εr sets trace impedance and signal propagation speed, a critical spec in every high-speed digital and RF board design."
],
formulas:["D = ε0E + P = εE = ε0εr E","E_t1 = E_t2","D_n1 - D_n2 = ρS(free)"],
questions:[
{type:"Conceptual", q:"At a dielectric-dielectric interface with no free charge, D_n is continuous but E_n is not. Physically, why does the flux quantity (D) stay continuous while the force-per-charge quantity (E) doesn't?"},
{type:"Engineering reasoning", q:"A PCB substrate (dielectric) sits beneath a copper trace. At the trace-substrate boundary, which boundary condition (tangential E or normal D) governs how the field couples from the trace into the substrate material — and why does this matter for signal integrity in high-speed design?"},
{type:"Reasoning", q:"If you doubled εr of a dielectric while keeping the SAME free charge on an adjacent conductor surface, predict what happens to E just inside the dielectric versus D just inside it — do they respond the same way or differently? Justify from D = εE."}
]},

{d:19,week:4,title:"Capacitance and Capacitors",big:false,steps:5,
diagram:"energyCap",
facts:[{tag:"KEY FACT", text:"C = eps A/d for a parallel-plate capacitor -- inserting a dielectric always increases C."}, {tag:"CAUTION", text:"Series capacitors combine reciprocally (shared charge); parallel capacitors add directly (shared voltage) -- don't mix up the rule."}],
mcqs:[
{q:"C = εA/d applies to:", options:["Spherical capacitors", "Parallel-plate capacitors", "Coaxial cables only", "Any shape"], correct:1, explain:"Standard parallel-plate capacitance formula."},
{q:"Inserting a dielectric always:", options:["Decreases C", "Increases C", "Has no effect", "Makes C negative"], correct:1, explain:"Polarization reduces net E, raising C at fixed Q."},
{q:"Capacitors in parallel combine:", options:["Reciprocally", "Directly (add)", "Randomly", "Only in series"], correct:1, explain:"They share the same voltage."},
{q:"Capacitors in series combine:", options:["Directly (add)", "Reciprocally (1/C sum)", "Randomly", "Only in parallel"], correct:1, explain:"They share the same charge."},
{q:"C = Q/V is:", options:["Dependent on applied Q and V individually", "A constant ratio for a given geometry", "Always 1", "Undefined for dielectrics"], correct:1, explain:"Capacitance is a geometric/material constant."}
],
core:"Capacitance is a purely geometric/material property relating stored charge to potential difference — independent of the actual charge or voltage applied.",
notes:[
"Capacitance C = Q/V is defined as the ratio of charge stored to potential difference created — critically, this ratio is CONSTANT for a given geometry and dielectric, regardless of how much charge or voltage you actually apply. Doubling Q simply doubles V proportionally.",
"Standard geometries — parallel-plate (C = εA/d), coaxial cylindrical, and concentric spherical — each follow from applying Gauss's Law (Day 9) to find E, then integrating to find V, then forming the ratio Q/V. These derivations are worth redoing from scratch rather than memorizing, since they reinforce the whole Week 2–4 toolchain.",
"For combinations: capacitors in PARALLEL add directly (C_total = C1+C2+...) because they share the same voltage; capacitors in SERIES combine reciprocally (1/C_total = 1/C1+1/C2+...) because they share the same charge. Multi-layer dielectric capacitors require careful application of the Day 18 boundary conditions at each interface.",
"<strong>Worked example:</strong> A parallel-plate capacitor has area A=0.01m², separation d=1mm, dielectric εr=4. C=ε0εrA/d≈3.54×10⁻¹⁰F=354pF. At V=12V, Q=CV≈4.25nC.",
"<strong>Self-check:</strong> unit mismatches (like leaving d in mm instead of converting to m — a factor-of-1000 error) are the single most common capacitance mistake. Convert every length to meters before plugging in.",
"<strong>Application:</strong> Capacitance calculations size decoupling/bypass capacitors that filter power-supply noise in digital circuits, and underlie the capacitive sensing elements used in touch panels, MEMS accelerometers, and pressure sensors."
],
formulas:["C = Q/V","C_parallel-plate = εA/d","C_series: 1/C = Σ(1/Ci)   |   C_parallel: C = ΣCi"],
questions:[
{type:"Conceptual", q:"Why does inserting a dielectric ALWAYS increase capacitance regardless of geometry? Trace the causal chain from polarization → reduced net E (at fixed free charge) → increased C."},
{type:"Engineering reasoning", q:"A designer needs to increase a parallel-plate capacitor's value without changing its footprint on a PCB. List every physical parameter in C = εA/d they could adjust, and rank them by practical feasibility in a real fabrication process."},
{type:"Reasoning", q:"For a multi-layer dielectric capacitor (layers in series along the field direction), is the correct combination rule the 'series' formula or something else? Justify by checking which physical quantity (charge or field) is actually shared across the layers."}
]},

{d:20,week:4,title:"Poisson's and Laplace's Equations",big:true,steps:7,
diagram:"platesLaplace",
facts:[{tag:"KEY FACT", text:"Poisson: grad^2 V = -rho_v/eps. Laplace (charge-free): grad^2 V = 0."}, {tag:"INSIGHT", text:"The Uniqueness Theorem makes 'inspired guessing' mathematically rigorous: match the PDE and boundary conditions and you're done."}],
mcqs:[
{q:"Poisson's equation is:", options:["∇²V = -ρv/ε", "∇²V = ρv", "∇×V=0", "∇V=ρv/ε"], correct:0, explain:"General form relating potential to charge density."},
{q:"Laplace's equation applies in regions that are:", options:["Charge-free", "Full of charge", "Conductive", "Magnetic"], correct:0, explain:"Special case of Poisson's equation with ρv=0."},
{q:"The Uniqueness Theorem guarantees:", options:["Multiple valid solutions", "One and only one solution matching PDE + boundary conditions", "No solution exists", "Solutions are always guesses"], correct:1, explain:"This licenses 'inspired guessing' as a rigorous method."},
{q:"Laplace's equation method works even when:", options:["No symmetry is present", "Only spherical symmetry exists", "Only for point charges", "Never"], correct:0, explain:"More general than Gauss's Law's symmetry requirement."},
{q:"∇² in different coordinate systems is:", options:["Always identical in form", "Different, depending on the system", "Undefined", "Only valid in Cartesian"], correct:1, explain:"The Laplacian has distinct explicit forms per system."}
],
core:"Combining ∇·D=ρv with E=-∇V gives a single PDE that solves electrostatics purely from boundary conditions — no symmetry required.",
notes:[
"Substituting E = -∇V into Gauss's differential law ∇·D = ρv (with D = εE) yields Poisson's equation: ∇²V = -ρv/ε. In charge-free regions, this reduces to the simpler LAPLACE'S EQUATION: ∇²V = 0. Together, these are the most general tools in electrostatics — they work even when NO symmetry is present, unlike Gauss's Law's integral form.",
"The Laplacian operator ∇² takes different explicit forms in Cartesian, cylindrical, and spherical coordinates; selecting the right form (again tied back to Day 2's coordinate choice) is the first real step in any boundary-value problem.",
"Solved examples — parallel plates in 1D Cartesian, coaxial cable in 1D cylindrical — show the general method: write the ODE/PDE for the geometry, integrate, then apply the specific boundary conditions (known V's or charges at the boundaries) to pin down the constants of integration.",
"The UNIQUENESS THEOREM is what makes this entire method rigorous rather than a lucky guess: if a function satisfies Laplace's/Poisson's equation AND matches the given boundary conditions, it is GUARANTEED to be the one and only correct solution. This licenses 'inspired guessing' — if your guessed V satisfies both the PDE and boundary conditions, you're done, full stop, no further verification needed.",
"<strong>Worked example:</strong> Two parallel plates are separated by d=0.02m, with V=0 at x=0 and V=50V at x=d. Solving d²V/dx²=0 gives V(x)=Ax+B; the boundary conditions give A=2500, B=0, so V(x)=2500x and E=−dV/dx=−2500 V/m, constant as expected.",
"<strong>Self-check:</strong> solving Laplace's equation always starts from the general solution form for your coordinate system (linear in 1D Cartesian, logarithmic in 1D cylindrical) — memorize these so you don't have to re-derive them under exam pressure.",
"<strong>Application:</strong> Laplace/Poisson solvers are the computational engine inside every commercial EM/IC simulation tool (ANSYS, COMSOL, TCAD) used to design PCB layouts, connectors, and semiconductor doping profiles from boundary specifications alone."
],
formulas:["∇²V = -ρv/ε  (Poisson's equation)","∇²V = 0  (Laplace's equation, charge-free)"],
questions:[
{type:"Conceptual", q:"The Uniqueness Theorem says a solution satisfying Laplace's equation and the boundary conditions IS the solution. Why does this make 'inspired guessing' a mathematically rigorous problem-solving method here, unlike in most other engineering contexts?"},
{type:"Engineering reasoning", q:"An irregular-shaped conductor geometry (no clean symmetry) needs its field solved for a shielding design. Explain why Laplace's equation approach can succeed here where Gauss's Law's integral form (Day 9) fails outright — what does 'no symmetry required' actually buy you?"},
{type:"Reasoning", q:"Explain why Laplace's/Poisson's equation approach is strictly MORE GENERAL than the Gauss's Law symmetry method from Day 9 — is every Gauss's-Law-solvable problem also solvable by Laplace's equation? Is the reverse true?"}
]},

{d:21,week:5,title:"Biot–Savart Law",big:false,steps:5,
diagram:"biotSavart",
facts:[{tag:"KEY FACT", text:"dH = I dL x R-hat / (4 pi R^2) -- direction is perpendicular to BOTH the current and the line to the field point."}, {tag:"CAUTION", text:"Unlike Coulomb's law, Biot-Savart field direction is never along the line to the source -- always apply the right-hand rule."}],
mcqs:[
{q:"Biot-Savart's dH direction is:", options:["Along the line to the source", "Perpendicular to both dL and R̂", "Parallel to dL only", "Random"], correct:1, explain:"Cross-product geometry, unlike Coulomb's law."},
{q:"The infinite-wire H field falls off as:", options:["1/ρ", "1/ρ²", "Constant", "ρ²"], correct:0, explain:"Standard infinite-wire result from Biot-Savart/Ampère."},
{q:"Biot-Savart is the magnetic analog of:", options:["Gauss's Law", "Coulomb's Law", "Faraday's Law", "Ohm's Law"], correct:1, explain:"Both describe field contributions from elemental sources."},
{q:"On the axis of a circular loop, far away, the field resembles:", options:["A point charge field", "A magnetic dipole field", "A uniform field", "Zero field"], correct:1, explain:"Far-field loop behaves like a magnetic dipole."},
{q:"The field direction in Biot-Savart is found via:", options:["Dot product", "Cross product / right-hand rule", "Gradient", "Divergence"], correct:1, explain:"dH = IdL×R̂/4πR² uses the cross product."}
],
core:"Current elements generate magnetic field the way charge elements generate electric field — but the geometry is fundamentally cross-product-based, not radial.",
notes:[
"The Biot–Savart Law, dH = (I dL × â_R)/(4πR²), gives the magnetic field contribution from a small current element. Unlike Coulomb's law, the direction of dH is NOT along the line to the source point — it's PERPENDICULAR to both the current direction and the line to the field point, via the cross product.",
"Integrating over a finite straight wire gives a formula involving the angles subtended at the ends; taking the wire-length-to-infinity limit recovers the simpler, commonly memorized infinite-wire result H = I/(2πρ).",
"For a circular current loop, evaluating H on the axis gives a result that, far from the loop, resembles a magnetic dipole field — directly paralleling the electric dipole result from Day 13, reinforcing the electric/magnetic structural analogy that runs through the whole course.",
"<strong>Worked example:</strong> A straight wire carries I=5A. At perpendicular distance R=0.1m (treating it as effectively infinite), H=I/(2πR)≈7.96 A/m, and B=μ0H≈1×10⁻⁵T=10μT — comparable to Earth's magnetic field.",
"<strong>Self-check:</strong> Biot–Savart problems almost always need the cross product worked out FIRST for direction, and only then the magnitude — skipping the direction step is a common source of sign/orientation errors.",
"<strong>Application:</strong> Biot–Savart-based field calculations size RF choke inductors and optimize coil geometry for near-field wireless power transfer systems (like phone charging pads), where coil shape directly determines coupling efficiency."
],
formulas:["dH = (I dL × â_R) / (4π R²)","H_infinite-wire = I/(2πρ)  â_φ"],
questions:[
{type:"Conceptual", q:"Since dH is always perpendicular to both dL and â_R, what does this guarantee about the shape of magnetic field lines around any straight current — and why must they always close on themselves rather than terminate?"},
{type:"Engineering reasoning", q:"A PCB trace carries current in a straight run before bending 90°. Using the cross-product geometry alone (no calculation), sketch how the H-field direction just before and just after the bend differs — what practical EMI concern does this create for adjacent traces?"},
{type:"Reasoning", q:"Coulomb's law and Biot–Savart law both have a 1/R² falloff, but one is radial and the other is cross-product-based. What single structural difference in the SOURCE (static point charge vs. moving/flowing charge) explains why the resulting field geometries are so fundamentally different?"}
]},

{d:22,week:5,title:"Ampère's Circuital Law — Symmetry Applications",big:true,steps:7,
diagram:"ampereLoop",
facts:[{tag:"KEY FACT", text:"Ampere's Law is always true, solvable by hand only under Ampere-friendly symmetry."}, {tag:"INSIGHT", text:"Solenoids and toroids confine B almost entirely within their winding -- a direct payoff of this symmetry."}],
mcqs:[
{q:"Ampère's Circuital Law states:", options:["∮H·dL = I_enc", "∮D·dS = Q_enc", "∇V=E", "C=Q/V"], correct:0, explain:"Circulation of H equals enclosed current."},
{q:"Ampère's Law is easily solvable when:", options:["There's no current", "There is suitable symmetry (wire, solenoid, toroid)", "Only for point charges", "Never"], correct:1, explain:"Symmetry lets you pull H out of the loop integral."},
{q:"Inside an ideal long solenoid, H is:", options:["Zero", "Uniform (H=nI)", "Infinite", "Random"], correct:1, explain:"Classic solenoid result."},
{q:"A toroid confines its field:", options:["Everywhere in space", "Almost entirely within the core", "Only outside", "Nowhere"], correct:1, explain:"Closed donut geometry traps the field internally."},
{q:"A coaxial cable's H field:", options:["Is the same in all regions", "Differs by region (inside/between/outside conductors)", "Is always zero", "Doesn't depend on current"], correct:1, explain:"Multi-region Amperian-loop analysis is required."}
],
core:"Ampère's Law is to magnetostatics what Gauss's Law is to electrostatics — a universally true statement that is only solvable by hand under the right symmetry.",
notes:[
"Ampère's Law, ∮_C H·dL = I_enc, states that the circulation of H around any closed loop equals the total current passing through that loop. Like Gauss's Law, it's always true but only easily SOLVABLE when you can pick an 'Amperian loop' along which H is constant in magnitude and either parallel or perpendicular to dL everywhere.",
"Three canonical symmetric geometries recur constantly: the infinite straight wire (circular Amperian loop, recovers the Day 21 Biot–Savart result exactly), the SOLENOID (long rectangular loop straddling the winding — gives uniform H inside, ~zero outside), and the TOROID (circular loop inside the torus core — confines the field entirely within the donut shape).",
"The coaxial cable combines multiple regions: inside the inner conductor, between conductors, and outside the outer conductor each require a SEPARATE Amperian loop and give a DIFFERENT H expression, piecing together the full field profile as a function of radius — this multi-region approach is a favorite exam structure.",
"As with Gauss's Law, the critical exam skill is diagnosing SOLVABILITY: given a new, asymmetric current distribution, you must recognize when Ampère's Law's integral form fails to simplify and fall back to direct Biot–Savart integration or superposition instead.",
"<strong>Worked example:</strong> A long solenoid has n=1000 turns/meter and I=2A. Inside, H=nI=2000 A/m, and B=μ0H≈2.51mT — uniform throughout the interior, essentially zero just outside the winding.",
"<strong>Self-check:</strong> 'n' in H=nI means turns PER UNIT LENGTH, not total turns — forgetting to divide by the solenoid's length is the most common Ampère's Law solenoid mistake.",
"<strong>Application:</strong> Ampère's-Law symmetry results directly size toroidal transformers and chokes, and guide ferrite-bead selection for suppressing common-mode noise on cables — a routine EMI-mitigation task in product design."
],
formulas:["∮_C H·dL = I_enc","H_solenoid(inside) = nI  (n = turns per length)","H_toroid(inside core) = NI/(2πρ)"],
questions:[
{type:"Conceptual", q:"Ampère's Law is true for ANY closed loop, but useful only for special ones. What loop-selection criterion mirrors the Gaussian-surface criterion from Day 9 — and why does this exact parallel exist between the two laws?"},
{type:"Engineering reasoning", q:"For an RF choke built as a toroidal inductor, explain why the toroidal geometry is specifically chosen (over, say, a straight solenoid) from the standpoint of field CONFINEMENT — what does Ampère's Law tell you about field leakage outside a toroid versus outside a solenoid?"},
{type:"Reasoning", q:"Given a current distribution with only PARTIAL symmetry (e.g., a finite-length solenoid, not infinite), does Ampère's Law's integral form still give an EXACT answer, an approximate answer, or no usable answer at all near the ends? Justify your classification."}
]},

{d:23,week:5,title:"Magnetic Flux Density (B) & Vector Potential (A)",big:true,steps:6,
diagram:"vectorPotential",
facts:[{tag:"KEY FACT", text:"div(B) = 0 always -- there are no magnetic monopoles, so B can always be written as B = curl(A)."}, {tag:"CAUTION", text:"A is a VECTOR potential (unlike scalar V) because its source, current, is itself directional."}],
mcqs:[
{q:"∇·B always equals:", options:["ρv", "Zero", "Infinity", "μ0"], correct:1, explain:"No magnetic monopoles — B is always divergence-free."},
{q:"B can always be written as:", options:["-∇V", "∇×A", "∇·A", "A/μ0"], correct:1, explain:"Divergence-free fields can be expressed as a curl."},
{q:"A is a vector (not scalar) because:", options:["B is scalar", "Current, its source, is directional", "V is a vector", "Of convention only"], correct:1, explain:"Current has direction, unlike static charge."},
{q:"The absence of magnetic monopoles corresponds to:", options:["∇×B=0", "∇·B=0", "∇·D=0", "∇×D=0"], correct:1, explain:"This is one of Maxwell's four equations."},
{q:"B = μ0H holds in:", options:["Ferromagnets only", "Free space", "Conductors only", "Dielectrics only"], correct:1, explain:"Free-space linear relationship between B and H."}
],
core:"Vector potential A plays the same mathematical role for B that scalar potential V plays for E — a potential from which the field is derived.",
notes:[
"B = μ0H in free space is the magnetic flux density, analogous to D in electrostatics. Crucially, ∇·B = 0 ALWAYS — unlike ∇·D = ρv, there is no magnetic equivalent of charge (no magnetic monopoles have ever been observed), so B has NO sources or sinks anywhere.",
"Because ∇·B = 0 identically, B can always be written as the curl of some vector field: B = ∇×A, where A is the vector magnetic potential. This is the magnetic analog of E = -∇V, but A must be a VECTOR (not scalar) because its source — current — is itself a vector (moving charge has direction; static charge does not).",
"The asymmetry between ∇·D = ρv (electrostatics) and ∇·B = 0 (magnetostatics always) is the deepest structural difference between the electric and magnetic halves of the course — everywhere else the two subjects mirror each other almost formula-for-formula, but THIS equation has no electric counterpart with charge on the right-hand side.",
"<strong>Worked example:</strong> For an infinite straight wire carrying I, A points ALONG the wire's direction everywhere, with magnitude A=−(μ0I/2π)ln(ρ)+constant — even though B circulates AROUND the wire, A points ALONG it.",
"<strong>Self-check:</strong> don't assume A points in the same direction as B — A is defined by B=∇×A, a relationship that typically rotates direction, not preserves it.",
"<strong>Application:</strong> The vector potential is the standard computational tool antenna-design software uses to calculate far-field radiation patterns from a given current distribution — nearly every antenna simulation starts from an A-field integral."
],
formulas:["B = μ0 H  (free space)","∇·B = 0","B = ∇×A"],
questions:[
{type:"Conceptual", q:"If ∇·B = 0 always, why is the Divergence Theorem applied to B guaranteed to give exactly zero net flux through ANY closed surface, regardless of what currents are inside or outside it?"},
{type:"Engineering reasoning", q:"An antenna designer needs to compute radiated fields far from a current-carrying structure. Explain why it's often computationally EASIER to first find A (via integrating the current distribution) and then take its curl to get B, rather than attempting Biot–Savart directly on a complex geometry."},
{type:"Reasoning", q:"If magnetic monopoles were discovered tomorrow, ∇·B = 0 would need to be replaced with ∇·B = ρ_m (magnetic charge density). Trace through which OTHER results from Week 5 — Biot–Savart, the vector potential definition, Ampère's Law — would need to change as a consequence, and which would remain untouched."}
]},

{d:24,week:5,title:"Curl of H, Differential Ampère's Law",big:false,steps:5,
diagram:"curl",
facts:[{tag:"KEY FACT", text:"curl(H) = J -- the differential, point-local form of Ampere's Law."}, {tag:"INSIGHT", text:"curl(H) = 0 in current-free regions, even though the loop integral around a current-enclosing path is nonzero."}],
mcqs:[
{q:"The differential Ampère's Law is:", options:["∇×H=J", "∇·H=J", "∇²H=J", "H=J/μ0"], correct:0, explain:"Local, point-form of Ampère's Law."},
{q:"In a current-free region, ∇×H equals:", options:["Infinity", "Zero", "J", "μ0"], correct:1, explain:"No local current source means zero curl there."},
{q:"The differential form was derived using:", options:["The Divergence Theorem", "Stokes' Theorem", "Coulomb's Law", "Superposition alone"], correct:1, explain:"Converts the loop integral into a surface integral."},
{q:"Local curl can be zero at points while a loop integral around a larger enclosing path is nonzero because:", options:["This is a contradiction (impossible)", "The loop can enclose a region where curl is nonzero elsewhere (e.g., inside the wire)", "H is undefined", "Ampère's Law is false"], correct:1, explain:"Curl concentrates at the current-carrying region."},
{q:"∇×H = J is the magnetic analog of:", options:["∇·D=ρv", "∇V=E", "C=Q/V", "F=qE"], correct:0, explain:"Both relate a local field derivative to a local source density."}
],
core:"Localizing Ampère's Law to a single point connects current density directly to the local rotational behavior of the field.",
notes:[
"Applying Stokes' Theorem (Day 5) to the integral form of Ampère's Law converts ∮_C H·dL = I_enc into the local, differential statement ∇×H = J — the curl of H at a point equals the current density AT THAT POINT. This is the magnetic-field analog of Day 10's ∇·D = ρv.",
"Verifying this against the Day 22 infinite-wire result confirms consistency between the integral and differential pictures — as always, the two forms describe the identical physics, differing only in whether you're looking at a whole loop or a single point.",
"In any current-free region, ∇×H = 0, meaning H behaves there like a conservative field locally (though globally, around a current-carrying region, its circulation is nonzero) — an important subtlety that trips students up when reasoning about 'far from the wire' regions.",
"<strong>Worked example:</strong> For H=(I/2πρ)φ̂ outside a wire (ρ>a), ∇×H in cylindrical coordinates comes out to zero — no current outside. Inside the wire (ρ<a, uniform J), H=Iρ/(2πa²)φ̂, and its curl correctly returns J.",
"<strong>Self-check:</strong> curl in cylindrical coordinates has a different, more involved formula than in Cartesian — don't apply the simple Cartesian curl formula to a field given in ρ,φ,z components.",
"<strong>Application:</strong> Differential Ampère's Law underlies current-density mapping tools used to find hot spots and EMI radiation sources on PCB power planes during thermal and compliance analysis."
],
formulas:["∇×H = J","In any current-free region: ∇×H = 0"],
questions:[
{type:"Conceptual", q:"Both Gauss's and Ampère's differential laws relate a field's local behavior to a source density. Why is one a DIVERGENCE relation and the other a CURL relation — what does that structural difference say about how electric charge versus electric current 'creates' fields differently?"},
{type:"Engineering reasoning", q:"Given a measured/simulated H field around a complex current-carrying structure, describe how you would use ∇×H = J to reverse-engineer the actual current density distribution — what does this let you verify that a simple 'total current' measurement wouldn't?"},
{type:"Reasoning", q:"In a current-free region far from a wire, ∇×H = 0 locally, yet ∮H·dL around a loop enclosing the wire is nonzero. Reconcile these two statements — how can local curl be zero everywhere in a region while the loop integral around a larger path through that region is not?"}
]},

{d:25,week:5,title:"Review & Critical Problem Set: Magnetostatics I",big:true,steps:6,

{q:"The magnetostatics concept chain is:", options:["H→Biot-Savart→B", "Biot-Savart→H→B→A→Ampère's Law", "Ampère→Biot-Savart only", "A→H only"], correct:1, explain:"The Week 5 build-up order."},

{d:26,week:6,title:"Forces on Moving Charges & Current Elements",big:false,steps:5,
diagram:"lorentz",
facts:[{tag:"KEY FACT", text:"F = Q(E + v x B) -- the Lorentz force law defines what fields actually DO to a charge."}, {tag:"CAUTION", text:"Magnetic force never does work on a charge -- it only changes direction, never speed."}],
mcqs:[
{q:"The Lorentz force law is:", options:["F=Q(E+v×B)", "F=QE only", "F=Qv only", "F=QB only"], correct:0, explain:"Combines electric and magnetic contributions."},
{q:"Magnetic force on a moving charge does:", options:["Positive work", "Negative work", "No work (always ⟂ to v)", "Work equal to QE"], correct:2, explain:"Magnetic force never changes a charge's speed."},
{q:"A charge moving purely in a uniform B field (no E) follows:", options:["A straight line", "Circular (or helical) motion", "Random motion", "No motion"], correct:1, explain:"Classic cyclotron-style motion."},
{q:"dF = I dL×B gives force on:", options:["A single stationary charge", "A current-carrying wire segment", "A magnetic dipole only", "A capacitor"], correct:1, explain:"Macroscopic force on current elements."},
{q:"If v is parallel to B, the magnetic force is:", options:["Maximum", "Zero", "Undefined", "Equal to QE"], correct:1, explain:"sin(0°)=0 in the v×B cross product."}
],
core:"The Lorentz force law is the operational definition connecting abstract fields back to measurable, real mechanical force.",
notes:[
"The Lorentz force law, F = Q(E + v×B), is the fundamental link between field theory and mechanics: it defines what E and B actually DO to a charge, uniting everything from Weeks 2–5 into a single force expression an engineer can actually use to predict motion.",
"For a charge moving purely in a magnetic field (no E), the force is always perpendicular to velocity, producing UNIFORM CIRCULAR MOTION (or helical motion if there's a velocity component along B) — this is the operating principle behind mass spectrometers, cyclotrons, and CRT-style beam steering.",
"Extending to a current-carrying wire: dF = I dL×B integrates the microscopic force on individual moving charges into a macroscopic force on the whole wire — this is the direct bridge from field theory to motor/actuator design.",
"<strong>Worked example:</strong> An electron (Q=−1.6×10⁻¹⁹C) moves at v=10⁶ m/s perpendicular to B=0.5T. |F|=|Q|vB=(1.6×10⁻¹⁹)(10⁶)(0.5)=8×10⁻¹⁴N, perpendicular to both v and B, with the negative charge flipping the direction predicted for a positive charge.",
"<strong>Self-check:</strong> for NEGATIVE charges, apply the right-hand rule as if the charge were positive, then FLIP the resulting direction — forgetting this sign flip is the most common Lorentz-force direction mistake.",
"<strong>Application:</strong> The Lorentz force is the working principle of Hall-effect current sensors (used everywhere in power electronics for non-contact current measurement) and MEMS magnetic field sensors found in phone compasses."
],
formulas:["F = Q(E + v×B)  (Lorentz force)","dF = I dL × B"],
questions:[
{type:"Conceptual", q:"If magnetic force never does work on a charge (since it's always perpendicular to velocity), how can an electric motor — fundamentally driven by magnetic forces on currents — produce mechanical work output? Resolve this apparent contradiction."},
{type:"Engineering reasoning", q:"A charged particle beam needs to be steered without changing its speed. Explain, using the Lorentz force structure alone, why a magnetic field (not an electric field) is the natural engineering choice for this specific requirement."},
{type:"Reasoning", q:"For a charge moving with velocity exactly PARALLEL to B, what does the Lorentz force law predict for the magnetic force component? What does this tell you about which velocity components 'matter' for magnetic deflection?"}
]},

{d:27,week:6,title:"Force Between Conductors, Torque & Dipole",big:false,steps:5,
diagram:"forceWires",
facts:[{tag:"KEY FACT", text:"Torque on a current loop is maximum at 90 degrees to the field and zero at alignment."}, {tag:"INSIGHT", text:"Currents in the SAME direction attract; opposite directions repel -- the reverse of the electric-charge convention."}],
mcqs:[
{q:"Currents in the same direction in two parallel wires:", options:["Repel", "Attract", "No force", "Rotate"], correct:1, explain:"Opposite convention from like electric charges."},
{q:"Torque on a magnetic dipole is:", options:["T=m·B", "T=m×B", "T=m/B", "T=mB²"], correct:1, explain:"Cross-product torque formula."},
{q:"Torque is maximum when m and B are:", options:["Parallel", "Perpendicular", "Antiparallel", "Zero"], correct:1, explain:"sin(90°)=1 gives maximum torque."},
{q:"Torque is zero when m and B are:", options:["Perpendicular", "Aligned (parallel)", "Random", "Always nonzero"], correct:1, explain:"sin(0°)=0 at alignment."},
{q:"This torque behavior is the working principle of:", options:["Capacitors", "DC motors and galvanometers", "Resistors", "Diodes"], correct:1, explain:"Direct engineering application of dipole torque."}
],
core:"Current loops behave as magnetic dipoles, experiencing torque that aligns them with an external field — the operating principle of every DC motor and galvanometer.",
notes:[
"Two parallel current-carrying wires exert force on each other (via each wire's B field acting on the other's current) — currents in the SAME direction attract, opposite directions repel, the reverse convention from like/unlike electric charges.",
"A planar current loop is characterized by its magnetic dipole moment m = IA n̂ (current times enclosed area, direction by right-hand rule). Placed in a uniform external B field, it experiences torque T = m×B that acts to align m with B — zero torque at alignment, maximum torque at 90°.",
"This is structurally identical to the electric dipole torque in a uniform E field (a natural callback to Week 3), reinforcing yet again the deep electric/magnetic parallel — but here it has an immediate practical payoff: it IS the working principle of DC motors and analog meter movements.",
"<strong>Worked example:</strong> Two long parallel wires 0.05m apart each carry I=10A in the same direction. F'/L=μ0I1I2/(2πd)=4×10⁻⁴ N/m, attractive since the currents flow the same way.",
"<strong>Self-check:</strong> this force-per-length formula only applies to PARALLEL, effectively-infinite wires — for finite or non-parallel wires you must return to the full Biot–Savart + Lorentz-force approach.",
"<strong>Application:</strong> Force-and-torque-on-current-loop results are the direct design basis for electromagnetic relays, solenoid actuators, and analog galvanometer meter movements still used in some panel instruments."
],
formulas:["F'/L = μ0 I1 I2 / (2π d)","m = I A n̂","T = m × B"],
questions:[
{type:"Conceptual", q:"Why does the SI definition of the ampere historically rely on the force between two parallel current-carrying wires rather than on Coulomb's law directly — what practical measurement advantage does this give?"},
{type:"Engineering reasoning", q:"In a simple DC motor, torque is maximum when the coil's magnetic moment is perpendicular to the field and zero when aligned with it. Explain why a real motor needs a COMMUTATOR (current-reversing mechanism) given this torque behavior — what would happen without one?"},
{type:"Reasoning", q:"Two adjacent parallel PCB traces carry current in the SAME direction during normal operation. Predict, from the force-between-wires result, whether they experience attractive or repulsive force — and what happens to that force if one trace's current direction reverses during a signal transition?"}
]},

{d:28,week:6,title:"Magnetic Materials & Boundary Conditions for B/H",big:true,steps:6,
diagram:{type:"boundary", top:"B1, H1 (material 1)", bottom:"B2, H2 (material 2)", caption:"B_n always continuous; H_t continuous only if no free surface current"},
facts:[{tag:"KEY FACT", text:"Normal B is ALWAYS continuous across any boundary -- no exceptions, because div(B)=0 has no source term."}, {tag:"CAUTION", text:"Tangential H is only continuous when there's no free surface current -- don't assume continuity by default."}],
mcqs:[
{q:"Normal B across any boundary is:", options:["Discontinuous always", "Always continuous", "Zero always", "Undefined"], correct:1, explain:"Follows directly from ∇·B=0."},
{q:"Tangential H is continuous only if:", options:["μr is large", "There's no free surface current", "B=0", "H=0"], correct:1, explain:"Free surface current is what breaks H_t continuity."},
{q:"Ferromagnetic materials have μr that is:", options:["Slightly less than 1", "Slightly more than 1", "Very large (often thousands)", "Always negative"], correct:2, explain:"Strong flux concentration property."},
{q:"Diamagnetic materials have μr:", options:["Slightly less than 1", "Very large", "Negative infinity", "Exactly 1000"], correct:0, explain:"Weakly repel applied fields."},
{q:"Magnetization M relates to:", options:["Free charge only", "Bound current from aligned microscopic loops", "Conductivity only", "Nothing physical"], correct:1, explain:"Microscopic current loops produce M."}
],
core:"Materials respond to B fields via magnetization, and diamagnetic/paramagnetic/ferromagnetic behavior all trace back to microscopic current loops within the material.",
notes:[
"Magnetization M describes the net alignment of microscopic current loops (electron orbital and spin motion) within a material under an applied field, producing bound current densities J_b and K_b — directly analogous to bound charge from polarization in Day 18.",
"This leads to H = B/μ0 - M, and for LINEAR materials, B = μH with μ = μ0μr. Materials are classified by relative permeability μr: diamagnetic (μr slightly < 1, weakly repels field), paramagnetic (μr slightly > 1, weakly attracts), and ferromagnetic (μr >> 1, often thousands, strongly concentrates field — the basis of transformer and inductor cores).",
"Boundary conditions mirror the dielectric case but with roles partly swapped: TANGENTIAL H is continuous unless free surface current is present (H_t1 - H_t2 = K_free), while NORMAL B is ALWAYS continuous (B_n1 = B_n2) — no exceptions, because ∇·B=0 has no source term to ever violate continuity, unlike D's normal component.",
"<strong>Worked example:</strong> A ferromagnetic core has μr=2000. With H=500 A/m inside, B=μ0μrH≈1.26T — over 2000 times larger than the B that same H would produce in free space (≈6.3×10⁻⁴T), showing why ferromagnetic cores dramatically boost flux.",
"<strong>Self-check:</strong> μr is NOT truly constant for ferromagnets — it depends on H itself (saturation), so B=μH is only a linear approximation over a limited range, unlike the always-linear D=εE for typical dielectrics.",
"<strong>Application:</strong> Magnetic material classification (μr) is precisely how engineers choose ferrite cores for inductors, transformers, and EMI suppression beads — the right core material can be the difference between a compliant and non-compliant product."
],
formulas:["B = μ0(H + M) = μH","H_t1 - H_t2 = K_free","B_n1 = B_n2  (always)"],
questions:[
{type:"Conceptual", q:"Normal B is ALWAYS continuous across any boundary, but normal D is only continuous when there's no free charge present. Why does this asymmetry exist — trace it back to ∇·B=0 versus ∇·D=ρv?"},
{type:"Engineering reasoning", q:"A transformer core uses ferromagnetic material with very high μr specifically to concentrate flux. Using the boundary condition for H_t, explain what happens to H INSIDE the high-permeability core compared to the surrounding air gap, and why this matters for efficient flux confinement."},
{type:"Reasoning", q:"If a material's μr depends on the applied field strength (as real ferromagnets do, via saturation), does the simple linear relationship B=μH still hold exactly, or only as an approximation? What practical design consequence follows for transformers operated near saturation?"}
]},

{d:29,week:6,title:"Inductance and Magnetic Energy",big:false,steps:5,
diagram:"coil",
facts:[{tag:"KEY FACT", text:"L = N(phi)/I; W = 1/2 L I^2 -- energy lives in the B field around the current, not in the wire."}, {tag:"INSIGHT", text:"A ferromagnetic core is the highest-leverage way to boost inductance without changing physical size."}],
mcqs:[
{q:"Self-inductance is defined as:", options:["L=Nφ/I", "L=Q/V", "L=εA/d", "L=I/N"], correct:0, explain:"Flux linkage per unit current."},
{q:"Energy stored in an inductor is:", options:["½LI²", "LI", "L/I", "2LI²"], correct:0, explain:"Standard magnetic energy formula."},
{q:"Mutual inductance describes flux linkage between:", options:["A single coil and itself", "Two separate circuits", "A capacitor and inductor", "Free space only"], correct:1, explain:"The basis of transformer coupling."},
{q:"The highest-leverage way to boost inductance without changing size is:", options:["Removing the core", "Adding a ferromagnetic core", "Reducing turns", "Using vacuum"], correct:1, explain:"High μr concentrates flux dramatically."},
{q:"Inductor energy is stored:", options:["In the wire itself", "In the B field around the current", "Nowhere", "In the resistor"], correct:1, explain:"Field-based energy storage, like capacitors."}
],
core:"Inductance quantifies flux linkage per unit current — the direct magnetic analog of capacitance from Day 19.",
notes:[
"Self-inductance L = Nφ/I measures how much magnetic flux a coil links per unit of its own current — a purely geometric/material property, just like capacitance was purely geometric/material in Day 19. Standard derivations for solenoids and toroids follow directly from the Day 22 H-field results, integrated to find flux.",
"Mutual inductance M extends this to TWO circuits: it quantifies how much flux from one coil's current links through a second, nearby coil — the physical basis of transformers.",
"Energy stored in an inductor's field, W = ½LI² = ½∫B·H dv, is the magnetic mirror of Day 14's electric energy density — energy lives in the B field surrounding the current-carrying structure, not 'in the wire' itself.",
"<strong>Worked example:</strong> A solenoid has N=500 turns, length 0.2m, area 0.001m², air core. L=μ0N²A/l≈1.57mH. At I=2A, stored energy W=½LI²≈3.14mJ.",
"<strong>Self-check:</strong> inductance scales with N SQUARED, not N — doubling the turns quadruples L, a frequently mis-estimated relationship on exams.",
"<strong>Application:</strong> Inductance calculations size the power inductor in every switching power supply (buck/boost converters) and set matching-network component values in RF front-end design."
],
formulas:["L = Nφ/I","W = ½LI² = ½∫ᵥ B·H dv"],
questions:[
{type:"Conceptual", q:"Capacitors store energy in E fields between separated charge; inductors store energy in B fields around current. Both use a '½' factor in their energy formulas. Where does that factor come from in EACH case — and is it a coincidence that both share it?"},
{type:"Engineering reasoning", q:"A designer wants to increase an air-core inductor's value without changing its physical size. List the parameters in L's derivation (turns, geometry, core material) they could adjust, and explain why switching to a ferromagnetic core (Day 28) is often the highest-leverage single change."},
{type:"Reasoning", q:"When a switch abruptly interrupts current through an inductor, the stored energy ½LI² must go somewhere instantly. Using only the energy-conservation idea (not circuit theory yet), predict qualitatively what kind of dramatic electrical event this forces — and why inductive loads are notorious for generating voltage spikes."}
]},

{d:30,week:6,title:"Review & Critical Problem Set: Magnetostatics II",big:true,steps:6,
diagram:{type:"conceptmap", nodes:["Fields","Forces/Torque","Materials","Inductance/Energy"]},
facts:[{tag:"INSIGHT", text:"Magnetic circuit analysis (reluctance, MMF) borrows its structure from electric circuit theory because B is always a closed loop."}, {tag:"KEY FACT", text:"Concept chain: Fields -> Forces/Torque -> Materials -> Inductance/Energy."}],
mcqs:[
{q:"The full magnetostatics chain is:", options:["Fields→Forces/Torque→Materials→Inductance/Energy", "Only Fields→Energy", "Materials→Fields only", "Random order"], correct:0, explain:"The Week 6 synthesis order."},
{q:"In the magnetic circuit analogy, flux plays the role of:", options:["Voltage", "Current", "Resistance", "Power"], correct:1, explain:"Flux is analogous to circuit current."},
{q:"MMF (NI) plays the role of:", options:["Resistance", "EMF", "Reluctance", "Current"], correct:1, explain:"Magnetomotive force drives flux like EMF drives current."},
{q:"Reluctance plays the role of:", options:["EMF", "Resistance", "Current", "Flux"], correct:1, explain:"Opposes flux the way resistance opposes current."},
{q:"Magnetostatics is fundamentally a:", options:["Open-line theory", "Closed-loop theory", "Random theory", "Static-only theory with no structure"], correct:1, explain:"B field lines always close on themselves."}
],
core:"Synthesis day for forces, materials, and inductance — completing the full magnetostatics toolkit before time-varying fields begin.",
notes:[
"Weeks 5–6 together build a complete magnetostatics toolkit: Biot–Savart/Ampère (find the field) → forces/torque (what the field DOES to charges and currents) → materials (how matter modifies the field) → inductance/energy (how the field stores energy in a circuit element). Today's job is connecting all four layers.",
"A key structural insight worth writing down explicitly: magnetostatics is fundamentally a 'closed-loop' theory. Unlike electrostatics, where field lines can start and end on isolated charges, EVERY magnetic field line closes on itself (∇·B=0), and every practical magnetic circuit element (solenoid, toroid, transformer core) is built around confining and directing these closed loops.",
"This closed-loop nature is why magnetic circuit analysis (used in transformer/motor design) borrows so much structural language from electric circuit analysis — flux plays the role of current, magnetomotive force (NI) plays the role of EMF, and reluctance plays the role of resistance — a genuinely useful analogy for later coursework.",
"<strong>Worked example:</strong> Given a solenoid's current I, turns N, and core μr, you can find H (Ampère's Law, Day 22), B=μH (Day 28), L=Nφ/I, and stored energy ½LI² (Day 29) — one starting scenario unlocking the entire chain.",
"<strong>Self-check:</strong> before plugging in numbers on a multi-step problem, write out the CHAIN of formulas you'll use — this catches unit-mismatch errors (like forgetting the μr factor) before they propagate through the whole solution.",
"<strong>Application:</strong> The complete magnetostatics chain (fields → forces → materials → inductance) is the standard workflow motor and transformer designers follow from a blank datasheet to a finished winding specification."
],
formulas:["Concept chain: Fields (Biot–Savart/Ampère) → Forces/Torque → Materials → Inductance/Energy","Magnetic circuit analogy: MMF = NI = φ × Reluctance"],
questions:[
{type:"Conceptual", q:"Write, in your own words, why magnetostatics is fundamentally a 'closed-loop' theory, unlike electrostatics which allows field lines to start/end on isolated charge — and how this shapes practical magnetic circuit design."},
{type:"Engineering reasoning", q:"You're asked to compare, at a high level, why transformer design borrows so heavily from circuit-theory vocabulary (reluctance ~ resistance, MMF ~ EMF). Justify this analogy using the closed-loop structural property of B, and identify one place where the analogy breaks down."},
{type:"Reasoning", q:"If you had to teach Weeks 5–6 to a classmate in 10 minutes using only ONE diagram, what would it show, and what would it deliberately have to leave out?"}
]},

{d:31,week:7,title:"Faraday's Law of Electromagnetic Induction",big:true,steps:6,
diagram:"faraday",
facts:[{tag:"KEY FACT", text:"curl(E) = -dB/dt -- the first equation coupling E and B directly."}, {tag:"CAUTION", text:"Once B is time-varying, E is no longer strictly conservative -- 'voltage' becomes a careful approximation, not an exact global quantity."}],
mcqs:[
{q:"Faraday's Law states:", options:["EMF=-dφ/dt", "EMF=Q/C", "EMF=IR", "EMF=∇·D"], correct:0, explain:"EMF equals negative rate of flux change."},
{q:"The negative sign in Faraday's Law represents:", options:["A math error", "Lenz's Law (opposition to change)", "Zero EMF", "Infinite EMF"], correct:1, explain:"Induced current opposes the flux change causing it."},
{q:"The differential form of Faraday's Law is:", options:["∇×E=-∂B/∂t", "∇·E=-∂B/∂t", "∇×B=-∂E/∂t", "∇²E=-∂B/∂t"], correct:0, explain:"Local coupling between changing B and circulating E."},
{q:"Once B is time-varying, E is:", options:["Still fully conservative", "No longer strictly conservative", "Zero", "Undefined"], correct:1, explain:"Nonzero curl breaks the conservative property."},
{q:"Lenz's Law follows from:", options:["Charge conservation", "Energy conservation", "Momentum conservation", "Nothing physical"], correct:1, explain:"Reinforcing induced currents would violate energy conservation."}
],
core:"A changing magnetic flux induces an EMF — the first true COUPLING between electric and magnetic fields, and the start of genuinely dynamic electromagnetism.",
notes:[
"Faraday's Law states that the EMF induced around a loop equals the negative rate of change of magnetic flux through it: EMF = -dφ/dt. The negative sign is Lenz's Law — the induced current always flows in the direction that OPPOSES the change causing it, a direct consequence of energy conservation.",
"Applying Stokes' Theorem converts this into the differential form ∇×E = -∂B/∂t — a genuine modification of the electrostatic result ∇×E=0 from Day 5. This is the FIRST equation in the course where E and B are directly coupled: a changing B literally CREATES a circulating E field.",
"This has a profound consequence for the concept of 'potential': the Week 3 definition of V relied on E being conservative (curl-free). Once ∇×E ≠ 0 (because B is time-varying), the LINE INTEGRAL of E around a closed loop is no longer path-independent in general — 'voltage' as a globally well-defined single-valued quantity starts to require care, even though circuit theory continues to use it as a useful local approximation.",
"<strong>Worked example:</strong> A circular loop of area 0.02m² sits in a field increasing uniformly from 0 to 0.5T over 2s. EMF=−A(dB/dt)=−0.02×(0.5/2)=−5mV, the negative sign showing the induced current opposes the increasing flux (Lenz's Law).",
"<strong>Self-check:</strong> distinguish AVERAGE dφ/dt (uniform change, most exam problems) from INSTANTANEOUS dφ/dt (a true derivative of a more complex B(t)) — using the wrong one is a common error.",
"<strong>Application:</strong> Faraday's Law is the operating principle of every transformer, wireless charging pad (Qi standard), and RFID/NFC tag — all of them work by deliberately inducing EMF via a changing magnetic flux."
],
formulas:["EMF = -dφ/dt","∇×E = -∂B/∂t"],
questions:[
{type:"Conceptual", q:"Static electrostatics required ∇×E=0 for potential V to be well-defined. Since ∇×E≠0 with time-varying B, does 'voltage' between two points in a circuit still make unambiguous sense? Why do circuit-theory textbooks continue using it anyway?"},
{type:"Engineering reasoning", q:"A nearby switching power supply induces unwanted EMF in an adjacent sensitive analog trace loop on a PCB. Using Faraday's Law directly, identify the TWO physical design changes (independent of shielding) that would most directly reduce this coupling, and justify each from the dφ/dt formula."},
{type:"Reasoning", q:"Lenz's Law (the induced current opposes the change causing it) is often justified purely by energy conservation. Explain, in your own words, what would go wrong physically — an unbounded feedback loop — if the induced current instead REINFORCED the change causing it."}
]},

{d:32,week:7,title:"Motional EMF and Transformer EMF",big:false,steps:5,
diagram:"rodRails",
facts:[{tag:"KEY FACT", text:"Total EMF = motional term (v x B) + transformer term (-dB/dt) -- both add together."}, {tag:"INSIGHT", text:"Wireless charging relies purely on transformer EMF -- no physical motion required at all."}],
mcqs:[
{q:"Motional EMF arises from:", options:["A stationary loop in changing B", "The Lorentz force on charges in a moving conductor", "Zero field", "Static charges only"], correct:1, explain:"Physical motion through a field drives motional EMF."},
{q:"Transformer EMF arises from:", options:["A moving conductor", "A stationary loop in a time-varying field", "Constant B and stationary loop", "No field at all"], correct:1, explain:"Pure ∂B/∂t effect, no motion needed."},
{q:"Wireless charging relies primarily on:", options:["Motional EMF", "Transformer EMF", "Neither", "Coulomb force"], correct:1, explain:"Both coils are stationary; only the field changes."},
{q:"The general EMF formula combines:", options:["Only the motional term", "Only the transformer term", "Both motional and transformer terms", "Neither term"], correct:2, explain:"Both contributions add in the general case."},
{q:"In a moving-rod generator, the work done on charges ultimately traces back to:", options:["Pure magnetic work on the charge", "The mechanical force moving the rod (via v×B redirecting charge)", "Gravity", "Friction"], correct:1, explain:"Mechanical input, not magnetic force, supplies the energy."}
],
core:"Total induced EMF splits into a 'motional' part (moving conductor through a static field) and a 'transformer' part (stationary loop, changing field) — both are the SAME underlying physics viewed two ways.",
notes:[
"Motional EMF arises from the Lorentz force (v×B) acting on charges within a conductor physically moving through a magnetic field — this is the generator mechanism: mechanical motion converted directly into EMF via F=Qv×B pushing charges along the conductor.",
"Transformer EMF, by contrast, arises purely from a STATIONARY loop sitting in a field that changes with time — no mechanical motion involved at all, purely ∂B/∂t driving the induction, exactly the mechanism from Day 31.",
"The most general case — a loop that is BOTH moving AND sitting in a time-varying field — combines both contributions additively: EMF = ∮(v×B)·dL - ∫(∂B/∂t)·dS. Both cases are ultimately unified by the single total-derivative flux rule EMF=-dφ/dt, whether the flux changes because the AREA moves or because B itself changes.",
"<strong>Worked example:</strong> A rod of length 0.3m moves at v=4 m/s perpendicular to B=0.2T, with v, B, and the rod all mutually perpendicular. EMF=BLv=0.2×0.3×4=0.24V.",
"<strong>Self-check:</strong> EMF=BLv only applies when v, B, and L are all mutually perpendicular — for any other geometry, return to the full integral EMF=∫(v×B)·dL.",
"<strong>Application:</strong> Motional and transformer EMF calculations underlie tachometer/speed-sensor design (motional) and wireless power transfer system efficiency analysis (transformer) — both common in automotive and consumer electronics."
],
formulas:["EMF = ∮ (v×B)·dL - ∫ (∂B/∂t)·dS","Motional EMF (v, B, L mutually ⟂): EMF = BLv"],
questions:[
{type:"Conceptual", q:"In a moving-rod generator, is the force doing work on the charges magnetic or electric in origin, given that magnetic force alone can never do work on a charge? Resolve this apparent contradiction carefully."},
{type:"Engineering reasoning", q:"A wireless charging pad (stationary primary coil, stationary receiver coil) relies entirely on transformer EMF, not motional EMF. Explain why NO physical motion is required for energy transfer here, tracing the mechanism back to ∂B/∂t alone."},
{type:"Reasoning", q:"Could a real generator design ever have BOTH motional and transformer EMF contributing simultaneously and significantly? Describe a plausible physical scenario where this would happen, and what would go wrong if a designer accounted for only one term."}
]},

{d:33,week:7,title:"Displacement Current & Modified Ampère's Law",big:true,steps:6,
diagram:"displacement",
facts:[{tag:"KEY FACT", text:"curl(H) = J + dD/dt -- displacement current completes Ampere's Law for time-varying fields."}, {tag:"INSIGHT", text:"Without displacement current, the wave equation -- and radio/light itself -- has no theoretical foundation."}],
mcqs:[
{q:"Displacement current density is:", options:["J_d=∂D/∂t", "J_d=σE", "J_d=∇·D", "J_d=εH"], correct:0, explain:"Maxwell's key added term."},
{q:"The corrected Ampère-Maxwell Law is:", options:["∇×H=J", "∇×H=J+∂D/∂t", "∇·H=J", "∇²H=J"], correct:1, explain:"Completes Ampère's Law for time-varying fields."},
{q:"Displacement current was needed to fix an inconsistency in:", options:["Gauss's Law", "The original Ampère's Law for time-varying fields", "Faraday's Law", "Coulomb's Law"], correct:1, explain:"Original law failed the capacitor-gap thought experiment."},
{q:"In the charging-capacitor thought experiment, the gap between plates has:", options:["Conduction current only", "Zero current of any kind", "Displacement current, no conduction current", "Infinite current"], correct:2, explain:"No charge crosses the gap, but D changes there."},
{q:"Without displacement current, which of these would lack a theoretical foundation?", options:["Ohm's Law", "The EM wave equation", "Coulomb's Law", "Kirchhoff's Voltage Law"], correct:1, explain:"Wave propagation requires this coupling term."}
],
core:"Maxwell's single greatest insight: a changing E field acts as a current source for B, completing the symmetry between electricity and magnetism and making EM waves possible.",
notes:[
"The original Ampère's Law, ∇×H=J, silently ASSUMES steady-state currents. Applying it to a genuinely time-varying situation (like a charging capacitor) produces a contradiction with the continuity equation — the law as originally stated is simply INCOMPLETE for dynamic situations.",
"Maxwell's fix: introduce a DISPLACEMENT current density J_d = ∂D/∂t, giving the corrected law ∇×H = J + ∂D/∂t. This isn't an actual flow of charge — it's a changing electric field acting mathematically (and, as it turns out, physically) exactly like a current source for generating H.",
"The classic charging-capacitor thought experiment makes this concrete: choose an Amperian loop around the wire feeding the capacitor. If your bounding SURFACE passes through the wire, you get conduction current J. If instead it passes THROUGH THE GAP between the plates (no wire there at all), you get zero conduction current — UNLESS you include displacement current from the changing E field between the plates, which gives the exact same total enclosed 'current' either way, restoring consistency.",
"This correction is not a minor patch — without it, the wave equation of Week 8 simply cannot be derived, and radio waves, light, and every wireless telecom technology would have no theoretical foundation. Maxwell needed a genuinely NEW physical term, not just an accepted limitation, because the old law gave self-contradictory answers depending on an arbitrary choice of surface.",
"<strong>Worked example:</strong> A capacitor with plate area 0.005m² has E between the plates increasing at dE/dt=10⁶ V/(m·s). J_d=ε0(dE/dt)≈8.85×10⁻⁶ A/m²; multiplying by area gives I_d≈4.4×10⁻⁸A, matching the actual conduction current in the feed wire.",
"<strong>Self-check:</strong> displacement current is not a flow of real charge — never compute it with J=σE (Ohm's Law); it comes only from the time-derivative of D.",
"<strong>Application:</strong> Displacement current reasoning is essential for modeling capacitive coupling on high-speed PCBs, where a 'capacitor' formed by adjacent traces passes AC signal energy even though no charge physically crosses the gap."
],
formulas:["∇×H = J + ∂D/∂t","J_d = ∂D/∂t  (displacement current density)"],
questions:[
{type:"Conceptual", q:"The capacitor-gap thought experiment shows the original Ampère's Law gives INCONSISTENT answers for different Amperian surfaces unless displacement current is included. What does this inconsistency reveal about the difference between a law being 'usually right' and being 'universally true'?"},
{type:"Engineering reasoning", q:"In a high-frequency circuit, a capacitor is sometimes described as 'passing AC current' even though no charge physically crosses the gap between its plates. Explain precisely what IS crossing the gap in field terms, and connect this directly to today's displacement current concept."},
{type:"Reasoning", q:"If displacement current only matters when fields change RAPIDLY with time, explain why it can be safely ignored in ordinary low-frequency circuit analysis (50/60 Hz power systems) but becomes essential in RF/microwave and antenna design. What quantity, roughly, determines the crossover?"}
]},

{d:34,week:7,title:"Maxwell's Equations — Full Synthesis",big:true,steps:7,
diagram:{type:"conceptmap", nodes:["div D = rho","div B = 0","curl E = -dB/dt","curl H = J + dD/dt"]},
facts:[{tag:"KEY FACT", text:"The four Maxwell equations: div D = rho_v, div B = 0, curl E = -dB/dt, curl H = J + dD/dt."}, {tag:"INSIGHT", text:"Set d/dt = 0 and all four collapse exactly to the static laws from Weeks 2-6 -- electrostatics and magnetostatics were never separate theories."}],
mcqs:[
{q:"Which is NOT one of Maxwell's four equations?", options:["∇·D=ρv", "∇·B=0", "∇×E=-∂B/∂t", "F=ma"], correct:3, explain:"F=ma is Newton's Second Law, not a Maxwell equation."},
{q:"Setting ∂/∂t=0 in Maxwell's equations recovers:", options:["Only Faraday's Law", "The static forms from Weeks 2-6", "Nothing useful", "Only Gauss's Law"], correct:1, explain:"Static electrostatics and magnetostatics as special cases."},
{q:"Combining Gauss's Law and the Ampère-Maxwell Law reproduces:", options:["Coulomb's Law", "The continuity equation", "Ohm's Law", "Snell's Law"], correct:1, explain:"A consistency check linking charge and current conservation."},
{q:"∇×H=J+∂D/∂t is known as:", options:["Faraday's Law", "The Ampère-Maxwell Law", "Gauss's Law", "Lenz's Law"], correct:1, explain:"The corrected, complete form of Ampère's Law."},
{q:"Historically, electrostatics and magnetostatics were discovered:", options:["Simultaneously as one theory", "Separately, before their unification by Maxwell", "Never unified", "By the same single experiment"], correct:1, explain:"Maxwell's synthesis unified two previously separate sciences."}
],
core:"Four equations, unified, form the complete classical theory of electromagnetism — everything from Weeks 2–6 is a special case of these four statements.",
notes:[
"The four Maxwell's equations, in differential form, are: ∇·D=ρv (Gauss's Law — electric charge sources electric flux), ∇·B=0 (no magnetic monopoles — magnetic flux has no sources), ∇×E=-∂B/∂t (Faraday's Law — changing B creates circulating E), and ∇×H=J+∂D/∂t (Ampère–Maxwell Law — current AND changing E create circulating H).",
"Each has an equivalent integral form (∮ₛD·dS=Qenc, ∮ₛB·dS=0, ∮_C E·dL=-dφB/dt, ∮_C H·dL=Ienc+dφD/dt), related to the differential forms via the Divergence Theorem (Days 4, 10) and Stokes' Theorem (Days 5, 24) respectively — the SAME two theorems from Week 1 underpin every single equation in this set.",
"A powerful consistency check: combining Gauss's Law with the Ampère–Maxwell Law (taking the divergence of the latter) exactly reproduces the continuity equation from Day 16 — the four equations aren't four independent assumptions, they're deeply interlocked, and charge conservation falls OUT of them rather than needing to be assumed separately.",
"Setting ∂/∂t=0 collapses all four equations back down to the static forms you spent Weeks 2–6 mastering: ∇×E=0 (electrostatics) and ∇×H=J (magnetostatics) with no coupling between E and B at all. This is the single biggest 'aha' of the course: electrostatics and magnetostatics were never separate theories — they were always the SAME four equations, just in the special case where nothing changes with time.",
"<strong>Worked example:</strong> In a region with no charge and no current (like free space between a transmitter and receiver), all four equations reduce to ∇·D=0, ∇·B=0, ∇×E=−∂B/∂t, ∇×H=∂D/∂t — exactly the source-free system Day 36 uses to derive the wave equation.",
"<strong>Self-check:</strong> whenever a problem says 'free space, no charge or current,' immediately set ρv=0 and J=0 in all four equations first — this single simplification unlocks most wave-propagation questions.",
"<strong>Application:</strong> Maxwell's equations, exactly as written here, are the equations solved numerically inside every commercial EM simulator (HFSS, CST Studio, ADS) used throughout the RF, microwave, and antenna design industry."
],
formulas:["∇·D = ρv","∇·B = 0","∇×E = -∂B/∂t","∇×H = J + ∂D/∂t"],
questions:[
{type:"Conceptual", q:"Every equation you learned in Weeks 2–6 is a special case of Maxwell's equations under ∂/∂t=0. What does this tell you about why electrostatics and magnetostatics could historically be discovered as 'separate' sciences, decades apart, before anyone realized they were unified?"},
{type:"Engineering reasoning", q:"An antenna radiates power continuously into free space with no charge physically leaving the antenna structure. Using ONLY the four Maxwell equations (not the wave equation yet, which comes Day 36), explain in outline how a changing E can sustain a changing B and vice versa, indefinitely, propagating outward."},
{type:"Reasoning", q:"Argue, from the STRUCTURE of the four equations alone, why E and B cannot be treated as independent fields once ∂/∂t≠0 — they must co-evolve. What specific pair of equations directly couples them, and in which direction does each coupling run?"}
]},

{d:35,week:7,title:"Boundary Conditions from Maxwell's Equations",big:false,steps:5,
diagram:{type:"boundary", top:"Tangential E, H", bottom:"Normal D, B", caption:"Two templates only: thin pillbox for divergence laws, thin loop for curl laws"},
facts:[{tag:"KEY FACT", text:"All four boundary conditions come from just two derivation templates: a thin pillbox (divergence laws) and a thin loop (curl laws)."}, {tag:"INSIGHT", text:"B_n and E_t are always continuous; D_n and H_t depend on free charge/current at the boundary."}],
mcqs:[
{q:"Tangential E boundary condition derives from:", options:["∇·D=ρv using a pillbox", "∇×E=-∂B/∂t using a thin loop", "∇·B=0", "∇×H=J"], correct:1, explain:"Curl laws pair with the thin-loop derivation template."},
{q:"Normal D boundary condition derives from:", options:["A thin loop and Faraday's Law", "A pillbox and Gauss's Law", "Ampère's Law", "Biot-Savart"], correct:1, explain:"Divergence laws pair with the pillbox template."},
{q:"B_n across any boundary is:", options:["Discontinuous", "Always continuous", "Zero", "Random"], correct:1, explain:"Direct consequence of ∇·B=0 having no source term."},
{q:"The two universal derivation templates are:", options:["Sphere and cylinder", "Pillbox (divergence laws) and loop (curl laws)", "Line and plane only", "None needed"], correct:1, explain:"These two templates generate all four boundary conditions."},
{q:"H_t is continuous only if:", options:["μr is large", "There's no free surface current", "B=0", "Always, no exceptions"], correct:1, explain:"Free surface current breaks tangential H continuity."}
],
core:"All four boundary-condition sets (E_t, D_n, H_t, B_n) derive systematically from applying Maxwell's equations across an infinitesimal boundary — they were never four separate facts to memorize.",
notes:[
"Tangential E continuity re-derives from ∇×E=-∂B/∂t applied to a thin rectangular loop straddling the boundary — in the static limit, this recovers exactly the Day 18 dielectric result, confirming consistency between the static and dynamic treatments.",
"Normal D discontinuity re-derives from ∇·D=ρv applied to a thin pillbox straddling the boundary — again matching Day 18 exactly. Similarly, tangential H (from ∇×H=J+∂D/∂t) and normal B (from ∇·B=0, ALWAYS continuous) reproduce the Day 28 magnetic-material results.",
"The payoff of today is recognizing that ALL FOUR boundary conditions come from exactly the SAME TWO derivation templates — a thin pillbox for the divergence-based laws (D and B), and a thin loop for the curl-based laws (E and H) — applied four times to four different equations. This single insight collapses what looked like four separate memorization tasks (Days 18 and 28) into one reusable method.",
"<strong>Worked example:</strong> At an air–dielectric (εr=3) boundary with no free surface charge, if E in air has normal component 100 V/m, D_n1=ε0×100. Since D_n is continuous, D_n2=D_n1, so E_n2=D_n2/(ε0×3)≈33.3 V/m — reduced by a factor of εr entering the denser dielectric.",
"<strong>Self-check:</strong> identify FIRST which field components (normal or tangential) are given/asked for — mixing up normal and tangential relative to the boundary is the most common Week 7 mistake.",
"<strong>Application:</strong> Boundary-condition calculations directly determine microstrip and stripline transmission-line impedance on PCBs — the standard method for controlling signal integrity on any board carrying high-speed digital or RF signals."
],
formulas:["E_t1 = E_t2","D_n1 - D_n2 = ρS(free)","H_t1 - H_t2 = K_S(free)","B_n1 = B_n2"],
questions:[
{type:"Conceptual", q:"Now that you've derived all four boundary conditions from Maxwell's equations directly, which SINGLE derivation template (pillbox or loop) underlies EACH pair — and how does recognizing this reduce your memorization load going forward?"},
{type:"Engineering reasoning", q:"At a metal-air interface on a PCB (a near-perfect conductor boundary), which of the four boundary conditions collapses to a particularly simple special case (hint: revisit Day 17's E=0-inside-conductor result), and what does that simplification mean for surface current and charge at that interface?"},
{type:"Reasoning", q:"Two of the four boundary conditions are 'always continuous' (no exceptions) and two are 'continuous only if no free charge/current.' Pair up which two belong in each category, and explain the common feature they share that determines this classification."}
]},

{d:36,week:8,title:"Wave Equation from Maxwell's Equations",big:true,steps:7,
diagram:"wave",
facts:[{tag:"KEY FACT", text:"grad^2 E = mu*eps * d^2E/dt^2 -- the EM wave equation, derived purely from Maxwell's equations in a source-free region."}, {tag:"INSIGHT", text:"v = 1/sqrt(mu0 eps0) equals the measured speed of light exactly -- proof that light IS an electromagnetic wave."}],
mcqs:[
{q:"The EM wave equation is:", options:["∇²E=με∂²E/∂t²", "∇·E=ρv/ε", "∇×E=0", "E=V/d"], correct:0, explain:"Derived from combining Faraday's and Ampère-Maxwell's laws."},
{q:"Wave speed v equals:", options:["με", "1/√(με)", "μ/ε", "√(με)"], correct:1, explain:"Standard wave-equation speed formula."},
{q:"In free space, v equals:", options:["Zero", "The speed of light c", "Speed of sound", "Infinite"], correct:1, explain:"A numerical coincidence too precise to be accidental."},
{q:"The wave equation derivation requires:", options:["A region full of charge and current", "A source-free region (J=0, ρv=0)", "Static fields only", "Conductors only"], correct:1, explain:"Valid for propagation away from sources."},
{q:"This derivation proved that:", options:["Light has nothing to do with EM theory", "Light IS an electromagnetic wave", "Gravity is electromagnetic", "Sound is electromagnetic"], correct:1, explain:"Maxwell's landmark unification of optics and EM theory."}
],
core:"Combining Faraday's and Ampère–Maxwell's laws in a source-free region yields a wave equation — proof that light, radio, and every wireless signal ARE oscillating E/B fields.",
notes:[
"Starting from the source-free forms ∇×E=-∂B/∂t and ∇×H=∂D/∂t (setting J=0, ρv=0 for a region with no charge or current — e.g., free space between transmitter and receiver), taking the curl of Faraday's Law and substituting the Ampère–Maxwell Law eliminates B, leaving an equation purely in E.",
"Applying the vector identity ∇×(∇×E) = ∇(∇·E) - ∇²E, and using ∇·E=0 (no charge in this region), the curl terms collapse into the classic wave equation: ∇²E = με ∂²E/∂t². An identical derivation for H (or B) by symmetry gives the same equation for the magnetic field.",
"Comparing this to the standard mechanical wave equation identifies the wave speed as v=1/√(με). In free space, plugging in μ0 and ε0 gives EXACTLY the measured speed of light, c ≈ 3×10⁸ m/s — a numerical coincidence far too precise to be accidental.",
"This derivation, more than any single earlier result in the course, is considered Maxwell's greatest achievement: before this, light and electromagnetism were studied as entirely separate branches of physics. The wave equation PROVED light is an electromagnetic phenomenon, unifying optics with electricity and magnetism in one stroke — and directly enabling every radio, telecom, and wireless technology that followed.",
"<strong>Worked example:</strong> Substituting E(z,t)=E0cos(ωt−βz) into ∇²E=με∂²E/∂t² gives −β²=−μεω², so β=ω√(με) — exactly the dispersion relation used throughout Week 8.",
"<strong>Self-check:</strong> always verify a proposed wave solution by direct substitution back into the wave equation — the standard 'check your answer' method, and a favorite way exams test real understanding rather than memorization.",
"<strong>Application:</strong> The wave equation is the starting point for modeling signal propagation in both fiber-optic links (light as an EM wave) and RF/wireless channels — the same equation, two different frequency regimes."
],
formulas:["∇²E = με ∂²E/∂t²","v = 1/√(με)  →  v = c in free space"],
questions:[
{type:"Conceptual", q:"Before Maxwell, light and electromagnetism were considered separate phenomena. What SPECIFIC numerical coincidence in the wave equation (relating ε0, μ0, and the independently measured speed of light) forced physicists to conclude light IS an electromagnetic wave?"},
{type:"Engineering reasoning", q:"A telecom engineer designs a signal path through a dielectric-filled waveguide instead of free space. Using v=1/√(με), explain qualitatively how the signal's propagation speed changes compared to free-space propagation, and why this matters for timing/latency calculations in cable or fiber design."},
{type:"Reasoning", q:"The wave equation derivation required setting J=0 and ρv=0 — a SOURCE-FREE region. What does this assumption mean physically for where the derivation applies (e.g., far from an antenna vs. AT the antenna itself), and why can't the same simple derivation describe wave GENERATION, only wave PROPAGATION?"}

{d:37,week:8,title:"Plane Waves in Free Space",big:false,steps:5,

facts:[{tag:"KEY FACT", text:"eta0 = sqrt(mu0/eps0) ~ 377 ohms -- the intrinsic impedance of free space."}, {tag:"INSIGHT", text:"E and H are always mutually perpendicular AND perpendicular to propagation -- EM waves are strictly transverse."}],
mcqs:[
{q:"EM plane waves are:", options:["Longitudinal", "Transverse", "Neither", "Both, depending on medium"], correct:1, explain:"E and H are perpendicular to the propagation direction."},
{q:"The intrinsic impedance of free space is approximately:", options:["50Ω", "75Ω", "377Ω", "0Ω"], correct:2, explain:"η0 = √(μ0/ε0) ≈ 377Ω."},
{q:"In lossless free space, E and H are:", options:["90° out of phase", "Exactly in phase", "180° out of phase", "Unrelated in phase"], correct:1, explain:"No phase lag in a lossless medium."},
{q:"E and H directions relative to propagation are:", options:["Parallel to propagation", "Perpendicular to propagation and to each other", "Random", "Antiparallel"], correct:1, explain:"Defining transverse-wave geometry."},
{q:"η = √(μ/ε) relates:", options:["E and H amplitudes", "Frequency and wavelength", "Charge and current", "Force and mass"], correct:0, explain:"Impedance sets the E-to-H amplitude ratio."}
],
core:"The simplest wave solution — uniform, transverse, propagating at speed c — is the conceptual foundation for antenna and transmission-line theory.",
notes:[
"The general plane-wave solution to the wave equation, E(z,t)=E0 cos(ωt-βz), describes a field that is uniform in the plane perpendicular to propagation and oscillates sinusoidally as it travels along z at speed v=ω/β.",
"A defining structural feature: E and H are always mutually PERPENDICULAR to each other AND both perpendicular to the direction of propagation — this is why EM waves are called TRANSVERSE waves, fundamentally different from, say, sound (a longitudinal wave).",
"The ratio of E to H amplitudes is fixed by the medium's INTRINSIC IMPEDANCE, η=√(μ/ε); in free space, η0≈377Ω — a number that shows up constantly in antenna matching and radiation-resistance calculations. Additionally, for a lossless medium, E and H are always exactly IN PHASE — no lag between them.",
"<strong>Worked example:</strong> In free space, if E0=10 V/m, then H0=E0/η0=10/377≈26.5mA/m — this η0≈377Ω ratio is worth memorizing since it appears constantly in antenna and link-budget work.",
"<strong>Self-check:</strong> E and H amplitudes are related by η, but their units differ (V/m vs A/m) — don't compare them numerically without accounting for this impedance relationship.",
"<strong>Application:</strong> Plane-wave and free-space-impedance results feed directly into free-space path-loss calculations used in every WiFi, cellular, and satellite link-budget analysis to predict achievable range and signal strength."
],
