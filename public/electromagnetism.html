<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Electromagnetism I — 40-Day Field Study</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700;800&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/theme.css">
<style>
  :root{
    --bg:#F7F5EF;
    --bg-panel:#FFFFFF;
    --bg-raised:#EFEBDE;
    --line:#DEDACB;
    --text:#23282E;
    --text-muted:#5B6470;
    --text-dim:#838C93;
    --copper:#1F5FA8;
    --copper-dim:#163F73;
    --cyan:#1F8A57;
    --cyan-dim:#146641;
    --big-flag:#C97A22;
    --caution:#B94A40;
    --radius:3px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:'Atkinson Hyperlegible',sans-serif;
    font-size:16.5px;
    line-height:1.7;
    -webkit-font-smoothing:antialiased;
    text-rendering:optimizeLegibility;
    font-feature-settings:"kern" 1, "liga" 1;
  }
  body::before{
    content:"";
    position:fixed; inset:0;
    background-image:
      linear-gradient(var(--line) 1px, transparent 1px),
      linear-gradient(90deg, var(--line) 1px, transparent 1px);
    background-size:64px 64px;
    opacity:0.05;
    pointer-events:none;
    z-index:0;
  }
  h1,h2,h3,h4{font-family:'Sora',sans-serif; font-weight:700; letter-spacing:-0.015em; margin:0; color:var(--text);}
  .mono{font-family:'IBM Plex Mono',monospace;}

  /* ---------- Layout ---------- */
  .app{display:flex; min-height:100vh; position:relative; z-index:1;}

  .sidebar{
    width:340px; flex:none;
    background:var(--bg-panel);
    border-right:1px solid var(--line);
    height:100vh; position:sticky; top:0;
    overflow-y:auto;
    padding:28px 0 60px;
  }
  .sidebar-head{padding:0 24px 20px; border-bottom:1px solid var(--line); margin-bottom:8px;}
  .sidebar-head .kicker{color:var(--copper); font-family:'IBM Plex Mono',monospace; font-size:12px; letter-spacing:0.08em; font-weight:500;}
  .sidebar-head h1{font-size:23px; line-height:1.25; margin-top:8px; font-weight:800; letter-spacing:-0.02em;}
  .sidebar-head p{color:var(--text-muted); font-size:13.5px; line-height:1.55; margin-top:10px; font-family:'Atkinson Hyperlegible',sans-serif;}

  details.week{border-bottom:1px solid var(--line);}
  details.week summary{
    list-style:none; cursor:pointer;
    display:flex; align-items:center; justify-content:space-between;
    padding:14px 24px;
    font-family:'Sora',sans-serif; font-weight:600; font-size:14.5px; letter-spacing:-0.01em;
    color:var(--text);
  }
  details.week summary::-webkit-details-marker{display:none;}
  details.week summary .wk-range{color:var(--text-dim); font-family:'IBM Plex Mono',monospace; font-size:11.5px; font-weight:400; letter-spacing:0.02em;}
  details.week summary::after{
    content:"+"; color:var(--copper); font-family:'IBM Plex Mono',monospace; font-size:16px; margin-left:8px;
  }
  details.week[open] summary::after{content:"–";}

  .day-list{padding:0 14px 14px;}
  .day-btn{
    width:100%; text-align:left;
    background:none; border:none; color:var(--text-muted);
    font-family:'Atkinson Hyperlegible',sans-serif; font-size:13.5px;
    padding:9px 12px; border-radius:var(--radius);
    cursor:pointer; display:flex; gap:10px; align-items:baseline;
  }
  .day-btn:hover{background:var(--bg-raised); color:var(--text);}
  .day-btn.active{background:var(--bg-raised); color:var(--text); box-shadow:inset 2px 0 0 var(--copper);}
  .day-btn .num{font-family:'IBM Plex Mono',monospace; color:var(--cyan); font-size:12px; min-width:20px;}
  .day-btn .flag{margin-left:auto; font-family:'IBM Plex Mono',monospace; font-size:10px; color:var(--big-flag); opacity:0.9;}

  /* ---------- Main ---------- */
  main{flex:1; padding:56px 64px 120px; max-width:900px;}
  .top-progress{color:var(--text-dim); font-family:'IBM Plex Mono',monospace; font-size:12px; letter-spacing:0.04em; margin-bottom:26px;}
  .day-meta{display:flex; align-items:center; gap:14px; margin-bottom:10px;}
  .day-tag{font-family:'IBM Plex Mono',monospace; font-size:12.5px; color:var(--copper);}
  .step-tag{font-family:'IBM Plex Mono',monospace; font-size:12px; color:var(--text-dim); border:1px solid var(--line); padding:3px 9px; border-radius:20px;}
  .step-tag.big{color:var(--big-flag); border-color:var(--copper-dim);}
  .day-title{font-size:36px; line-height:1.16; font-weight:800; letter-spacing:-0.02em; margin-bottom:8px;}
  .core-idea{color:var(--text-muted); font-size:17px; line-height:1.6; font-style:italic; font-family:'Atkinson Hyperlegible',sans-serif; font-weight:400; margin:14px 0 34px; padding-left:16px; border-left:2px solid var(--cyan-dim);}

  section.block{margin-bottom:36px;}
  .block h3{font-size:12.5px; font-family:'IBM Plex Mono',monospace; color:var(--cyan); font-weight:500; letter-spacing:0.06em; margin-bottom:14px;}
  .notes p{color:var(--text); font-size:16px; line-height:1.75; margin:0 0 15px; max-width:74ch;}
  .notes p:last-child{margin-bottom:0;}

  .formula-list{display:flex; flex-direction:column; gap:10px;}
  .formula{
    background:rgba(185,74,64,0.06); border:1px solid var(--caution); border-left:4px solid var(--caution);
    padding:12px 16px; border-radius:var(--radius);
    font-family:'IBM Plex Mono',monospace; font-size:14.5px; font-weight:600; color:var(--caution);
  }

  /* ---------- Diagram ---------- */
  .diagram-wrap{
    background:var(--bg-panel); border:1px solid var(--line); border-radius:var(--radius);
    padding:26px 28px 18px; margin-bottom:32px;
  }
  .diagram-wrap .diagram-cap{
    font-family:'IBM Plex Mono',monospace; font-size:11.5px; color:var(--text-dim);
    margin-top:10px; text-align:center;
  }
  .diagram-svg{width:100%; height:auto; display:block; max-height:460px;}

  @keyframes dashflow{ to{ stroke-dashoffset:-24; } }
  @keyframes pulseGlow{ 0%,100%{ transform:scale(1); opacity:1; } 50%{ transform:scale(1.3); opacity:0.55; } }
  .diagram-svg [marker-end="url(#ac)"],
  .diagram-svg [marker-end="url(#ao)"],
  .diagram-svg [marker-end="url(#am)"]{
    stroke-dasharray:7 6;
    animation:dashflow 1.3s linear infinite;
  }
  .diagram-svg circle[fill="#1F5FA8"],
  .diagram-svg circle[fill="#1F8A57"]{
    transform-box:fill-box; transform-origin:center;
    animation:pulseGlow 2.6s ease-in-out infinite;
  }
  @media (prefers-reduced-motion: reduce){
    .diagram-svg *{ animation:none !important; }
  }

  /* ---------- Key facts (color-coded highlights) ---------- */
  .facts{display:flex; flex-direction:column; gap:10px;}
  .fact{
    padding:11px 16px; border-radius:var(--radius);
    font-size:14.5px; color:var(--text);
    background:var(--bg-panel); border:1px solid var(--line);
    border-left:3px solid var(--line);
  }
  .fact .tag{
    font-family:'IBM Plex Mono',monospace; font-size:10.5px; font-weight:600;
    margin-right:9px; letter-spacing:0.03em;
  }
  .fact.insight{border-left-color:var(--cyan);}
  .fact.insight .tag{color:var(--cyan);}
  .fact.key{border-left-color:var(--copper);}
  .fact.key .tag{color:var(--copper);}
  .fact.caution{border-left-color:var(--caution);}
  .fact.caution .tag{color:var(--caution);}

  /* ---------- MCQ quiz ---------- */
  .mcq-score{font-family:'IBM Plex Mono',monospace; font-size:12.5px; color:var(--text-dim); margin-bottom:16px;}
  .mcq-list{display:flex; flex-direction:column; gap:18px;}
  .mcq-card{background:var(--bg-panel); border:1px solid var(--line); border-radius:var(--radius); padding:16px 18px 18px;}
  .mcq-q{font-size:15.5px; color:var(--text); margin-bottom:12px; line-height:1.55; font-weight:500;}
  .mcq-options{display:flex; flex-direction:column; gap:8px;}
  .mcq-opt{
    text-align:left; background:var(--bg-raised); border:1px solid var(--line); color:var(--text-muted);
    padding:9px 13px; border-radius:var(--radius); cursor:pointer;
    font-family:'Atkinson Hyperlegible',sans-serif; font-size:14px; transition:border-color .15s;
  }
  .mcq-opt:hover:not(.disabled){border-color:var(--copper); color:var(--text);}
  .mcq-opt.correct{border-color:var(--cyan); color:var(--cyan); background:rgba(95,184,201,0.09);}
  .mcq-opt.incorrect{border-color:var(--caution); color:var(--caution); background:rgba(217,83,79,0.09);}
  .mcq-opt.disabled{cursor:default;}
  .mcq-explain{
    margin-top:11px; padding-top:11px; border-top:1px dashed var(--line);
    font-size:13.5px; color:var(--text-dim); display:none;
  }
  .mcq-explain.show{display:block;}

  .qlist{display:flex; flex-direction:column; gap:14px;}
  .qcard{
    background:var(--bg-panel); border:1px solid var(--line); border-radius:var(--radius);
    padding:18px 20px;
  }
  .qcard .qtype{font-family:'IBM Plex Mono',monospace; font-size:11px; letter-spacing:0.05em; color:var(--big-flag); margin-bottom:8px;}
  .qcard p{margin:0; font-size:15.5px; line-height:1.6; color:var(--text);}

  .daynav{display:flex; justify-content:space-between; margin-top:52px; padding-top:24px; border-top:1px solid var(--line);}
  .daynav button{
    background:none; border:1px solid var(--line); color:var(--text-muted);
    font-family:'Atkinson Hyperlegible',sans-serif; font-size:13.5px; padding:10px 16px; border-radius:var(--radius);
    cursor:pointer;
  }
  .daynav button:hover:not(:disabled){border-color:var(--copper); color:var(--text);}
  .daynav button:disabled{opacity:0.3; cursor:default;}

  ::-webkit-scrollbar{width:10px;}
  ::-webkit-scrollbar-track{background:var(--bg-panel);}
  ::-webkit-scrollbar-thumb{background:var(--line); border-radius:6px;}

  @media (max-width:860px){
    .app{flex-direction:column;}
    .sidebar{width:100%; height:auto; position:relative; max-height:60vh;}
    main{padding:36px 22px 90px;}
    .day-title{font-size:26px;}
  }
</style>
</head>

      <div class="kicker">ETE · YEAR 2</div>

    <div id="week-list"></div>

  <main>
    <div class="top-progress" id="crumb"></div>

<script>window.APP_NAME = 'electromagnetism';</script>
<script src="/js/nav.js"></script>
<script src="/js/file-input-enhance.js"></script>
<script src="/js/storage-shim.js"></script>
<script>(function(){ window.HubNav.init('electromagnetism', true); })();</script>

<script>
const WEEKS = [
  {n:1, title:"Mathematical & Physical Foundations", range:"Days 1–5"},
  {n:2, title:"Electrostatics I", range:"Days 6–10"},
  {n:3, title:"Electrostatics II", range:"Days 11–15"},
  {n:4, title:"Conductors, Dielectrics & Boundary-Value Problems", range:"Days 16–20"},
  {n:5, title:"Magnetostatics I", range:"Days 21–25"},
  {n:6, title:"Magnetostatics II", range:"Days 26–30"},
  {n:7, title:"Time-Varying Fields & Maxwell's Equations", range:"Days 31–35"},
  {n:8, title:"EM Waves & the Bridge to Telecom", range:"Days 36–40"},
];

const DAYS = [
{d:1,week:1,title:"Vector Algebra Review",big:false,steps:4,
diagram:"vectors",
facts:[{tag:"KEY FACT", text:"A.B gives a scalar (magnitude of alignment); AxB gives a vector (magnitude of perpendicularity)."}, {tag:"CAUTION", text:"Cross product order matters: AxB = -(BxA). Reversing operand order flips the field/torque direction."}],
mcqs:[
{q:"A·B is maximum when the angle between A and B is:", options:["0°", "45°", "90°", "180°"], correct:0, explain:"cosθ peaks (=1) at θ=0°."},
{q:"The magnitude of A×B is greatest when θ equals:", options:["0°", "90°", "180°", "270° only"], correct:1, explain:"sinθ peaks at 90°."},
{q:"If A·B = 0 for nonzero A and B, the vectors are:", options:["Parallel", "Perpendicular", "Equal", "Antiparallel"], correct:1, explain:"cosθ=0 only at 90°."},
{q:"A×B is:", options:["A scalar", "Always zero", "A vector perpendicular to both A and B", "Parallel to A"], correct:2, explain:"The cross product yields a vector via the right-hand rule."},
{q:"Reversing the order to B×A:", options:["Gives the same vector", "Flips the sign of the result", "Gives a scalar", "Is undefined"], correct:1, explain:"Cross product is anti-commutative: A×B = -(B×A)."}
],
core:"Fields are vector quantities — every EM law is a statement about vectors, so fluency here is non-negotiable before anything else.",
notes:[
"Electromagnetism describes quantities that have both magnitude and direction at every point in space — electric field, magnetic field, force, current density. Scalar algebra cannot carry that directional information, so the entire subject is built on vector operations from day one.",
"The dot product A·B = |A||B|cosθ extracts the component of one vector along another — it answers 'how much of A points the same way as B?' This is exactly the operation behind work (F·d) and flux (E·dS), which you will use continuously starting Week 2.",
"The cross product A×B = |A||B|sinθ n̂ produces a vector perpendicular to both inputs, with direction fixed by the right-hand rule. This is the operation behind torque, force on moving charges, and — critically — the Biot–Savart law in Week 5. Build right-hand-rule fluency now; it is unforgiving later under exam pressure.",
"<strong>Worked example:</strong> Let A = 3x̂+4ŷ and B = 4x̂+3ŷ. Then A·B = (3)(4)+(4)(3) = 24, and cosθ = 24/(5×5) = 0.96, so θ ≈ 16.3°. For A×B: since both lie in the xy-plane, A×B = (3×3 − 4×4)ẑ = −7ẑ, a vector pointing into the page. The dot product gave a single number (alignment); the cross product gave a vector (perpendicularity).",
"<strong>Self-check:</strong> if you compute A×B and get a scalar instead of a vector, you've made an error — the cross product ALWAYS returns a vector, even if some components happen to be zero. A common mistake is guessing the direction instead of computing it from the determinant / right-hand rule.",
"<strong>Application:</strong> Vector algebra underlies antenna-array signal processing (dot products compute correlation/combining gain between element signals), the Smith chart used daily in RF impedance matching (a graphical vector tool), and every 3D EM simulator (HFSS, CST) that represents fields as vector quantities on a mesh."
],
formulas:["A·B = |A||B| cos θ = AxBx + AyBy + AzBz","A×B = |A||B| sin θ  n̂  (right-hand rule)"],
questions:[
{type:"Conceptual", q:"Coulomb's law could, in principle, be written as a scalar magnitude formula. Why does EM theory insist on a vector form instead — what physical information would be lost otherwise?"},
{type:"Engineering reasoning", q:"In a PCB layout, two trace segments carry current at right angles. Before doing any calculation, what does the cross product tell you about the geometric relationship between the resulting magnetic field and the two current directions?"},
{type:"Reasoning", q:"If A·B = 0 for two nonzero vectors, and separately A×B = 0 for the same two vectors, what must be true about A and B in each case — and can both conditions hold simultaneously for nonzero vectors?"}
]},

{d:2,week:1,title:"Coordinate Systems & Transformations",big:true,steps:5,
diagram:"coords",
facts:[{tag:"KEY FACT", text:"dV = rho d(rho) d(phi) dz (cylindrical); dV = r^2 sin(theta) dr d(theta) d(phi) (spherical) -- memorize before Week 2."}, {tag:"INSIGHT", text:"Symmetry of the geometry, not personal preference, should choose your coordinate system."}],
mcqs:[
{q:"The best coordinate system for an infinite line charge is:", options:["Cartesian", "Cylindrical", "Spherical", "2D polar only"], correct:1, explain:"Cylindrical symmetry matches the geometry."},
{q:"The differential volume in spherical coordinates is:", options:["dx dy dz", "ρ dρ dφ dz", "r² sinθ dr dθ dφ", "r dr dθ"], correct:2, explain:"Standard spherical volume element."},
{q:"For an isolated point charge, the natural coordinate choice is:", options:["Cartesian", "Cylindrical", "Spherical", "Any, equally easy"], correct:2, explain:"Point symmetry matches spherical coordinates."},
{q:"In cylindrical coordinates, φ is measured:", options:["From the z-axis outward", "Around the z-axis in the xy-plane", "Radially from origin", "Along ρ"], correct:1, explain:"φ is the azimuthal angle in the xy-plane."},
{q:"A problem with no clean symmetry in any coordinate system suggests using:", options:["Gauss's Law directly", "Ampère's Law directly", "Poisson's/Laplace's equation", "Ignoring boundary conditions"], correct:2, explain:"Boundary-value methods don't require symmetry."}
],
core:"Choosing the right coordinate system turns a hard integral into an easy one — this single decision determines whether a problem takes 2 lines or 20.",
notes:[
"Cartesian, cylindrical, and spherical coordinates are three different languages for describing the same point in space. Cylindrical (ρ,φ,z) suits problems with an axis of symmetry — wires, cables, solenoids. Spherical (r,θ,φ) suits problems with a point of symmetry — point charges, spheres, radiating antennas.",
"Each system has its own differential length, area, and volume elements, which is what actually matters when you set up an integral. Memorizing dV = ρ dρ dφ dz (cylindrical) and dV = r²sinθ dr dθ dφ (spherical) up front saves you from re-deriving them mid-exam.",
"Transformation equations let you convert a point or a vector's components between systems. In practice, most of your EM1 work stays within ONE system per problem — the real skill is recognizing, before you write a single equation, which system the geometry demands.",
"<strong>Worked example:</strong> Convert the Cartesian point (3,4,5) to cylindrical coordinates: ρ=√(3²+4²)=5, φ=tan⁻¹(4/3)≈53.1°, z=5. Converting the same point to spherical: r=√(3²+4²+5²)=√50≈7.07, θ=cos⁻¹(5/7.07)≈45°, φ stays 53.1°.",
"<strong>Self-check:</strong> always confirm which angle is θ and which is φ before you start — conventions differ between textbooks. In this course θ is the polar angle from +z, and φ is the azimuthal angle in the xy-plane, matching Sadiku and Hayt.",
"<strong>Application:</strong> Cylindrical coordinates are the natural language for coaxial cable and circular waveguide design (their cross-sections are circles); spherical coordinates are how antenna radiation patterns and far-field gain plots are actually specified and measured in datasheets."
],
formulas:["dV = dx dy dz  (Cartesian)","dV = ρ dρ dφ dz  (cylindrical)","dV = r² sin θ dr dθ dφ  (spherical)"],
questions:[
{type:"Conceptual", q:"A charge distribution has cylindrical symmetry, but you're asked for the field at a point off-axis. Does the symmetry argument still simplify the problem? Why or why not?"},
{type:"Engineering reasoning", q:"You're modeling the field around a coaxial cable (used constantly in RF/telecom). Justify, from the geometry alone, why cylindrical coordinates are the only sane choice — what would spherical coordinates cost you here?"},
{type:"Reasoning", q:"If a problem has NO clean symmetry in any standard coordinate system, what does that tell you about which solution method (Coulomb's law directly, Gauss's Law, or Laplace's equation) is likely to be required later in the course?"}
]},

{d:3,week:1,title:"Gradient",big:false,steps:4,
diagram:"contour",
facts:[{tag:"KEY FACT", text:"E = -grad(V) -- the field is the negative gradient of potential."}, {tag:"INSIGHT", text:"Field lines always cross equipotential surfaces at exactly 90 degrees."}],
mcqs:[
{q:"∇V points in the direction of:", options:["Steepest decrease of V", "Steepest increase of V", "Constant V", "Zero V"], correct:1, explain:"Gradient points toward increasing V; E=-∇V then points downhill."},
{q:"E = -∇V means E points:", options:["From low to high V", "From high to low V", "Parallel to equipotentials", "Randomly"], correct:1, explain:"The negative sign sends E from high to low potential."},
{q:"Equipotential surfaces are always ___ to E:", options:["Parallel", "Perpendicular", "At 45°", "Unrelated"], correct:1, explain:"A geometric consequence of the gradient relationship."},
{q:"If two potential functions differ everywhere by a constant, their gradients:", options:["Differ", "Are identical", "Are zero", "Are undefined"], correct:1, explain:"The derivative of a constant is zero, so gradients match."},
{q:"The gradient of a scalar field is a:", options:["Scalar", "Vector", "Tensor", "Constant"], correct:1, explain:"Gradient converts a scalar field into a vector field."}
],
core:"The gradient converts a scalar potential field into the vector field that actually drives motion and force.",
notes:[
"Given any scalar function V(x,y,z) — temperature, pressure, or later, electric potential — the gradient ∇V is a vector field pointing in the direction of steepest increase, with magnitude equal to the rate of that increase.",
"This is the mathematical machine behind E = -∇V in Week 3: the electric field is simply the negative gradient of potential, meaning charges are pushed 'downhill' from high to low potential, exactly as a ball rolls downhill on a landscape shaped by V.",
"Equipotential surfaces (constant V) are always perpendicular to the gradient at every point — this single geometric fact lets you sketch field lines directly from a potential contour map without doing any calculus.",
"<strong>Worked example:</strong> Let V(x,y,z) = 3x²+2y. Then ∇V = 6x x̂ + 2 ŷ. At the point (1,1,0), ∇V = 6x̂+2ŷ, so E=−∇V=−6x̂−2ŷ at that point — the field points toward decreasing V.",
"<strong>Self-check:</strong> the single most common error here is forgetting the negative sign when turning ∇V into E. If your computed field points toward higher potential, you've dropped the minus sign — go back and re-check.",
"<strong>Application:</strong> Gradient calculations run inside every field-solver (ANSYS, COMSOL, HFSS) used to simulate PCB and IC electrostatics, and drive thermal gradient analysis on densely packed boards where heat flow follows -∇T exactly as E follows -∇V."
],
formulas:["∇V = (∂V/∂x) x̂ + (∂V/∂y) ŷ + (∂V/∂z) ẑ","E = -∇V  (the operational payoff of today's gradient — used from Day 12 onward)"],
questions:[
{type:"Conceptual", q:"If two different potential functions have the same gradient everywhere, what must be true about their difference — and what does that mean for the idea of an 'absolute' potential?"},
{type:"Engineering reasoning", q:"On a PCB ground-plane simulation, you're given a color-coded potential map instead of field vectors. Explain how you'd read off field direction and relative strength directly from the color contours, without computing a single derivative."},
{type:"Reasoning", q:"Could a physically valid potential field have a gradient that reverses direction discontinuously at a point with no charge present? What would that discontinuity actually represent?"}
]},

{d:4,week:1,title:"Divergence & the Divergence Theorem",big:true,steps:6,
diagram:"divergence",
facts:[{tag:"KEY FACT", text:"The Divergence Theorem swaps a surface integral for a volume integral: closed-surface flux = volume integral of divergence."}, {tag:"CAUTION", text:"Divergence = 0 does NOT mean the field is zero -- it means no net flux is created or destroyed at that point."}],
mcqs:[
{q:"∮ₛA·dS equals, by the Divergence Theorem:", options:["∫ᵥ∇×A dV", "∫ᵥ∇·A dV", "∮_C A·dL", "∇V"], correct:1, explain:"The Divergence Theorem swaps surface flux for volume divergence."},
{q:"If ∇·A = 0 everywhere, the field is called:", options:["Conservative", "Source-free (solenoidal)", "Irrotational", "Radial"], correct:1, explain:"Zero divergence means no net sources/sinks."},
{q:"A field with ∇·A > 0 at a point behaves as a:", options:["Sink", "Source", "Vortex", "Zero field"], correct:1, explain:"Positive divergence = local source."},
{q:"The divergence of a purely rotational (circulating) field is typically:", options:["Positive", "Negative", "Zero", "Undefined"], correct:2, explain:"Circulating fields have no net outward flux at a point."},
{q:"∇·A = ∂Ax/∂x + ∂Ay/∂y + ∂Az/∂z is the form used in:", options:["Spherical only", "Cartesian coordinates", "Cylindrical only", "Polar only"], correct:1, explain:"This explicit form is the Cartesian divergence."}
],
core:"Divergence measures net flux 'birth' at a point — the local source density of a field — and the Divergence Theorem lets you swap a surface integral for a volume integral (or vice versa).",
notes:[
"Divergence ∇·A at a point tells you whether that point is acting as a source (div > 0, flux flowing outward), a sink (div < 0, flux flowing inward), or neither (div = 0, whatever flows in flows back out — 'source-free').",
"The Divergence Theorem, ∮ₛA·dS = ∫ᵥ(∇·A)dV, is one of the two workhorse theorems of EM1 (Stokes' is the other). It says: the total flux leaving a closed surface equals the sum of all the little sources inside it. This is the mathematical engine behind converting Gauss's Law between its integral and differential forms in Week 2.",
"A classic trap: a field like A = r̂/r² has zero divergence everywhere EXCEPT at the origin, where it's singular. This single fact is the entire reason Gauss's Law works cleanly for point charges — all the 'divergence' of a point charge's field is concentrated at a single point.",
"<strong>Worked example:</strong> For A = x x̂ + y ŷ + z ẑ (a purely radial field), ∇·A = 1+1+1 = 3, positive and constant everywhere — a uniform source density, consistent with the field radiating outward from the origin.",
"<strong>Self-check:</strong> don't confuse 'the field is large' with 'the divergence is large.' A strong but uniform field like A=5x̂ has ZERO divergence, because nothing is being created or destroyed locally, even though the field itself is nonzero.",
"<strong>Application:</strong> Divergence checks are how simulation software verifies charge-free vs. charge-containing regions inside semiconductor devices — the depletion region of a diode or MOSFET gate is identified precisely by where ∇·D becomes nonzero."
],
formulas:["∇·A = ∂Ax/∂x + ∂Ay/∂y + ∂Az/∂z","∮ₛ A·dS = ∫ᵥ (∇·A) dV"],
questions:[
{type:"Conceptual", q:"Physically, why must the divergence of a truly source-free field (like B, which you'll meet in Week 5) be identically zero everywhere, not just zero 'on average' over a volume?"},
{type:"Engineering reasoning", q:"In a heat-sink thermal model (a common cross-disciplinary use of the same divergence math), a region shows positive divergence of heat flux with no heat source physically present. What does that tell you about your model — is it more likely a modeling error or a real undiscovered source?"},
{type:"Reasoning", q:"Predict, without computing anything, whether the divergence of a purely rotational field (imagine water circling a drain, no inflow/outflow) should be zero — then justify your prediction using the 'net flux out of a small volume' definition."}
]},

{d:5,week:1,title:"Curl & Stokes' Theorem",big:true,steps:6,
diagram:"curl",
facts:[{tag:"KEY FACT", text:"Stokes' Theorem swaps a closed line integral for a surface integral of curl."}, {tag:"INSIGHT", text:"Zero curl everywhere means the field is conservative, which means a scalar potential exists."}],
mcqs:[
{q:"∮_C A·dL equals, by Stokes' Theorem:", options:["∫ᵥ∇·A dV", "∫ₛ(∇×A)·dS", "∇V", "∮ₛA·dS"], correct:1, explain:"Stokes' Theorem swaps line circulation for surface curl."},
{q:"A field with ∇×A = 0 everywhere is called:", options:["Solenoidal", "Conservative (irrotational)", "Divergent", "Radial"], correct:1, explain:"Zero curl means the field is conservative."},
{q:"A conservative field guarantees the existence of a:", options:["Vector potential", "Scalar potential", "Zero field", "Current density"], correct:1, explain:"Curl-free fields can be written as -∇(scalar)."},
{q:"The direction of curl is found using:", options:["Left-hand rule", "Right-hand rule", "Either rule", "No rule needed"], correct:1, explain:"Standard EM convention uses the right-hand rule."},
{q:"A field can have zero divergence but nonzero curl. This statement is:", options:["True", "False", "Only in 1D", "Only for static fields"], correct:0, explain:"Divergence and curl are independent properties (e.g., B field around a wire)."}
],
core:"Curl measures local rotation/circulation of a field — essential for understanding induction (Week 7) and Ampère's Law (Week 5).",
notes:[
"Curl ∇×A at a point measures the tendency of a field to circulate around that point, with direction given by the right-hand rule applied to the sense of rotation. A field with curl = 0 everywhere is called 'conservative' or 'irrotational' — electrostatic E fields are exactly this, which is precisely why potential V can be defined for them.",
"Stokes' Theorem, ∮_C A·dL = ∫ₛ(∇×A)·dS, converts a line integral around a closed loop into a surface integral of curl over any surface bounded by that loop. This is the differential-to-integral bridge for Ampère's Law and, later, Faraday's Law.",
"A field can have zero divergence but nonzero curl (like the magnetic field around a wire — it circulates but has no 'source' points), or zero curl but nonzero divergence (like the electrostatic field around a point charge — it flows outward but doesn't circulate). Recognizing which behavior a field exhibits tells you immediately which theorem (Divergence or Stokes') is relevant.",
"<strong>Worked example:</strong> For A = −y x̂ + x ŷ (circulating counterclockwise around the z-axis), ∇×A = (∂x/∂x − ∂(−y)/∂y)ẑ = (1−(−1))ẑ = 2ẑ — nonzero curl pointing out of the page, matching counterclockwise rotation by the right-hand rule.",
"<strong>Self-check:</strong> a field that visually 'looks like it flows in circles' doesn't automatically have nonzero curl everywhere — check the formula. Conversely, straight-looking flow CAN have nonzero curl if its magnitude varies across the flow direction (shear).",
"<strong>Application:</strong> Curl calculations explain and predict eddy currents induced in transformer cores and PCB ground planes by nearby changing fields — a direct concern in high-frequency power electronics and EMI-sensitive layouts."
],
formulas:["∇×A = curl determinant of (x̂,ŷ,ẑ; ∂/∂x,∂/∂y,∂/∂z; Ax,Ay,Az)","∮_C A·dL = ∫ₛ (∇×A)·dS"],
questions:[
{type:"Conceptual", q:"A field is conservative (curl = 0) everywhere except at one singular point. Does Stokes' Theorem still guarantee zero circulation around any closed loop? What condition must the loop satisfy for the guarantee to hold?"},
{type:"Engineering reasoning", q:"An RF engineer notices that the H-field around a current-carrying trace circulates in closed loops rather than radiating outward. Using only the divergence/curl vocabulary from Days 4–5, characterize this field in one sentence — is it more like the 'source-y' E-field or the 'circulating' pattern?"},
{type:"Reasoning", q:"If you already know a field is conservative (∇×A = 0), what does that immediately tell you about whether a scalar potential function can be defined for it — and why does that matter for whether 'voltage' is even a meaningful concept for that field?"}
]},

{d:6,week:2,title:"Charge, Coulomb's Law, Superposition",big:false,steps:4,
diagram:"coulomb",
facts:[{tag:"KEY FACT", text:"F = Q1Q2/(4 pi eps0 r^2) -- inverse-square, acting along the line joining the charges."}, {tag:"INSIGHT", text:"Superposition only works because Coulomb's law is linear in charge."}],
mcqs:[
{q:"Coulomb's Law force is proportional to:", options:["1/r", "1/r²", "1/r³", "r²"], correct:1, explain:"Inverse-square law."},
{q:"Like charges experience a force that is:", options:["Attractive", "Repulsive", "Zero", "Torque only"], correct:1, explain:"Same-sign charges repel."},
{q:"Superposition of forces is valid because Coulomb's law is:", options:["Nonlinear in Q", "Linear in Q", "Quadratic in Q", "Independent of Q"], correct:1, explain:"Linearity allows simple vector addition of contributions."},
{q:"ε0 represents the:", options:["Permeability of free space", "Permittivity of free space", "Conductivity", "Resistivity"], correct:1, explain:"ε0 sets electric interaction strength in vacuum."},
{q:"Coulomb's Law force direction lies:", options:["Perpendicular to the line joining charges", "Along the line joining charges", "Random", "Always vertical"], correct:1, explain:"It's a central (radial) force."}
],
core:"All of electrostatics builds from one pairwise force law plus the principle of linear superposition.",
notes:[
"Coulomb's Law, F = (Q1Q2/4πε0r²) â_r, describes the force between two point charges: it falls off as the inverse square of separation, acts along the line joining the charges, and is repulsive for like charges, attractive for unlike.",
"Superposition is the quiet workhorse of the entire course: because Coulomb's law is LINEAR in each charge, the total force (or field) from many charges is simply the vector sum of the individual contributions. This single principle is what makes continuous charge distributions solvable via integration in Day 7.",
"ε₀, the permittivity of free space, sets the strength of the electric interaction in vacuum; it will reappear as εrε₀ once dielectric media are introduced in Week 4.",
"<strong>Worked example:</strong> Two charges Q1=+2μC and Q2=+3μC are separated by r=0.5m. F = (2×10⁻⁶)(3×10⁻⁶)/(4πε0×0.5²) ≈ 0.216N, directed along the line joining them, repulsive since both charges are positive.",
"<strong>Self-check:</strong> keep the SIGN of each charge separate from the direction of the force — plug in signed charges to get the correct magnitude, then reason separately about attraction/repulsion from whether the signs match.",
"<strong>Application:</strong> Coulomb's Law-based charge modeling underlies ESD (electrostatic discharge) protection design for ICs, and explains charge injection effects at MOSFET gates that engineers must account for in sensitive analog circuits."
],
formulas:["F = (Q1Q2 / 4πε0 r²) â_r","ε0 ≈ 8.854 × 10⁻¹² F/m"],
questions:[
{type:"Conceptual", q:"Superposition works because Coulomb's law is linear in charge. What would break in electrostatics if the force instead depended on Q² rather than Q?"},
{type:"Engineering reasoning", q:"On a PCB, three charge-carrying nodes are laid out in an L-shape. Before calculating anything, sketch the reasoning for why the net force direction on the corner node will NOT simply bisect the angle between the other two — what vector step is missing from that intuition?"},
{type:"Reasoning", q:"Coulomb's law assumes point charges. What physically changes about the force calculation once you replace one point charge with a small but finite charged sphere at close range — and at what separation does the point-charge approximation start to fail?"}
]},

{d:7,week:2,title:"Electric Field from Discrete & Continuous Charges",big:true,steps:6,
diagram:"chargeRadial",
facts:[{tag:"KEY FACT", text:"Infinite sheet: E is CONSTANT with distance. Infinite line: E falls off as 1/rho. Point charge: E falls off as 1/r^2."}, {tag:"CAUTION", text:"Don't apply infinite-line/sheet formulas to a finite distribution without checking the near-field vs far-field limit."}],
mcqs:[
{q:"The field of an infinite charged sheet:", options:["Falls off as 1/r", "Falls off as 1/r²", "Is constant with distance", "Is zero everywhere"], correct:2, explain:"A defining, frequently-tested result."},
{q:"The field of an infinite line charge falls off as:", options:["1/ρ", "1/ρ²", "Constant", "1/ρ³"], correct:0, explain:"Line charge field decreases as 1/ρ."},
{q:"E is defined as:", options:["Force per unit mass", "Force per unit charge", "Charge per unit force", "Energy per unit charge"], correct:1, explain:"Operational definition of electric field."},
{q:"For a point charge, E falls off as:", options:["1/r", "1/r²", "Constant", "1/r³"], correct:1, explain:"Inverse-square, matching Coulomb's law."},
{q:"Continuous charge distributions require finding E via:", options:["Simple summation", "Integration over the distribution", "No calculation", "Cross products only"], correct:1, explain:"Superposition becomes an integral for continuous charge."}
],
core:"E is force-per-unit-test-charge; continuous charge requires integration over the distribution, not simple summation.",
notes:[
"The electric field E is defined operationally as the force per unit positive test charge: E = F/Q. For a point charge, this gives E = Q/(4πε0r²) â_r — identical in structure to Coulomb's law but now describing the field itself, independent of any test charge placed in it.",
"For continuous distributions — line charge ρ_L, surface charge ρ_S, volume charge ρ_v — you replace the discrete sum with an integral: each infinitesimal charge element dQ contributes a field dE, and you integrate dE over the whole distribution. The geometry of the distribution (line, sheet, or volume) plus the coordinate system from Day 2 determines how hard that integral is.",
"Two canonical results are worth memorizing outright: an infinite line charge produces E ∝ 1/ρ (falls off with distance), while an infinite charged SHEET produces a CONSTANT E, independent of distance. This difference — a direct consequence of how much charge 'sees' a field point as you move away — is one of the most-tested conceptual results in the whole course.",
"<strong>Worked example:</strong> An infinite sheet has ρS=2nC/m². Its field is E=ρS/(2ε0)=2×10⁻⁹/(2×8.854×10⁻¹²)≈113 V/m, pointing away from the sheet on both sides — and this value is the SAME whether you're 1cm or 10m away.",
"<strong>Self-check:</strong> if your computed field for an infinite sheet appears to depend on distance, you've made an error — re-derive it from Gauss's Law with a pillbox to see exactly why the distance cancels out.",
"<strong>Application:</strong> Field-from-charge-distribution calculations are exactly how signal-integrity engineers predict crosstalk between adjacent PCB traces, and how near-field probes used in EMI pre-compliance testing interpret what they measure."
],
formulas:["E = Q/(4πε0 r²) â_r  (point charge)","E_line = ρ_L/(2πε0 ρ) â_ρ  (infinite line)","E_sheet = ρ_S/(2ε0) n̂  (infinite sheet, constant)"],
questions:[
{type:"Conceptual", q:"Why does the field of an infinite charged sheet not depend at all on distance from the sheet, while a point charge's field falls off as 1/r²? What does this say about how much charge 'contributes' to your local field as you move farther away in each geometry?"},
{type:"Engineering reasoning", q:"A ground plane in a PCB behaves, at short range, like an infinite charged sheet. What practical design consequence follows from the fact that its field doesn't decay with distance the way a trace's (line-charge-like) field does?"},
{type:"Reasoning", q:"For a FINITE line charge, the field does NOT simply equal the infinite-line formula. Under what limiting condition (in terms of distance vs. line length) does the finite-line result converge to the infinite-line approximation — and why does that limit make physical sense?"}
]},

{d:8,week:2,title:"Electric Flux Density (D) and Field Lines",big:false,steps:4,
diagram:"fluxSheet",
facts:[{tag:"KEY FACT", text:"D = eps0 E in free space; total flux through a closed surface equals the enclosed free charge."}, {tag:"CAUTION", text:"Field lines never cross -- a crossing point in a hand sketch is always an error."}],
mcqs:[
{q:"D in free space equals:", options:["ε0E", "E/ε0", "μ0H", "εrE only"], correct:0, explain:"Definition of flux density in vacuum."},
{q:"Total flux through a closed surface equals:", options:["Zero always", "The enclosed free charge", "The total E field", "The permittivity"], correct:1, explain:"This is the statement Gauss's Law formalizes next."},
{q:"Flux lines can:", options:["Cross freely", "Never cross", "Only cross at charges", "Cross at boundaries only"], correct:1, explain:"A crossing would mean two field directions at one point — impossible."},
{q:"Flux line density in a sketch visually represents:", options:["Charge sign only", "Field strength", "Permittivity", "Potential"], correct:1, explain:"Denser lines indicate a stronger local field."},
{q:"D becomes especially useful once you introduce:", options:["Conductors only", "Dielectric media", "Time-varying fields", "Magnetic fields"], correct:1, explain:"D tracks free charge independent of the dielectric's response."}
],
core:"D decouples the field description from the surrounding medium's permittivity, setting up the Week 4 dielectric treatment.",
notes:[
"D = ε0E in free space is the electric flux density — conceptually, a 'bookkeeping' field that tracks how much flux originates from free charge, independent of what material fills the space. This distinction becomes essential in Week 4 once dielectrics are introduced, where D and E behave differently across material boundaries.",
"Field lines (or flux lines) are a visualization tool: they start on positive charge, end on negative charge (or go to infinity), point in the direction of the field at every point, and their density represents field strength. A fundamental rule: flux lines never cross — if your sketch shows two lines crossing, the field would have two directions at that point, which is physically impossible.",
"Total flux Ψ through a closed surface equals the enclosed free charge — this is a preview of Gauss's Law, coming next on Day 9.",
"<strong>Worked example:</strong> A closed surface encloses a total free charge of 5μC. By definition the total flux Ψ through that surface is exactly 5μC, regardless of the surface's shape, size, or how the charge is arranged inside it.",
"<strong>Self-check:</strong> don't try to estimate total flux by 'counting' field lines in a hand sketch — flux is a precise integral quantity (∮D·dS); a sketch is a qualitative aid only, never a calculation shortcut.",
"<strong>Application:</strong> Flux density (D) calculations size dielectric layers in high-voltage power electronics and capacitors, ensuring the material's breakdown field strength is never exceeded — a direct safety and reliability specification."
],
formulas:["D = ε0 E  (free space)","Ψ = ∮ₛ D·dS"],
questions:[
{type:"Conceptual", q:"If flux lines never cross, what does a 'crossing point' in a hand-drawn sketch actually tell you about the validity of that diagram?"},
{type:"Engineering reasoning", q:"Field-line density is often used informally to communicate 'field strength' in textbook diagrams for antenna radiation patterns. What is being visually approximated when a region is drawn with denser lines — and what quantitative field property does that correspond to?"},
{type:"Reasoning", q:"Why is it D — not E — that is the more 'universal' bookkeeping quantity once different dielectric materials are involved? (You won't fully answer this until Day 18, but form a hypothesis now based on how D was defined today.)"}
]},

{d:9,week:2,title:"Gauss's Law — Integral Form & Symmetry Applications",big:true,steps:7,
diagram:"gaussSphere",
facts:[{tag:"KEY FACT", text:"Gauss's Law is always true, but only solvable by hand under spherical, cylindrical, or planar symmetry."}, {tag:"INSIGHT", text:"Inside a uniformly charged sphere E grows linearly with r; outside it falls off as 1/r^2, exactly like a point charge."}],
mcqs:[
{q:"Gauss's Law integral form states:", options:["∮ₛD·dS = Q_enc", "∮_C E·dL = 0", "∇×E=0", "C=Q/V"], correct:0, explain:"Total enclosed flux equals enclosed free charge."},
{q:"Gauss's Law is easily solvable by hand when:", options:["Charge is at rest", "There is spherical, cylindrical, or planar symmetry", "Charge is negative", "Never"], correct:1, explain:"Symmetry lets you pull D out of the integral."},
{q:"Inside a uniformly charged sphere, E grows:", options:["As 1/r²", "Linearly with r", "Exponentially", "Not at all"], correct:1, explain:"Enclosed charge grows as r³, area as r², so E ∝ r."},
{q:"Outside a uniformly charged sphere, E behaves like:", options:["Zero field", "A point charge at the center", "A line charge", "A sheet charge"], correct:1, explain:"All charge appears concentrated at the center from outside."},
{q:"Gauss's Law is:", options:["Only true for spheres", "Always true, but not always easily solvable", "Only an approximation", "Only valid in vacuum"], correct:1, explain:"Universally true; solvability depends on symmetry."}
],
core:"Gauss's Law turns hard integrals into algebra — but ONLY when the charge distribution's symmetry justifies pulling D outside the integral.",
notes:[
"Gauss's Law states that the total electric flux through any closed surface equals the total free charge enclosed: ∮ₛD·dS = Q_enc. This is always true — but it is only SOLVABLE by hand when you can choose a 'Gaussian surface' over which D is constant in magnitude and either parallel or perpendicular to dS everywhere.",
"Three symmetry types unlock this simplification: spherical symmetry (point charge, charged sphere) → use a concentric sphere; cylindrical symmetry (line charge, charged cylinder/cable) → use a coaxial cylinder; planar symmetry (infinite sheet) → use a pillbox straddling the sheet.",
"Applying Gauss's Law to a uniformly charged sphere gives two distinct regimes: OUTSIDE the sphere, the field behaves exactly as if all charge were concentrated at the center (matches the point-charge result); INSIDE a uniformly charged sphere, the enclosed charge grows with r³ while the surface area grows with r², so E grows LINEARLY with r from the center. This inside/outside contrast is one of the most frequently tested results in the entire syllabus.",
"The deep lesson of Day 9 is the gap between a law being TRUE and a law being SOLVABLE: Gauss's Law holds for every closed surface and every charge distribution, but it collapses to simple algebra only for the special, symmetric cases above. Recognizing quickly whether a problem qualifies is arguably the single highest-value exam skill in electrostatics.",
"<strong>Worked example:</strong> A solid sphere of radius a=0.1m carries uniform charge Q=4μC, so ρv=Q/(4/3 πa³)≈9.55×10⁻⁴ C/m³. At r=0.05m (inside): E=ρv r/(3ε0)≈1.8×10⁶ V/m. At r=0.2m (outside): E=Q/(4πε0r²)≈8.99×10⁵ V/m.",
"<strong>Self-check:</strong> always identify FIRST whether your field point is inside or outside the charge distribution — using the 'outside' formula for an 'inside' point (or vice versa) is the single most common Gauss's Law exam mistake.",
"<strong>Application:</strong> Gauss's Law with cylindrical symmetry is exactly how coaxial cable and connector characteristic impedance is derived, and how shielding effectiveness of a cable's outer conductor is quantified in RF cabling specifications."
],
formulas:["∮ₛ D·dS = Q_enc","E_sphere(outside) = Q/(4πε0 r²)","E_sphere(inside, uniform ρv) = ρv r /(3ε0)"],
questions:[
{type:"Conceptual", q:"Gauss's Law is always true, but only 'useful' for solving E in special symmetric cases. What precisely is the difference between a law being true and being solvable, and why does that distinction matter for how you should triage exam problems?"},
{type:"Engineering reasoning", q:"A coaxial cable's inner conductor carries charge with perfect cylindrical symmetry along its length, but near the connector ends the symmetry breaks down. Explain why Gauss's Law remains exactly true at the connector, yet is no longer practically solvable there by hand — what tool would an engineer reach for instead (hint: look ahead to Day 20)?"},
{type:"Reasoning", q:"Given a NEW, unfamiliar charge distribution you've never seen before, describe the diagnostic question you should ask FIRST to determine whether Gauss's Law can simplify it — and what you should do if the answer is no."}
]},

{d:10,week:2,title:"Gauss's Law — Differential Form",big:false,steps:5,
diagram:"gaussDiff",
facts:[{tag:"KEY FACT", text:"div(D) = rho_v -- the local, point-by-point version of Gauss's Law."}, {tag:"INSIGHT", text:"In any charge-free region, div(D) = 0: flux passes through but never originates there."}],
mcqs:[
{q:"The differential form of Gauss's Law is:", options:["∇·D=ρv", "∇×D=ρv", "∇²D=ρv", "D=ρv/ε"], correct:0, explain:"Local, point-by-point version of Gauss's Law."},
{q:"In a charge-free region, ∇·D equals:", options:["Infinity", "Zero", "ρv", "ε0"], correct:1, explain:"No local source of flux where there's no charge."},
{q:"The differential form was derived using:", options:["Stokes' Theorem", "The Divergence Theorem", "Coulomb's Law alone", "Ampère's Law"], correct:1, explain:"Converts the surface integral into a volume integral."},
{q:"The differential and integral forms of Gauss's Law are:", options:["Contradictory", "Equivalent", "Unrelated", "Only approximately equal"], correct:1, explain:"Same physics, different scale of description."},
{q:"A thin shell with nonzero ∇·D implies:", options:["No charge anywhere", "Charge concentrated in that shell", "Zero total charge", "An error in the field"], correct:1, explain:"Divergence directly localizes where charge sits."}
],
core:"The differential form localizes Gauss's Law to a single point in space — the direct bridge toward Maxwell's equations.",
notes:[
"Applying the Divergence Theorem (Day 4) to the integral form of Gauss's Law converts ∮ₛD·dS = Q_enc into a purely local, point-by-point statement: ∇·D = ρ_v. This says the divergence of the flux density AT A POINT equals the volume charge density AT THAT SAME POINT — no surface, no integration, just local behavior.",
"This differential form is one of Maxwell's four equations (you'll meet all four together on Day 34) and is exactly equivalent to the integral form — the choice between them is purely about which is more convenient for a given problem, not about which is more 'true.'",
"In any charge-free region, ∇·D = 0, meaning D is a divergence-free (source-free) field there — flux lines can pass through freely but cannot begin or end unless they hit a region containing charge.",
"<strong>Worked example:</strong> Suppose D = 2x x̂ (C/m²). Then ∇·D = ∂(2x)/∂x = 2, so ρv=2 C/m³ uniformly, wherever D has this form — no integration or Gaussian surface needed.",
"<strong>Self-check:</strong> ∇·D gives ρv directly at a point. If you find yourself setting up an integral or a Gaussian surface just to find ρv from a given D, you're using the harder (integral-form) method when the differential form is faster.",
"<strong>Application:</strong> The differential form (∇·D=ρv) is the equation Poisson solvers inside semiconductor device simulators (TCAD tools) actually iterate on to compute doping-dependent charge and field profiles inside transistors."
],
formulas:["∇·D = ρv","In any charge-free region: ∇·D = 0"],
questions:[
{type:"Conceptual", q:"If you're given a D field that has nonzero divergence only within a thin spherical shell, what physical charge distribution does that imply, and how would you sketch ρv(r) versus radius?"},
{type:"Engineering reasoning", q:"A simulation tool reports ∇·D ≠ 0 at a point in a region you modeled as charge-free dielectric. Walk through what this discrepancy should make you suspect first — a numerical artifact, an unmodeled charge, or a boundary condition error — and how you'd distinguish between them."},
{type:"Reasoning", q:"Why must the integral and differential forms of Gauss's Law always give consistent answers for the SAME physical situation, even though one describes a whole surface and the other a single point?"}
]},

{d:11,week:3,title:"Electric Potential: Work & Energy",big:false,steps:5,
diagram:"contour",
facts:[{tag:"KEY FACT", text:"V = Q/(4 pi eps0 r), referenced to V = 0 at infinity."}, {tag:"INSIGHT", text:"Potentials add as plain numbers; fields must be added as vectors."}],
mcqs:[
{q:"V for a point charge (ref at infinity) is:", options:["Q/(4πε0r)", "Q/(4πε0r²)", "Qr/(4πε0)", "4πε0Q/r"], correct:0, explain:"Standard potential formula."},
{q:"Work to move a charge in a static E field is:", options:["Path-dependent", "Path-independent", "Always zero", "Undefined"], correct:1, explain:"Static E is conservative, so work only depends on endpoints."},
{q:"Potentials from multiple charges add as:", options:["Vectors", "Plain scalar numbers", "Cross products", "Squares"], correct:1, explain:"V is scalar, so superposition is simple addition."},
{q:"V = -∫E·dL relies on E being:", options:["Non-conservative", "Conservative", "Zero", "Time-varying"], correct:1, explain:"Path-independence requires a conservative field."},
{q:"Choosing V=0 at infinity is:", options:["Physically mandatory", "An arbitrary but convenient reference", "Always incorrect", "Only valid for spheres"], correct:1, explain:"Only potential differences are physically meaningful."}
],
core:"Potential is path-independent work per unit charge — a scalar shortcut around vector field integration.",
notes:[
"Potential difference between two points is defined as the work done, per unit positive charge, in moving a charge against the electric field from one point to the other: V = -∫E·dL. Because static E fields are conservative (zero curl, from Day 5), this work is path-INDEPENDENT — only the start and end points matter, never the route taken.",
"For a point charge, referencing V = 0 at infinity gives the clean result V = Q/(4πε0r). This single formula, combined with superposition, lets you find the potential of any discrete charge configuration by simple scalar addition — no vector components required.",
"The shift from vector E-field calculations to scalar V calculations is often the single biggest time-saver in electrostatics problems: adding numbers is far easier than adding vectors component-by-component.",
"<strong>Worked example:</strong> A point charge Q=5nC sits at the origin. V at r=2m is 5×10⁻⁹/(4πε0×2)≈22.5V. At r=4m, V≈11.25V — exactly half, since V∝1/r (unlike E, which would drop to a quarter over the same distance).",
"<strong>Self-check:</strong> V falls off as 1/r while E falls off as 1/r² for a point charge — mixing these two up is a common source of factor-of-two errors on exams.",
"<strong>Application:</strong> Potential (voltage) is the quantity every multimeter measures and every SPICE circuit simulation reports at each node — ground-plane reference design on a PCB is fundamentally a potential-distribution problem."
],
formulas:["V = -∫ E·dL","V = Q/(4πε0 r)  (point charge, reference at infinity)"],
questions:[
{type:"Conceptual", q:"Why is it valid to add potentials from multiple charges as plain numbers, while adding their fields requires full vector addition? What property of scalars versus vectors makes this shortcut work?"},
{type:"Engineering reasoning", q:"In circuit design, 'ground' is chosen as the 0V reference. Connect this everyday choice directly to the mathematical freedom you have in choosing WHERE V = 0 for a point charge — what does this tell you about whether 'absolute potential' has any physical meaning on its own?"},
{type:"Reasoning", q:"Path-independence of work relies on E being conservative. If you later learn (Week 7) that time-varying E fields are NOT conservative, what happens to the very definition of 'voltage between two points' in that setting?"}
]},

{d:12,week:3,title:"Relationship Between E and V",big:false,steps:4,
diagram:"contour",
facts:[{tag:"KEY FACT", text:"E = -grad(V), always."}, {tag:"CAUTION", text:"Equal potential does not guarantee zero field along an arbitrary path -- only along a path that stays ON the equipotential surface."}],
mcqs:[
{q:"E = -∇V shows E points from:", options:["Low V to high V", "High V to low V", "Always upward", "Always along x"], correct:1, explain:"Field points toward decreasing potential."},
{q:"If two points share the same V, the field along the straight line between them:", options:["Is always nonzero", "Is not determined just from equal V", "Is always infinite", "Is always zero"], correct:1, explain:"Depends on whether the connecting path lies on the equipotential."},
{q:"Equipotential surfaces are surfaces of:", options:["Constant E", "Constant V", "Constant Q", "Constant D"], correct:1, explain:"Definition of an equipotential surface."},
{q:"A region of constant V everywhere implies:", options:["E is huge", "E = 0 throughout that region", "D is huge", "ρv is huge"], correct:1, explain:"Gradient of a constant is zero."},
{q:"Computing E from V uses:", options:["Integration", "Differentiation (gradient)", "Multiplication", "Curl"], correct:1, explain:"E = -∇V is a differentiation operation."}
],
core:"E is the negative gradient of V — potential and field are two mathematical views of the exact same physics.",
notes:[
"Combining the Day 3 gradient operation with the Day 11 definition of potential gives one of the most-used identities in the course: E = -∇V. The field points in the direction of steepest DECREASE of potential — charges are pushed from high V to low V, just as a ball rolls downhill.",
"In practice, this means you can solve a problem EITHER by finding E directly and integrating to get V, OR by finding V first (often easier, since it's scalar) and then differentiating to recover E. Which direction you go depends entirely on which quantity is easier to set up for the given geometry.",
"Equipotential surfaces are always perpendicular to E at every point — a purely geometric consequence of the gradient relationship, and a fast way to sketch field direction from a contour map without any calculus.",
"<strong>Worked example:</strong> Given V(x)=100−5x² (volts, x in meters), E=−dV/dx x̂=10x x̂. At x=2m, E=20 V/m in the +x direction — the field points AWAY from the potential maximum at x=0.",
"<strong>Self-check:</strong> a flat (zero-slope) region of a V(x) plot means E=0 there, even if V itself is large. It is the SLOPE of V, not its size, that determines E's magnitude.",
"<strong>Application:</strong> The E=-∇V relationship is how field solvers convert a simulated potential map (easy to compute) into the field map engineers actually need for via/trace voltage-drop analysis and dielectric stress checks."
],
formulas:["E = -∇V","Equipotential surfaces are always ⟂ to E"],
questions:[
{type:"Conceptual", q:"Two points have the same potential. Can there be a nonzero E field along the straight line joining them? Justify your answer using the equipotential-perpendicularity property."},
{type:"Engineering reasoning", q:"A PCB thermal/field simulation outputs a potential map but not a field map directly. Explain, step by step, how you would derive the field distribution from the potential map alone, and what numerical operation that corresponds to."},
{type:"Reasoning", q:"If a region has CONSTANT potential everywhere (not just along one surface, but the whole 3D region), what must be true about E throughout that region, and what physical situation (hint: Day 17) produces exactly this condition?"}
]},

{d:13,week:3,title:"Potential Due to Charge Distributions",big:false,steps:5,
diagram:"chargeRadial",
facts:[{tag:"KEY FACT", text:"V = integral of rho/(4 pi eps0 R) -- scalar superposition, usually easier than the equivalent E-field integral."}, {tag:"INSIGHT", text:"A dipole's far-field V falls off as 1/r^2, one power faster than a single charge, due to near-cancellation."}],
mcqs:[
{q:"V from a continuous charge distribution requires:", options:["Vector integration", "Scalar integration", "No calculation", "Cross products"], correct:1, explain:"V is scalar, simplifying the integral setup."},
{q:"A dipole's far-field V falls off as:", options:["1/r", "1/r²", "1/r³", "Constant"], correct:1, explain:"One power faster than a single charge due to cancellation."},
{q:"Computing V first, then E via gradient, is often:", options:["Always harder", "Often easier than direct E integration", "Impossible", "Only valid for point charges"], correct:1, explain:"Scalar integration then differentiation is usually the lighter path."},
{q:"A single point charge's V falls off as:", options:["1/r", "1/r²", "1/r³", "Constant"], correct:0, explain:"Standard point-charge potential falloff."},
{q:"The dipole's faster falloff is due to:", options:["Charge doubling", "Near-cancellation of opposite charges", "Higher permittivity", "Symmetry breaking"], correct:1, explain:"Opposite charges' contributions nearly cancel at large r."}
],
core:"Scalar superposition often makes potential integrals easier to set up than the equivalent field integrals for the same geometry.",
notes:[
"Just as with E, continuous charge distributions require integrating V over the distribution: V = ∫ρ(L,S,v)/(4πε0R) d(l,S,v). Because V is scalar, this integral is often noticeably simpler to set up than the corresponding vector E-field integral — you skip decomposing into components and instead sum plain numbers weighted by 1/R.",
"A common and instructive workflow: compute V via the (easier) scalar integral, then recover E via E = -∇V, rather than attacking the E-field integral directly. This trade — harder differentiation for easier integration — is usually a net win.",
"The dipole result (two equal and opposite charges close together) is worth previewing: far-field V for a dipole falls off as 1/r², faster than a single charge's 1/r, because the near-cancellation of the two opposite-sign contributions removes the leading-order term.",
"<strong>Worked example:</strong> A finite line charge of length L=1m with uniform ρL=10nC/m lies along the x-axis. The potential at a point on the perpendicular bisector, distance d=0.5m away, requires the full integral V=∫ρL/(4πε0R)dl over the length — more work than the point-charge case, but still just scalar addition of contributions.",
"<strong>Self-check:</strong> for finite distributions, always set up the full integral with correct limits BEFORE simplifying. Jumping straight to the infinite-line shortcut formula for a finite line is a very common mistake.",
"<strong>Application:</strong> Potential-from-distribution calculations predict how densely packed charge on adjacent IC package pins or BGA balls influences neighboring signal integrity — a real concern in high-pin-count chip packaging."
],
formulas:["V = ∫ ρL,S,v /(4πε0 R) dl, dS, dv","V_dipole(far field) ∝ p·â_r / r²"],
questions:[
{type:"Conceptual", q:"For a dipole, why does far-field V fall off as 1/r² instead of 1/r like a single charge — what cancellation, specifically, is happening between the two charge contributions?"},
{type:"Engineering reasoning", q:"When would you, as a design decision, choose to compute V first and differentiate for E, versus computing E directly? Frame your answer around the geometry of the charge distribution, not just 'whichever is easier in general.'"},
{type:"Reasoning", q:"If a charge distribution is arranged so that its total charge is zero (like a dipole) but its net dipole moment is ALSO zero (a quadrupole arrangement), what do you predict happens to the leading power-law falloff of V — faster or slower than 1/r²? Justify by analogy to the dipole cancellation."}
]},

{d:14,week:3,title:"Energy Density in Electrostatic Fields",big:false,steps:4,
diagram:"energyCap",
facts:[{tag:"KEY FACT", text:"Energy density w = 1/2 eps0 E^2 is stored in the field itself, not in the charge."}, {tag:"INSIGHT", text:"This field-energy view is the ONLY one that explains how radiated waves carry energy through empty space."}],
mcqs:[
{q:"Electrostatic energy density is:", options:["εE", "½εE²", "εE²/2r", "ε/E"], correct:1, explain:"Standard energy density formula."},
{q:"Energy in a static field is stored:", options:["Only in the charges", "In the field itself, throughout space", "Nowhere", "Only at infinity"], correct:1, explain:"The field-based view of energy storage."},
{q:"The field-energy view is essential for explaining:", options:["Only DC circuits", "Energy transport by radiated waves", "Conductor shielding", "Superposition"], correct:1, explain:"Radiation carries energy through charge-free space."},
{q:"W = ½∫D·E dv represents:", options:["Total stored electrostatic energy", "Total charge", "Total current", "Total flux"], correct:0, explain:"Integrated energy density over all space."},
{q:"A region with E≠0 but no nearby charge:", options:["Has zero energy", "Still has stored field energy", "Is impossible", "Has negative energy"], correct:1, explain:"Energy density depends only on E, not on nearby charge."}
],
core:"Energy isn't stored 'in the charges' — it's stored in the field itself, distributed continuously through space.",
notes:[
"The work required to assemble a system of charges from infinite separation equals the total electrostatic potential energy of the configuration: W = ½∫ρvV dv for a continuous distribution. This is a bookkeeping statement about the charges.",
"Reformulating this energy purely in terms of the field gives w_E = ½ε0E² as an ENERGY DENSITY — energy per unit volume — that exists at every point in space where E is nonzero, whether or not charge is physically present there. This is a genuine conceptual leap: energy is a property of the field, not of the charge.",
"This reframing becomes indispensable in Week 7–8, where time-varying fields carry energy through empty space (radiation) with no charge in transit at all — the field-based energy picture is the ONLY one that makes sense there.",
"<strong>Worked example:</strong> A parallel-plate capacitor has E=10⁴ V/m between its plates in vacuum. The energy density is w=½ε0E²=½×8.854×10⁻¹²×(10⁴)²≈4.43×10⁻⁴ J/m³; multiplying by the gap's volume gives the total stored energy.",
"<strong>Self-check:</strong> energy density depends on E SQUARED — doubling the field quadruples the stored energy density, not just doubles it. This nonlinearity is a frequent source of quick-estimate errors.",
"<strong>Application:</strong> Energy density calculations directly size supercapacitors and decoupling/bypass capacitors used to stabilize power rails in digital circuits, and determine RF component power-handling limits before dielectric breakdown."
],
formulas:["W = ½∫ᵥ D·E dv","w_E = ½ε0 E²  (energy density, free space)"],
questions:[
{type:"Conceptual", q:"If energy is stored in the field rather than in the charge, what does that imply about the energy present in a region of space with E ≠ 0 but no charge nearby?"},
{type:"Engineering reasoning", q:"A parallel-plate capacitor stores energy 'in the gap' between the plates according to field theory, not 'on the plates' as circuit theory loosely implies. What practical safety implication follows from this for handling a charged capacitor after power is removed?"},
{type:"Reasoning", q:"Radio waves carry energy across a vacuum with no charge moving between transmitter and receiver. Using only the field-energy-density concept from today, explain in your own words how that's even possible — and note which future week (7 or 8) will make this rigorous."}
]},

{d:15,week:3,title:"Review & Critical Problem Set: Electrostatics",big:true,steps:6,
diagram:{type:"conceptmap", nodes:["Coulomb","E","D","Gauss's Law","V","Energy"]},
facts:[{tag:"INSIGHT", text:"The whole of electrostatics rests on two properties: linearity (superposition) and conservativeness (a well-defined potential)."}, {tag:"KEY FACT", text:"Concept chain: Coulomb's Law -> E -> D -> Gauss's Law -> V -> Energy."}],
mcqs:[
{q:"The electrostatics concept chain is:", options:["V→D→E→Gauss→Coulomb", "Coulomb→E→D→Gauss→V→Energy", "Energy→V→Coulomb", "Gauss→Coulomb only"], correct:1, explain:"The build-up order used across Weeks 2-3."},
{q:"Superposition is valid because Coulomb's Law is:", options:["Nonlinear", "Linear", "Quadratic", "Undefined"], correct:1, explain:"Linear force law in charge enables simple addition."},
{q:"A well-defined potential exists because E is:", options:["Divergence-free", "Conservative (curl-free)", "Time-varying", "Discontinuous"], correct:1, explain:"Conservative fields admit a scalar potential."},
{q:"For irregular, non-symmetric charge shapes, Gauss's Law's integral form is:", options:["Still the fastest method", "Not easily solvable by hand", "Invalid", "The only option"], correct:1, explain:"Symmetry is required for the integral shortcut."},
{q:"The two properties underlying all of electrostatics are:", options:["Randomness and chaos", "Linearity and conservativeness", "Only linearity", "Only symmetry"], correct:1, explain:"These two properties generate the entire toolkit."}
],
core:"Synthesis day — force every tool from Days 6–14 to work together on multi-concept problems, the way exam questions actually combine them.",
notes:[
"Electrostatics rests on a small set of deeply connected ideas: Coulomb's Law (force) → superposition → E (field) → D (flux density) → Gauss's Law (flux/charge relationship) → V (potential, via work) → energy (assembled from V or from field density). Today's job is not learning anything new — it's forcing these pieces to interlock.",
"A useful diagnostic when facing an unfamiliar electrostatics problem: identify what's GIVEN (charge distribution? field? potential?) and what's ASKED FOR, then trace the shortest legal path through the concept map connecting them — sometimes that path goes through Gauss's Law, sometimes through direct integration, sometimes through V and a gradient.",
"The single unifying principle underneath everything in Weeks 2–3 is CONSERVATION plus LINEARITY: charge is conserved, the force law is linear (enabling superposition), and the field is conservative (enabling a well-defined potential). Every formula you've learned is a consequence of these three facts applied to different geometries.",
"<strong>Worked example:</strong> Given only a spherical distribution's total charge Q and radius a, you can find E (Gauss's Law, Day 9), then V (integrating E, Day 11), then energy (w=½ε0E², Day 14) — all from that one starting fact, showing how the whole Week 2–3 toolkit chains together.",
"<strong>Self-check:</strong> before starting any electrostatics problem, write down what's GIVEN and what's ASKED FOR. Most mistakes come from calculating before identifying which tool (Coulomb, Gauss, V, E-V relation, energy) actually connects the two.",
"<strong>Application:</strong> The full electrostatics toolkit together is what powers capacitive touchscreen sensing (your phone) and capacitive proximity sensors — both rely on tracking how a nearby object changes local charge, field, and capacitance."
],
formulas:["Concept chain: Coulomb's Law → E → D → Gauss's Law → V → Energy","W = QV  (work/energy to bring a charge Q to a point at potential V)"],
questions:[
{type:"Conceptual", q:"Write, in your own words, the single unifying principle connecting Coulomb's Law, Gauss's Law, and potential — what property of the underlying force makes ALL of electrostatics solvable with such a small toolkit?"},
{type:"Engineering reasoning", q:"You're asked to characterize the field environment around a charged sensor housing with an irregular (non-symmetric) shape. Walk through, in order, which tools from Weeks 2–3 you would try FIRST, SECOND, and LAST — and justify the ordering."},
{type:"Reasoning", q:"If Coulomb's Law were only an approximation valid at large distances (rather than exact), which downstream results — Gauss's Law, potential, energy density — would need to be re-derived from scratch, and which would likely remain structurally intact? Defend your classification."}
]},

{d:16,week:4,title:"Current, Current Density & Continuity",big:false,steps:4,
diagram:"continuity",
facts:[{tag:"KEY FACT", text:"div(J) = -d(rho_v)/dt -- local charge conservation."}, {tag:"INSIGHT", text:"In steady state, div(J) = 0 everywhere -- this IS Kirchhoff's Current Law, derived from field theory."}],
mcqs:[
{q:"The continuity equation is:", options:["∇·J = -∂ρv/∂t", "∇×J = ρv", "J = σE", "∇·E=ρv"], correct:0, explain:"Local statement of charge conservation."},
{q:"In steady state, ∇·J equals:", options:["Infinity", "Zero", "ρv", "σ"], correct:1, explain:"No charge accumulation means divergence-free current."},
{q:"Kirchhoff's Current Law follows from continuity when:", options:["Charge is increasing", "∂ρv/∂t = 0 (steady state)", "Current is AC", "Never"], correct:1, explain:"KCL is the DC special case of continuity."},
{q:"I = ∫J·dS relates:", options:["Current to current density over a surface", "Voltage to current", "Charge to mass", "E to D"], correct:0, explain:"Definition of total current from current density."},
{q:"At high frequency, the -∂ρv/∂t term:", options:["Is always negligible", "Can become significant", "Never matters", "Equals zero always"], correct:1, explain:"Rapid charge changes make this term important."}
],
core:"Charge conservation, expressed locally at every point in space, IS the continuity equation — the bridge from static to dynamic EM.",
notes:[
"Current I is the rate of charge flow through a surface; current density J describes this flow per unit cross-sectional area at each point, related by I = ∫J·dS. J is the more fundamental, local quantity — I is just its integral over a chosen surface.",
"The continuity equation, ∇·J = -∂ρv/∂t, is nothing more than local charge conservation written in field language: if charge density at a point is decreasing over time, current must be diverging away from that point (flowing outward) to carry it away, and vice versa.",
"In STEADY-STATE (DC) conditions, ∂ρv/∂t = 0, so the continuity equation reduces to ∇·J = 0 — current in equals current out at every point, which is the field-theoretic origin of Kirchhoff's Current Law used constantly in circuit analysis.",
"<strong>Worked example:</strong> A wire carries J=2×10⁶ A/m² uniformly through a 1mm² (10⁻⁶m²) cross-section. I=J×A=2A. If this 2A flows into a node splitting into two branches, the branch currents must sum to 2A — a direct use of ∇·J=0 in steady state.",
"<strong>Self-check:</strong> J is a LOCAL, per-unit-area quantity, while I is a TOTAL, integrated quantity — never use them interchangeably in a formula without accounting for the cross-sectional area.",
"<strong>Application:</strong> Continuity and current density calculations size PCB trace widths for safe current-carrying capacity (ampacity) and drive power-distribution-network (PDN) design in ICs to avoid localized overheating."
],
formulas:["I = ∫ₛ J·dS","∇·J = -∂ρv/∂t"],
questions:[
{type:"Conceptual", q:"In steady-state DC circuits, why must ∇·J = 0 hold at every point, not just at circuit nodes — what would happen physically at an interior point of a conductor if it didn't?"},
{type:"Engineering reasoning", q:"Kirchhoff's Current Law is normally taught as a circuit-theory axiom. Show explicitly how it follows as a special case of the continuity equation — what assumption about time-dependence makes the reduction work?"},
{type:"Reasoning", q:"In a high-frequency circuit where charge densities DO change rapidly with time, does KCL as commonly stated still hold exactly at a node, or does the -∂ρv/∂t term become non-negligible? What real high-frequency phenomenon does this connect to?"}
]},

{d:17,week:4,title:"Conductors in Electrostatic Fields",big:false,steps:4,
diagram:"conductorCavity",
facts:[{tag:"KEY FACT", text:"E = 0 inside a conductor at electrostatic equilibrium -- everything else about conductors follows from this."}, {tag:"INSIGHT", text:"A charge-free cavity inside a conductor always has zero field inside it, regardless of the conductor's outer shape."}],
mcqs:[
{q:"Inside a conductor at electrostatic equilibrium, E equals:", options:["Maximum", "Zero", "Infinite", "Equal to V"], correct:1, explain:"Free charges redistribute until internal field cancels."},
{q:"Excess charge on a conductor resides:", options:["Throughout the bulk", "Only on the surface", "At the center", "Nowhere"], correct:1, explain:"A direct consequence of E=0 inside."},
{q:"A charge-free cavity inside a conductor has:", options:["A strong field inside", "Zero field inside", "Field equal to the outside field", "Undefined field"], correct:1, explain:"Shielding effect regardless of outer shape."},
{q:"At a conductor's surface, E is:", options:["Tangential only", "Purely normal (perpendicular)", "Zero", "Random direction"], correct:1, explain:"Any tangential component would drive further charge motion."},
{q:"This cavity shielding effect is the basis of:", options:["Capacitors", "Faraday cages", "Inductors", "Resistors"], correct:1, explain:"Practical application of the cavity result."}
],
core:"Inside a conductor at equilibrium, E = 0 — this single fact drives every other conductor boundary behavior you'll use in circuit and shielding design.",
notes:[
"Conductors contain free charge carriers that redistribute instantly (on the timescale of electrostatics) in response to any applied field, until the internal field is exactly cancelled. The equilibrium condition is therefore E = 0 everywhere INSIDE a conductor.",
"A direct consequence: since E = 0 inside, ∇·D = ρv = 0 inside too — meaning any excess charge on a conductor resides ENTIRELY on its outer surface, never in the bulk. This is why charge distributes itself over the surface of a conductor, however irregular its shape.",
"At the conductor's surface, E must be purely NORMAL (perpendicular) to the surface — any tangential component would drive further charge motion, contradicting equilibrium. This normal-field, surface-charge relationship (E = ρS/ε0 just outside the surface) is the seed of every conductor boundary-condition problem in the course.",
"<strong>Worked example:</strong> A conductor carries +10μC total charge and has an internal star-shaped cavity containing no charge. Despite the irregular shape, the field inside that cavity is exactly ZERO everywhere — a direct, exam-favorite consequence of E=0 in the conductor's bulk.",
"<strong>Self-check:</strong> don't assume charge spreads 'evenly' over an irregular conductor surface — it distributes so that E=0 INSIDE, which for non-spherical shapes means higher surface charge density at sharp points (why lightning rods are pointed).",
"<strong>Application:</strong> The conductor-cavity shielding result is the entire theoretical basis for Faraday cages and EMI-shielded enclosures used to protect sensitive RF receivers, medical electronics, and test equipment from external interference."
],
formulas:["E_inside(conductor, equilibrium) = 0","E_surface(normal, just outside) = ρS / ε0"],
questions:[
{type:"Conceptual", q:"A conductor with an internal cavity (containing no charge) sits inside an external field. Why is the field inside the cavity exactly zero, regardless of the conductor's outer shape — trace the argument from E=0 in the bulk."},
{type:"Engineering reasoning", q:"This cavity result is the theoretical basis for Faraday-cage shielding used to protect sensitive electronics. Explain precisely what property of the shielding enclosure (shape? material? thickness?) actually matters for the shielding to work, based on today's derivation."},
{type:"Reasoning", q:"If a conductor is NOT in electrostatic equilibrium (charges are still actively redistributing), is E = 0 inside guaranteed at that instant? What does this tell you about the timescale assumption baked into 'electrostatic equilibrium'?"}
]},

{d:18,week:4,title:"Dielectrics, Polarization & Boundary Conditions",big:true,steps:6,
diagram:{type:"boundary", top:"E1, D1 (medium 1)", bottom:"E2, D2 (medium 2)", caption:"E_t continuous always; D_n continuous only if no free surface charge"},
facts:[{tag:"KEY FACT", text:"Tangential E is always continuous; normal D is continuous only if there is no free surface charge."}, {tag:"CAUTION", text:"D tracks FREE charge only; E responds to free + bound charge -- don't conflate the two across a dielectric boundary."}],
mcqs:[
{q:"D = εE holds for:", options:["Any material", "Linear dielectrics", "Conductors only", "Vacuum only"], correct:1, explain:"Linear dielectric constitutive relation."},
{q:"Tangential E across a dielectric boundary is:", options:["Discontinuous", "Always continuous", "Zero", "Undefined"], correct:1, explain:"One of the two dielectric boundary conditions."},
{q:"Normal D is continuous only if:", options:["εr is large", "There is no free surface charge", "E=0", "D=0"], correct:1, explain:"Free charge is what breaks D_n continuity."},
