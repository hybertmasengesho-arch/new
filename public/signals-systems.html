"<strong>Application:</strong> The time-bandwidth trade-off directly explains why a very SHORT radar pulse (good range resolution -- it can distinguish closely-spaced targets in time) REQUIRES a correspondingly WIDE receiver bandwidth to capture it faithfully -- a fundamental design constraint radar and wideband communication engineers cannot avoid, only manage."
],
formulas:["X(ω) = ∫_{-∞}^{∞} x(t)e^{-jωt}dt   (forward Fourier Transform)","x(t) = (1/2π)∫_{-∞}^{∞} X(ω)e^{jωt}dω   (inverse)","rect(t/τ) ↔ τ·sinc(ωτ/2π)  ;  e^{-at}u(t) ↔ 1/(a+jω), a>0"],
questions:[
{type:"Conceptual", q:"Explain, conceptually, how letting the period T→∞ in a Fourier SERIES turns the discrete harmonic spacing ω0=2π/T into a continuous frequency variable ω, motivating why the Fourier TRANSFORM naturally applies to aperiodic signals."},
{type:"ECE application", q:"A radar system needs very fine range resolution, which requires a very short transmitted pulse. Using the rect-sinc transform pair and the time-bandwidth trade-off, explain why this design requirement forces the radar's RF front-end and receiver to support a wide bandwidth, and why this is a genuine engineering cost (more bandwidth = more noise, more spectrum regulation to navigate)."},
{type:"Reasoning", q:"Why can't an ordinary (non-impulse-extended) Fourier Transform be computed directly for x(t)=cos(ω0t) using the defining integral ∫x(t)e^{-jωt}dt as written -- what property of cos(ω0t) makes this integral fail to converge in the ordinary sense, and why does Day 14 need impulses in frequency to handle it?"}
]},

{d:14,week:3,title:"Properties of the Fourier Transform",big:false,steps:5,
diagram:"ftprops",
facts:[{tag:"KEY FACT", text:"The Convolution Theorem: convolution in the TIME domain becomes simple MULTIPLICATION in the frequency domain, y(t)=x(t)*h(t) ⟺ Y(ω)=X(ω)H(ω) -- this is the single most consequential property in the entire course."}, {tag:"INSIGHT", text:"Duality: the Fourier Transform's forward and inverse formulas are nearly mirror images of each other, meaning every time-domain property has a matching, symmetric frequency-domain property (and vice versa)."}],
mcqs:[
{q:"The Convolution Theorem states that convolution in time corresponds, in frequency, to:", options:["Convolution again", "Multiplication: Y(ω)=X(ω)H(ω)", "Addition: Y(ω)=X(ω)+H(ω)", "Division"], correct:1, explain:"This is precisely why LTI system analysis is done almost exclusively in the frequency domain -- multiplying two functions is far easier than convolving them."},
{q:"Modulation (multiplying x(t) by cos(ω0t)) in the frequency domain:", options:["Leaves X(ω) unchanged", "Shifts X(ω) up and down in frequency by ±ω0", "Squares X(ω)", "Deletes all frequencies below ω0"], correct:1, explain:"Multiplying by a cosine in time SHIFTS the spectrum to be centered at ±ω0 -- this is literally how AM radio modulation works."},
{q:"By the duality property, if x(t) has transform X(ω), then a signal shaped like X(t) has a transform that looks like:", options:["x(ω), exactly, with no sign change", "2π·x(-ω)", "Zero", "X(ω) again unchanged"], correct:1, explain:"Duality reflects the near-symmetric roles of time and frequency in the forward/inverse transform definitions, up to a 2π scaling and a sign flip."},
{q:"Multiplication in the TIME domain, x(t)·y(t), corresponds in frequency to:", options:["X(ω)·Y(ω)", "(1/2π)X(ω)*Y(ω), i.e. convolution in frequency", "X(ω)+Y(ω)", "It has no frequency-domain equivalent"], correct:1, explain:"This is the 'dual' statement of the Convolution Theorem: multiplying in one domain always corresponds to convolving in the other."},
{q:"Parseval's/Rayleigh's energy theorem for the Fourier Transform states:", options:["Energy is always zero", "∫|x(t)|²dt = (1/2π)∫|X(ω)|²dω", "Energy only exists at ω=0", "It only applies to periodic signals"], correct:1, explain:"Just like Day 12's Parseval theorem for periodic power, this states total signal ENERGY is identical whether computed in time or frequency."}
],
core:"The Convolution Theorem is the payoff for everything since Day 6: instead of grinding through a flip-slide-multiply-integrate convolution, an engineer can transform both signals to the frequency domain, simply MULTIPLY their spectra, and transform back -- this is the actual computational basis of virtually all practical filter design and analysis.",
notes:[
"CONVOLUTION THEOREM: x(t)*h(t) ⟺ X(ω)H(ω). Convolution (hard, requires an integral for every output point) in time becomes ordinary multiplication (easy, pointwise) in frequency. This single fact is WHY frequency-domain analysis dominates practical filter design: a filter's effect on ANY input spectrum is found by simply multiplying by H(ω), the filter's frequency response.",
"MODULATION property: x(t)cos(ω0t) ⟺ (1/2)[X(ω-ω0)+X(ω+ω0)]. Multiplying a signal by a sinusoid in time shifts its ENTIRE spectrum to be centered around ±ω0 in frequency. This is literally the mathematical description of AM (amplitude) modulation -- moving a baseband signal's spectrum up to a radio carrier frequency for transmission.",
"DUALITY: because the forward and inverse Fourier Transform formulas are nearly symmetric (differing only by a 1/2π factor and a sign in the exponent), every time-domain property has a mirror-image frequency-domain property. E.g. multiplication-in-time↔convolution-in-frequency is the dual of convolution-in-time↔multiplication-in-frequency (the Convolution Theorem above).",
"Linearity, time-shift (x(t-t0)↔X(ω)e^{-jωt0}, phase-only change, exactly parallel to Day 12's Fourier series property), and time-scaling (x(at)↔(1/|a|)X(ω/a), confirming the time-bandwidth trade-off from Day 13 as a formal property) all carry over from the Fourier series with the sum replaced by an integral.",
"<strong>Worked example:</strong> An ideal low-pass filter has H(ω)=1 for |ω|<ωc and 0 otherwise (a 'brick wall' filter). By the Convolution Theorem, ANY input signal x(t) passed through this filter has output spectrum Y(ω)=X(ω)H(ω) -- meaning the output spectrum is simply X(ω) with everything above ωc chopped off to zero. This is the cleanest possible description of 'what a filter does', and it's why H(ω) itself is called the system's FREQUENCY RESPONSE.",
"<strong>Application:</strong> Every radio transmitter uses the modulation property to shift an audio/data baseband signal up to its assigned RF carrier frequency (so it can be radiated efficiently and multiple stations can share the spectrum without overlapping), and every receiver uses the SAME property in reverse (demodulation) to shift the RF signal back down to baseband for the listener/decoder."
],
formulas:["Convolution Theorem: x(t)*h(t) ↔ X(ω)H(ω)","Modulation: x(t)cos(ω0t) ↔ (1/2)[X(ω-ω0)+X(ω+ω0)]","Multiplication (dual): x(t)y(t) ↔ (1/2π)X(ω)*Y(ω)"],
questions:[
{type:"Conceptual", q:"Using the Convolution Theorem, explain in your own words why an engineer analyzing an LTI filter almost always prefers to work with H(ω) (frequency response) rather than h(t) (impulse response) directly, even though both contain exactly the same information about the system."},
{type:"ECE application", q:"An AM radio transmitter multiplies a baseband audio signal x(t) (bandwidth ~5 kHz) by a carrier cos(ω0t) where f0=1000 kHz. Using the modulation property, describe where the transmitted signal's spectrum is now located, and explain why this shift is what allows many different radio stations to broadcast simultaneously without their signals overlapping."},
{type:"Reasoning", q:"An 'ideal brick-wall' low-pass filter H(ω) (1 inside a band, 0 outside, with a perfectly sharp cutoff) is mathematically convenient but its IMPULSE response h(t) turns out to be a sinc function stretching from t=-∞ to t=+∞. Explain why this means an ideal brick-wall filter is NON-CAUSAL, and therefore physically unrealizable exactly -- connect this back to Day 4's causality condition on h(t)."}
]},

{d:15,week:3,title:"Sampling Theorem & Aliasing",big:true,steps:6,
diagram:"sampling",
facts:[{tag:"KEY FACT", text:"The Nyquist–Shannon Sampling Theorem: a band-limited signal with maximum frequency fm can be perfectly reconstructed from its samples if the sampling rate fs > 2fm (the Nyquist rate)."}, {tag:"CAUTION", text:"Sampling BELOW the Nyquist rate causes ALIASING -- high frequencies fold back and masquerade as false, lower frequencies in the sampled data, an error that CANNOT be undone after the fact by any filter."}],
mcqs:[
{q:"The Nyquist rate for a signal band-limited to fm Hz is:", options:["fm", "2fm", "fm/2", "4fm"], correct:1, explain:"Sampling must occur at a rate STRICTLY GREATER than twice the highest frequency present to avoid aliasing (fs>2fm)."},
{q:"Sampling a signal in time corresponds, in frequency, to:", options:["Erasing the spectrum entirely", "Periodically repeating (replicating) the original spectrum at multiples of fs", "Shrinking the spectrum to zero width", "No change to the spectrum at all"], correct:1, explain:"Ideal sampling creates infinitely many shifted copies of X(ω), spaced fs apart along the frequency axis -- this is the mathematical heart of the sampling theorem."},
{q:"Aliasing occurs when:", options:["fs > 2fm (oversampling)", "fs < 2fm, causing the shifted spectral copies to overlap", "The signal is perfectly band-limited", "The signal has zero bandwidth"], correct:1, explain:"If the sampling rate is too low, the replicated spectral copies overlap, and high frequencies get irreversibly mixed with (mistaken for) low frequencies."},
{q:"An anti-aliasing filter is placed:", options:["After the ADC, to fix aliasing after the fact", "Before the ADC (sampler), to band-limit the signal before sampling", "It doesn't matter where it's placed", "Only in digital systems, never analog"], correct:1, explain:"Aliasing must be PREVENTED before sampling by removing frequencies above fs/2 -- it fundamentally cannot be corrected afterward, since the information is already irretrievably folded together."},
{q:"Ideal signal reconstruction from samples uses interpolation with a:", options:["Rectangular pulse", "sinc function (ideal low-pass filter)", "Impulse train only", "Ramp function"], correct:1, explain:"Passing the sampled impulse train through an ideal low-pass (reconstruction) filter -- equivalently, sinc interpolation between samples -- perfectly recovers x(t) when the Nyquist condition was satisfied."}
],
core:"The Sampling Theorem is the bridge between the entire analog (CT) half of this course and the digital (DT) world every modern communication system, smartphone, and DSP chip actually operates in -- get the sampling rate wrong, and NO amount of clever digital processing afterward can undo the damage.",
notes:[
"The Nyquist–Shannon Sampling Theorem: a signal x(t) that is band-limited (X(ω)=0 for |ω|>ωm, i.e. no frequency content above fm=ωm/2π) can be EXACTLY reconstructed from uniformly spaced samples x(nTs) if the sampling rate fs=1/Ts satisfies fs>2fm. The quantity 2fm is called the Nyquist rate.",
"Mathematically, ideal sampling multiplies x(t) by an impulse train (a periodic sequence of impulses spaced Ts apart). By the Convolution Theorem's dual (multiplication in time ↔ convolution in frequency), this REPLICATES X(ω) periodically in frequency, creating identical copies of the original spectrum spaced fs apart along the frequency axis.",
"ALIASING: if fs<2fm, these replicated spectral copies overlap. Within the overlap region, a HIGH original frequency component becomes indistinguishable from (folds onto) a DIFFERENT, LOWER apparent frequency in the sampled signal -- and once sampled, this corruption is mathematically irreversible; no digital filter, however clever, can separate the tangled frequencies back apart.",
"Because aliasing cannot be fixed after sampling, practical ADC (analog-to-digital converter) systems always place an ANALOG anti-aliasing filter BEFORE the sampler, removing (or sufficiently attenuating) any frequency content above fs/2 so it never gets the chance to fold back and corrupt the sampled data.",
"Reconstruction: given samples satisfying the Nyquist condition, the original x(t) is recovered EXACTLY by passing the impulse train of samples through an ideal low-pass filter with cutoff at fs/2 (equivalently, sinc-function interpolation between the sample points) -- this is the theoretical basis for every digital-to-analog converter (DAC).",
"<strong>Worked example:</strong> Audio CDs sample at fs=44.1 kHz. Human hearing extends to roughly fm=20 kHz. Nyquist rate = 2×20=40 kHz < 44.1 kHz, so CDs sample comfortably ABOVE the Nyquist rate, with headroom left for a realistic (non-ideal, non-brick-wall) anti-aliasing filter to roll off the response before fs/2=22.05 kHz.",
"<strong>Application:</strong> Software-defined radios and telecom baseband processors MUST place an anti-aliasing filter before every ADC stage; violating the Nyquist condition in a receiver design causes out-of-band interference (e.g. an adjacent, unwanted radio channel) to alias directly into the desired signal's band, corrupting reception in a way no downstream digital filtering can ever repair."
],
formulas:["Nyquist rate = 2·fm  ;  sampling requires fs > 2fm","Sampling x(t) ↔ periodic replication of X(ω) at multiples of fs, in frequency","Reconstruction: ideal LPF with cutoff fs/2 (sinc interpolation)"],
questions:[
{type:"Conceptual", q:"Explain, using the fact that sampling replicates the spectrum periodically at spacing fs, exactly why fs>2fm (not fs≥2fm, and specifically 2fm and not, say, fm or 3fm) is the precise dividing line between overlapping and non-overlapping spectral copies."},
{type:"ECE application", q:"A telecom engineer is designing an ADC front-end for a signal known to be band-limited to 3.5 MHz, but the raw antenna signal also picks up strong interference at 20 MHz. Explain why an anti-aliasing filter is essential here even though the DESIRED signal itself satisfies Nyquist at a sampling rate of, say, 8 MHz."},
{type:"Reasoning", q:"A strobe light flashing at a fixed rate can make a rotating fan blade appear to move slowly backward, forward, or stand still, depending on the fan's speed relative to the flash rate -- this is a mechanical/visual analogy for aliasing. Explain, in signals-and-systems terms (sampling rate vs. signal frequency), which of these three visual effects corresponds to fs slightly less than, exactly equal to, or slightly more than the rotational frequency."}
]},

{d:16,week:4,title:"Laplace Transform — Definition & Region of Convergence",big:true,steps:6,
diagram:"laplace",
facts:[{tag:"KEY FACT", text:"The (bilateral) Laplace Transform X(s)=∫x(t)e^{-st}dt generalizes the Fourier Transform by allowing a COMPLEX frequency s=σ+jω, letting it handle signals (like growing exponentials) for which the ordinary Fourier Transform doesn't converge."}, {tag:"INSIGHT", text:"X(s) alone is meaningless without its Region of Convergence (ROC) -- the exact same algebraic expression for X(s) can correspond to two entirely DIFFERENT time signals, distinguished only by which ROC is specified."}],
mcqs:[
{q:"The Laplace Transform is defined as X(s) =", options:["∫x(t)e^{-jωt}dt", "∫x(t)e^{-st}dt, s=σ+jω complex", "Σx[n]z^{-n}", "x(t)*h(t)"], correct:1, explain:"Replacing the purely imaginary jω of the Fourier Transform with the general complex variable s=σ+jω is exactly what defines the Laplace Transform."},
{q:"Setting s=jω (i.e. σ=0) in the Laplace Transform recovers:", options:["The Z-transform", "The Fourier Transform (when the ROC includes the jω-axis)", "The convolution sum", "Nothing meaningful"], correct:1, explain:"The Fourier Transform is a special case/slice of the Laplace Transform along the imaginary axis, valid precisely when the ROC contains that axis."},
{q:"The Region of Convergence (ROC) of X(s) is:", options:["Always the entire s-plane", "The set of s values for which the defining integral converges", "Irrelevant to correctly interpreting X(s)", "Always a single point"], correct:1, explain:"Different time signals can share the exact same algebraic X(s) formula but differ ENTIRELY in their ROC -- so the ROC is not optional extra information, it's part of the transform's definition."},
{q:"For a RIGHT-SIDED (causal) signal x(t)u(t-t0), the ROC is typically:", options:["A vertical strip", "A right-half-plane, Re(s) > some value", "A left-half-plane", "The entire s-plane"], correct:1, explain:"Causal, right-sided signals converge for s sufficiently far to the RIGHT in the complex plane (large enough real part)."},
{q:"For a LEFT-SIDED (anti-causal) signal, the ROC is typically:", options:["A right-half-plane", "A left-half-plane, Re(s) < some value", "A single vertical line only", "It never converges"], correct:1, explain:"Left-sided signals converge for s sufficiently far to the LEFT (small enough, i.e. very negative, real part)."}
],
core:"The Laplace Transform is the tool that finally converts differential equations (Day 10) into simple algebra, and it does this specifically by extending Fourier's jω axis into the full complex s-plane -- a generalization that both fixes Fourier's convergence limitations AND, via the ROC, encodes information about a signal's growth/decay and a system's stability all at once.",
notes:[
"The (bilateral) Laplace Transform: X(s)=∫_{-∞}^{∞} x(t)e^{-st}dt, where s=σ+jω is a complex variable. The extra real part σ (compared to Fourier's purely imaginary jω) provides an exponential 'convergence factor' e^{-σt} that can force even a GROWING signal's integral to converge, for a suitable range of σ.",
"The Region of Convergence (ROC) is the set of s (equivalently, the range of σ=Re(s)) for which the defining integral converges to a finite value. Crucially, the exact same rational function X(s) can be the transform of TWO DIFFERENT time signals (one causal/right-sided, one anti-causal/left-sided) -- distinguishable ONLY by stating which ROC goes with which. X(s) without its ROC is an incomplete, ambiguous answer.",
"ROC shape rules (for rational X(s), the overwhelmingly common case): a right-sided signal has an ROC that is a right-half-plane (Re(s)>σmax, bounded on the left by the rightmost pole); a left-sided signal has an ROC that is a left-half-plane (Re(s)<σmin); a two-sided signal has an ROC that is a vertical STRIP between two poles. The ROC never contains any pole of X(s).",
"When the ROC includes the imaginary (jω) axis (i.e. Re(s)=0 lies inside the ROC), the Fourier Transform exists and can be obtained simply by evaluating X(s) at s=jω. This is precisely why causal, STABLE systems (whose poles all lie in the left half-plane, so the ROC extends rightward from there and always includes the jω-axis) always have a well-defined, ordinary frequency response.",
"<strong>Worked example:</strong> x1(t)=e^{-at}u(t) (causal, a>0) has X(s)=1/(s+a), ROC: Re(s)>-a (right-half-plane). x2(t)=-e^{-at}u(-t) (anti-causal) has the IDENTICAL formula X(s)=1/(s+a), but ROC: Re(s)<-a (left-half-plane). Same algebra, opposite time signals -- proving the ROC is not optional bookkeeping.",
"<strong>Application:</strong> Circuit and control engineers routinely work with 'unstable' intermediate systems (e.g. an op-amp circuit during transient analysis) where growing exponentials appear -- the Laplace Transform's σ-axis flexibility is precisely what lets these be analyzed algebraically at all, something the plain Fourier Transform cannot do since its integral simply fails to converge for growing signals."
],
formulas:["X(s) = ∫_{-∞}^{∞} x(t)e^{-st} dt ,  s = σ+jω","Right-sided (causal) signal: ROC is Re(s) > σmax (right-half-plane)","Fourier Transform = Laplace Transform evaluated at s=jω, IF jω-axis ⊂ ROC"],
questions:[
{type:"Conceptual", q:"Explain precisely what algebraic feature of e^{-st}=e^{-σt}e^{-jωt} (compared to Fourier's e^{-jωt} alone) allows the Laplace Transform integral to converge for a signal like e^{2t}u(t), which has NO ordinary Fourier Transform."},
{type:"ECE application", q:"Two engineers are each given the SAME algebraic expression X(s)=1/(s-2) and asked to identify the time-domain signal x(t) it represents. Explain why this task is IMPOSSIBLE to answer uniquely without also being told the ROC, and give the two different possible x(t) answers (one causal, one anti-causal) for the two possible ROC choices."},
{type:"Reasoning", q:"A system's poles (values of s where X(s) blows up) all lie in the left-half s-plane (Re(s)<0). Explain why, for a CAUSAL system, this specific pole location guarantees the ROC automatically includes the jω-axis, and connect this to why 'poles in the left-half-plane' has become shorthand for 'the system is stable' among ECE engineers (foreshadowing Day 19)."}
]},

{d:17,week:4,title:"Properties of the Laplace Transform & Inverse Laplace",big:false,steps:5,
diagram:"laplaceprops",
facts:[{tag:"KEY FACT", text:"Differentiation in time becomes multiplication by s in the s-domain: dx/dt ⟺ sX(s) (for zero initial conditions) -- this single property is what converts a differential equation into an algebraic equation."}, {tag:"INSIGHT", text:"Just like Fourier, convolution in time becomes multiplication in the s-domain: y(t)=x(t)*h(t) ⟺ Y(s)=X(s)H(s), and H(s) is called the system's TRANSFER FUNCTION."}],
mcqs:[
{q:"The Laplace Transform of dx/dt (assuming zero initial conditions) is:", options:["X(s)/s", "sX(s)", "X(s)²", "s+X(s)"], correct:1, explain:"Differentiation in time maps to multiplication by s in the s-domain -- the key property enabling algebraic solution of differential equations."},
{q:"The Laplace Transform of ∫x(t)dt (integration, zero initial conditions) is:", options:["sX(s)", "X(s)/s", "X(s)·s²", "It has no Laplace Transform"], correct:1, explain:"Integration is the inverse operation of differentiation, so it maps to DIVISION by s, exactly the algebraic inverse of the differentiation property."},
{q:"The transfer function H(s) of an LTI system is defined as:", options:["The input signal's transform", "Y(s)/X(s), the ratio of output to input transforms (equivalently, the Laplace Transform of h(t))", "Always equal to 1", "The system's impulse response in time"], correct:1, explain:"H(s)=Y(s)/X(s)=L{h(t)} -- the s-domain fingerprint of an LTI system, algebraically equivalent to convolving with h(t) in time."},
{q:"To find the inverse Laplace Transform of a rational X(s), the standard technique is:", options:["Direct integration only", "Partial fraction expansion, then look up known transform pairs term by term", "Guessing", "It cannot be done for rational functions"], correct:1, explain:"Breaking a rational X(s) into simple terms like A/(s+a) lets each piece be matched directly against a table of standard Laplace pairs."},
{q:"The Initial Value Theorem states x(0+) equals:", options:["lim_{s→0} sX(s)", "lim_{s→∞} sX(s)", "X(0)", "It cannot be found from X(s) alone"], correct:1, explain:"The Initial Value Theorem extracts the signal's value at t=0+ directly from the s-domain, without ever computing the full inverse transform."}
],
core:"This is the payoff day: with these properties, an entire differential equation (Day 10) -- derivatives, integrals, initial conditions and all -- collapses into ONE algebraic equation in s that can be solved with ordinary algebra, then converted back to a time-domain answer via partial fractions and a lookup table.",
notes:[
"Differentiation property: L{dx/dt} = sX(s) - x(0-) (the -x(0-) term vanishes for zero initial conditions). Higher derivatives introduce higher powers of s. This is the master property: it is exactly why an Nth-order differential equation transforms into an Nth-degree POLYNOMIAL equation in s, solvable by ordinary algebra instead of calculus.",
"Integration property: L{∫_{-∞}^{t}x(τ)dτ} = X(s)/s (zero initial conditions) -- the exact algebraic inverse of differentiation, consistent with integration and differentiation being inverse operations in time.",
"Convolution property: L{x(t)*h(t)} = X(s)H(s), directly paralleling Day 14's Fourier Convolution Theorem. This defines the TRANSFER FUNCTION H(s)=Y(s)/X(s)=L{h(t)}: the s-domain description of an LTI system, from which poles/zeros (Day 19) and frequency response (Day 20, via H(jω)) are both read off directly.",
"Inverse Laplace Transform via PARTIAL FRACTIONS: any proper rational X(s)=N(s)/D(s) is decomposed into a sum of simple terms (e.g. A/(s+a), or B/(s+a)² for repeated poles, or terms with complex-conjugate pole pairs), each of which matches a standard, memorized transform pair (like e^{-at}u(t)↔1/(s+a)) -- inverting term-by-term and summing gives x(t).",
"<strong>Worked example:</strong> Solve RC dy/dt + y = Vs·u(t), y(0)=0, using Laplace. Transform: RC(sY(s)) + Y(s) = Vs/s. Solve algebraically: Y(s)(RCs+1)=Vs/s → Y(s)=Vs/[s(RCs+1)]. Partial fractions: Y(s)=Vs[1/s - 1/(s+1/RC)]. Inverting term by term: y(t)=Vs(1-e^{-t/RC})u(t) -- identical to Day 7's convolution result and Day 10's differential-equation solution, obtained here with pure algebra.",
"<strong>Application:</strong> Circuit simulators (SPICE) and control-system design tools work internally with transfer functions H(s) precisely because cascading, feedback, and stability analysis (Day 19) are all far simpler as s-domain algebra (multiplying/dividing rational functions) than as time-domain convolutions or differential equations."
],
formulas:["L{dx/dt} = sX(s) - x(0-)  ;  L{∫x dt} = X(s)/s","Transfer function: H(s) = Y(s)/X(s) = L{h(t)}","Inverse: partial-fraction expand X(s), invert each term via table lookup"],
questions:[
{type:"Conceptual", q:"Explain exactly why the differentiation property L{dx/dt}=sX(s) is the specific mathematical fact that allows an Nth-order LINEAR CONSTANT-COEFFICIENT differential equation to be converted into an Nth-degree polynomial (algebraic) equation in s."},

{d:18,week:4,title:"The Z-Transform for Discrete-Time Systems",big:true,steps:6,
diagram:"ztransform",
facts:[{tag:"KEY FACT", text:"The Z-Transform X(z)=Σx[n]z^{-n} is the exact DT analogue of the Laplace Transform, converting difference equations (Day 10) into algebra the same way Laplace converts differential equations."}, {tag:"INSIGHT", text:"Setting z=e^{jω} (i.e. evaluating on the UNIT CIRCLE, |z|=1) recovers the Discrete-Time Fourier Transform (DTFT) -- exactly parallel to Laplace's s=jω giving the Fourier Transform."}],
mcqs:[
{q:"The (bilateral) Z-Transform is defined as X(z) =", options:["∫x(t)e^{-st}dt", "Σ_{n=-∞}^{∞} x[n]z^{-n}", "x[n]*h[n]", "Σx[n]"], correct:1, explain:"The Z-Transform replaces continuous integration with a summation over all discrete-time samples, weighted by powers of the complex variable z."},
{q:"Setting z=e^{jω} in X(z) (evaluating on the unit circle) recovers:", options:["The Laplace Transform", "The Discrete-Time Fourier Transform (DTFT)", "The Z-transform's inverse only", "Nothing meaningful"], correct:1, explain:"The unit circle |z|=1 in the z-plane plays exactly the role the jω-axis plays in the s-plane for the Laplace/Fourier relationship."},
{q:"For a causal (right-sided) DT signal, the ROC of X(z) is typically:", options:["|z| > some radius (outside a circle)", "|z| < some radius (inside a circle)", "A single point", "The entire z-plane always"], correct:0, explain:"Causal sequences converge for z sufficiently large in magnitude, giving an ROC that is the exterior of a circle in the z-plane."},
{q:"For an anti-causal (left-sided) DT signal, the ROC of X(z) is typically:", options:["|z| > some radius", "|z| < some radius (inside a circle)", "Only |z|=1", "It never converges"], correct:1, explain:"Left-sided sequences converge for small |z|, giving an ROC that is the interior of a circle -- the mirror image of the causal case."},
{q:"The Z-transform's convolution property states y[n]=x[n]*h[n] corresponds to:", options:["Y(z) = X(z) + H(z)", "Y(z) = X(z)·H(z)", "Y(z) = X(z)/H(z) always", "There is no such property"], correct:1, explain:"Exactly parallel to Laplace and Fourier, convolution in the discrete time domain becomes ordinary multiplication in the z-domain."}
],
core:"The Z-Transform is the DT world's answer to Laplace -- it's the tool that turns difference equations (the native language of every digital filter, DSP algorithm, and microcontroller-based signal chain) into algebra, and is absolutely central to any telecom engineer working with digital receivers, software-defined radio, or digital filter design.",
notes:[
"The Z-Transform: X(z)=Σ_{n=-∞}^{∞} x[n]z^{-n}, where z is a complex variable. This is the DT counterpart to the Laplace Transform's integral, with summation replacing integration and z^{-n} replacing e^{-st} -- the entire theory (ROC, poles/zeros, transfer functions) mirrors Laplace almost term for term.",
"The Region of Convergence follows analogous rules: causal (right-sided) sequences have an ROC that is the EXTERIOR of a circle, |z|>r (outside the outermost pole); anti-causal (left-sided) sequences have an ROC that is the INTERIOR of a circle, |z|<r; two-sided sequences have an annular (ring-shaped) ROC between two circles.",
"Setting z=e^{jω} evaluates X(z) on the UNIT CIRCLE (|z|=1) in the z-plane, giving the Discrete-Time Fourier Transform (DTFT) -- exactly analogous to Laplace's s=jω recovering the Fourier Transform. This means: whenever the ROC of X(z) includes the unit circle, the system's DTFT (frequency response) exists.",
"Properties mirror Laplace closely: linearity, time-shift (x[n-n0]↔z^{-n0}X(z), directly modeling a delay element/register in digital hardware), and the CONVOLUTION property y[n]=x[n]*h[n] ↔ Y(z)=X(z)H(z), which defines the DT transfer function H(z)=Y(z)/X(z) -- the s-domain-style 'fingerprint' of a digital filter, from which its poles/zeros (Day 19) are read directly.",
"<strong>Worked example:</strong> x[n]=a^n u[n] (causal geometric sequence, |a|<1 for eventual decay). X(z)=Σ_{n=0}^{∞}a^n z^{-n} = Σ(a/z)^n = 1/(1-az^{-1}) = z/(z-a), valid (converges) for |z|>|a| -- an ROC that is the exterior of a circle of radius |a|, exactly matching the causal-signal rule.",
"<strong>Application:</strong> Every digital IIR filter running on a DSP chip or software-defined radio is designed and analyzed directly in terms of its Z-transform H(z) -- the filter's difference-equation coefficients (Day 10) are read directly off the numerator/denominator of H(z), making Z-domain design the standard workflow for real digital filter implementation."
],
formulas:["X(z) = Σ_{n=-∞}^{∞} x[n] z^{-n}","Causal x[n]: ROC is |z| > r (exterior of a circle)","Convolution: y[n]=x[n]*h[n] ↔ Y(z)=X(z)H(z) ; DTFT = X(z) at z=e^{jω}"],
questions:[
{type:"Conceptual", q:"Explain the direct structural parallel between the Laplace Transform/s-plane and the Z-Transform/z-plane -- specifically, why 'exterior of a circle' in the z-plane plays the same role that 'right-half-plane' plays in the s-plane for causal signals."},
{type:"ECE application", q:"A digital FIR filter has the difference equation y[n]=0.5x[n]+0.5x[n-1]. Find its transfer function H(z) directly from this equation (hint: apply the time-shift property to each term), and identify what this H(z) tells a DSP engineer about the filter without needing to test it against any specific input signal."},
{type:"Reasoning", q:"For x[n]=a^n u[n] with |a|>1 (a GROWING geometric sequence), does the same X(z)=z/(z-a) formula still apply? Discuss what changes (if anything) about the ROC in this case, and connect this to Day 16's observation that a growing CT signal still has a well-defined (Laplace) transform provided the ROC is chosen appropriately."}
]},

{d:19,week:4,title:"System Analysis via Poles, Zeros & Stability",big:true,steps:6,
diagram:"stability",
facts:[{tag:"KEY FACT", text:"For a CAUSAL LTI system, BIBO stability holds if and only if ALL poles of H(s) lie strictly in the LEFT-HALF s-plane (Re(s)<0), or equivalently, all poles of H(z) lie strictly INSIDE the unit circle (|z|<1)."}, {tag:"CAUTION", text:"A pole exactly ON the boundary (the jω-axis in s, or the unit circle in z) makes the system MARGINALLY stable, not stable -- a bounded input at exactly that pole's frequency can still produce an unbounded (resonant) output."}],
mcqs:[
{q:"Poles of H(s) are the values of s where:", options:["H(s)=0", "H(s) becomes infinite (denominator=0)", "H(s)=1", "The input is zero"], correct:1, explain:"Poles are the roots of the transfer function's DENOMINATOR polynomial, where H(s) blows up to infinity."},
{q:"Zeros of H(s) are the values of s where:", options:["H(s) becomes infinite", "H(s)=0 (numerator=0)", "The system is unstable", "s=0 always"], correct:1, explain:"Zeros are the roots of the transfer function's NUMERATOR polynomial, where H(s) evaluates to exactly zero."},
{q:"A causal CT LTI system is BIBO stable if and only if all its poles lie:", options:["On the jω-axis", "In the right-half s-plane", "Strictly in the left-half s-plane (Re(s)<0)", "At the origin only"], correct:2, explain:"Left-half-plane poles correspond to decaying exponential terms in h(t); any pole with Re(s)≥0 introduces a non-decaying or growing term, violating BIBO stability."},
{q:"A causal DT LTI system is BIBO stable if and only if all its poles lie:", options:["Outside the unit circle", "Strictly inside the unit circle (|z|<1)", "Exactly on the unit circle", "At z=0 only"], correct:1, explain:"Poles inside the unit circle correspond to decaying geometric terms in h[n]; poles on or outside the unit circle break BIBO stability."},
{q:"A pole located exactly on the s-plane's jω-axis (or on the z-plane's unit circle) makes a system:", options:["Definitely stable", "Definitely unstable, always", "Marginally stable (borderline case)", "Impossible to have"], correct:2, explain:"This borderline case (e.g. a pure oscillator, poles at ±jω0) produces a bounded natural response for MOST inputs, but resonates unboundedly for an input exactly matching that frequency -- hence 'marginal', not fully stable."}
],
core:"Poles and zeros are where all the previous weeks' work pays off in one clean geometric picture: plot a handful of points in the complex plane, and you can read off a system's stability, its natural response's shape (decaying? oscillating? growing?), and even sketch its frequency response -- all without touching another integral.",
notes:[
"Given a rational transfer function H(s)=N(s)/D(s), the POLES are the roots of D(s) (where H(s)→∞) and the ZEROS are the roots of N(s) (where H(s)=0). Plotting these as points in the complex s-plane (poles as ×, zeros as ○) is called the pole-zero plot, and it visually encodes almost everything about the system's time-domain behavior.",
"Each pole corresponds to a term in the system's natural response: a real pole at s=-a (a>0) gives a decaying exponential e^{-at}; a complex-conjugate pole pair at s=-σ±jωd gives a decaying oscillation e^{-σt}cos(ωdt+φ); a pole at s=+a (a>0, right-half-plane) gives a GROWING exponential. Reading the pole locations directly tells you the qualitative SHAPE of the natural response, without solving anything further.",
"STABILITY criterion (causal systems): BIBO-stable ⟺ every pole strictly in the left-half s-plane (Re(s)<0) for CT, or strictly inside the unit circle (|z|<1) for DT. This is a direct consequence of Day 5's ∫|h(t)|dt<∞ condition: only strictly-decaying natural-response terms (left-half-plane/inside-unit-circle poles) can produce an absolutely integrable/summable h(t).",
"Poles ON the boundary (jω-axis for CT, unit circle for DT) give MARGINALLY STABLE systems: their natural response neither decays nor grows (e.g. a pure sinusoidal oscillation, or a DT system with a pole at z=1, an accumulator/integrator). These systems have bounded output for MOST bounded inputs, but resonate unboundedly if driven at exactly the pole's own frequency -- a subtlety full BIBO stability testing must catch.",
"<strong>Worked example:</strong> H(s)=(s+1)/[(s+2)(s+5)] has poles at s=-2 and s=-5 (both strictly left-half-plane) and a zero at s=-1. Since BOTH poles have Re(s)<0, this causal system is BIBO stable, and its natural response is a sum of two decaying exponentials, e^{-2t} and e^{-5t}, with no oscillation (both poles are real, not complex).",
"<strong>Application:</strong> Control and filter designers routinely PLACE poles deliberately (via feedback design) to shape a system's transient response -- pulling poles further left in the s-plane makes a system respond FASTER (faster decay) but often at the cost of requiring more control effort/gain; this pole-placement design philosophy underlies everything from op-amp filter design to autopilot control-loop tuning."
],
formulas:["Poles: roots of D(s) where H(s)=N(s)/D(s)→∞ ; Zeros: roots of N(s), H(s)=0","CT stability (causal): all poles have Re(s)<0 (strict left-half-plane)","DT stability (causal): all poles have |z|<1 (strictly inside unit circle)"],
questions:[
{type:"Conceptual", q:"Explain, using Day 5's absolute-integrability stability condition on h(t), WHY a pole with Re(s)=0 exactly (on the jω-axis) fails to be BIBO stable -- what specific TERM does this pole contribute to h(t), and why does that specific term fail the ∫|h(t)|dt<∞ test?"},
{type:"ECE application", q:"An audio equalizer is implemented as a DT (digital) filter with transfer function H(z), and a bug in the design accidentally places one pole at z=1.02 (just outside the unit circle). Explain what would happen, in practice, to the digital audio signal being processed by this filter -- describe the failure mode a listener or engineer would actually observe."},
{type:"Reasoning", q:"An LC (inductor-capacitor) circuit with NO resistance ideally has a complex-conjugate pole pair located EXACTLY on the jω-axis (at s=±jω0), corresponding to an undamped, perpetual oscillation. Explain why real, physical LC circuits ALWAYS have at least some small resistance, and connect this to why real oscillator circuits' poles are never quite exactly on the jω-axis in practice."}
]},

{d:20,week:4,title:"Frequency Response, Bode Plots & System Synthesis",big:true,steps:6,
diagram:"bode",
facts:[{tag:"KEY FACT", text:"The frequency response H(jω) = H(s)|_{s=jω} tells you EXACTLY how a stable LTI system scales the amplitude and shifts the phase of a sinusoidal input at every frequency ω -- the single most-used engineering summary of a filter's behavior."}, {tag:"INSIGHT", text:"A Bode plot displays |H(jω)| in DECIBELS (20log10|H(jω)|) versus LOG-scale frequency, turning multiplicative filter cascades (Day 8) into simple ADDITION of dB curves -- an enormous practical simplification."}],
mcqs:[
{q:"For a stable LTI system with sinusoidal input x(t)=cos(ω0t), the steady-state output is:", options:["A completely different waveform shape", "|H(jω0)|·cos(ω0t + ∠H(jω0)) -- same frequency, scaled amplitude, shifted phase", "Zero always", "A DC signal only"], correct:1, explain:"LTI systems can only scale amplitude and shift phase of a sinusoidal input -- they can NEVER create new frequencies (only nonlinear or time-varying systems, like Day 4's modulator, can do that)."},
{q:"A Bode magnitude plot displays:", options:["|H(jω)| on a linear scale vs. linear frequency", "20log10|H(jω)| (in dB) vs. log10(ω)", "The impulse response h(t)", "Only the phase response"], correct:1, explain:"Both axes use logarithmic-style scaling (dB for magnitude, log frequency for the x-axis), which is what makes Bode plots so useful for spanning wide frequency ranges."},
{q:"Why are Bode plots so practically useful for cascaded systems (Day 8)?", options:["They aren't useful for cascades", "Because dB magnitudes of cascaded H(jω)'s simply ADD, turning multiplication into addition", "Because they eliminate the need for stability analysis", "They only work for a single system, never combinations"], correct:1, explain:"Since |H1H2| in dB = 20log|H1|+20log|H2|, cascaded systems' Bode magnitude plots can simply be added graphically -- a huge practical shortcut over multiplying raw magnitude curves."},
{q:"An ideal LOW-PASS filter's frequency response |H(jω)| is:", options:["Large for high ω, small for low ω", "Large (passes) for low ω, small/zero (blocks) for high ω above a cutoff", "Constant for all ω", "Zero everywhere"], correct:1, explain:"A low-pass filter is defined precisely by this behavior -- passing low frequencies through largely unchanged while attenuating frequencies above its cutoff."},
{q:"The -3 dB cutoff frequency of a filter is the frequency at which:", options:["The output is completely zero", "The power gain has dropped to half its maximum value (magnitude ≈0.707 of max)", "The phase is exactly 0", "The system becomes unstable"], correct:1, explain:"-3 dB corresponds to a magnitude ratio of 1/√2≈0.707, and hence half the POWER (since power ∝ magnitude²) -- the standard, universally used definition of a filter's bandwidth edge."}
],
core:"This is where the whole course arrives at practice: a filter's frequency response H(jω), read straight off its pole-zero plot and displayed as a Bode plot, is THE document an ECE engineer actually hands to a colleague to specify a real analog or digital filter, RF front-end, or communication channel's behavior -- everything from Day 1's signal classification to Day 19's stability now culminates in this one design/analysis tool.",
notes:[
"For a STABLE LTI system, the steady-state response to a sinusoidal input x(t)=cos(ω0t) is y(t)=|H(jω0)|cos(ω0t+∠H(jω0)) -- the OUTPUT is a sinusoid at the EXACT SAME frequency ω0, only scaled in amplitude by |H(jω0)| and shifted in phase by ∠H(jω0). This is the formal statement of why LTI systems cannot create new frequencies (only modulators/mixers, which are time-varying, can do that -- Day 4/14).",
"H(jω) is obtained by evaluating the transfer function H(s) (Day 17) at s=jω, valid whenever the system is stable (poles in the left-half-plane, guaranteeing the jω-axis lies inside the ROC, per Day 16). |H(jω)| is the MAGNITUDE (gain) response and ∠H(jω) is the PHASE response, together fully describing the filter's effect at every frequency.",
"A Bode plot displays 20log10|H(jω)| (magnitude, in decibels) and ∠H(jω) (phase, in degrees) both against log10(ω) on the x-axis. Log-log-style scaling lets a single plot span many decades of frequency, and — crucially — because dB is a logarithm of magnitude, CASCADED systems' Bode magnitude plots simply ADD (20log|H1H2|=20log|H1|+20log|H2|), turning Day 8's cascade-multiplication rule into simple graphical addition.",
"Standard filter types are classified entirely by their |H(jω)| SHAPE: low-pass (passes low ω, blocks high), high-pass (opposite), band-pass (passes a middle band only), and band-stop/notch (blocks a middle band only). The -3 dB point(s) (where |H(jω)| drops to 1/√2 of its passband value, i.e. half power) define the filter's cutoff frequency/frequencies and hence its BANDWIDTH.",
"<strong>Worked example:</strong> The RC low-pass filter from Days 7/10/17 has H(s)=1/(RCs+1), so H(jω)=1/(1+jωRC). Magnitude: |H(jω)|=1/√(1+(ωRC)²) -- equals 1 (0 dB) at ω=0 and falls to 1/√2 (-3 dB) exactly at ω=1/RC, confirming ωc=1/RC (or fc=1/(2πRC)) is this filter's cutoff frequency, matching its known time-constant τ=RC from the step-response analysis.",
"<strong>Application:</strong> Every RF receiver's channel-selectivity spec, every audio system's frequency-response graph, and every telecom standard's spectral mask requirement is communicated using EXACTLY this Bode-style |H(jω)| language -- 'this filter must provide at least 40 dB of attenuation by 2×fc' is a sentence every practicing ECE/telecom engineer reads and writes routinely, and it is now fully decodable using everything from this 20-day course."
],
formulas:["Steady-state sinusoidal response: y(t) = |H(jω0)|cos(ω0t+∠H(jω0))","H(jω) = H(s)|_{s=jω}  (valid when system is stable)","Bode magnitude: 20log10|H(jω)| (dB) vs. log10(ω) ; -3dB point: |H(jω)|=1/√2 of max"],
questions:[
{type:"Conceptual", q:"Explain carefully why an LTI system can NEVER create a frequency component in its output that wasn't already present in its input -- connect this directly to the steady-state sinusoidal response formula and to the Convolution Theorem (Day 14)."},
{type:"ECE application", q:"A telecom filter spec requires 'at least 40 dB attenuation at twice the cutoff frequency.' Using the cascade-addition property of Bode magnitude plots, explain why a designer might choose to cascade TWO identical, simpler filter stages (each providing 20 dB at that frequency) rather than trying to design one single, more complex filter stage that meets the full 40 dB requirement alone."},
{type:"Reasoning", q:"Reflecting back across all 20 days: trace the SINGLE conceptual thread connecting Day 5's impulse response h(t), Day 14's convolution theorem H(ω), Day 17's transfer function H(s), Day 19's pole-zero stability criterion, and today's H(jω) frequency response -- explain, in one connected narrative, how these are all really just DIFFERENT VIEWS of the exact same underlying LTI system."}
]}

];

function conceptMapSVG(nodes){
  const n = nodes.length, totalW = 420, boxW = Math.min(110, (totalW-(n-1)*16)/n), gap = (totalW-n*boxW)/(n-1);
  let x = 10, boxes='', arrows='';
  nodes.forEach((label,i)=>{
    boxes += `<rect x="${x}" y="68" width="${boxW}" height="38" rx="3" fill="#121D2C" stroke="#1F5FA8" stroke-width="1.5"/><text x="${x+7}" y="91" style="font:9.5px 'IBM Plex Mono',monospace;fill:#E7EDF3">${label.length>15?label.slice(0,15):label}</text>`;
    if(i<n-1){ arrows += `<line x1="${x+boxW}" y1="87" x2="${x+boxW+gap-4}" y2="87" stroke="#1F8A57" stroke-width="2" marker-end="url(#ac)"/>`; }
    x += boxW+gap;
  });
  return svg(boxes+arrows);
}

function diagramHTML(spec){
  if(typeof spec === 'string') return DIAGRAMS[spec] || '';
  if(spec.type === 'conceptmap') return conceptMapSVG(spec.nodes);
  return '';
}

// ---------- Rendering ----------
const weekListEl = document.getElementById('week-list');
const contentEl = document.getElementById('content');
const crumbEl = document.getElementById('crumb');
const TOTAL_DAYS = 20;
let currentDay = 1;

/* ---------------- progress persistence (real account, via storage-shim.js) ---------------- */
let progress = {};
async function loadProgress(){
  if(!(window.storage && typeof window.storage.get === 'function')) return;
  try{
    const res = await window.storage.get('progress', false);
    if(res && res.value){ progress = JSON.parse(res.value); }
  }catch(e){}
}
async function saveProgress(){
  if(!(window.storage && typeof window.storage.set === 'function')) return;
  try{ await window.storage.set('progress', JSON.stringify(progress), false); }catch(e){}
}
function isDayComplete(dayNum){
  const day = DAYS.find(x=>x.d===dayNum);
  const entry = progress[dayNum];
  return !!(day && entry && entry.total === day.mcqs.length && entry.correct !== undefined);
}

function buildSidebar(){
  WEEKS.forEach(w=>{
    const det = document.createElement('details');
    det.className = 'week';
    det.open = (w.n===1);
    const sum = document.createElement('summary');
    sum.innerHTML = `<span>Week ${w.n} — ${w.title}</span><span class="wk-range">${w.range}</span>`;
    det.appendChild(sum);
    const list = document.createElement('div');
    list.className = 'day-list';
    DAYS.filter(d=>d.week===w.n).forEach(d=>{
      const btn = document.createElement('button');
      btn.className = 'day-btn';
      btn.id = 'nav-' + d.d;
      btn.innerHTML = `<span class="num">${String(d.d).padStart(2,'0')}</span><span>${d.title}</span>${d.big?'<span class="flag">BIG TOPIC</span>':''}<span class="flag" id="done-${d.d}" style="display:${isDayComplete(d.d)?'':'none'};">✓</span>`;
      btn.onclick = ()=>renderDay(d.d, true);
      list.appendChild(btn);
    });
    det.appendChild(list);
    weekListEl.appendChild(det);
  });
}

function renderDay(n, scrollNav){
  const d = DAYS.find(x=>x.d===n);
  if(!d) return;
  currentDay = n;
  document.querySelectorAll('.day-btn').forEach(b=>b.classList.remove('active'));
  const activeBtn = document.getElementById('nav-'+n);
  if(activeBtn){
    activeBtn.classList.add('active');
    const parentDetails = activeBtn.closest('details');
    if(parentDetails) parentDetails.open = true;
    if(scrollNav) activeBtn.scrollIntoView({block:'nearest'});
  }
  const week = WEEKS.find(w=>w.n===d.week);
  crumbEl.textContent = `WEEK ${d.week} · ${week.title.toUpperCase()}`;

  const notesHtml = d.notes.map(p=>`<p>${p}</p>`).join('');
  const formulaHtml = d.formulas.map(f=>`<div class="formula">${f}</div>`).join('');
  const qHtml = d.questions.map(q=>`<div class="qcard"><div class="qtype">${q.type}</div><p>${q.q}</p></div>`).join('');
  const diagramSvg = diagramHTML(d.diagram);
  const factsHtml = d.facts.map(f=>{
    const cls = f.tag==='INSIGHT' ? 'insight' : (f.tag==='CAUTION' ? 'caution' : 'key');
    return `<div class="fact ${cls}"><span class="tag">${f.tag}</span>${f.text}</div>`;
  }).join('');
  const mcqHtml = d.mcqs.map((m,qi)=>{
    const opts = m.options.map((opt,oi)=>
      `<button class="mcq-opt" data-day="${d.d}" data-q="${qi}" data-o="${oi}">${String.fromCharCode(65+oi)}. ${opt}</button>`
    ).join('');
    return `<div class="mcq-card" id="mcq-${d.d}-${qi}">
      <div class="mcq-q">${qi+1}. ${m.q}</div>
      <div class="mcq-options">${opts}</div>
      <div class="mcq-explain" id="exp-${d.d}-${qi}">${m.explain}</div>
    </div>`;
  }).join('');

  contentEl.innerHTML = `
    <div class="day-meta">
      <span class="day-tag">DAY ${String(d.d).padStart(2,'0')} / ${TOTAL_DAYS}</span>
      <span class="step-tag ${d.big?'big':''}">${d.steps}-step ${d.big?'(big topic)':''}</span>
    </div>
    <h2 class="day-title">${d.title}</h2>
    <p class="core-idea">${d.core}</p>
    <div class="diagram-wrap">${diagramSvg}<div class="diagram-cap">figure — Day ${d.d} concept sketch (animated)</div></div>
    <section class="block">
      <h3>KEY FACTS</h3>
      <div class="facts">${factsHtml}</div>
    </section>
    <section class="block notes">
      <h3>NOTES</h3>
      ${notesHtml}
    </section>
    <section class="block">
      <h3>IMPORTANT FORMULAS</h3>
      <div class="formula-list">${formulaHtml}</div>
    </section>
    <section class="block">
      <h3>CRITICAL-THINKING &amp; ECE REASONING</h3>
      <div class="qlist">${qHtml}</div>
    </section>
    <section class="block">
      <h3>QUICK CHECK — 5 MULTIPLE CHOICE</h3>
      <div class="mcq-score" id="mcq-score-${d.d}">0 / ${d.mcqs.length} answered</div>
      <div class="mcq-list">${mcqHtml}</div>
    </section>
    <div class="daynav">
      <button id="prevBtn" ${n<=1?'disabled':''}>&larr; Day ${n-1}</button>
      <button id="nextBtn" ${n>=TOTAL_DAYS?'disabled':''}>Day ${n+1} &rarr;</button>
    </div>
  `;
  const prevBtn = document.getElementById('prevBtn');
  const nextBtn = document.getElementById('nextBtn');
  if(prevBtn) prevBtn.onclick = ()=>{renderDay(n-1,true); window.scrollTo(0,0);};
  if(nextBtn) nextBtn.onclick = ()=>{renderDay(n+1,true); window.scrollTo(0,0);};
  restoreAnswerState(d);
  window.scrollTo(0,0);
}

function restoreAnswerState(d){
  const entry = progress[d.d];
  if(!entry || !entry.answers) return;
  Object.keys(entry.answers).forEach(qiStr=>{
    const qi = parseInt(qiStr);
    const oi = entry.answers[qiStr];
    const m = d.mcqs[qi];
    if(!m) return;
    const card = document.getElementById('mcq-'+d.d+'-'+qi);
    if(!card || card.classList.contains('answered')) return;
    card.classList.add('answered');
    const opts = card.querySelectorAll('.mcq-opt');
    opts.forEach((o,i)=>{
      o.classList.add('disabled');
      if(i===m.correct) o.classList.add('correct');
      else if(i===oi) o.classList.add('incorrect');
    });
    const exp = document.getElementById('exp-'+d.d+'-'+qi);
    if(exp) exp.classList.add('show');
  });
  const scoreEl = document.getElementById('mcq-score-'+d.d);
  if(scoreEl && entry.total !== undefined){
    scoreEl.textContent = `${entry.total} / ${d.mcqs.length} answered — ${entry.correct} correct so far`;
  }
}

(async function init(){
  await loadProgress();
  buildSidebar();
  renderDay(1, true);
})();

// ---------- MCQ interaction (event delegation) ----------
contentEl.addEventListener('click', function(e){
  const btn = e.target.closest('.mcq-opt');
  if(!btn) return;
  const card = btn.closest('.mcq-card');
  if(card.classList.contains('answered')) return;
  card.classList.add('answered');

  const dayNum = parseInt(btn.dataset.day);
  const qi = parseInt(btn.dataset.q);
  const oi = parseInt(btn.dataset.o);
  const day = DAYS.find(x=>x.d===dayNum);
  const m = day.mcqs[qi];

  const opts = card.querySelectorAll('.mcq-opt');
  opts.forEach((o,i)=>{
    o.classList.add('disabled');
    if(i===m.correct) o.classList.add('correct');
    else if(i===oi) o.classList.add('incorrect');
  });
  const exp = document.getElementById('exp-'+dayNum+'-'+qi);
  if(exp) exp.classList.add('show');

  const scoreEl = document.getElementById('mcq-score-'+dayNum);
  let answered = 0, correctCount = 0;
  if(scoreEl){
    answered = card.parentElement.querySelectorAll('.mcq-card.answered').length;
    correctCount = Array.from(card.parentElement.querySelectorAll('.mcq-card.answered')).reduce((acc,c)=>{
      const chosenIncorrect = c.querySelector('.mcq-opt.incorrect');
      return acc + (chosenIncorrect ? 0 : 1);
    },0);
    scoreEl.textContent = `${answered} / ${day.mcqs.length} answered — ${correctCount} correct so far`;
  }

  if(!progress[dayNum]) progress[dayNum] = { answers: {} };
  progress[dayNum].answers[qi] = oi;
  progress[dayNum].total = answered;
  progress[dayNum].correct = correctCount;
  saveProgress();
  if(answered === day.mcqs.length){
    const doneFlag = document.getElementById('done-'+dayNum);
    if(doneFlag) doneFlag.style.display = '';
  }
});
</script>
</body>
</html>
