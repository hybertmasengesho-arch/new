<!DOCTYPE html>
<html lang="en">
<head>

<title>Signals & Systems — Days 1–20 (ECE / Telecommunications)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700;800&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F7F5EF;
    --bg-panel:#FFFFFF;
    --bg-raised:#EFEBDE;
    --line:#DEDACB;
    --text:#23282E;
    --text-muted:#5B6470;
    --text-dim:#838C93;
    --copper:#1F5FA8;
    --copper-dim:#163F73;
    --cyan:#1F8A57;
    --cyan-dim:#146641;
    --big-flag:#C97A22;
    --caution:#B94A40;
    --radius:3px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:'Atkinson Hyperlegible',sans-serif;
    font-size:16.5px;
    line-height:1.7;
    -webkit-font-smoothing:antialiased;
    text-rendering:optimizeLegibility;
    font-feature-settings:"kern" 1, "liga" 1;
  }
  body::before{
    content:"";
    position:fixed; inset:0;
    background-image:
      linear-gradient(var(--line) 1px, transparent 1px),
      linear-gradient(90deg, var(--line) 1px, transparent 1px);
    background-size:64px 64px;
    opacity:0.05;
    pointer-events:none;
    z-index:0;
  }
  h1,h2,h3,h4{font-family:'Sora',sans-serif; font-weight:700; letter-spacing:-0.015em; margin:0; color:var(--text);}
  .mono{font-family:'IBM Plex Mono',monospace;}

  /* ---------- Layout ---------- */
  .app{display:flex; min-height:100vh; position:relative; z-index:1;}

  .sidebar{
    width:340px; flex:none;
    background:var(--bg-panel);
    border-right:1px solid var(--line);
    height:100vh; position:sticky; top:0;
    overflow-y:auto;
    padding:28px 0 60px;
  }
  .sidebar-head{padding:0 24px 20px; border-bottom:1px solid var(--line); margin-bottom:8px;}
  .sidebar-head .kicker{color:var(--copper); font-family:'IBM Plex Mono',monospace; font-size:12px; letter-spacing:0.08em; font-weight:500;}
  .sidebar-head h1{font-size:23px; line-height:1.25; margin-top:8px; font-weight:800; letter-spacing:-0.02em;}
  .sidebar-head p{color:var(--text-muted); font-size:13.5px; line-height:1.55; margin-top:10px; font-family:'Atkinson Hyperlegible',sans-serif;}

  details.week{border-bottom:1px solid var(--line);}
  details.week summary{
    list-style:none; cursor:pointer;
    display:flex; align-items:center; justify-content:space-between;
    padding:14px 24px;
    font-family:'Sora',sans-serif; font-weight:600; font-size:14.5px; letter-spacing:-0.01em;
    color:var(--text);
  }
  details.week summary::-webkit-details-marker{display:none;}
  details.week summary .wk-range{color:var(--text-dim); font-family:'IBM Plex Mono',monospace; font-size:11.5px; font-weight:400; letter-spacing:0.02em;}
  details.week summary::after{
    content:"+"; color:var(--copper); font-family:'IBM Plex Mono',monospace; font-size:16px; margin-left:8px;
  }
  details.week[open] summary::after{content:"–";}

  .day-list{padding:0 14px 14px;}
  .day-btn{
    width:100%; text-align:left;
    background:none; border:none; color:var(--text-muted);
    font-family:'Atkinson Hyperlegible',sans-serif; font-size:13.5px;
    padding:9px 12px; border-radius:var(--radius);
    cursor:pointer; display:flex; gap:10px; align-items:baseline;
  }
  .day-btn:hover{background:var(--bg-raised); color:var(--text);}
  .day-btn.active{background:var(--bg-raised); color:var(--text); box-shadow:inset 2px 0 0 var(--copper);}
  .day-btn .num{font-family:'IBM Plex Mono',monospace; color:var(--cyan); font-size:12px; min-width:20px;}
  .day-btn .flag{margin-left:auto; font-family:'IBM Plex Mono',monospace; font-size:10px; color:var(--big-flag); opacity:0.9;}

  /* ---------- Main ---------- */
  main{flex:1; padding:56px 64px 120px; max-width:900px;}
  .top-progress{color:var(--text-dim); font-family:'IBM Plex Mono',monospace; font-size:12px; letter-spacing:0.04em; margin-bottom:26px;}
  .day-meta{display:flex; align-items:center; gap:14px; margin-bottom:10px;}
  .day-tag{font-family:'IBM Plex Mono',monospace; font-size:12.5px; color:var(--copper);}
  .step-tag{font-family:'IBM Plex Mono',monospace; font-size:12px; color:var(--text-dim); border:1px solid var(--line); padding:3px 9px; border-radius:20px;}
  .step-tag.big{color:var(--big-flag); border-color:var(--copper-dim);}
  .day-title{font-size:36px; line-height:1.16; font-weight:800; letter-spacing:-0.02em; margin-bottom:8px;}
  .core-idea{color:var(--text-muted); font-size:17px; line-height:1.6; font-style:italic; font-family:'Atkinson Hyperlegible',sans-serif; font-weight:400; margin:14px 0 34px; padding-left:16px; border-left:2px solid var(--cyan-dim);}

  section.block{margin-bottom:36px;}
  .block h3{font-size:12.5px; font-family:'IBM Plex Mono',monospace; color:var(--cyan); font-weight:500; letter-spacing:0.06em; margin-bottom:14px;}
  .notes p{color:var(--text); font-size:16px; line-height:1.75; margin:0 0 15px; max-width:74ch;}
  .notes p:last-child{margin-bottom:0;}

  .formula-list{display:flex; flex-direction:column; gap:10px;}
  .formula{
    background:rgba(185,74,64,0.06); border:1px solid var(--caution); border-left:4px solid var(--caution);
    padding:12px 16px; border-radius:var(--radius);
    font-family:'IBM Plex Mono',monospace; font-size:14.5px; font-weight:600; color:var(--caution);
  }

  /* ---------- Diagram ---------- */
  .diagram-wrap{
    background:var(--bg-panel); border:1px solid var(--line); border-radius:var(--radius);
    padding:26px 28px 18px; margin-bottom:32px;
  }
  .diagram-wrap .diagram-cap{
    font-family:'IBM Plex Mono',monospace; font-size:11.5px; color:var(--text-dim);
    margin-top:10px; text-align:center;
  }
  .diagram-svg{width:100%; height:auto; display:block; max-height:460px;}

  @keyframes dashflow{ to{ stroke-dashoffset:-24; } }
  @keyframes pulseGlow{ 0%,100%{ transform:scale(1); opacity:1; } 50%{ transform:scale(1.3); opacity:0.55; } }
  .diagram-svg [marker-end="url(#ac)"],
  .diagram-svg [marker-end="url(#ao)"],
  .diagram-svg [marker-end="url(#am)"]{
    stroke-dasharray:7 6;
    animation:dashflow 1.3s linear infinite;
  }
  .diagram-svg circle[fill="#1F5FA8"],
  .diagram-svg circle[fill="#1F8A57"]{
    transform-box:fill-box; transform-origin:center;
    animation:pulseGlow 2.6s ease-in-out infinite;
  }
  @media (prefers-reduced-motion: reduce){
    .diagram-svg *{ animation:none !important; }
  }

  /* ---------- Key facts (color-coded highlights) ---------- */
  .facts{display:flex; flex-direction:column; gap:10px;}
  .fact{
    padding:11px 16px; border-radius:var(--radius);
    font-size:14.5px; color:var(--text);
    background:var(--bg-panel); border:1px solid var(--line);
    border-left:3px solid var(--line);
  }
  .fact .tag{
    font-family:'IBM Plex Mono',monospace; font-size:10.5px; font-weight:600;
    margin-right:9px; letter-spacing:0.03em;
  }
  .fact.insight{border-left-color:var(--cyan);}
  .fact.insight .tag{color:var(--cyan);}
  .fact.key{border-left-color:var(--copper);}
  .fact.key .tag{color:var(--copper);}
  .fact.caution{border-left-color:var(--caution);}
  .fact.caution .tag{color:var(--caution);}

  /* ---------- MCQ quiz ---------- */
  .mcq-score{font-family:'IBM Plex Mono',monospace; font-size:12.5px; color:var(--text-dim); margin-bottom:16px;}
  .mcq-list{display:flex; flex-direction:column; gap:18px;}
  .mcq-card{background:var(--bg-panel); border:1px solid var(--line); border-radius:var(--radius); padding:16px 18px 18px;}
  .mcq-q{font-size:15.5px; color:var(--text); margin-bottom:12px; line-height:1.55; font-weight:500;}
  .mcq-options{display:flex; flex-direction:column; gap:8px;}
  .mcq-opt{
    text-align:left; background:var(--bg-raised); border:1px solid var(--line); color:var(--text-muted);
    padding:9px 13px; border-radius:var(--radius); cursor:pointer;
    font-family:'Atkinson Hyperlegible',sans-serif; font-size:14px; transition:border-color .15s;
  }
  .mcq-opt:hover:not(.disabled){border-color:var(--copper); color:var(--text);}
  .mcq-opt.correct{border-color:var(--cyan); color:var(--cyan); background:rgba(95,184,201,0.09);}
  .mcq-opt.incorrect{border-color:var(--caution); color:var(--caution); background:rgba(217,83,79,0.09);}
  .mcq-opt.disabled{cursor:default;}
  .mcq-explain{
    margin-top:11px; padding-top:11px; border-top:1px dashed var(--line);
    font-size:13.5px; color:var(--text-dim); display:none;
  }
  .mcq-explain.show{display:block;}

  .qlist{display:flex; flex-direction:column; gap:14px;}
  .qcard{
    background:var(--bg-panel); border:1px solid var(--line); border-radius:var(--radius);
    padding:18px 20px;
  }
  .qcard .qtype{font-family:'IBM Plex Mono',monospace; font-size:11px; letter-spacing:0.05em; color:var(--big-flag); margin-bottom:8px;}
  .qcard p{margin:0; font-size:15.5px; line-height:1.6; color:var(--text);}

  .daynav{display:flex; justify-content:space-between; margin-top:52px; padding-top:24px; border-top:1px solid var(--line);}
  .daynav button{
    background:none; border:1px solid var(--line); color:var(--text-muted);
    font-family:'Atkinson Hyperlegible',sans-serif; font-size:13.5px; padding:10px 16px; border-radius:var(--radius);
    cursor:pointer;
  }
  .daynav button:hover:not(:disabled){border-color:var(--copper); color:var(--text);}
  .daynav button:disabled{opacity:0.3; cursor:default;}

  ::-webkit-scrollbar{width:10px;}
  ::-webkit-scrollbar-track{background:var(--bg-panel);}
  ::-webkit-scrollbar-thumb{background:var(--line); border-radius:6px;}

  @media (max-width:860px){
    .app{flex-direction:column;}
    .sidebar{width:100%; height:auto; position:relative; max-height:60vh;}
    main{padding:36px 22px 90px;}
    .day-title{font-size:26px;}
  }
</style>

<script>
const WEEKS = [
  {n:1, title:"Signal & System Fundamentals", range:"Days 1–5"},
  {n:2, title:"Time-Domain Analysis of LTI Systems", range:"Days 6–10"},
  {n:3, title:"Fourier Analysis & Sampling", range:"Days 11–15"},
  {n:4, title:"Laplace, Z-Transform & Frequency Response", range:"Days 16–20"},
];

const DAYS = [

{d:1,week:1,title:"Signals & Their Classification",big:true,steps:6,
diagram:"sigclass",
facts:[{tag:"KEY FACT", text:"A continuous-time (CT) signal x(t) is defined for every real t; a discrete-time (DT) signal x[n] is defined only at integer n -- sampling turns one into the other."}, {tag:"CAUTION", text:"A DT sequence is NOT 'a CT signal with gaps' -- x[n] is undefined between integers, it isn't zero there."}],
mcqs:[
{q:"A signal defined at every instant of time is called:", options:["Discrete-time", "Continuous-time", "Digital", "Periodic"], correct:1, explain:"CT signals are defined for all real-valued t, e.g. a voltage waveform v(t)."},
{q:"A signal is periodic with period T if:", options:["x(t)=x(t) for some t", "x(t+T)=x(t) for ALL t", "It repeats only once", "Its energy is finite"], correct:1, explain:"Periodicity must hold for every t, not just one instance, and T is the smallest such positive value (fundamental period)."},
{q:"An energy signal is one for which:", options:["Total energy is finite and power is zero", "Power is finite and nonzero", "Both energy and power are infinite", "It must be periodic"], correct:0, explain:"Energy signals (e.g. a single pulse) have finite total energy; averaged over infinite time, their power is zero."},
{q:"Every periodic signal (other than x(t)=0) is classified as a:", options:["Energy signal", "Power signal", "Neither", "Random signal"], correct:1, explain:"Periodic signals repeat forever, so their total energy is infinite but their average power over one period is finite and nonzero."},
{q:"An even signal satisfies:", options:["x(-t) = -x(t)", "x(-t) = x(t)", "x(t) = 0 for t<0", "x(t) is always positive"], correct:1, explain:"Even signals are symmetric about the vertical axis; odd signals satisfy x(-t) = -x(t)."}
],
core:"Every signal you will ever process -- a voice waveform, a sampled sensor reading, a modulated RF carrier -- first has to be sorted along these axes, because the axis you're on decides which entire branch of the course (CT Fourier/Laplace vs. DT Fourier/Z) actually applies to it.",
notes:[
"A signal is any function that carries information by varying over an independent variable, usually time: x(t) for continuous-time (CT), x[n] for discrete-time (DT), where n is an integer index. CT signals arise from physical phenomena (voltage, sound pressure); DT signals arise from sampling a CT signal, or from inherently discrete data (daily stock prices).",
"Periodic vs aperiodic: x(t) is periodic if x(t+T)=x(t) for all t and some T>0; the smallest such T is the fundamental period, and f0=1/T (or ω0=2π/T) is the fundamental frequency. A signal that never exactly repeats is aperiodic (e.g. a single decaying pulse).",
"Energy vs power classification: energy E=∫|x(t)|²dt (or Σ|x[n]|² in DT). If 0<E<∞, x is an energy signal (power=0). If E=∞ but average power P=lim(1/2T)∫|x(t)|²dt is finite and nonzero, x is a power signal. Periodic and random signals are almost always power signals; finite-duration pulses are energy signals.",
"Even/odd decomposition: any signal can be split as x(t)=xe(t)+xo(t), where xe(t)=[x(t)+x(-t)]/2 (even part) and xo(t)=[x(t)-x(-t)]/2 (odd part). This decomposition underlies why real, even signals have purely real Fourier/Laplace transforms -- a fact used constantly in circuit and filter analysis.",
"<strong>Worked example:</strong> Classify x(t)=cos(2t): it is periodic with T=2π/2=π; since it's periodic and bounded, it is a power signal with average power 1/2 (using P=A²/2 for a cosine of amplitude A).",
"<strong>Self-check:</strong> before computing anything, always ask 'CT or DT?' and 'periodic or not?' first -- these two answers alone tell you whether you'll eventually need the Fourier Series (periodic) or Fourier/Laplace Transform (aperiodic), and whether formulas use integrals or sums.",
"<strong>Application:</strong> A transmitted RF carrier is treated as a power signal (it runs indefinitely), while a single detected radar pulse is treated as an energy signal -- this distinction changes which normalization (energy spectral density vs power spectral density) a communications engineer uses."
],
formulas:["T is fundamental period: x(t+T)=x(t) ∀t","E=∫|x(t)|²dt  (energy);  P=lim(1/2T)∫_{-T}^{T}|x(t)|²dt  (power)","xe(t)=[x(t)+x(-t)]/2 ,  xo(t)=[x(t)-x(-t)]/2"],
questions:[
{type:"Conceptual", q:"Explain why a signal cannot simultaneously have finite nonzero energy AND finite nonzero average power. What does it mean physically for a signal to have zero average power?"},
{type:"ECE application", q:"A microphone captures a 30-second voice clip. Is this an energy signal or a power signal? Now consider an FM radio station broadcasting continuously, 24/7 -- classify that signal and explain why your answer differs from the voice clip."},
{type:"Reasoning", q:"Is the sum of two periodic signals always periodic? Investigate x(t)=cos(t)+cos(πt) and explain, in terms of the ratio of the two periods, when a sum of periodics fails to be periodic."}
]},

{d:2,week:1,title:"Basic Operations on Signals",big:false,steps:4,
diagram:"sigops",
facts:[{tag:"KEY FACT", text:"Time shifting x(t-t0) delays the signal if t0>0 (shifts right) and advances it if t0<0 (shifts left)."}, {tag:"INSIGHT", text:"Time scaling x(at) compresses the signal along the time axis if |a|>1 and expands it if |a|<1 -- the opposite of what many students first guess."}],
mcqs:[
{q:"x(t-3) shifts the graph of x(t):", options:["Left by 3", "Right by 3", "Up by 3", "Compresses by 3"], correct:1, explain:"Subtracting a positive constant from t delays (right-shifts) the waveform."},
{q:"x(2t) compared to x(t) is:", options:["Expanded by factor 2", "Compressed by factor 2", "Shifted by 2", "Reflected"], correct:1, explain:"Multiplying t by 2 makes events happen twice as fast in t, compressing the waveform along the time axis."},
{q:"x(-t) represents:", options:["Time shifting", "Time scaling", "Time reversal (reflection about t=0)", "Amplitude scaling"], correct:2, explain:"Negating the time argument flips the signal about the vertical axis."},
{q:"To sketch x(2t-4), the standard safe order is to:", options:["Shift first, then scale", "Scale first, then shift", "It never matters", "Reflect first always"], correct:1, explain:"Writing x(2t-4)=x(2(t-2)) shows: scale (compress by 2) FIRST, then shift right by 2 -- doing shift-then-scale on the raw argument gives the wrong answer."},
{q:"Amplitude scaling y(t)=A·x(t) changes:", options:["The time axis", "The vertical/amplitude axis only", "The period only", "Nothing"], correct:1, explain:"Amplitude scaling multiplies the signal's values, stretching or compressing it vertically, with no effect on timing."}
],
core:"Every LTI system you'll analyze this term is built from signals that have been shifted, scaled, and reflected -- convolution itself (Day 6-7) is nothing more than systematically flipping one signal, sliding it, and multiplying, so getting these operations exactly right now prevents almost every convolution mistake later.",
notes:[
"Time shifting: y(t)=x(t-t0). If t0>0, the signal is delayed (moves right, later in time); if t0<0, it's advanced (moves left, earlier). In DT, y[n]=x[n-n0] shifts the sequence by n0 samples -- crucial for describing delay lines and digital filter taps.",
"Time scaling: y(t)=x(at). If |a|>1, the signal is compressed (events happen faster/sooner); if 0<|a|<1, it's expanded (stretched out in time). This is the opposite of amplitude scaling and is the single most commonly reversed operation by beginners.",
"Time reversal (reflection): y(t)=x(-t) flips the signal about the vertical axis t=0 -- what happened at t=+5 now happens at t=-5. This is the special case a=-1 of time scaling, and it is exactly the operation convolution performs on one of its two signals.",
"Combined operations, e.g. y(t)=x(at-b), must be handled in the correct order: rewrite as x(a(t-b/a)) and apply SCALE first, then SHIFT (by b/a). Reversing this order (shift first, then scale) gives a different, incorrect result -- always factor out the coefficient of t before identifying the shift amount.",
"<strong>Worked example:</strong> Sketch x(2t-4) given a known x(t). Rewrite: x(2t-4)=x(2(t-2)). Step 1 (scale): compress x(t) by factor 2 to get x(2t). Step 2 (shift): shift that compressed signal right by 2 to get x(2(t-2)). This two-step order always works.",
"<strong>Self-check:</strong> a fast sanity test for shifting direction -- plug in the value of t that makes the argument zero. For x(t-3), argument=0 at t=3, so the feature that was at t=0 in x(t) now appears at t=3: confirms a RIGHT shift.",
"<strong>Application:</strong> In digital communication receivers, time shifting models propagation delay and time scaling models clock-rate mismatches (Doppler effect) between transmitter and receiver -- both must be estimated and corrected before demodulation."
],
formulas:["Shift: y(t)=x(t-t0)  (t0>0 → delay/right-shift)","Scale: y(t)=x(at)  (|a|>1 → compression, |a|<1 → expansion)","Reversal: y(t)=x(-t)  (special case a=-1)"],
questions:[
{type:"Conceptual", q:"Explain, step by step and in the correct order, how you would sketch y(t)=x(-3t+6) given a plot of x(t). Why does order matter here?"},
{type:"ECE application", q:"A digital delay line in an audio effects unit implements y[n]=x[n-D] for some integer D. Explain, using the shifting operation, what happens to a musical note if D is doubled, and why this operation alone cannot change the note's pitch (frequency content)."},
{type:"Reasoning", q:"For a DISCRETE-TIME signal, x[2n] ('downsampling') is defined only at even n and is a genuinely different, lossy operation compared to CT time scaling x(2t). Explain why compressing a DT signal by keeping every other sample can lose information that CT time scaling never loses."}
]},

{d:3,week:1,title:"Elementary / Standard Signals",big:false,steps:5,
diagram:"elemsignals",
facts:[{tag:"KEY FACT", text:"The unit impulse δ(t) is zero everywhere except t=0, has infinite height there, and unit area -- it is the building block every LTI system's response is characterized against (Day 5)."}, {tag:"INSIGHT", text:"The unit step u(t) is the running integral of δ(t), and δ(t) is the derivative of u(t) -- step and impulse are a matched pair under integration/differentiation."}],
mcqs:[
{q:"The unit step function u(t) equals:", options:["1 for t<0, 0 for t≥0", "0 for t<0, 1 for t≥0", "1 everywhere", "0 everywhere except t=0"], correct:1, explain:"u(t) 'switches on' at t=0: it is 0 before and 1 from t=0 onward."},
{q:"The defining sifting property of the impulse is:", options:["∫x(t)δ(t-t0)dt = x(t0)", "∫x(t)δ(t-t0)dt = 0", "δ(t)=u(t)", "δ(t) has amplitude 1"], correct:0, explain:"Multiplying any signal by a shifted impulse and integrating 'sifts out' exactly the value of the signal at that shift."},
{q:"The unit ramp r(t) = t·u(t) is related to the step by:", options:["r(t) is the derivative of u(t)", "r(t) is the integral of u(t)", "They are identical", "r(t) is the reversal of u(t)"], correct:1, explain:"Integrating u(t) from -∞ to t gives t for t≥0 and 0 for t<0 -- exactly the ramp."},
{q:"A real exponential signal x(t)=e^{at} with a>0 is:", options:["Decaying", "Growing without bound", "Periodic", "Always an energy signal"], correct:1, explain:"A positive exponent makes the signal grow unboundedly as t→∞ -- e.g. an unstable feedback loop."},
{q:"A complex exponential e^{jω0t} can be expanded using Euler's formula as:", options:["cos(ω0t) - j sin(ω0t) only", "cos(ω0t) + j sin(ω0t)", "j·cos(ω0t)", "sin(ω0t)/cos(ω0t)"], correct:1, explain:"Euler's identity: e^{jθ}=cos θ + j sin θ, the foundation for representing sinusoids as rotating phasors."}
],
core:"These handful of elementary signals -- impulse, step, ramp, real and complex exponential, sinusoid -- are the alphabet of the entire course: every input, every impulse response, and every basis function in Fourier/Laplace analysis is built from exactly these pieces.",
notes:[
"The unit step u(t)=1 for t≥0 and 0 for t<0 models an idealized 'switch-on' event (e.g. applying a DC voltage at t=0). In discrete time, u[n]=1 for n≥0, 0 otherwise, with no ambiguity at the origin.",
"The unit impulse δ(t) (Dirac delta) is defined by two properties: δ(t)=0 for t≠0, and ∫_{-∞}^{∞}δ(t)dt=1 (unit area concentrated at a single instant). Its most important property is SIFTING: ∫x(t)δ(t-t0)dt=x(t0) -- multiplying by a shifted impulse and integrating extracts one exact sample value.",
"δ(t) and u(t) are related by calculus: u(t)=∫_{-∞}^{t}δ(τ)dτ (step is the running integral of impulse), and equivalently δ(t)=du/dt (impulse is the derivative of the step, in the generalized/distributional sense). The unit ramp r(t)=t·u(t) continues this ladder: r(t)=∫_{-∞}^{t}u(τ)dτ.",
"The real exponential x(t)=Ce^{at} decays toward 0 as t→∞ if a<0 (models capacitor discharge, RC circuit transients) and grows unbounded if a>0 (models instability). The complex exponential e^{jω0t}=cos(ω0t)+j sin(ω0t) (Euler's formula) traces a unit circle in the complex plane and is THE basis function of Fourier analysis.",
"<strong>Worked example:</strong> Evaluate ∫_{-∞}^{∞} (t²+3) δ(t-2) dt using sifting: substitute t=2 directly into (t²+3), giving 4+3=7. No integration is actually performed -- sifting always reduces to plug-in-and-evaluate.",
"<strong>Self-check:</strong> in DT, the impulse δ[n] is simply 1 at n=0 and 0 elsewhere -- an ordinary, well-defined sequence (unlike its CT counterpart, which is a generalized function/limit concept). Don't import CT intuition about 'infinite height' into the DT impulse.",
"<strong>Application:</strong> An impulse δ(t) is the idealized test input engineers use to characterize any black-box LTI system in one shot (Day 5); the unit step models a switch closing in a circuit, and its system response (the 'step response') is a standard specification (rise time, overshoot) in control and communication system datasheets."
],
formulas:["u(t): 0 for t<0, 1 for t≥0","∫x(t)δ(t-t0)dt = x(t0)  (sifting property)","u(t)=∫δ(τ)dτ ,  δ(t)=du/dt ,  e^{jω0t}=cos(ω0t)+j sin(ω0t)"],
questions:[
{type:"Conceptual", q:"Explain why δ(t) cannot be an ordinary function in the everyday sense (no ordinary function is zero everywhere except one point yet integrates to 1), and what 'generalized function' or 'distribution' means in this context."},
{type:"ECE application", q:"A power supply is switched on at t=0, producing v(t)=5u(t) volts. Using the ramp and step relationship, sketch (in words) what ∫v(t)dt looks like, and identify a real circuit quantity this integral could represent (hint: charge, or capacitor voltage under constant current)."},
{type:"Reasoning", q:"Using Euler's formula, express cos(ω0t) purely in terms of complex exponentials e^{jω0t} and e^{-jω0t}. Why is this decomposition exactly what allows a real-valued sinusoid to be analyzed using the (complex) exponential Fourier series in Week 3?"}
]},

{d:4,week:1,title:"Classification of Systems",big:true,steps:6,
diagram:"sysclass",
facts:[{tag:"KEY FACT", text:"A system is LINEAR if it obeys superposition: response to a·x1+b·x2 must equal a·y1+b·y2, for ALL a, b, x1, x2 -- both additivity and homogeneity must hold."}, {tag:"CAUTION", text:"y(t)=x(t)+1 LOOKS simple but is NOT linear -- test with x=0: output is 1, not 0, violating homogeneity. Always test the zero-input case first as a quick linearity filter."}],
mcqs:[
{q:"A system is time-invariant if:", options:["Its output never changes", "A shifted input produces an identically shifted output", "It only works for periodic inputs", "It has no memory"], correct:1, explain:"Time-invariance means x(t-t0)→y(t-t0): delaying the input by t0 just delays the output by t0, with no other change."},
{q:"A system is causal if:", options:["The output at time t depends only on present and past inputs", "The output depends on future inputs", "It is always stable", "It is memoryless"], correct:0, explain:"Causality (realizability) forbids the output from depending on inputs that haven't happened yet."},
{q:"A memoryless (static) system's output at time t depends on:", options:["Only x(t) at that same instant t", "All past values of x", "Future values of x", "The system's initial conditions only"], correct:0, explain:"y(t)=2x(t) is memoryless; y(t)=x(t-1) is NOT (it depends on a past value, so it has memory)."},
{q:"BIBO stability means:", options:["Bounded input always produces bounded output", "The system has zero output for zero input", "The system is linear", "The output grows without bound"], correct:0, explain:"Bounded-Input-Bounded-Output stability guarantees that if |x(t)|<∞ for all t, then |y(t)|<∞ for all t too."},
{q:"y(t) = x(2t) (time scaling) as a system is:", options:["Time-invariant", "Time-varying", "Unstable", "Non-causal only if scaled by a negative number"], correct:1, explain:"Shifting the input x(t-t0) and comparing to shifting the output shows a mismatch -- the compression system is time-VARYING, a classic trap."}
],
core:"Linearity and time-invariance are the two properties that together define 'LTI' -- and LTI is the single most powerful assumption in this entire course, because it's the ONLY class of system fully characterized by one function (the impulse response) and solvable with convolution, Fourier, and Laplace tools all at once.",
notes:[
"LINEARITY requires superposition to hold exactly: for inputs x1→y1 and x2→y2, the system is linear iff (a·x1+b·x2) → (a·y1+b·y2) for every choice of constants a, b. This bundles two sub-properties: additivity (x1+x2→y1+y2) and homogeneity/scaling (a·x1→a·y1). A fast disqualifying test: if x(t)=0 doesn't produce y(t)=0, the system is automatically nonlinear.",
"TIME-INVARIANCE requires that delaying the input by any t0 produces the exact same output shape, just delayed by that same t0: x(t-t0)→y(t-t0). Systems whose defining equation explicitly contains 't' outside of x (like y(t)=t·x(t), or a time-scaling y(t)=x(2t)) are almost always time-VARYING.",
"CAUSALITY: y(t) depends only on x(τ) for τ≤t (present and past, never future). All real-time physical systems (a filter, an amplifier) MUST be causal; non-causal systems (e.g. y[n]=x[n+1]) can only be implemented with a processing delay, or exist purely for offline signal processing.",
"STABILITY (BIBO): every bounded input (|x(t)|≤Mx<∞) must produce a bounded output (|y(t)|≤My<∞). For LTI systems specifically, this reduces to a clean, checkable condition on the impulse response: BIBO-stable ⟺ ∫|h(t)|dt<∞ (absolutely integrable impulse response) -- this single test will resurface constantly once Day 5's h(t) is introduced.",
"MEMORY: a system is memoryless (static) if y(t) depends only on x(t) at the SAME instant t (e.g. a resistor, y(t)=Rx(t)); otherwise it has memory (dynamic), depending on past and/or future values (e.g. any system with a delay, derivative, or integral, like a capacitor or inductor).",
"<strong>Worked example:</strong> Test y(t)=x(t)·cos(t) for linearity and time-invariance. Linearity: a·x1(t)cos(t)+b·x2(t)cos(t) = a·y1(t)+b·y2(t) — holds, so it IS linear. Time-invariance: shift input, x(t-t0)cos(t) ≠ x(t-t0)cos(t-t0) (the output for a delayed input isn't simply the old output delayed) — so it is time-VARYING. This is a linear but time-varying system, a common exam trap.",
"<strong>Application:</strong> An amplitude modulator in a communication transmitter, y(t)=x(t)·cos(ωct), is exactly this linear-but-time-varying system -- which is precisely WHY modulation can shift a signal's frequency content (something no LTI system can ever do, since LTI systems only scale existing frequencies, never create new ones -- see Day 14)."
],
formulas:["Linear: a·x1+b·x2 → a·y1+b·y2  (∀ a,b)","Time-invariant: x(t-t0) → y(t-t0)","BIBO-stable (LTI): ∫_{-∞}^{∞}|h(t)|dt < ∞"],
questions:[
{type:"Conceptual", q:"Prove that y(t)=x(t)+5 is NOT linear by explicitly showing which sub-property (additivity or homogeneity) fails, using specific numeric inputs."},
{type:"ECE application", q:"An RF power amplifier is designed to be memoryless and time-invariant, but its real characteristic is y(t)=x(t)+0.01·x(t)³ (a nonlinear 'compression' term). Explain, without doing Fourier math yet, why engineers still care about linearity even though a small nonlinearity like this is common in real amplifiers."},
{type:"Reasoning", q:"Is the DT ideal predictor system y[n]=x[n+1] linear? Is it time-invariant? Is it causal? Justify each answer, and explain in what kind of processing scenario (real-time vs. stored/offline data) a non-causal system like this could still be legitimately used."}
]},

{d:5,week:1,title:"LTI Systems & the Impulse Response",big:false,steps:5,
diagram:"ltiimpulse",
facts:[{tag:"KEY FACT", text:"An LTI system is completely and uniquely characterized by its impulse response h(t) -- the output when the input is exactly δ(t)."}, {tag:"INSIGHT", text:"Once h(t) is known, the output for ANY input x(t) whatsoever is found by convolution: y(t)=x(t)*h(t) -- this single fact is why Days 6-7 exist."}],
mcqs:[
{q:"The impulse response h(t) of an LTI system is defined as:", options:["The output when input is u(t)", "The output when input is δ(t)", "The system's transfer function", "The input signal itself"], correct:1, explain:"h(t) is, by definition, the system's response to a unit impulse applied at t=0."},
{q:"For an LTI system, knowing h(t) lets you find the output for:", options:["Only impulse inputs", "Only sinusoidal inputs", "ANY arbitrary input x(t)", "Only periodic inputs"], correct:2, explain:"Because any x(t) can be represented as a (continuous) sum of scaled, shifted impulses, and the system is linear and time-invariant, h(t) alone determines the response to every possible input."},
{q:"Why does time-invariance matter for characterizing a system by h(t) alone?", options:["It doesn't matter", "It guarantees the response to a shifted impulse δ(t-τ) is just h(t-τ)", "It only matters for DT systems", "It guarantees stability"], correct:1, explain:"Without time-invariance, the response to each shifted impulse δ(t-τ) could be a DIFFERENT function of t, and one h(t) would not suffice."},
{q:"A system's causality can be read directly off h(t) by checking:", options:["h(t)=0 for t<0", "h(t)=0 for t>0", "h(0)=1", "h(t) is bounded"], correct:0, explain:"A causal LTI system cannot respond before the impulse arrives at t=0, so its impulse response must vanish for all negative time."},
{q:"A system's BIBO stability can be read directly off h(t) by checking:", options:["h(t) is periodic", "∫|h(t)|dt is finite", "h(t)=δ(t)", "h(t) is causal"], correct:1, explain:"Absolute integrability of the impulse response is the exact necessary-and-sufficient BIBO stability test for LTI systems."}
],
core:"This is the single most important idea in the entire course: linearity plus time-invariance together mean ONE experiment -- hit the system with an impulse and record what comes out -- fully determines how the system will respond to literally any signal you ever feed it, forever.",
notes:[
"The impulse response h(t) is the system's output when x(t)=δ(t). This is not just a convenient test signal -- because δ(t) is the 'atom' every other signal can be built from (via the sifting property), h(t) is genuinely enough information to predict the output for ANY input.",
"The reasoning chain: any x(t) can be written as x(t)=∫x(τ)δ(t-τ)dτ (this is just the sifting property in reverse). By LINEARITY, the system's response to this integral (sum) of scaled impulses is the same integral (sum) of the corresponding scaled RESPONSES. By TIME-INVARIANCE, the response to δ(t-τ) is exactly h(t-τ). Combining both gives y(t)=∫x(τ)h(t-τ)dτ -- the convolution integral, derived directly rather than pulled from nowhere.",
"Causal LTI systems have h(t)=0 for all t<0 -- the system physically cannot 'respond' to an impulse before that impulse has occurred. This gives an instant causality check on any impulse response you're handed.",
"BIBO-stable LTI systems have ∫_{-∞}^{∞}|h(t)|dt<∞ (absolutely integrable h(t)); an unbounded or non-decaying h(t), like h(t)=u(t) (a pure integrator) or h(t)=e^{t}u(t) (growing exponential), is BIBO-unstable.",
"<strong>Worked example:</strong> An LTI system has h(t)=e^{-2t}u(t). Causal? Yes -- h(t)=0 for t<0. Stable? ∫_0^∞ e^{-2t}dt = 1/2, finite, so YES, BIBO-stable. This single function h(t) also tells you (via Day 16's Laplace transform) the system's pole location and frequency response.",
"<strong>Self-check:</strong> resist the urge to think of h(t) as 'just another signal' -- it plays a structurally different role: it's the DNA of the system itself, not a signal passing through it. Convolving x(t) with h(t) is how that DNA gets 'expressed' for a specific input.",
"<strong>Application:</strong> Loudspeaker and room acoustics engineers measure a room's impulse response with a test pop/sweep, then convolve ANY audio with that h(t) to simulate exactly how that room would color the sound -- this is literally how 'convolution reverb' plugins work."
],
formulas:["h(t) = system response to δ(t)","y(t) = x(t) * h(t) = ∫x(τ)h(t-τ)dτ  (derived from linearity + time-invariance)","Causal ⟺ h(t)=0 for t<0;   BIBO-stable ⟺ ∫|h(t)|dt<∞"],
questions:[
{type:"Conceptual", q:"Walk through, in your own words, exactly where LINEARITY is used and exactly where TIME-INVARIANCE is used in the derivation of y(t)=∫x(τ)h(t-τ)dτ from x(t)=∫x(τ)δ(t-τ)dτ. Why would this derivation fail for a system that is linear but NOT time-invariant?"},
{type:"ECE application", q:"An equalizer in an audio system is designed as an LTI filter with impulse response h(t). Explain why a designer can fully specify and test this equalizer's behavior in the lab using only a single impulse (or its DT equivalent, a unit sample) rather than testing it against every possible music track."},
{type:"Reasoning", q:"h(t)=δ(t) (the 'do-nothing' impulse response) -- what is y(t) for an arbitrary x(t) in this case? Use the convolution formula to justify your answer, and explain what physical system (if any) this represents."}
]},

{d:6,week:2,title:"Discrete-Time Convolution (Convolution Sum)",big:true,steps:6,
diagram:"dtconv",
facts:[{tag:"KEY FACT", text:"The convolution sum y[n] = Σ x[k]h[n-k] computes an LTI system's output by flipping h[k], sliding it across x[k], multiplying overlapping samples, and summing."}, {tag:"INSIGHT", text:"Convolution is commutative: x[n]*h[n] = h[n]*x[n] -- you may always flip and slide whichever of the two sequences is more convenient."}],
mcqs:[
{q:"The DT convolution sum is defined as y[n] =", options:["Σ x[k]+h[n-k]", "Σ x[k]h[n-k]", "Σ x[n]h[n]", "x[n]/h[n]"], correct:1, explain:"Convolution sums the products of x[k] with the TIME-REVERSED-AND-SHIFTED h[n-k], over all k."},
{q:"In the 'flip and slide' procedure, which signal is conventionally flipped?", options:["x[k]", "h[k], to form h[n-k]", "Neither -- both stay fixed", "Both are flipped simultaneously"], correct:1, explain:"By convention h[k] is time-reversed to h[-k] then shifted by n to form h[n-k], while x[k] remains fixed as k varies."},
{q:"If x[n] has length Lx and h[n] has length Lh (both finite, starting at n=0), the convolution y[n] has length:", options:["Lx + Lh", "Lx + Lh - 1", "max(Lx,Lh)", "Lx × Lh"], correct:1, explain:"Convolving two finite sequences of length Lx and Lh always produces a result of length Lx+Lh-1."},
{q:"Convolving any x[n] with the unit impulse δ[n] gives:", options:["0", "δ[n]", "x[n] unchanged", "x[n]+1"], correct:2, explain:"δ[n] is the identity element of convolution: x[n]*δ[n]=x[n] exactly, by the sifting property applied in DT."},
{q:"Convolution is associative, meaning:", options:["(x*h1)*h2 = x*(h1*h2)", "x*h = h+x", "x*h is never equal to h*x", "Associativity doesn't apply to convolution"], correct:0, explain:"This lets two cascaded LTI systems be replaced, for analysis purposes, by one system whose impulse response is h1*h2."}
],
core:"Convolution is THE computational engine of LTI system theory: once you can mechanically flip, slide, multiply, and sum, you can find the exact output of any LTI system to any input -- this is the DT half of the single most-tested skill in a signals course.",
notes:[
"The convolution sum y[n] = Σ_{k=-∞}^{∞} x[k]h[n-k], written y[n]=x[n]*h[n], gives the output of an LTI system with impulse response h[n] to input x[n]. Mechanically it has four steps for each output index n: (1) flip h[k] to get h[-k], (2) shift by n to get h[n-k], (3) multiply pointwise with x[k], (4) sum all the products -- repeat for every n you need.",
"For finite-length sequences, the sum only runs over the overlap where both x[k] and h[n-k] are nonzero -- this makes hand computation tractable: tabulate x[k] and h[n-k] side by side for each n and sum only the overlapping nonzero products.",
"The identity property: x[n]*δ[n]=x[n] (convolving with the unit impulse leaves a signal unchanged), and more generally x[n]*δ[n-n0]=x[n-n0] (convolving with a SHIFTED impulse just shifts the signal) -- this is the DT sifting property in convolution form and a fast sanity-check tool.",
"For two finite sequences of length Lx and Lh, y[n] has length Lx+Lh-1 -- e.g. two length-3 sequences convolve to a length-5 result. This length formula is a quick way to check whether a computed convolution result is even plausible.",
"<strong>Worked example:</strong> x[n]={1,2,3} (n=0,1,2), h[n]={1,1} (n=0,1). y[0]=x[0]h[0]=1. y[1]=x[0]h[1]+x[1]h[0]=1+2=3. y[2]=x[1]h[1]+x[2]h[0]=2+3=5. y[3]=x[2]h[1]=3. Result: y[n]={1,3,5,3} for n=0,1,2,3 -- length 3+2-1=4. ✓ matches the length formula.",
"<strong>Self-check:</strong> after computing each y[n], verify against the length formula (Lx+Lh-1) and check that the very first and very last output samples equal x[0]h[0] and x[Lx-1]h[Lh-1] respectively -- a fast way to catch an off-by-one indexing error before it propagates.",
"<strong>Application:</strong> A digital FIR (Finite Impulse Response) filter, used constantly in audio/telecom DSP chips, computes its output as literally a convolution sum of the input samples with the filter's fixed coefficient sequence h[n] -- this is not an analogy, it is the exact operation the hardware performs sample by sample."
],
formulas:["y[n] = x[n]*h[n] = Σ_{k=-∞}^{∞} x[k]h[n-k]","x[n]*δ[n]=x[n] ,  x[n]*δ[n-n0]=x[n-n0]","length(y) = length(x) + length(h) - 1  (finite sequences)"],
questions:[
{type:"Conceptual", q:"Explain, mechanically, why flipping h[k] (rather than leaving it un-flipped) is the necessary step in convolution -- what would (incorrectly) computing Σx[k]h[k+n] instead represent, and why is that a different operation (correlation, Day 9)?"},
{type:"ECE application", q:"A 3-tap FIR filter has coefficients h[n]={0.25, 0.5, 0.25}. Compute, by hand, the output y[n] for input x[n]={1,1,1,1} (n=0..3), and describe in words what this particular h[n] does to the input (hint: compare it to a moving average)."},
{type:"Reasoning", q:"If x[n] is an infinite-length signal (e.g. x[n]=u[n], the unit step) and h[n] is a finite-length filter, is y[n]=x[n]*h[n] finite or infinite in length? Explain how the summation limits in the convolution sum change compared to the finite-finite case in the worked example."}
]},

{d:7,week:2,title:"Continuous-Time Convolution (Convolution Integral)",big:true,steps:6,
diagram:"ctconv",
facts:[{tag:"KEY FACT", text:"The convolution integral y(t)=∫x(τ)h(t-τ)dτ is the exact CT analogue of the DT convolution sum -- same flip-slide-multiply-integrate procedure, with integration replacing summation."}, {tag:"CAUTION", text:"The integration limits are NOT always -∞ to ∞ in practice -- for causal signals (zero for t<0), the effective limits collapse to 0 to t, which is where most computational mistakes happen."}],
mcqs:[
{q:"The CT convolution integral is y(t) =", options:["∫x(τ)h(t-τ)dτ", "∫x(t)h(t)dt", "x(t)+h(t)", "d/dt[x(t)h(t)]"], correct:0, explain:"Exactly parallel to the DT sum, but with continuous integration over the dummy variable τ."},
{q:"If both x(t) and h(t) are causal (zero for t<0), the convolution integral's effective limits become:", options:["-∞ to ∞", "0 to t", "-t to t", "0 to ∞ always"], correct:1, explain:"Causality on both signals forces the integrand to vanish outside 0≤τ≤t, collapsing the limits to exactly that range."},
{q:"x(t)*δ(t-t0) equals:", options:["x(t)", "x(t-t0)", "δ(t-t0)", "0"], correct:1, explain:"Convolving with a shifted impulse reproduces the signal shifted by that same amount -- the CT sifting-in-convolution property."},
{q:"Convolving a rectangular pulse of width 1 with ITSELF produces:", options:["Another rectangular pulse", "A triangular pulse of width 2", "An impulse", "A sinusoid"], correct:1, explain:"This is a classic worked result: rect*rect gives a triangle whose base is the sum of the two widths."},
{q:"The distributive property of convolution states:", options:["x*(h1+h2) = x*h1 + x*h2", "x*(h1·h2) = (x*h1)·(x*h2)", "x*h = h-x", "x*(h1+h2) = x·h1+x·h2 always fails"], correct:0, explain:"Convolution distributes over addition -- this models two LTI systems combined in PARALLEL as one system whose impulse response is h1+h2."}
],
core:"Continuous-time convolution is the mathematical machinery behind circuit step/impulse responses, RF channel effects, and acoustic reverberation -- almost every physically continuous LTI system you'll design or analyze in ECE gets solved with exactly this integral.",
notes:[
"y(t) = x(t)*h(t) = ∫_{-∞}^{∞} x(τ)h(t-τ)dτ. The graphical procedure mirrors DT exactly: flip h(τ) to get h(-τ), slide it by t to get h(t-τ), multiply pointwise against x(τ), then find the AREA under the product curve (integrate) -- repeat conceptually as t sweeps from -∞ to ∞.",
"When both signals are causal (x(t)=0 and h(t)=0 for t<0, the overwhelmingly common case for real physical systems), the nonzero overlap of x(τ) and h(t-τ) restricts to 0≤τ≤t, so y(t)=∫_0^t x(τ)h(t-τ)dτ for t≥0, and y(t)=0 for t<0.",
"Key properties carry over directly from DT: commutative (x*h=h*x), associative ((x*h1)*h2=x*(h1*h2), models cascaded/series LTI systems as one equivalent system h1*h2), distributive over addition (x*(h1+h2)=x*h1+x*h2, models parallel LTI systems), and identity (x(t)*δ(t)=x(t), x(t)*δ(t-t0)=x(t-t0)).",
"<strong>Worked example:</strong> Let x(t)=u(t) and h(t)=e^{-t}u(t) (both causal). For t≥0: y(t)=∫_0^t (1)(e^{-(t-τ)})dτ = e^{-t}∫_0^t e^{τ}dτ = e^{-t}(e^t-1) = 1-e^{-t}. So y(t)=(1-e^{-t})u(t) -- this is exactly the familiar RC-circuit step response shape.",
"<strong>Self-check:</strong> before integrating, always sketch (mentally or on paper) which values of τ make BOTH x(τ) and h(t-τ) simultaneously nonzero -- getting these overlap limits right is 90% of the difficulty in a convolution integral; the algebra afterward is usually routine.",
"<strong>Application:</strong> The RC low-pass filter's step response (1-e^{-t/RC})u(t) derived above is the textbook model for how quickly a digital logic gate's output can transition -- convolution with the circuit's own impulse response directly predicts rise-time and settling behavior used in timing analysis."
],
formulas:["y(t) = x(t)*h(t) = ∫_{-∞}^{∞} x(τ)h(t-τ)dτ","Causal x,h: y(t) = ∫_0^t x(τ)h(t-τ)dτ  for t≥0 ,  y(t)=0 for t<0","x(t)*δ(t-t0) = x(t-t0)"],
questions:[
{type:"Conceptual", q:"Explain why, for two causal signals, the convolution integral's limits collapse from (-∞,∞) to (0,t). What physically would it mean if this collapse did NOT happen -- i.e. if the system's output depended on x(τ) for τ>t?"},
{type:"ECE application", q:"An antenna's impulse response h(t) models multipath echoes in a wireless channel. If the transmitted signal is x(t), explain in plain language what y(t)=x(t)*h(t) represents at the receiver, and why a channel with a 'longer' h(t) (more delayed echoes) causes more inter-symbol interference in digital communication."},
{type:"Reasoning", q:"Two identical RC low-pass filters are placed in cascade (series). Using the associative property, explain how you would find the single equivalent impulse response of the combined system, and what this implies about needing to convolve h(t) with itself once versus never at all when analyzing the two-stage circuit."}
]},

{d:8,week:2,title:"Properties of Convolution & LTI Interconnections",big:false,steps:5,
diagram:"convprops",
facts:[{tag:"KEY FACT", text:"Two LTI systems in SERIES (cascade) combine into one system with impulse response h1(t)*h2(t) -- and remarkably, the ORDER of cascaded LTI systems doesn't matter (commutativity)."}, {tag:"INSIGHT", text:"Two LTI systems in PARALLEL combine into one system with impulse response h1(t)+h2(t) -- convolution's distributive property, applied to system block diagrams rather than raw signals."}],
mcqs:[
{q:"Two LTI systems h1 and h2 in series (cascade) have an overall impulse response of:", options:["h1(t)+h2(t)", "h1(t)*h2(t)", "h1(t)-h2(t)", "max(h1,h2)"], correct:1, explain:"Cascading systems corresponds exactly to convolving their individual impulse responses, via convolution's associative property."},
{q:"Two LTI systems h1 and h2 in parallel (same input, outputs summed) have an overall impulse response of:", options:["h1(t)*h2(t)", "h1(t)+h2(t)", "h1(t)/h2(t)", "0"], correct:1, explain:"Parallel combination sums the individual responses, directly reflecting convolution's distributive property over addition."},
{q:"Swapping the order of two cascaded LTI systems (h1 then h2, vs h2 then h1):", options:["Changes the overall output", "Never changes the overall output, since convolution is commutative", "Is only valid for causal systems", "Only works for stable systems"], correct:1, explain:"Because h1*h2=h2*h1, LTI cascade order is fully interchangeable -- a genuinely useful design freedom, e.g. in filter/amplifier ordering."},
{q:"An LTI system h(t) is invertible if there exists h_inv(t) such that:", options:["h(t)*h_inv(t) = δ(t)", "h(t)+h_inv(t) = 0", "h(t)·h_inv(t) = 1", "h_inv(t) = h(-t) always"], correct:0, explain:"Convolving a system with its inverse must produce the identity element of convolution, δ(t), meaning the cascade does nothing overall."},
{q:"If h1 is BIBO-stable and h2 is BIBO-stable, the cascade h1*h2 is:", options:["Always unstable", "Always BIBO-stable", "Stability cannot be determined", "Only stable if h1=h2"], correct:1, explain:"∫|h1*h2|dt ≤ (∫|h1|dt)(∫|h2|dt) < ∞ when both factors are finite, so cascading stable LTI systems preserves stability."}
],
core:"These interconnection rules are why block-diagram thinking works at all in ECE: a complicated signal chain of filters, amplifiers, and channels can always be collapsed algebraically into ONE equivalent impulse response using nothing more than convolution's own algebraic properties.",
notes:[
"SERIES (cascade): output of system 1 feeds directly into system 2. Overall impulse response h(t)=h1(t)*h2(t), which follows directly from associativity: y=(x*h1)*h2=x*(h1*h2). This is a genuinely powerful design tool -- a designer can analyze one combined transfer characteristic instead of two separate stages.",
"Cascade order is interchangeable: h1*h2=h2*h1 means physically swapping the ORDER of two cascaded LTI blocks (e.g. an amplifier then a filter, vs. a filter then an amplifier) produces the exact same overall system -- provided both remain LTI (this breaks down completely once nonlinearity, e.g. amplifier saturation, is introduced).",
"PARALLEL: the same input x(t) feeds both systems simultaneously, and their outputs are summed. Overall impulse response h(t)=h1(t)+h2(t), directly from distributivity: x*h1+x*h2=x*(h1+h2). This models, e.g., a signal split across two filter paths (say, a low-pass and a band-pass branch) that are recombined.",
"INVERTIBILITY: a system h(t) is invertible if some h_inv(t) exists with h(t)*h_inv(t)=δ(t) -- cascading the system with its inverse gives back exactly the original input unchanged (the identity system). Not every system is invertible (e.g. a system that discards information, like an ideal rectifier |x(t)|, has no LTI inverse).",
"<strong>Worked example:</strong> System A has h1(t)=δ(t-1) (pure 1-second delay); System B has h2(t)=δ(t-2) (pure 2-second delay). Cascade: h1*h2 = δ(t-1)*δ(t-2) = δ(t-3) (delays add, using the shift-identity property twice) -- confirming that cascading two delays gives one larger delay, exactly as physical intuition demands.",
"<strong>Application:</strong> A receiver's signal chain -- antenna, bandpass filter, low-noise amplifier, mixer -- is analyzed by ECE engineers as a cascade of LTI blocks precisely so that the WHOLE chain's impulse response (and later, frequency response, Day 20) can be computed once via successive convolutions rather than tracking every stage's output separately."
],
formulas:["Series/cascade: h(t) = h1(t)*h2(t)  (order-independent: h1*h2=h2*h1)","Parallel: h(t) = h1(t)+h2(t)","Invertible: h(t)*h_inv(t) = δ(t)"],
questions:[
{type:"Conceptual", q:"Prove that cascade order doesn't matter for LTI systems using ONLY the commutative property of convolution -- state clearly what physical assumption (LTI) is required for this proof to remain valid."},
{type:"ECE application", q:"A telecom receiver chain has a bandpass filter (h1) followed by an amplifier (h2), both LTI. An engineer proposes swapping their physical order to simplify the PCB layout. Under the idealized LTI model this is provably fine -- but name one realistic, practical (not purely mathematical) reason a real RF engineer might still object to swapping this order."},
{type:"Reasoning", q:"Is the ideal differentiator system (output = dx/dt) invertible? If so, describe (in words, without necessarily computing it formally) what its inverse system does, and connect this to the step/impulse relationship from Day 3."}
]},

{d:9,week:2,title:"Correlation of Signals",big:false,steps:4,
diagram:"correlation",
facts:[{tag:"KEY FACT", text:"Cross-correlation Rxy(τ)=∫x(t)y(t+τ)dt measures the SIMILARITY between two signals as a function of relative time shift τ -- unlike convolution, there is NO flipping involved."}, {tag:"INSIGHT", text:"Autocorrelation (correlating a signal with itself) always peaks at τ=0 -- a signal is always maximally similar to an un-shifted copy of itself."}],
mcqs:[
{q:"The key mechanical difference between correlation and convolution is:", options:["Correlation uses summation, convolution uses integration", "Correlation does NOT flip one of the signals; convolution does", "They are exactly the same operation", "Correlation only works on periodic signals"], correct:1, explain:"Both slide one signal across the other, but correlation skips the time-reversal step that convolution requires."},
{q:"The autocorrelation of a signal x(t) always achieves its MAXIMUM value at:", options:["τ=∞", "τ=0", "τ=-1", "It depends entirely on the signal"], correct:1, explain:"A signal correlated with an exact, un-shifted copy of itself has the highest possible similarity, giving the peak at zero lag."},
{q:"Cross-correlation is used in radar/sonar systems primarily to:", options:["Amplify the signal", "Detect the time delay between a transmitted pulse and its received echo", "Filter out noise completely", "Change the signal's frequency"], correct:1, explain:"The lag τ at which Rxy(τ) peaks directly reveals the round-trip delay to a target, from which range is computed."},
{q:"For real signals, Rxy(τ) and Ryx(τ) are related by:", options:["Rxy(τ) = Ryx(τ)", "Rxy(τ) = Ryx(-τ)", "They are always equal to zero", "Rxy(τ) = -Ryx(τ)"], correct:1, explain:"Swapping which signal is 'shifted' reverses the sign of the lag, so Rxy(τ)=Ryx(-τ) -- correlation is NOT commutative in the way convolution is."},
{q:"Correlation can be computed from convolution using the relationship:", options:["Rxy(τ) = x(τ)*y(τ)", "Rxy(τ) = x(-τ)*y(τ)", "Rxy(τ) = x(τ)+y(τ)", "There is no relationship"], correct:1, explain:"Pre-flipping x(t) to x(-t) before convolving with y(t) exactly reproduces cross-correlation -- correlation is 'convolution without the built-in flip', so flipping one signal manually recovers it."}
],
core:"Correlation answers a fundamentally different question than convolution -- not 'what comes out of this system' but 'how alike are these two signals, and by how much are they offset' -- which is exactly the question radar ranging, GPS timing, and digital receiver synchronization all need answered.",
notes:[
"Cross-correlation: Rxy(τ)=∫_{-∞}^{∞} x(t)y(t+τ)dt (continuous-time; for DT, sum replaces integral). It measures how well y(t), shifted by τ, matches x(t), for every possible lag τ. Critically, NEITHER signal is time-reversed -- this is the key mechanical distinction from convolution.",
"Autocorrelation Rxx(τ)=∫x(t)x(t+τ)dt is the special case y=x. Rxx(τ) is always maximized at τ=0 (a signal matches an unshifted copy of itself better than any shifted copy), and for real signals Rxx(τ)=Rxx(-τ) (it is an EVEN function of lag).",
"Correlation and convolution ARE related: Rxy(τ) = x(-τ)*y(τ). This means every correlation calculation can be performed mechanically using the same flip-slide-multiply-integrate machinery from Days 6-7, simply by pre-flipping one signal before convolving -- so no new computational skill is actually required, only a new INTERPRETATION.",
"Correlation is not commutative the way convolution is: Rxy(τ)=Ryx(-τ), not Rxy(τ)=Ryx(τ). Swapping which signal you call 'x' and which you call 'y' flips the sign of the lag axis, since 'how much does y lag behind x' and 'how much does x lag behind y' are naturally opposite questions.",
"<strong>Worked example:</strong> A radar transmits a known pulse p(t) and receives echo r(t)=A·p(t-td)+noise. Computing the cross-correlation Rpr(τ) produces a sharp peak located at τ=td (since the echo most resembles a τ=td-shifted copy of the transmitted pulse) -- reading off the peak location directly gives the round-trip delay td, and hence target range = c·td/2.",
"<strong>Application:</strong> Beyond radar, cross-correlation is the core mechanism behind GPS receivers locking onto satellite signals (correlating the received signal against known pseudorandom codes to find timing offset), and behind digital modem synchronization (finding exactly where a known 'preamble' sequence starts within a noisy received bitstream)."
],
formulas:["Rxy(τ) = ∫x(t)y(t+τ)dt   (cross-correlation)","Rxx(τ) = ∫x(t)x(t+τ)dt ,  peak always at τ=0,  Rxx(τ)=Rxx(-τ)","Rxy(τ) = x(-τ)*y(τ)   (correlation via convolution)"],
questions:[
{type:"Conceptual", q:"Explain, using the formula Rxy(τ)=x(-τ)*y(τ), exactly which one signal gets flipped in a correlation calculation, and why -- unlike convolution -- this flip is NOT considered part of the 'meaning' of correlation, just a computational trick to reuse convolution machinery."},
{type:"ECE application", q:"A GPS receiver must identify which satellite a faint signal is coming from and its exact timing offset, using cross-correlation against a bank of known reference codes. Explain, in terms of the correlation peak, what a HIGH peak (vs. a flat, low correlation everywhere) tells the receiver about whether it has found the right satellite code."},
{type:"Reasoning", q:"If x(t) is pure white noise (random, uncorrelated with itself at any nonzero lag), describe qualitatively what its autocorrelation function Rxx(τ) looks like for τ≠0 versus τ=0, and explain why this specific shape makes noise-like signals useful as radar/sonar test pulses (hint: a 'sharp' autocorrelation peak gives precise ranging)."}
]},

{d:10,week:2,title:"Differential & Difference Equation Representation",big:false,steps:5,
diagram:"diffeq",
facts:[{tag:"KEY FACT", text:"An Nth-order LTI system can equivalently be described by a linear constant-coefficient differential equation (CT) or difference equation (DT) relating y(t)/y[n] and its derivatives/past values to x(t)/x[n]."}, {tag:"INSIGHT", text:"Solving these equations requires BOTH a natural (homogeneous, zero-input) response from initial conditions AND a forced (particular, zero-state) response driven by the input -- total response = natural + forced."}],
mcqs:[
{q:"A linear constant-coefficient differential equation description of an LTI system relates:", options:["x(t) to itself only", "y(t) and its derivatives to x(t) and its derivatives", "Only initial conditions", "The system's stability margin"], correct:1, explain:"E.g. dy/dt + 2y(t) = x(t) is a first-order LTI differential equation relating output and input directly."},
{q:"The DT equivalent of a differential equation is a:", options:["Convolution sum", "Difference equation, e.g. y[n] = ay[n-1]+bx[n]", "Fourier series", "Correlation function"], correct:1, explain:"Difference equations relate the CURRENT output sample to past output samples and current/past input samples -- the DT analogue of derivatives."},
{q:"The 'natural response' (homogeneous solution) of an LTI system arises from:", options:["The forcing input x(t) alone", "Initial conditions, with input set to zero", "Random noise", "It never exists for stable systems"], correct:1, explain:"The natural response is the system's own internal behavior (e.g. decay/oscillation) that would occur even with zero input, driven purely by stored energy/initial conditions."},
{q:"The 'forced response' (particular solution) of an LTI system is:", options:["Independent of the input", "The component of the output directly driven by x(t), assuming zero initial conditions", "Always zero", "Only relevant for unstable systems"], correct:1, explain:"The forced response is exactly what convolution y=x*h computes -- the zero-state response due entirely to the input."},
{q:"A first-order RC circuit's differential equation is typically:", options:["RC dy/dt + y(t) = x(t)", "y(t) = x(t)", "d²y/dt² = 0", "y(t) = ∫x(t)dt only"], correct:0, explain:"The classic first-order RC low-pass has time constant RC and satisfies RC·dy/dt + y(t) = x(t) relating capacitor voltage y(t) to source x(t)."}
],
core:"Differential/difference equations are the OTHER standard language for describing LTI systems, alongside impulse response h(t) -- and Day 16's Laplace transform (plus its DT cousin, the Z-transform) exists specifically to turn these equations into simple algebra, which is why this representation matters even before you can fully solve one by hand.",
notes:[
"CT LTI systems are commonly specified by a linear, constant-coefficient differential equation: a_N y^(N)(t) + ... + a1 y'(t) + a0 y(t) = b_M x^(M)(t) + ... + b0 x(t), where superscripts denote derivative order. This is exactly how physical circuits (RLC networks) and mechanical systems are naturally modeled from first principles (Kirchhoff's laws, Newton's laws).",
"DT LTI systems are analogously specified by a linear, constant-coefficient DIFFERENCE equation: y[n] = -Σa_k y[n-k] + Σb_m x[n-m] -- the current output sample as a weighted combination of past outputs (feedback) and current/past inputs (feedforward). This is exactly the form implemented by digital IIR filter hardware/software.",
"The total solution splits into two parts: the NATURAL (homogeneous/zero-input) response, found by solving the equation with x(t)=0 using only the given initial conditions, and the FORCED (particular/zero-state) response, found assuming zero initial conditions and driven entirely by x(t) -- total response = natural + forced, a direct consequence of linearity (superposition).",
"The forced response computed this way is IDENTICAL to what convolution y(t)=x(t)*h(t) produces -- differential/difference equations and the impulse-response/convolution view are two equivalent descriptions of the same LTI system, and Laplace/Z-transforms (Days 16-18) are the standard bridge that converts between them with far less algebra.",
"<strong>Worked example:</strong> RC circuit: RC·dy/dt + y(t) = x(t), with x(t)=Vs·u(t) (step input) and y(0)=0 (capacitor initially uncharged). Natural response form: Ae^{-t/RC}. Forced response (steady-state, since d/dt of a constant is 0): y=Vs. Total: y(t)=Vs+Ae^{-t/RC}; applying y(0)=0 gives A=-Vs, so y(t)=Vs(1-e^{-t/RC})u(t) -- matching Day 7's convolution result exactly.",
"<strong>Application:</strong> Every analog filter (Butterworth, Chebyshev) used in radio receivers is designed FROM a target differential equation (or, equivalently, a target transfer function derived via Laplace transform, Day 16-17); every digital IIR filter on a DSP chip is directly IMPLEMENTED as a difference equation, executed sample-by-sample in real time."
],
formulas:["CT: a_N y^(N)+...+a0 y = b_M x^(M)+...+b0 x","DT: y[n] = -Σ_{k=1}^{N} a_k y[n-k] + Σ_{m=0}^{M} b_m x[n-m]","Total response = Natural (zero-input) response + Forced (zero-state) response"],
questions:[
{type:"Conceptual", q:"Explain why the 'natural response' and the 'zero-input response' are the same thing, and why the 'forced response' equals the convolution result y=x*h -- connect this explicitly to the superposition principle from Day 4."},
{type:"ECE application", q:"A digital audio equalizer is implemented as the difference equation y[n] = 0.6y[n-1] + 0.4x[n]. Identify whether this filter has memory, and explain, in terms of the feedback term 0.6y[n-1], why this is called an IIR (Infinite Impulse Response) filter rather than an FIR filter like Day 6's moving average."},
{type:"Reasoning", q:"For the RC circuit example, what happens to the natural response component Ae^{-t/RC} as t→∞, for a physically realizable circuit (RC>0)? Explain why engineers often care only about the FORCED (steady-state) response when characterizing a stable filter's long-term behavior."}
]},

{d:11,week:3,title:"Fourier Series — Representing Periodic Signals",big:true,steps:6,
diagram:"fourierseries",
facts:[{tag:"KEY FACT", text:"Any periodic signal x(t) satisfying mild (Dirichlet) conditions can be written as a sum of harmonically related sinusoids/complex exponentials at frequencies 0, ω0, 2ω0, 3ω0, ... where ω0=2π/T."}, {tag:"INSIGHT", text:"The exponential Fourier series form, x(t)=Σck e^{jkω0t}, is mathematically cleaner than the trigonometric (sin/cos) form and is what Days 12-14 build on directly."}],
mcqs:[
{q:"The fundamental frequency ω0 of a periodic signal with period T is:", options:["ω0 = T", "ω0 = 2π/T", "ω0 = 2πT", "ω0 = 1/(2πT)"], correct:1, explain:"Angular fundamental frequency is inversely proportional to the period, scaled by 2π."},
{q:"The exponential Fourier series expresses x(t) as:", options:["A single sinusoid", "Σck e^{jkω0t}, a sum over ALL integers k (positive, negative, zero)", "Only positive-frequency terms", "A polynomial in t"], correct:1, explain:"The exponential form sums over both positive and negative harmonic indices k, unlike the trigonometric form which uses only k≥0."},
{q:"The Fourier coefficient c0 (k=0 term) represents:", options:["The signal's peak value", "The DC (average) value of the signal over one period", "The fundamental frequency", "Always zero"], correct:1, explain:"c0=(1/T)∫x(t)dt over one period is exactly the time-average, i.e. the DC component."},
{q:"For a REAL-valued periodic signal, the Fourier coefficients satisfy:", options:["ck = c(-k) always", "c(-k) = ck* (complex conjugate symmetry)", "All ck are real numbers", "ck = 0 for k≠0"], correct:1, explain:"Real signals always have conjugate-symmetric Fourier coefficients, which is why their magnitude spectrum is even and phase spectrum is odd."},
{q:"A signal's Fourier series coefficients ck, plotted vs. k (or kω0), are called the:", options:["Impulse response", "Line spectrum", "Convolution sum", "Correlation function"], correct:1, explain:"Because only discrete frequencies (harmonics) are present, the spectrum consists of discrete 'lines' rather than a continuous curve."}
],
core:"Fourier series is the mathematical proof that every periodic signal -- no matter how jagged (a square wave!) -- is secretly built from pure sinusoids, and this single idea is the entire foundation of frequency-domain thinking: filters, spectrum analyzers, and channel bandwidth all describe signals in terms of THESE harmonic components, not the time waveform.",
notes:[
"Any periodic signal x(t) with period T (satisfying the mild Dirichlet conditions: finite number of discontinuities/extrema per period, absolutely integrable) can be written as x(t)=Σ_{k=-∞}^{∞} ck e^{jkω0t}, where ω0=2π/T is the fundamental frequency and ck are complex Fourier series coefficients.",
"The coefficients are computed by ck = (1/T)∫_T x(t)e^{-jkω0t}dt (integrating over any one full period). c0 is always the signal's DC/average value; larger |k| corresponds to higher harmonic frequencies kω0 contributing progressively finer detail (sharper edges, faster variations) to the reconstructed waveform.",
"The equivalent trigonometric (sine-cosine) form, x(t)=a0+Σ(ak cos(kω0t)+bk sin(kω0t)), is more intuitive for real signals but algebraically messier; the two forms are related by simple conversion formulas, and virtually all modern analysis (Days 12-14) uses the exponential form exclusively.",
"For REAL x(t), the coefficients obey conjugate symmetry: c(-k)=ck* . This guarantees the magnitude spectrum |ck| is an EVEN function of k and the phase spectrum ∠ck is an ODD function of k -- a fast consistency check on any computed spectrum.",
"<strong>Worked example:</strong> A symmetric square wave (period T, amplitude ±1) has Fourier coefficients ck=0 for even k, and ck = (2/(jkπ)) for odd k (specific constants depend on the exact square wave definition/phase chosen). The KEY qualitative takeaway: only ODD harmonics are present, and their magnitude falls off as 1/k -- so a 'sharp-edged' square wave requires infinitely many higher harmonics to reconstruct its edges exactly (this partial-sum ringing near jumps is the Gibbs phenomenon).",
"<strong>Self-check:</strong> compute c0 first, always -- it should equal the visually obvious time-average of the waveform (e.g. c0=0 for a symmetric square wave straddling zero) -- an instant sanity check before computing any harder ck.",
"<strong>Application:</strong> A power-line signal's Fourier series (60 Hz fundamental plus odd harmonics from non-linear loads) is exactly how power-quality engineers quantify 'harmonic distortion'; in telecom, understanding which harmonics a periodic clock or carrier signal contains is essential for predicting interference with adjacent channels."
],
formulas:["x(t) = Σ_{k=-∞}^{∞} ck e^{jkω0t} ,  ω0=2π/T","ck = (1/T)∫_T x(t) e^{-jkω0t} dt","Real x(t): c(-k) = ck*  (conjugate symmetry)"],
questions:[
{type:"Conceptual", q:"Explain why a signal must be PERIODIC for a Fourier SERIES (as opposed to a Fourier TRANSFORM, Day 13) to apply, and what specifically about the derivation (the integral limits) requires this."},
{type:"ECE application", q:"A digital clock signal (an ideal square wave at frequency f0) is used on a PCB. Using the fact that only odd harmonics are present with magnitude falling as 1/k, explain why a clock's higher-order harmonics (3f0, 5f0, 7f0, ...) are a realistic EMI (electromagnetic interference) concern for a telecom engineer, even though the 'intended' signal is only at f0."},
{type:"Reasoning", q:"The Gibbs phenomenon describes persistent 'ringing'/overshoot near a signal's discontinuities, no matter how many Fourier terms are summed. Explain, in terms of which frequency components are missing from a TRUNCATED (finite-term) Fourier series, why this overshoot doesn't shrink away even as more (but still finitely many) harmonics are added."}
]},

{d:12,week:3,title:"Properties of the Fourier Series & Parseval's Theorem",big:false,steps:5,
diagram:"fsprops",
facts:[{tag:"KEY FACT", text:"Time-shifting a periodic signal only changes the PHASE of its Fourier coefficients (ck·e^{-jkω0t0}), never their magnitude -- the spectrum's shape is shift-invariant."}, {tag:"INSIGHT", text:"Parseval's theorem states the average power of a periodic signal equals the sum of the powers in EACH individual harmonic: P = Σ|ck|² -- power in the time domain equals power in the frequency domain."}],
mcqs:[
{q:"If x(t) has Fourier coefficients ck, then x(t-t0) has coefficients:", options:["ck unchanged", "ck·e^{-jkω0t0}", "ck²", "ck/t0"], correct:1, explain:"Time-shifting adds a linear phase term across harmonics but leaves each |ck| exactly the same."},
{q:"Parseval's theorem for periodic signals states:", options:["Energy is always infinite", "Average power P = Σ_{k=-∞}^{∞} |ck|²", "P = c0 only", "Power is undefined for periodic signals"], correct:1, explain:"Total average power splits exactly across all harmonics, each contributing |ck|² -- a direct energy-conservation statement between time and frequency domains."},
{q:"If x(t) is REAL and EVEN, its Fourier coefficients ck are:", options:["Purely imaginary", "Purely real", "Always zero", "Complex with random phase"], correct:1, explain:"Real+even symmetry in time forces the coefficients to be real-valued (no phase/imaginary component) in frequency."},
{q:"Linearity of the Fourier series means that for x(t)=Ax1(t)+Bx2(t):", options:["ck = A·c1k + B·c2k", "ck = A+B", "ck cannot be found without recomputing from scratch", "ck = c1k · c2k"], correct:0, explain:"Fourier coefficients combine linearly exactly like the signals themselves -- a direct consequence of the integral defining ck being linear."},
{q:"Scaling time as x(at) (a>0) changes the fundamental frequency to:", options:["ω0 unchanged", "a·ω0 (harmonics move to new frequencies, but ck values are unchanged)", "ω0/a²", "It destroys periodicity entirely"], correct:1, explain:"Compressing/expanding time compresses/expands the period by 1/a, which scales the fundamental (and all harmonic) frequencies by a, while the coefficient VALUES themselves stay the same."}
],
core:"These properties turn Fourier analysis from 'recompute the integral every time' into 'look up how a simple time-domain operation predictably reshapes the spectrum' -- exactly the shortcut-based reasoning that lets engineers quickly predict a modulator, filter, or delay's effect on a signal's spectrum without redoing calculus.",
notes:[
"Linearity: x(t)=Ax1(t)+Bx2(t) → ck=A·c1k+B·c2k (assuming a common period exists). This lets you build the spectrum of a complicated periodic signal by summing the KNOWN spectra of simpler pieces, rather than integrating the whole thing from scratch.",
"Time-shift: x(t-t0) → ck·e^{-jkω0t0}. Only the PHASE of each coefficient changes (a linear phase ramp across k); the magnitude spectrum |ck| is completely unaffected by time-shifting -- this is exactly why a spectrum analyzer can't tell you WHEN a periodic event started, only what frequencies are present.",
"Time-scaling: x(at) is periodic with a NEW fundamental frequency a·ω0 (period scales by 1/a), while the coefficient values ck themselves are unchanged -- compressing a signal in time stretches its spectrum out along the frequency axis (harmonics move further apart), a direct time-frequency trade-off that reappears throughout Fourier theory.",
"Parseval's theorem: average power P=(1/T)∫_T|x(t)|²dt = Σ_{k=-∞}^{∞}|ck|². This says the total power can be computed EITHER by integrating |x(t)|² in the time domain OR by summing |ck|² across every harmonic in the frequency domain -- they must agree, giving a powerful cross-check on any computed Fourier series.",
"<strong>Worked example:</strong> A signal has c0=0, c1=c-1=0.5 (only a fundamental sinusoid present, no DC, no higher harmonics). By Parseval, P=|c0|²+|c1|²+|c-1|²=0+0.25+0.25=0.5 -- which matches the known result that a sinusoid of amplitude 1 has average power 1/2 (A²/2 with A=2·0.5=1... consistent with Day 1's power formula).",
"<strong>Application:</strong> Parseval's theorem is exactly how a spectrum analyzer's power reading is justified -- summing (integrating) the power in each displayed frequency bin gives the SAME total power a power meter would read directly from the time-domain waveform, which is why engineers trust frequency-domain power measurements at all."
],
formulas:["Time-shift: x(t-t0) ↔ ck e^{-jkω0t0}  (magnitude unchanged, phase shifts linearly)","Time-scale: x(at) has fundamental freq a·ω0; ck values unchanged","Parseval: P = (1/T)∫_T|x(t)|²dt = Σ_{k=-∞}^{∞}|ck|²"],
questions:[
{type:"Conceptual", q:"Explain why time-shifting a periodic signal changes only the PHASE, never the magnitude, of its Fourier coefficients -- connect this to the fact that a magnitude spectrum plot alone cannot tell you when a periodic signal 'starts'."},
{type:"ECE application", q:"A spectrum analyzer displays the magnitude spectrum |ck| of a periodic test signal from a signal generator. If the engineer delays the trigger point (effectively time-shifting the observed waveform), explain, using the time-shift property, whether the displayed magnitude spectrum plot would change at all."},
{type:"Reasoning", q:"Using Parseval's theorem, explain why a signal with energy concentrated in just a FEW low-order harmonics (small k) is generally 'easier' to transmit through a band-limited communication channel than a signal whose power is spread across many high-order harmonics -- connect this to the practical idea of channel bandwidth."}
]},

{d:13,week:3,title:"Fourier Transform of Aperiodic Signals",big:true,steps:6,
diagram:"fouriertransform",
facts:[{tag:"KEY FACT", text:"The Fourier Transform X(ω)=∫x(t)e^{-jωt}dt extends Fourier analysis to APERIODIC signals by treating them as the limit of a periodic signal whose period T→∞, turning the discrete line spectrum into a CONTINUOUS spectrum."}, {tag:"INSIGHT", text:"A signal that is narrow/short in TIME has a spectrum that is wide/spread-out in FREQUENCY, and vice versa -- this time-bandwidth trade-off is unavoidable and appears everywhere in communication system design."}],
mcqs:[
{q:"The Fourier Transform X(ω) of x(t) is defined as:", options:["Σck e^{jkω0t}", "∫_{-∞}^{∞} x(t)e^{-jωt}dt", "x(t)*h(t)", "∫x(t)dt"], correct:1, explain:"This integral extends the Fourier series idea to a continuous frequency variable ω, valid for aperiodic (as well as suitably well-behaved periodic) signals."},
{q:"The Fourier Transform of a rectangular pulse in time is:", options:["Another rectangular pulse", "A sinc function", "An impulse", "A pure sinusoid"], correct:1, explain:"rect(t) and sinc(ω) form one of the most important, frequently-reused transform pairs in signal processing."},
{q:"For the Fourier Transform to exist in the ordinary sense, x(t) generally must satisfy:", options:["Be periodic", "Be absolutely integrable (Dirichlet conditions)", "Have infinite energy", "Be a pure sinusoid"], correct:1, explain:"∫|x(t)|dt<∞ (plus mild extra conditions) guarantees convergence of the Fourier integral; some special signals (like sinusoids) are handled using impulses in the frequency domain as an extension."},
{q:"A signal that is very SHORT/narrow in time will have a Fourier Transform that is:", options:["Also narrow in frequency", "Wide/spread out in frequency", "Zero everywhere", "Impossible to compute"], correct:1, explain:"Time and frequency 'widths' are inversely related -- compressing a pulse in time necessarily spreads its energy across a wider band of frequencies."},
{q:"The inverse Fourier Transform recovers x(t) from X(ω) via:", options:["x(t) = (1/2π)∫X(ω)e^{jωt}dω", "x(t) = X(ω) directly", "x(t) = ΣX(ω)", "x(t) cannot be recovered"], correct:0, explain:"The inverse transform is structurally symmetric to the forward transform, differing by a 1/2π scaling and the sign in the exponent."}
],
core:"The Fourier Transform is the single tool that lets an ECE engineer look at ANY signal -- periodic or not, a voice clip, a radar chirp, a data packet -- and see exactly what frequencies it's made of, which is the non-negotiable first step before designing any filter, modulator, or channel around that signal.",
notes:[
"The Fourier Transform: X(ω)=∫_{-∞}^{∞} x(t)e^{-jωt}dt, and its inverse: x(t)=(1/2π)∫_{-∞}^{∞} X(ω)e^{jωt}dω. Conceptually, X(ω) is obtained by letting a periodic signal's period T→∞ in the Fourier series: the harmonic spacing ω0=2π/T shrinks to zero, turning the discrete set of coefficients ck into a CONTINUOUS function X(ω).",
"Existence requires x(t) to satisfy the Dirichlet conditions (absolutely integrable, finite discontinuities/extrema in any finite interval) -- most practical, finite-duration or decaying signals qualify. Signals that don't decay (like a pure sinusoid or a step) require impulse functions IN the frequency domain to represent their transform, an extension covered alongside Day 14's properties.",
"A cornerstone pair: a rectangular pulse rect(t/τ) of width τ in time transforms to a sinc function X(ω)=τ·sinc(ωτ/2π) in frequency, whose main-lobe width is inversely proportional to τ. This single pair captures the entire time-bandwidth trade-off: shrink the pulse in time (smaller τ) and its spectral width GROWS (wider main lobe) -- you cannot simultaneously confine a signal tightly in both domains.",
"|X(ω)| is called the magnitude spectrum and ∠X(ω) the phase spectrum; together they completely describe the aperiodic signal in the frequency domain, exactly parallel to |ck| and ∠ck for periodic signals in Fourier series.",
"<strong>Worked example:</strong> x(t)=e^{-at}u(t), a>0 (a causal decaying exponential). X(ω)=∫_0^∞ e^{-at}e^{-jωt}dt = ∫_0^∞ e^{-(a+jω)t}dt = 1/(a+jω). This is one of the most-reused transform pairs in the entire course -- it reappears in Day 16's Laplace transform (simply setting s=jω) and describes the frequency response of a basic RC low-pass filter.",
