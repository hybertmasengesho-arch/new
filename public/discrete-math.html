<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Discrete Mathematics — Days 1–20 (incl. Foundations for ML)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700;800&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/theme.css">
<style>
  :root{
    --bg:#F7F5EF;
    --bg-panel:#FFFFFF;
    --bg-raised:#EFEBDE;
    --line:#DEDACB;
    --text:#23282E;
    --text-muted:#5B6470;
    --text-dim:#838C93;
    --copper:#1F5FA8;
    --copper-dim:#163F73;
    --cyan:#1F8A57;
    --cyan-dim:#146641;
    --big-flag:#C97A22;
    --caution:#B94A40;
    --radius:3px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:'Atkinson Hyperlegible',sans-serif;
    font-size:16.5px;
    line-height:1.7;
    -webkit-font-smoothing:antialiased;
    text-rendering:optimizeLegibility;
    font-feature-settings:"kern" 1, "liga" 1;
  }
  body::before{
    content:"";
    position:fixed; inset:0;
    background-image:
      linear-gradient(var(--line) 1px, transparent 1px),
      linear-gradient(90deg, var(--line) 1px, transparent 1px);
    background-size:64px 64px;
    opacity:0.05;
    pointer-events:none;
    z-index:0;
  }
  h1,h2,h3,h4{font-family:'Sora',sans-serif; font-weight:700; letter-spacing:-0.015em; margin:0; color:var(--text);}
  .mono{font-family:'IBM Plex Mono',monospace;}

  /* ---------- Layout ---------- */
  .app{display:flex; min-height:100vh; position:relative; z-index:1;}

  .sidebar{
    width:340px; flex:none;
    background:var(--bg-panel);
    border-right:1px solid var(--line);
    height:100vh; position:sticky; top:0;
    overflow-y:auto;
    padding:28px 0 60px;
  }
  .sidebar-head{padding:0 24px 20px; border-bottom:1px solid var(--line); margin-bottom:8px;}
  .sidebar-head .kicker{color:var(--copper); font-family:'IBM Plex Mono',monospace; font-size:12px; letter-spacing:0.08em; font-weight:500;}
  .sidebar-head h1{font-size:23px; line-height:1.25; margin-top:8px; font-weight:800; letter-spacing:-0.02em;}
  .sidebar-head p{color:var(--text-muted); font-size:13.5px; line-height:1.55; margin-top:10px; font-family:'Atkinson Hyperlegible',sans-serif;}

  details.week{border-bottom:1px solid var(--line);}
  details.week summary{
    list-style:none; cursor:pointer;
    display:flex; align-items:center; justify-content:space-between;
    padding:14px 24px;
    font-family:'Sora',sans-serif; font-weight:600; font-size:14.5px; letter-spacing:-0.01em;
    color:var(--text);
  }
  details.week summary::-webkit-details-marker{display:none;}
  details.week summary .wk-range{color:var(--text-dim); font-family:'IBM Plex Mono',monospace; font-size:11.5px; font-weight:400; letter-spacing:0.02em;}
  details.week summary::after{
    content:"+"; color:var(--copper); font-family:'IBM Plex Mono',monospace; font-size:16px; margin-left:8px;
  }
  details.week[open] summary::after{content:"–";}

  .day-list{padding:0 14px 14px;}
  .day-btn{
    width:100%; text-align:left;
    background:none; border:none; color:var(--text-muted);
    font-family:'Atkinson Hyperlegible',sans-serif; font-size:13.5px;
    padding:9px 12px; border-radius:var(--radius);
    cursor:pointer; display:flex; gap:10px; align-items:baseline;
  }
  .day-btn:hover{background:var(--bg-raised); color:var(--text);}
  .day-btn.active{background:var(--bg-raised); color:var(--text); box-shadow:inset 2px 0 0 var(--copper);}
  .day-btn .num{font-family:'IBM Plex Mono',monospace; color:var(--cyan); font-size:12px; min-width:20px;}
  .day-btn .flag{margin-left:auto; font-family:'IBM Plex Mono',monospace; font-size:10px; color:var(--big-flag); opacity:0.9;}

  /* ---------- Main ---------- */
  main{flex:1; padding:56px 64px 120px; max-width:900px;}
  .top-progress{color:var(--text-dim); font-family:'IBM Plex Mono',monospace; font-size:12px; letter-spacing:0.04em; margin-bottom:26px;}
  .day-meta{display:flex; align-items:center; gap:14px; margin-bottom:10px;}
  .day-tag{font-family:'IBM Plex Mono',monospace; font-size:12.5px; color:var(--copper);}
  .step-tag{font-family:'IBM Plex Mono',monospace; font-size:12px; color:var(--text-dim); border:1px solid var(--line); padding:3px 9px; border-radius:20px;}
  .step-tag.big{color:var(--big-flag); border-color:var(--copper-dim);}
  .day-title{font-size:36px; line-height:1.16; font-weight:800; letter-spacing:-0.02em; margin-bottom:8px;}
  .core-idea{color:var(--text-muted); font-size:17px; line-height:1.6; font-style:italic; font-family:'Atkinson Hyperlegible',sans-serif; font-weight:400; margin:14px 0 34px; padding-left:16px; border-left:2px solid var(--cyan-dim);}

  section.block{margin-bottom:36px;}
  .block h3{font-size:12.5px; font-family:'IBM Plex Mono',monospace; color:var(--cyan); font-weight:500; letter-spacing:0.06em; margin-bottom:14px;}
  .notes p{color:var(--text); font-size:16px; line-height:1.75; margin:0 0 15px; max-width:74ch;}
  .notes p:last-child{margin-bottom:0;}

  .formula-list{display:flex; flex-direction:column; gap:10px;}
  .formula{
    background:rgba(185,74,64,0.06); border:1px solid var(--caution); border-left:4px solid var(--caution);
    padding:12px 16px; border-radius:var(--radius);
    font-family:'IBM Plex Mono',monospace; font-size:14.5px; font-weight:600; color:var(--caution);
  }

  /* ---------- Diagram ---------- */
  .diagram-wrap{
    background:var(--bg-panel); border:1px solid var(--line); border-radius:var(--radius);
    padding:26px 28px 18px; margin-bottom:32px;
  }
  .diagram-wrap .diagram-cap{
    font-family:'IBM Plex Mono',monospace; font-size:11.5px; color:var(--text-dim);
    margin-top:10px; text-align:center;
  }
  .diagram-svg{width:100%; height:auto; display:block; max-height:460px;}

  @keyframes dashflow{ to{ stroke-dashoffset:-24; } }
  @keyframes pulseGlow{ 0%,100%{ transform:scale(1); opacity:1; } 50%{ transform:scale(1.3); opacity:0.55; } }
  .diagram-svg [marker-end="url(#ac)"],
  .diagram-svg [marker-end="url(#ao)"],
  .diagram-svg [marker-end="url(#am)"]{
    stroke-dasharray:7 6;
    animation:dashflow 1.3s linear infinite;
  }
  .diagram-svg circle[fill="#1F5FA8"],
  .diagram-svg circle[fill="#1F8A57"]{
    transform-box:fill-box; transform-origin:center;
    animation:pulseGlow 2.6s ease-in-out infinite;
  }
  @media (prefers-reduced-motion: reduce){
    .diagram-svg *{ animation:none !important; }
  }

  /* ---------- Key facts (color-coded highlights) ---------- */
  .facts{display:flex; flex-direction:column; gap:10px;}
  .fact{
    padding:11px 16px; border-radius:var(--radius);
    font-size:14.5px; color:var(--text);
    background:var(--bg-panel); border:1px solid var(--line);
    border-left:3px solid var(--line);
  }
  .fact .tag{
    font-family:'IBM Plex Mono',monospace; font-size:10.5px; font-weight:600;
    margin-right:9px; letter-spacing:0.03em;
  }
  .fact.insight{border-left-color:var(--cyan);}
  .fact.insight .tag{color:var(--cyan);}
  .fact.key{border-left-color:var(--copper);}
  .fact.key .tag{color:var(--copper);}
  .fact.caution{border-left-color:var(--caution);}
  .fact.caution .tag{color:var(--caution);}

  /* ---------- MCQ quiz ---------- */
  .mcq-score{font-family:'IBM Plex Mono',monospace; font-size:12.5px; color:var(--text-dim); margin-bottom:16px;}
  .mcq-list{display:flex; flex-direction:column; gap:18px;}
  .mcq-card{background:var(--bg-panel); border:1px solid var(--line); border-radius:var(--radius); padding:16px 18px 18px;}
  .mcq-q{font-size:15.5px; color:var(--text); margin-bottom:12px; line-height:1.55; font-weight:500;}
  .mcq-options{display:flex; flex-direction:column; gap:8px;}
  .mcq-opt{
    text-align:left; background:var(--bg-raised); border:1px solid var(--line); color:var(--text-muted);
    padding:9px 13px; border-radius:var(--radius); cursor:pointer;
    font-family:'Atkinson Hyperlegible',sans-serif; font-size:14px; transition:border-color .15s;
  }
  .mcq-opt:hover:not(.disabled){border-color:var(--copper); color:var(--text);}
  .mcq-opt.correct{border-color:var(--cyan); color:var(--cyan); background:rgba(95,184,201,0.09);}
  .mcq-opt.incorrect{border-color:var(--caution); color:var(--caution); background:rgba(217,83,79,0.09);}
  .mcq-opt.disabled{cursor:default;}
  .mcq-explain{
    margin-top:11px; padding-top:11px; border-top:1px dashed var(--line);
    font-size:13.5px; color:var(--text-dim); display:none;
  }
  .mcq-explain.show{display:block;}

  .qlist{display:flex; flex-direction:column; gap:14px;}
  .qcard{
    background:var(--bg-panel); border:1px solid var(--line); border-radius:var(--radius);
    padding:18px 20px;
  }
  .qcard .qtype{font-family:'IBM Plex Mono',monospace; font-size:11px; letter-spacing:0.05em; color:var(--big-flag); margin-bottom:8px;}
  .qcard p{margin:0; font-size:15.5px; line-height:1.6; color:var(--text);}

  .daynav{display:flex; justify-content:space-between; margin-top:52px; padding-top:24px; border-top:1px solid var(--line);}
  .daynav button{
    background:none; border:1px solid var(--line); color:var(--text-muted);
    font-family:'Atkinson Hyperlegible',sans-serif; font-size:13.5px; padding:10px 16px; border-radius:var(--radius);
    cursor:pointer;
  }
  .daynav button:hover:not(:disabled){border-color:var(--copper); color:var(--text);}
  .daynav button:disabled{opacity:0.3; cursor:default;}

  ::-webkit-scrollbar{width:10px;}
  ::-webkit-scrollbar-track{background:var(--bg-panel);}
  ::-webkit-scrollbar-thumb{background:var(--line); border-radius:6px;}

  @media (max-width:860px){
    .app{flex-direction:column;}
    .sidebar{width:100%; height:auto; position:relative; max-height:60vh;}
    main{padding:36px 22px 90px;}
    .day-title{font-size:26px;}
  }
</style>

<script>
const WEEKS = [
  {n:1, title:"Logic & Proof Foundations", range:"Days 1–5"},
  {n:2, title:"Proof Techniques, Sets & Functions", range:"Days 6–10"},
  {n:3, title:"Relations & Counting", range:"Days 11–15"},
  {n:4, title:"Graphs & Discrete Probability for ML", range:"Days 16–20"},
];

const DAYS = [
{d:1,week:1,title:"Propositional Logic — Statements & Connectives",big:false,steps:4,
diagram:"truthtable",
facts:[{tag:"KEY FACT", text:"A proposition is a declarative sentence that is exactly one of true or false -- never both, never neither."}, {tag:"CAUTION", text:"Questions, commands, and opinions ('Is it raining?', 'Close the door', 'Pizza is the best food') are NOT propositions -- they can't be assigned a truth value."}],
mcqs:[
{q:"Which of these IS a proposition?", options:["What time is it?", "Paris is the capital of France.", "Please sit down.", "This sentence is amazing!"], correct:1, explain:"It's a declarative sentence with a definite truth value (true)."},
{q:"p ∧ q is true when:", options:["p is true or q is true", "Both p and q are true", "Neither p nor q is true", "Exactly one is true"], correct:1, explain:"AND requires both operands to be true."},
{q:"¬p is true when:", options:["p is true", "p is false", "p is undefined", "Always"], correct:1, explain:"Negation flips the truth value."},
{q:"p → q is false only when:", options:["p is false", "q is true", "p is true and q is false", "p and q are both false"], correct:2, explain:"An implication only fails when the hypothesis holds but the conclusion doesn't."},
{q:"p ⊕ q (XOR) is true when:", options:["p and q have the same truth value", "p and q have different truth values", "Both are false", "Both are true"], correct:1, explain:"Exclusive OR is true exactly when the operands differ."}
],
core:"Every if-statement, every boolean flag, every digital circuit reduces to combinations of true/false statements -- propositional logic is the alphabet everything else in this course, and in software itself, is written in.",
notes:[
"A proposition is a declarative sentence that is either true or false, but not both. 'The sun is a star' is a proposition (true). 'x + 1 = 5' is NOT a proposition on its own -- its truth depends on x (this becomes a predicate, Day 3). Propositions are usually named with lowercase letters: p, q, r.",
"The five core logical connectives are: negation ¬p ('not p'), conjunction p∧q ('p and q', true only if both true), disjunction p∨q ('p or q', true if at least one is true), exclusive or p⊕q ('exactly one is true'), and the conditional p→q ('if p then q', false only when p is true and q is false).",
"The conditional p→q is the connective students most often misjudge intuitively: it is considered TRUE whenever p is false, regardless of q ('vacuously true'). Only the single combination p=true, q=false makes it false. This matches how 'if it rains, I'll bring an umbrella' isn't broken just because it didn't rain.",
"Truth tables exhaustively list every combination of input truth values and the resulting output -- for n propositions there are 2^n rows. Building the table mechanically, one connective at a time following operator precedence (¬ binds tightest, then ∧, then ∨, then →, then ↔), is the safest way to evaluate any compound proposition without error.",
"<strong>Worked example:</strong> Evaluate (p∧q)→¬r when p=T, q=T, r=F. First p∧q = T∧T = T. Then ¬r = ¬F = T. Finally T→T = T. The whole expression is true.",
"<strong>Self-check:</strong> the most common beginner error is misreading p→q as 'p if and only if q' -- always double check whether a problem means → (one-directional) or ↔ (biconditional, Day 2) before building a truth table.",
"<strong>Application:</strong> Every `if (condition)` block, every digital logic AND/OR/NOT gate on a chip, and every SQL WHERE clause is a direct, literal instance of a compound proposition being evaluated."
],
formulas:["¬p, p∧q, p∨q, p⊕q, p→q, p↔q","p→q is false only when p=T and q=F"],
questions:[
{type:"Conceptual", q:"Explain in your own words why 'if pigs can fly, then 2+2=4' is considered a TRUE proposition under formal logic, even though the statement feels absurd in everyday language."},
{type:"CS reasoning", q:"A boolean expression in code, `if (a && b) { ... }`, short-circuits: if a is false, b is never evaluated. Connect this short-circuit behavior directly to the truth table for ∧ -- why is it safe to skip evaluating q once you know p is false?"},
{type:"Reasoning", q:"How many rows does the truth table for a compound proposition with 4 distinct propositional variables have, and why does this number make truth tables impractical for very complex boolean logic (motivating the equivalence laws you'll learn on Day 2)?"}
]},

{d:2,week:1,title:"Logical Equivalences & Laws",big:false,steps:4,
diagram:{type:"conceptmap", nodes:["Expression","Apply Laws","Simplified"]},
facts:[{tag:"KEY FACT", text:"De Morgan's Laws: ¬(p∧q) ≡ ¬p∨¬q, and ¬(p∨q) ≡ ¬p∧¬q -- negation flips AND/OR and distributes inward."}, {tag:"INSIGHT", text:"A tautology is always true, a contradiction is always false, and a contingency depends on the inputs -- checking which one a formula is tells you a great deal before building a full truth table."}],
mcqs:[
{q:"Two propositions are logically equivalent (p≡q) if:", options:["They use the same variables", "They have identical truth tables", "They are both tautologies", "p implies q"], correct:1, explain:"Equivalence means matching truth values in every row."},
{q:"¬(p∧q) is equivalent to:", options:["¬p∧¬q", "¬p∨¬q", "p∨q", "p∧q"], correct:1, explain:"De Morgan's Law: negating AND gives OR of negations."},
{q:"p∨¬p is an example of a:", options:["Contradiction", "Contingency", "Tautology", "Equivalence"], correct:2, explain:"It's always true regardless of p's value (law of excluded middle)."},
{q:"p∧¬p is an example of a:", options:["Tautology", "Contradiction", "Contingency", "Biconditional"], correct:1, explain:"It's always false -- p and ¬p can never both be true."},
{q:"The Distributive Law states p∧(q∨r) is equivalent to:", options:["(p∧q)∨(p∧r)", "(p∨q)∧(p∨r)", "p∨q∨r", "¬p∨¬q"], correct:0, explain:"AND distributes over OR just like multiplication over addition."}
],
core:"Equivalence laws let you simplify a tangled boolean expression algebraically -- exactly the way you'd simplify algebra -- without ever building a truth table.",
notes:[
"Two propositions p and q are logically equivalent, written p≡q, if they have identical truth values in every possible row of their truth table. This is stronger than just 'both true right now' -- it must hold universally.",
"A small toolbox of named laws covers almost every simplification you'll need: Identity (p∧T≡p), Domination (p∨T≡T), Idempotent (p∨p≡p), Double Negation (¬¬p≡p), Commutative, Associative, Distributive, Absorption (p∨(p∧q)≡p), and De Morgan's Laws. These mirror algebraic identities closely enough that the intuition transfers directly.",
"De Morgan's Laws deserve special attention because they're the single most frequently used pair in this course: ¬(p∧q)≡¬p∨¬q and ¬(p∨q)≡¬p∧¬q. In words: negating a conjunction gives a disjunction of negations, and vice versa. This exact pattern reappears for sets (Day 9) and for quantifiers (Day 3).",
"A tautology is a compound proposition that's true in EVERY row of its truth table (e.g. p∨¬p); a contradiction is false in every row (e.g. p∧¬p); everything else is a contingency, true in some rows and false in others. Recognizing a tautology or contradiction by inspection, using the laws, is much faster than a full truth table.",
"<strong>Worked example:</strong> Simplify ¬(p∨q)∨(¬p∧q). By De Morgan: ¬p∧¬q ∨ (¬p∧q) = ¬p∧(¬q∨q) [distributive] = ¬p∧T [negation law] = ¬p. Four terms collapse to one.",
"<strong>Self-check:</strong> after simplifying, verify your result against the ORIGINAL expression using a small truth table with 2-3 rows spot-checked -- algebraic slips are common and a quick sanity check catches most of them.",
"<strong>Application:</strong> Compilers apply exactly these laws to simplify boolean conditions in your code before generating machine instructions, and digital circuit designers use them to reduce the number of physical logic gates needed on a chip."
],
formulas:["¬(p∧q) ≡ ¬p∨¬q","¬(p∨q) ≡ ¬p∧¬q","p→q ≡ ¬p∨q"],
questions:[
{type:"Conceptual", q:"Explain why proving p≡q by matching truth tables row-by-row and proving it by chaining equivalence laws are guaranteed to give the same answer, even though the two methods feel completely different."},
{type:"CS reasoning", q:"A junior developer writes `if (!(isValid && isReady))`. Using De Morgan's Law, rewrite this condition into an equivalent form without a leading negation over the whole expression, and explain why the rewritten version might be easier for a reviewer to read correctly."},
{type:"Reasoning", q:"p→q was rewritten today as ¬p∨q. Using De Morgan's Law on this new form, derive an expression for ¬(p→q), and explain in plain English what it means for an implication to be false."}
]},

{d:3,week:1,title:"Predicate Logic & Quantifiers",big:false,steps:5,
diagram:"quantifiers",
facts:[{tag:"KEY FACT", text:"∀x P(x) means 'for every x in the domain, P(x) is true'; ∃x P(x) means 'there is at least one x for which P(x) is true.'"}, {tag:"CAUTION", text:"Negating a quantifier BOTH flips it (∀↔∃) AND negates the predicate inside -- doing only one of the two is the most common student error."}],
mcqs:[
{q:"P(x) = 'x is even' is called a:", options:["Proposition", "Predicate", "Tautology", "Connective"], correct:1, explain:"A predicate's truth depends on the variable's value -- it isn't a fixed proposition until x is fixed or quantified."},
{q:"∀x∈ℤ, x²≥0 is:", options:["False, since some x makes it false", "True -- every integer squared is non-negative", "Not a proposition", "Only true for positive x"], correct:1, explain:"Squaring any real number, including integers, always yields a non-negative result."},
{q:"¬∀x P(x) is logically equivalent to:", options:["∀x ¬P(x)", "∃x ¬P(x)", "∃x P(x)", "¬∃x P(x)"], correct:1, explain:"Negating 'for all' gives 'there exists one that fails' -- flip the quantifier AND negate the predicate."},
{q:"∃x P(x) is false exactly when:", options:["P(x) is true for some x", "P(x) is false for all x", "P(x) is true for all x", "The domain is infinite"], correct:1, explain:"If no x makes P(x) true, the existential claim fails entirely."},
{q:"In ∀x∃y (x+y=0) over the integers, the order of quantifiers means:", options:["y is chosen first, then x can depend on it", "For each x, some y (which may depend on x) makes it true", "x and y must be equal", "The statement is meaningless"], correct:1, explain:"Quantifier order matters: the later-quantified variable may depend on the earlier one."}
],
core:"Predicates add variables to propositions, and quantifiers pin those variables down -- this is the exact vocabulary used to write formal specifications, loop invariants, and database queries precisely.",
notes:[
"A predicate, like P(x)='x is prime', is not a proposition by itself -- it becomes one only once x is given a specific value (P(7) is true) or bound by a quantifier. The set of values x is allowed to range over is called the domain of discourse.",
"The universal quantifier ∀x P(x) reads 'for all x, P(x)' and is true only if P holds for EVERY element of the domain -- a single counterexample makes it false. The existential quantifier ∃x P(x) reads 'there exists an x such that P(x)' and is true if AT LEAST ONE element of the domain satisfies P -- it takes just one witness to make it true.",
"Negating a quantified statement requires two simultaneous changes: flip the quantifier type (∀ becomes ∃, or vice versa) AND negate the inner predicate. So ¬∀x P(x) ≡ ∃x ¬P(x), and ¬∃x P(x) ≡ ∀x ¬P(x). This is the direct predicate-logic analogue of De Morgan's Laws from Day 2.",
"When a statement uses multiple quantifiers, their ORDER changes the meaning entirely: ∀x∃y P(x,y) ('for every x there's some y, possibly depending on x') is a fundamentally weaker claim than ∃y∀x P(x,y) ('there's a single y that works for every x'). Swapping quantifier order is one of the most common logical errors in formal writing.",
"<strong>Worked example:</strong> Translate 'every student has taken at least one CS course' with domain of students S and courses C: ∀s∈S ∃c∈C, Taken(s,c). Its negation, mechanically applying both rules: ∃s∈S ∀c∈C, ¬Taken(s,c) -- 'there is some student who has taken no CS course at all.'",
"<strong>Self-check:</strong> when negating, resist the urge to negate ONLY the quantifier or ONLY the predicate -- write both steps out explicitly until the two-step habit becomes automatic.",
"<strong>Application:</strong> Loop invariants in program verification ('∀i, 0≤i<n → arr[i] is sorted'), SQL queries with EXISTS/NOT EXISTS, and formal software specifications are all quantified predicate statements written in exactly this notation."
],

{d:4,week:1,title:"Rules of Inference & Valid Arguments",big:false,steps:4,
diagram:{type:"conceptmap", nodes:["Premises","Inference Rule","Conclusion"]},
facts:[{tag:"KEY FACT", text:"Modus Ponens: from p and p→q, you may validly conclude q. It is the single most-used inference rule in all of mathematics and programming."}, {tag:"CAUTION", text:"Affirming the consequent (from q and p→q, concluding p) is a classic FALLACY, not a valid rule -- q being true doesn't mean p caused it."}],
mcqs:[
{q:"Modus Ponens has the form:", options:["p, p→q ⊢ q", "q, p→q ⊢ p", "¬p, p→q ⊢ ¬q", "p∨q, ¬p ⊢ q"], correct:0, explain:"From p and p implies q, conclude q."},
{q:"Modus Tollens has the form:", options:["p, p→q ⊢ q", "¬q, p→q ⊢ ¬p", "p, q ⊢ p∧q", "p→q, q→r ⊢ p→r"], correct:1, explain:"From ¬q and p implies q, conclude ¬p -- reasoning backward along the implication."},
{q:"'From p→q and q→r, conclude p→r' is:", options:["Disjunctive Syllogism", "Hypothetical Syllogism", "Modus Tollens", "A fallacy"], correct:1, explain:"Chaining two implications transitively is Hypothetical Syllogism."},
{q:"An argument is called VALID when:", options:["Its conclusion is true", "Its premises are all true", "The conclusion necessarily follows whenever the premises are true", "It uses modus ponens specifically"], correct:2, explain:"Validity is about the logical structure, not whether the premises happen to be true in reality."},
{q:"'From p∨q and ¬p, conclude q' is:", options:["Disjunctive Syllogism", "Modus Ponens", "A fallacy called affirming the consequent", "Hypothetical Syllogism"], correct:0, explain:"If at least one of p,q holds and p is ruled out, q must hold."}
],
core:"Inference rules formalize exactly what it means for 'the conclusion to follow' from premises -- the same rigor that lets a compiler or a theorem prover check an argument mechanically, with zero appeal to intuition.",
notes:[
"An argument consists of premises (assumed true) and a conclusion claimed to follow from them. The argument is VALID if the conclusion is guaranteed true whenever all premises are true -- validity is entirely about logical FORM, independent of whether the premises are actually true in the real world.",
"The core rules of inference include: Modus Ponens (p, p→q ⊢ q), Modus Tollens (¬q, p→q ⊢ ¬p), Hypothetical Syllogism (p→q, q→r ⊢ p→r), and Disjunctive Syllogism (p∨q, ¬p ⊢ q). Each can be verified as valid by checking that its corresponding conditional is a tautology.",
"Two classic FALLACIES look deceptively similar to valid rules: affirming the consequent (from q and p→q, wrongly concluding p) and denying the antecedent (from ¬p and p→q, wrongly concluding ¬q). Both fail because p→q says nothing about what happens when p is false or when q is true independently.",
"<strong>Worked example:</strong> Given 'if the code compiles, then tests can run' (p→q) and 'tests did NOT run' (¬q), Modus Tollens validly concludes 'the code did not compile' (¬p) -- without ever needing to check the compiler directly.",
"<strong>Self-check:</strong> before applying a rule, write the premises in EXACT p→q form first -- misidentifying which side is the hypothesis and which is the conclusion is what usually causes a valid-looking argument to actually be a fallacy.",
"<strong>Application:</strong> Automated theorem provers, SAT solvers, and static analysis tools that catch bugs before runtime all mechanically chain these exact inference rules to verify that a program's logic holds -- there's no 'common sense' step involved anywhere in the process."
],
formulas:["Modus Ponens: p, p→q ⊢ q","Modus Tollens: ¬q, p→q ⊢ ¬p","Hypothetical Syllogism: p→q, q→r ⊢ p→r"],

{type:"Reasoning", q:"Modus Ponens and Modus Tollens both start from the same conditional p→q, but reason in opposite directions. Explain, in terms of the conditional's truth table, why exactly these two directions are valid while affirming the consequent and denying the antecedent are not."}
]},

{d:5,week:1,title:"Proof Techniques I — Direct Proof & Contrapositive",big:false,steps:5,
diagram:{type:"conceptmap", nodes:["Assume p","Logical steps","Conclude q"]},
facts:[{tag:"KEY FACT", text:"A direct proof of p→q assumes p is true and derives q through a valid chain of logical steps -- no shortcuts, no assumed conclusions."}, {tag:"INSIGHT", text:"Since p→q ≡ ¬q→¬p (Day 2), proving the CONTRAPOSITIVE is a fully legitimate proof of the original statement -- and is often algebraically easier."}],
mcqs:[
{q:"A direct proof of p→q begins by:", options:["Assuming q is false", "Assuming p is true", "Assuming the conclusion", "Listing all cases"], correct:1, explain:"Direct proof assumes the hypothesis and derives the conclusion."},
{q:"The contrapositive of p→q is:", options:["q→p", "¬p→¬q", "¬q→¬p", "p→¬q"], correct:2, explain:"Contrapositive negates and swaps both sides."},
{q:"The contrapositive of a true implication is:", options:["Always false", "Always true (logically equivalent)", "Sometimes true", "Undefined"], correct:1, explain:"p→q and ¬q→¬p are logically equivalent, so proving one proves the other."},
{q:"Proving 'if n² is even then n is even' is typically easier using:", options:["Direct proof", "The contrapositive: if n is odd then n² is odd", "Proof by exhaustion only", "It cannot be proven"], correct:1, explain:"Starting from 'n is odd' gives an algebraic form (2k+1) that's easy to square directly."},
{q:"The CONVERSE of p→q is:", options:["¬p→¬q", "q→p", "¬q→¬p", "The same as p→q"], correct:1, explain:"The converse swaps p and q but does NOT negate -- and is logically independent of the original."}
],
core:"Proofs are the 'unit tests' of mathematics -- a claim isn't accepted as fact until it survives an airtight chain of logical justification, and direct/contrapositive proofs are the two most common ways to build that chain.",
notes:[
"A direct proof of 'if p then q' assumes p is true, then uses definitions, algebra, and previously established facts to derive q through a chain of valid logical steps -- every line must follow necessarily from the lines before it, with no gaps.",
"Since p→q is logically equivalent to its contrapositive ¬q→¬p (established via De Morgan's-style reasoning on Day 2), you may prove ¬q→¬p directly instead and it counts as a complete, valid proof of the original statement. This swap is purely a proof STRATEGY, not a different claim.",
"The contrapositive is often preferred when the hypothesis p is awkward to work with algebraically but its negation ¬p is clean. The classic example: proving 'n² even ⟹ n even' directly requires reasoning backward from an even square root, which is clumsy; proving the contrapositive 'n odd ⟹ n² odd' starts from n=2k+1, a clean algebraic form to square.",
"It's critical NOT to confuse the contrapositive (¬q→¬p, equivalent to the original) with the converse (q→p, a completely different and generally NOT equivalent claim) -- 'if it rained, the ground is wet' does not mean 'if the ground is wet, it rained' (a sprinkler could be the cause).",
"<strong>Worked example:</strong> Prove 'if n is odd, then n² is odd' (used as the contrapositive lemma above) directly: assume n is odd, so n=2k+1 for some integer k. Then n²=(2k+1)²=4k²+4k+1=2(2k²+2k)+1, which is of the form 2m+1 -- therefore n² is odd. QED.",
"<strong>Self-check:</strong> after finishing a proof, reread it line by line asking 'does this line follow strictly from the previous ones, or did I just assume what I was trying to prove?' -- circular reasoning is the most common flaw in student-written direct proofs.",
"<strong>Application:</strong> Proving an algorithm is correct -- 'if the input array is sorted (p), then binary search returns the correct index (q)' -- is exactly a direct or contrapositive proof, and is the rigorous foundation behind claims like 'this sorting function always works.'"
],
formulas:["Direct proof: assume p, derive q","Contrapositive: p→q ≡ ¬q→¬p (prove the latter to establish the former)"],
questions:[
{type:"Conceptual", q:"Explain precisely why proving the contrapositive ¬q→¬p constitutes a fully valid proof of p→q, rather than merely a proof of something 'similar' to it."},
{type:"CS reasoning", q:"A function's specification says 'if the input list is empty (p), the function returns null (q).' Write out the converse and the contrapositive of this specification, and explain which of the two (if either) a test suite verifying 'if the function did NOT return null, the input was NOT empty' is actually checking."},
{type:"Reasoning", q:"Describe a mathematical claim (different from the n²-even example above) where you'd expect a DIRECT proof to be easier than its contrapositive, and explain what property of the hypothesis makes direct proof the better choice there."}
]},

{d:6,week:2,title:"Proof by Contradiction & Proof by Cases",big:false,steps:5,
diagram:{type:"conceptmap", nodes:["Assume ¬(claim)","Derive","Contradiction"]},
facts:[{tag:"KEY FACT", text:"Proof by contradiction assumes the NEGATION of what you want to prove, then derives an impossible statement (like 0=1) -- forcing the assumption to be false."}, {tag:"CAUTION", text:"Proof by cases is only valid if the cases are EXHAUSTIVE -- covering every possibility -- even if they are not mutually exclusive."}],
mcqs:[
{q:"Proof by contradiction begins by assuming:", options:["The hypothesis is true", "The conclusion is true", "The negation of the statement to be proved", "Nothing -- it starts from a known theorem"], correct:2, explain:"You assume the claim is false and derive an impossibility."},
{q:"The classic proof that √2 is irrational uses:", options:["Direct proof", "Proof by contradiction", "Proof by induction", "Proof by cases"], correct:1, explain:"It assumes √2=a/b in lowest terms and derives a contradiction about a and b's parity."},
{q:"Proof by cases requires the cases to be:", options:["Mutually exclusive only", "Exhaustive (covering every possibility)", "Exactly two in number", "Ordered numerically"], correct:1, explain:"Missing even one possible case invalidates the proof."},
{q:"In the √2 proof, the contradiction reached is:", options:["a and b are both even, contradicting 'lowest terms'", "a=b", "a is negative", "b=0"], correct:0, explain:"Both a and b turning out even contradicts the assumption that a/b was already fully reduced."},
{q:"'For any integer n, n is even or n is odd' followed by separate reasoning for each is an example of:", options:["Contradiction", "Proof by cases", "Contrapositive", "Induction"], correct:1, explain:"Splitting into exhaustive sub-cases (even/odd) and proving each is proof by cases."}
],
core:"Contradiction and cases round out the core proof toolkit -- contradiction handles claims with no obvious direct path (like irrationality), while cases break a messy general claim into a handful of clean, exhaustive sub-problems.",
notes:[
"A proof by contradiction assumes the NEGATION of the statement you want to prove is true, then reasons validly from that assumption until reaching something logically impossible (like 0=1, or 'a is both even and odd'). Since valid reasoning can never derive a contradiction from a TRUE assumption, the assumption must have been false -- so the original statement is true.",
"The most famous example is the irrationality of √2: assume √2=a/b in lowest terms (gcd(a,b)=1). Squaring gives a²=2b², so a² is even, so a is even (Day 5's contrapositive lemma), so a=2k. Substituting: 4k²=2b² → b²=2k², so b is also even -- contradicting that a/b was in lowest terms. Therefore √2 cannot be rational.",
"A proof by cases splits the domain into two or more sub-cases that together cover EVERY possibility (exhaustive), proves the claim separately within each case, and concludes the claim holds overall. A classic example: proving n²+n is always even by splitting into 'n is even' and 'n is odd' and handling each algebraically.",
"The single requirement that makes or breaks a cases proof is exhaustiveness -- if there's a possibility your cases don't cover (a missing third option, or an edge case like n=0), the entire proof is invalid, no matter how carefully each individual case was handled.",
"<strong>Worked example (cases):</strong> Prove n²+n is even for all integers n. Case 1: n even, so n=2k; n²+n=4k²+2k=2(2k²+k), even. Case 2: n odd, so n=2k+1; n²+n=(2k+1)²+(2k+1)=4k²+6k+2=2(2k²+3k+1), even. Both cases (which are exhaustive -- every integer is even or odd) give an even result, so the claim holds for all n.",
"<strong>Self-check:</strong> before finalizing a cases proof, explicitly list your cases and verify out loud that they cover EVERY input in the domain -- don't rely on 'obviously' the cases are complete.",
"<strong>Application:</strong> Case analysis is the backbone of algorithm correctness proofs that must handle several distinct input shapes (empty list, single element, general list), and contradiction is the standard technique for proving impossibility results in complexity theory (e.g., 'no algorithm can sort in better than O(n log n) comparisons' style arguments)."
],
formulas:["Contradiction: assume ¬claim, derive a falsehood ⟹ claim is true","Cases: prove claim in each of finitely many exhaustive cases ⟹ claim holds generally"],
questions:[
{type:"Conceptual", q:"Explain, using the logical structure of the argument (not just the √2 example itself), WHY deriving a contradiction from an assumption is enough to prove that assumption false."},
{type:"CS reasoning", q:"You're asked to prove a function `abs(x)` always returns a non-negative value for any integer input x. Sketch how you'd structure this as a proof by cases, identifying what the exhaustive cases should be."},
{type:"Reasoning", q:"Could the irrationality of √2 be proven using a DIRECT proof instead of contradiction? Explain what makes 'irrational' an awkward property to establish directly, and why contradiction sidesteps that difficulty."}
]},

{d:7,week:2,title:"Mathematical Induction",big:true,steps:6,
diagram:"staircase",
facts:[{tag:"KEY FACT", text:"Induction has two parts: a Base Case (verify P(1), or the smallest case) and an Inductive Step (assume P(k) is true, prove P(k+1) follows)."}, {tag:"INSIGHT", text:"Strong induction assumes P is true for ALL of 1,2,...,k, not just P(k) alone -- strictly more powerful, needed whenever P(k+1) depends on more than just the immediately preceding case."}],
mcqs:[
{q:"The two required parts of a standard induction proof are:", options:["Base case and inductive step", "Direct proof and contradiction", "Two exhaustive cases", "Contrapositive and converse"], correct:0, explain:"Verify the smallest case, then show each case implies the next."},
{q:"The inductive step proves:", options:["P(1) directly", "P(k) is true for a specific k", "P(k)→P(k+1) for arbitrary k", "P(n) for the largest n"], correct:2, explain:"You assume P(k) (the inductive hypothesis) and derive P(k+1)."},
{q:"Skipping the base case in an induction proof:", options:["Is fine if the inductive step is correct", "Invalidates the entire proof, even with a correct inductive step", "Only matters for large n", "Is required for strong induction only"], correct:1, explain:"Without an anchor, the inductive chain P(k)→P(k+1) never actually starts."},
{q:"Strong induction differs from weak induction in that:", options:["It doesn't need a base case", "The inductive hypothesis assumes P(1) through P(k), not just P(k)", "It only works for even n", "It proves a different kind of statement entirely"], correct:1, explain:"Strong induction gives access to ALL previous cases, not just the immediately preceding one."},
{q:"Induction is most naturally suited to proving statements about:", options:["A single fixed number", "All real numbers", "All natural numbers ≥ some starting point", "Only prime numbers"], correct:2, explain:"Induction climbs a 'staircase' of naturals one integer step at a time."}
],
core:"Recursion and induction are two sides of the same coin -- every recursive algorithm's correctness proof is, structurally, an induction proof, which is exactly why this topic matters so much for CS beyond pure math.",
notes:[
"Mathematical induction proves a statement P(n) holds for ALL natural numbers n≥n0 using two pieces: the BASE CASE, which directly verifies P(n0) is true, and the INDUCTIVE STEP, which proves the conditional P(k)→P(k+1) for an arbitrary k≥n0 (assuming P(k), called the inductive hypothesis, and deriving P(k+1) from it).",
"Think of it as an infinite staircase: the base case gets you onto the first step, and the inductive step is a general rule guaranteeing that if you're standing on any step k, you can always climb to step k+1. Together, these two facts guarantee you can reach every single step, no matter how high.",
"STRONG induction is a variant where the inductive hypothesis assumes P is true for ALL of n0,n0+1,...,k (not merely P(k) alone) when proving P(k+1). This extra assumed power is essential whenever the (k+1)-th case genuinely depends on an earlier case that isn't simply k (e.g. proofs about Fibonacci-like recurrences, or that every integer >1 has a prime factorization).",
"A base case is not optional busywork -- omitting it (or getting it wrong) invalidates the ENTIRE proof, because the inductive step alone only proves a chain of IMPLICATIONS (P(1)→P(2)→P(3)→...) without ever establishing that the first link, P(1), is actually true.",
"<strong>Worked example:</strong> Prove 1+2+...+n = n(n+1)/2 for all n≥1. Base case (n=1): LHS=1, RHS=1(2)/2=1. ✓. Inductive step: assume 1+2+...+k=k(k+1)/2 (hypothesis). Then 1+2+...+k+(k+1) = k(k+1)/2+(k+1) = (k+1)(k/2+1) = (k+1)(k+2)/2, which is exactly the formula evaluated at n=k+1. Both parts hold, so the formula is true for all n≥1 by induction.",
"<strong>Self-check:</strong> in the inductive step, always write out explicitly WHERE you used the inductive hypothesis -- if your derivation of P(k+1) never actually invoked the assumption P(k), you haven't done induction at all, just a direct proof of one instance.",
"<strong>Application:</strong> Proving a recursive function terminates with the correct output (e.g. that a recursive factorial or a recursive tree-traversal is correct for every input size) is structurally identical to an induction proof: verify the base case (smallest input) and show correctness for size k implies correctness for size k+1."
],
formulas:["P(n0) ∧ [∀k≥n0, P(k)→P(k+1)]  ⟹  ∀n≥n0, P(n)","1+2+...+n = n(n+1)/2"],
questions:[

{type:"CS reasoning", q:"A recursive function `sum(n)` returns 0 if n=0, and otherwise returns n+sum(n-1). Sketch how you would structure an induction proof that `sum(n)` correctly computes 1+2+...+n, identifying the base case and what the inductive step needs to show."},
{type:"Reasoning", q:"Give an example of a claim about integers where you would need STRONG induction rather than ordinary (weak) induction, and explain specifically what the inductive step would need to assume that weak induction wouldn't give you."}
]},

{d:8,week:2,title:"Set Theory Basics",big:false,steps:4,
diagram:"sets",
facts:[{tag:"KEY FACT", text:"A set is an unordered collection of DISTINCT elements -- {1,2,3} and {3,1,2} are the same set, and {1,1,2} is just {1,2}."}, {tag:"CAUTION", text:"∈ (element of) and ⊆ (subset of) are different relations: 2∈{1,2,3} is true, but {2}⊆{1,2,3} is the correct way to say a SET containing 2 is a subset."}],

{q:"If A={1,2}, which is TRUE?", options:["1⊆A", "{1}∈A", "{1}⊆A", "A∈A"], correct:2, explain:"{1} is a subset of A (its single element, 1, is in A); 1 itself is an element, not a subset."},
{q:"The empty set ∅ is:", options:["Not a valid set", "A subset of every set, including itself", "Only a subset of itself", "The same as {0}"], correct:1, explain:"Vacuously, every element of ∅ (there are none) is in any set, so ∅⊆S for all S."},
{q:"If |S|=n, then |P(S)| (the power set) equals:", options:["n", "n²", "2^n", "n!"], correct:2, explain:"Each of the n elements is independently either in or out of a given subset, giving 2^n total subsets."},
{q:"A PROPER subset A⊊B means:", options:["A=B", "A⊆B and A≠B", "A has more elements than B", "A and B share no elements"], correct:1, explain:"Proper subset excludes the case of full equality."}
],
core:"Sets are the universal data structure underlying essentially all of mathematics -- and they map directly onto core CS data types: a Python/Java Set, a database's distinct rows, and a search space are all literal sets.",
notes:[
"A set is an unordered collection of DISTINCT elements, written with curly braces, e.g. A={2,4,6,8}. Order doesn't matter ({1,2}={2,1}) and duplicates collapse ({1,1,2}={1,2}) -- this is the defining difference between a set and a list or array in programming.",
"Membership is written x∈A ('x is an element of A') or x∉A. The SUBSET relation A⊆B means every element of A is also an element of B; this is a relation between two SETS, distinct from ∈ which relates an element to a set -- confusing the two is the most common notation error at this stage.",
"Every set has an associated power set P(S): the set of ALL possible subsets of S, including the empty set ∅ and S itself. If |S|=n (n elements), then |P(S)|=2^n, because each of the n elements independently either belongs to a given subset or doesn't -- n independent binary choices.",
"The empty set ∅ (containing zero elements) is a subset of every set, including itself -- this holds VACUOUSLY: the subset condition 'every element of ∅ is in S' is automatically true because ∅ has no elements to check.",
"<strong>Worked example:</strong> For S={a,b,c}, the power set is P(S)={∅, {a}, {b}, {c}, {a,b}, {a,c}, {b,c}, {a,b,c}} -- exactly 2³=8 subsets, matching the formula.",
"<strong>Self-check:</strong> when writing a subset relation, always ask 'am I comparing an element to a set (use ∈) or a set to a set (use ⊆)?' -- writing 2⊆{1,2,3} or {2}∈{1,2,3} are both type errors, even though they 'look' similar to correct statements.",
"<strong>Application:</strong> The `set` data type in Python/Java, and the DISTINCT keyword in SQL, both implement exactly the mathematical set abstraction -- automatic deduplication and no inherent ordering -- which is why set operations (Day 9) map so directly onto real code."
],

{d:9,week:2,title:"Set Operations & Venn Diagrams",big:false,steps:4,
diagram:"venn",
facts:[{tag:"KEY FACT", text:"De Morgan's Laws for sets mirror De Morgan's Laws for logic exactly: (A∪B)' = A'∩B', and (A∩B)' = A'∪B'."}, {tag:"INSIGHT", text:"Union (∪), intersection (∩), difference (−), and complement (') on sets correspond directly to OR, AND, AND-NOT, and NOT on the predicates defining set membership."}],
mcqs:[
{q:"A∪B (union) contains:", options:["Only elements in both A and B", "Elements in A, in B, or in both", "Only elements in A but not B", "The empty set always"], correct:1, explain:"Union combines everything from either set."},
{q:"A∩B (intersection) contains:", options:["Elements in either A or B", "Only elements in BOTH A and B", "Elements in A only", "Elements not in A or B"], correct:1, explain:"Intersection keeps only the shared elements."},
{q:"A−B (set difference) contains:", options:["Elements in A but not in B", "Elements in B but not in A", "Elements in both A and B", "All elements not in A or B"], correct:0, explain:"Difference removes B's elements from A."},
{q:"(A∪B)' (De Morgan's for sets) equals:", options:["A'∪B'", "A'∩B'", "A∩B", "A∪B"], correct:1, explain:"Complement of a union is the intersection of complements."},
{q:"In a Venn diagram, the overlapping region of two circles represents:", options:["A∪B", "A∩B", "A−B", "The universal set"], correct:1, explain:"The shared, overlapping area is exactly the intersection."}
],
core:"Set operations are not just diagrams -- SQL's JOIN, UNION, and INTERSECT clauses are literal, direct implementations of ∩, ∪, and − on database tables treated as sets of rows.",
notes:[
"The core set operations are: union A∪B={x : x∈A or x∈B}, intersection A∩B={x : x∈A and x∈B}, difference A−B={x : x∈A and x∉B}, and complement A'={x∈U : x∉A} (relative to some universal set U). Each mirrors a logical connective applied to the membership predicates.",
"Venn diagrams visualize these operations as overlapping circles inside a rectangle representing the universal set U: union shades everything covered by either circle, intersection shades only the overlap, difference shades one circle with the overlap removed, and complement shades everything OUTSIDE a circle.",
"De Morgan's Laws for sets, (A∪B)'=A'∩B' and (A∩B)'=A'∪B', are not a coincidental naming choice -- they follow directly from De Morgan's Laws for logic (Day 2), because 'x∈(A∪B)'' unpacks to '¬(x∈A ∨ x∈B)', which is logically ¬(x∈A)∧¬(x∈B) by the exact same law.",
"Two sets are called DISJOINT if A∩B=∅ (they share no elements at all) -- a common and useful special case, especially when partitioning a set into non-overlapping groups (a preview of equivalence classes in later coursework).",
"<strong>Worked example:</strong> Let A={1,2,3,4}, B={3,4,5,6}, U={1,...,8}. Then A∪B={1,2,3,4,5,6}, A∩B={3,4}, A−B={1,2}, and A'={5,6,7,8} (relative to U).",
"<strong>Self-check:</strong> when computing A−B by hand, go element-by-element through A ONLY, checking each against B -- do not accidentally start from B, which is a common source of reversed-difference errors.",
"<strong>Application:</strong> SQL's `UNION`, `INTERSECT`, and `EXCEPT`/`MINUS` clauses combine query result sets using exactly these set operations, and database query optimizers apply De Morgan-style rewriting to simplify complex WHERE clause conditions before execution."
],
formulas:["(A∪B)' = A'∩B'","(A∩B)' = A'∪B'","A−B = A∩B'"],
