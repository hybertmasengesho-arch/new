]},

{d:10,week:2,title:"Functions — Injective, Surjective, Bijective",big:true,steps:7,
diagram:"functionmap",
facts:[{tag:"KEY FACT", text:"Injective (one-to-one): no two distinct inputs map to the same output. Surjective (onto): every element of the codomain is hit by some input."}, {tag:"CAUTION", text:"Bijective requires BOTH injective AND surjective simultaneously -- a function can be one without being the other, and only a bijection has a true inverse function."}],
mcqs:[
{q:"A function f:A→B is injective if:", options:["Every element of B is hit", "f(x1)=f(x2) implies x1=x2", "A and B have the same size", "f is defined for all of A"], correct:1, explain:"Injective means distinct inputs always give distinct outputs."},
{q:"A function f:A→B is surjective if:", options:["No two inputs share an output", "Every element of B has at least one preimage in A", "f is one-to-one", "A is a subset of B"], correct:1, explain:"Surjective (onto) means the entire codomain is covered by the function's range."},
{q:"A bijective function has an inverse function that:", options:["Only exists sometimes", "Always exists and is itself a well-defined function", "Is never injective", "Only exists if A=B"], correct:1, explain:"Bijectivity is exactly the condition needed to guarantee a well-defined, unique inverse."},
{q:"f(x)=x² from ℝ to ℝ (all reals) is:", options:["Injective and surjective", "Injective only", "Neither injective nor surjective", "Surjective only"], correct:2, explain:"Not injective (f(2)=f(-2)=4) and not surjective (negative numbers are never hit)."},
{q:"A hash function that maps two different inputs to the same output hash has failed to be:", options:["Surjective", "A function at all", "Injective (this is called a collision)", "Well-defined"], correct:2, explain:"Mapping distinct inputs to the same output is precisely a failure of injectivity."}
],
core:"Hash functions, encryption schemes, and whether a data transformation can be reversed all hinge directly on whether a function is injective, surjective, or both -- this closes out the two-week foundations sequence by tying logic, proof, and sets together in one working object.",
notes:[
"A function f:A→B assigns to EVERY element of the domain A exactly one element of the codomain B. The RANGE (or image) of f is the subset of B actually hit by some input -- {f(x) : x∈A} -- which may be smaller than the full codomain B.",
"f is INJECTIVE (one-to-one) if distinct inputs always produce distinct outputs: formally, f(x1)=f(x2) ⟹ x1=x2 (equivalently, its contrapositive: x1≠x2 ⟹ f(x1)≠f(x2)). f is SURJECTIVE (onto) if every element of B is the image of at least one element of A -- the range equals the full codomain, with nothing in B left unreached.",
"f is BIJECTIVE only when it is BOTH injective and surjective at once -- every element of B is hit by EXACTLY one element of A, no more and no fewer. This exact-pairing property is what guarantees a well-defined inverse function f⁻¹:B→A exists, since every b∈B can be traced back to precisely one unambiguous a∈A.",
"These properties are independent: a function can be injective without being surjective (e.g. f(x)=2x from ℤ to ℤ hits only even numbers, missing odds, so not surjective, but distinct inputs never collide), or surjective without injective (e.g. f(x)=⌊x/2⌋ hits every integer, but many inputs share an output).",
"<strong>Worked example:</strong> Let f:ℤ→ℤ, f(x)=x+3. Injective? Yes: x1+3=x2+3 ⟹ x1=x2. Surjective? Yes: for any y∈ℤ, x=y−3 gives f(x)=y. So f is bijective, and its inverse is f⁻¹(y)=y−3.",
"<strong>Self-check:</strong> to disprove injectivity, it's enough to find ONE pair of distinct inputs with equal outputs; to disprove surjectivity, find ONE codomain element with no preimage at all -- a single counterexample settles either question, no exhaustive check needed.",
"<strong>Application:</strong> A cryptographic hash function is deliberately designed to make finding injectivity failures (collisions) computationally infeasible; a well-formed encryption scheme must be a BIJECTION on its message space so that every ciphertext decrypts back to exactly one unambiguous original message."
],
formulas:["Injective: f(x1)=f(x2) ⟹ x1=x2","Surjective: ∀b∈B, ∃a∈A, f(a)=b","Bijective ⟺ f⁻¹ exists and is a function"],
questions:[
{type:"Conceptual", q:"Explain why bijectivity -- rather than injectivity or surjectivity alone -- is the exact condition required for an inverse FUNCTION (not just an inverse relation) to exist."},
{type:"CS reasoning", q:"A hash table implementation experiences a 'collision' when two different keys hash to the same bucket. Explain this phenomenon precisely in terms of injectivity, and describe why NO practical hash function mapping a large key space to a small bucket space can ever be fully injective (hint: think about relative sizes of domain and codomain)."},
{type:"Reasoning", q:"Across Days 1–10, trace the throughline from propositional logic (Day 1) to functions (today): explain in a few sentences how quantifiers (Day 3), proof techniques (Days 5–6), and sets (Days 8–9) were all necessary tools used to even STATE the formal definitions of injective and surjective given today."}
]},

{d:11,week:3,title:"Relations — Properties & Representations",big:false,steps:4,
diagram:"relationmatrix",
facts:[{tag:"KEY FACT", text:"A relation R from A to B is just a subset of the Cartesian product A×B -- a set of ordered pairs. A relation on A alone is a subset of A×A."}, {tag:"CAUTION", text:"Symmetric and antisymmetric are NOT opposites -- a relation can be neither, and the identity relation is both at once."}],
mcqs:[
{q:"A relation R on set A is REFLEXIVE if:", options:["(a,a)∈R for every a∈A", "(a,b)∈R implies (b,a)∈R", "R is empty", "R=A×A"], correct:0, explain:"Every element must relate to itself."},
{q:"R is SYMMETRIC if:", options:["(a,b)∈R implies (b,a)∈R", "(a,a)∈R for all a", "(a,b)∈R and (b,a)∈R implies a=b", "R is a function"], correct:0, explain:"The relation works equally in both directions."},
{q:"R is TRANSITIVE if:", options:["(a,b)∈R implies (b,a)∈R", "(a,b)∈R and (b,c)∈R implies (a,c)∈R", "Every element relates to itself", "R has no cycles"], correct:1, explain:"Chains of relatedness must close up directly."},
{q:"A relation can be represented as an n×n matrix where entry (i,j)=1 means:", options:["Element i equals element j", "(ai,aj)∈R", "i and j are both in A", "The relation is reflexive"], correct:1, explain:"The matrix directly encodes which ordered pairs belong to R."},
{q:"'≤' on the real numbers is:", options:["Reflexive, antisymmetric, transitive", "Symmetric only", "Neither reflexive nor transitive", "Only defined on integers"], correct:0, explain:"a≤a always; a≤b and b≤a force a=b; a≤b≤c gives a≤c."}
],
core:"A relation is simply a set of ordered pairs -- but classifying it by reflexivity, symmetry, and transitivity is exactly what distinguishes 'similarity' relations (used for clustering) from 'ordering' relations (used for ranking), a distinction machine learning systems depend on constantly.",
notes:[
"Formally, a relation R from set A to set B is any subset of the Cartesian product A×B={(a,b) : a∈A, b∈B}. When A=B, we call R a relation ON A. Writing (a,b)∈R is often shortened to aRb.",
"Three properties classify most relations you'll encounter: REFLEXIVE (every a relates to itself: (a,a)∈R for all a∈A), SYMMETRIC ((a,b)∈R implies (b,a)∈R -- the relation is direction-blind), and TRANSITIVE ((a,b)∈R and (b,c)∈R implies (a,c)∈R -- chains close up).",
"A separate, distinct property is ANTISYMMETRIC: (a,b)∈R and (b,a)∈R implies a=b. Note this does NOT mean 'not symmetric' -- antisymmetry only forbids symmetric pairs between DISTINCT elements; a=b pairs are allowed freely. '≤' is antisymmetric (a≤b and b≤a forces a=b) while also being reflexive and transitive.",
"Relations can be represented two equivalent ways: as an n×n zero-one MATRIX (entry (i,j)=1 iff (ai,aj)∈R) or as a DIRECTED GRAPH (an arrow from ai to aj iff (ai,aj)∈R). Reflexivity shows up as a diagonal of all 1s (or self-loops on every node); symmetry shows up as a matrix equal to its own transpose.",
"<strong>Worked example:</strong> Let A={1,2,3} and R={(1,1),(2,2),(3,3),(1,2),(2,1)}. R is reflexive (all three self-pairs present), symmetric ((1,2) and (2,1) both present), but NOT transitive-testable trivially here since it already satisfies it vacuously beyond the given pairs -- checking (1,2)&(2,1)⟹(1,1)✓ confirms transitivity holds too.",
"<strong>Self-check:</strong> when checking transitivity, you must verify EVERY chain (a,b),(b,c) in R actually has (a,c) also in R -- finding just one broken chain disproves transitivity entirely, the same 'one counterexample suffices' logic from Day 8's subset reasoning.",
"<strong>Application:</strong> A recommendation system's 'users who bought X also bought Y' relation, and a similarity matrix used in nearest-neighbor search or attention mechanisms, are both literally relations on a set -- and whether that relation is symmetric determines whether 'A is similar to B' automatically implies 'B is similar to A.'"
],
formulas:["R ⊆ A×A","Reflexive: ∀a, (a,a)∈R","Transitive: (a,b)∈R ∧ (b,c)∈R ⟹ (a,c)∈R"],
questions:[
{type:"Conceptual", q:"Explain why antisymmetric and symmetric are not opposite properties, giving an example of a relation that is neither symmetric nor antisymmetric."},
{type:"CS reasoning", q:"A social network's 'follows' relation is generally NOT symmetric (you can follow someone who doesn't follow back), while a 'friends with' relation typically IS symmetric. Explain how this distinction would change the adjacency matrix representation of each relation."},
{type:"Reasoning", q:"A cosine-similarity matrix between embedding vectors is always symmetric (sim(a,b)=sim(b,a)) and reflexive (sim(a,a)=1 maximal). Is it typically transitive? Explain with an intuitive example why 'A similar to B' and 'B similar to C' does not generally guarantee 'A similar to C.'"}
]},

{d:12,week:3,title:"Equivalence Relations & Partitions",big:false,steps:4,
diagram:"partition",
facts:[{tag:"KEY FACT", text:"An equivalence relation is reflexive, symmetric, AND transitive all at once -- it formally captures the idea of 'being the same in some respect.'"}, {tag:"INSIGHT", text:"Every equivalence relation on a set A corresponds EXACTLY to a partition of A into disjoint, non-overlapping equivalence classes -- the two ideas are mathematically interchangeable."}],
mcqs:[
{q:"An equivalence relation must be:", options:["Reflexive and symmetric only", "Reflexive, symmetric, and transitive", "Antisymmetric and transitive", "Just transitive"], correct:1, explain:"All three properties together define an equivalence relation."},
{q:"An equivalence CLASS of an element a, written [a], contains:", options:["Only a itself", "All elements related to a by R", "All elements of A", "Nothing, unless a=0"], correct:1, explain:"[a]={x∈A : xRa}, everything 'equivalent' to a."},
{q:"A partition of a set A is a collection of subsets that are:", options:["Overlapping and covering A", "Disjoint and their union equals A", "All the same size", "Ordered by size"], correct:1, explain:"Non-overlapping subsets whose union recovers the whole set."},
{q:"'Has the same remainder mod 3' on the integers is an equivalence relation with how many equivalence classes?", options:["1", "2", "3", "Infinitely many"], correct:2, explain:"Remainders 0, 1, 2 mod 3 give exactly three classes."},
{q:"If a and b are in the same equivalence class under R, then:", options:["a=b necessarily", "aRb holds", "a and b are unrelated", "R is not an equivalence relation"], correct:1, explain:"Being in the same class is defined precisely by being related."}
],
core:"Equivalence relations are the mathematical backbone of clustering: every clustering algorithm implicitly defines (or approximates) an equivalence relation on the data, and the resulting clusters ARE the equivalence classes.",
notes:[
"An EQUIVALENCE RELATION is a relation that is simultaneously reflexive, symmetric, AND transitive. It formalizes the everyday idea of 'these things are the same in some specific sense' -- equality itself is the simplest example, but many other relations (same parity, same remainder, same length, same cluster) also qualify.",
"Given an equivalence relation R on A, the EQUIVALENCE CLASS of an element a, written [a], is the set of all elements related to a: [a]={x∈A : xRa}. A cornerstone theorem states that any two equivalence classes are either IDENTICAL or completely DISJOINT -- never partially overlapping.",
"This non-overlapping property means the full collection of equivalence classes forms a PARTITION of A: a set of pairwise disjoint, non-empty subsets whose union is all of A. Conversely, ANY partition of A defines a valid equivalence relation (put a and b in relation iff they're in the same block of the partition) -- equivalence relations and partitions are two views of the exact same structure.",
"This is a genuinely two-way theorem: every equivalence relation induces a unique partition, and every partition induces a unique equivalence relation. Recognizing which one you're handed lets you freely translate to whichever form is more convenient for the problem at hand.",
"<strong>Worked example:</strong> Define R on ℤ by aRb iff a≡b (mod 3) (same remainder when divided by 3). This is reflexive (a≡a), symmetric (a≡b⟹b≡a), and transitive (a≡b, b≡c⟹a≡c) -- an equivalence relation. It partitions ℤ into exactly 3 classes: [0]={...,-3,0,3,6,...}, [1]={...,-2,1,4,7,...}, [2]={...,-1,2,5,8,...}.",
"<strong>Self-check:</strong> to verify a candidate relation is an equivalence relation, check all THREE properties independently -- reflexive alone, or symmetric+transitive without reflexive, is not enough; a common mistake is assuming symmetric+transitive automatically implies reflexive (it does NOT, unless every element is already guaranteed related to something).",
"<strong>Application:</strong> K-means and other clustering algorithms partition a dataset into disjoint groups -- exactly the structure of equivalence classes; more precisely, k-fold cross-validation partitions your training data into k disjoint folds whose union is the full dataset, which is literally a set partition used to guarantee every data point gets used for both training and validation exactly once."
],
formulas:["Equivalence relation: reflexive ∧ symmetric ∧ transitive","[a] = {x∈A : xRa}","Equivalence classes partition A: pairwise disjoint, union = A"],
questions:[
{type:"Conceptual", q:"Explain why two equivalence classes [a] and [b] must be either identical or completely disjoint -- what would go wrong logically if they partially overlapped?"},
{type:"CS reasoning", q:"k-fold cross-validation splits a dataset into k disjoint folds. Explain precisely how this splitting is an instance of a set partition, and what property would be violated if two folds accidentally shared a data point."},
{type:"Reasoning", q:"Clustering algorithms like k-means don't always produce a relation that is perfectly transitive in the underlying similarity scores, yet the FINAL cluster assignment is still a strict partition. Explain how the algorithm 'forces' a true equivalence-relation structure (the partition) even when the raw pairwise similarity relation it started from was not itself transitive."}
]},

{d:13,week:3,title:"Basic Counting — Sum & Product Rules",big:false,steps:4,
diagram:"countingtree",
facts:[{tag:"KEY FACT", text:"Product Rule: if a task has k steps with n1, n2, ..., nk choices each, the total number of outcomes is n1×n2×...×nk."}, {tag:"CAUTION", text:"Use the SUM rule (add) only when choices are mutually exclusive alternatives -- use the PRODUCT rule (multiply) when choices are made in independent, sequential stages."}],
mcqs:[
{q:"The Product Rule applies when a task consists of:", options:["Mutually exclusive alternative choices", "A sequence of independent stages, each with its own choices", "A single choice only", "Choices that overlap"], correct:1, explain:"Multiply the number of options at each independent stage."},
{q:"The Sum Rule applies when:", options:["Tasks happen in sequence", "You choose ONE option from disjoint categories of choices", "Every choice must be made", "Order matters"], correct:1, explain:"Add the counts of mutually exclusive alternative ways to complete the task."},
{q:"A password has 3 letters followed by 2 digits (26 letters, 10 digits, repeats allowed). Total passwords:", options:["26+26+26+10+10", "26³×10²", "26³+10²", "(26+10)⁵"], correct:1, explain:"5 independent sequential choices → multiply: 26×26×26×10×10."},
{q:"Choosing a meal of EITHER a sandwich (5 options) OR a salad (3 options), not both:", options:["5×3=15 ways", "5+3=8 ways", "5³ ways", "3⁵ ways"], correct:1, explain:"Mutually exclusive alternatives → sum rule."},
{q:"A model architecture search picks 1 of 4 optimizers AND 1 of 3 learning rates AND 1 of 5 batch sizes. Total configurations:", options:["4+3+5=12", "4×3×5=60", "4³×3", "(4×3×5)²"], correct:1, explain:"Three independent sequential choices → multiply."}
],
core:"Every hyperparameter grid search, every combinatorial search space in AI, and every estimate of 'how big is the space of possible models' starts from these two simple counting rules -- getting sum vs. product right is the difference between a correct search-space size and one off by orders of magnitude.",
notes:[
"The PRODUCT RULE: if a task can be broken into a sequence of k independent stages, with n1 choices in stage 1, n2 choices in stage 2 (regardless of what was chosen in stage 1), and so on, the total number of ways to complete the whole task is n1×n2×...×nk.",
"The SUM RULE: if a task can be completed by choosing exactly ONE option from among several mutually exclusive, non-overlapping alternative CATEGORIES, the total number of ways is the sum of the counts within each category. Mixing these two rules up -- multiplying when you should add, or vice versa -- is the single most common counting error.",
"A useful diagnostic: ask 'am I making several choices IN SEQUENCE to build one single outcome?' (product rule) versus 'am I picking exactly ONE path from several alternative, disjoint routes?' (sum rule). A decision tree diagram, branching at each stage, visually distinguishes the two: product-rule stages branch DEEPER (multiply the branch counts along a path), sum-rule alternatives branch WIDER at the top (add the branch counts).",
"These rules combine freely: a more complex counting problem is usually solved by first applying the sum rule to split into disjoint cases, then the product rule within each case, then summing the per-case totals -- the exact same 'split into exhaustive cases' discipline from Day 6's proof by cases.",
"<strong>Worked example:</strong> A hyperparameter grid search tests 4 optimizers, 5 learning rates, and 3 batch sizes (independent sequential choices → product rule): 4×5×3=60 total configurations to train and evaluate.",
"<strong>Self-check:</strong> before computing, explicitly state in words whether you're 'choosing one from several alternatives' or 'making several choices to build one outcome' -- writing this sentence out loud catches sum/product confusion before you commit to a (possibly wrong) formula.",
"<strong>Application:</strong> Grid search over ML hyperparameters is a direct product-rule computation, and its rapid growth (adding just one more hyperparameter with 5 options MULTIPLIES total runs by 5) is exactly why practitioners switch to random or Bayesian search once the grid gets large -- a concrete motivation for the algorithmic complexity ideas closing out Week 4."
],
formulas:["Product Rule: n1×n2×...×nk (sequential independent choices)","Sum Rule: n1+n2+...+nk (mutually exclusive alternatives)"],
questions:[
{type:"Conceptual", q:"Construct your own short example (different from the ones given today) where using the sum rule instead of the product rule (or vice versa) would give a plausible-looking but WRONG answer, and explain exactly why the wrong rule fails."},
{type:"CS reasoning", q:"A binary image classifier pipeline chooses one of 3 preprocessing methods, THEN one of 6 model architectures, THEN one of 4 postprocessing steps. Compute the total number of distinct pipelines, showing which counting rule applies at each stage and why."},
{type:"Reasoning", q:"Explain, using the product rule directly, why adding a single new hyperparameter with only 2 possible values to an existing grid search can still meaningfully slow down a search that already has hundreds of configurations -- what does this reveal about how grid search scales?"}
]},

{d:14,week:3,title:"Permutations & Combinations",big:false,steps:5,
diagram:"permcomb",
facts:[{tag:"KEY FACT", text:"Permutations P(n,r) = n!/(n-r)! count ORDERED selections; combinations C(n,r) = n!/(r!(n-r)!) count UNORDERED selections."}, {tag:"CAUTION", text:"The deciding question is always 'does order matter here?' -- picking a committee (unordered) vs. picking a president/VP/secretary from the same group (ordered) use the SAME group but different formulas."}],
mcqs:[
{q:"The number of ways to arrange all n distinct objects in a row is:", options:["n", "n²", "n!", "2^n"], correct:2, explain:"n choices for the first spot, n-1 for the second, ..., down to 1: n!."},
{q:"P(n,r) counts:", options:["Unordered selections of r from n", "Ordered selections (arrangements) of r from n", "All subsets of size r", "Ways to partition n items"], correct:1, explain:"Permutations count arrangements where order matters."},
{q:"C(n,r) counts:", options:["Ordered arrangements", "Unordered selections (subsets) of size r from n", "n! total arrangements", "Only r=n cases"], correct:1, explain:"Combinations count subsets -- order is irrelevant."},
{q:"C(n,r) relates to P(n,r) by:", options:["C(n,r)=P(n,r)×r!", "C(n,r)=P(n,r)/r!", "C(n,r)=P(n,r)+r!", "They are always equal"], correct:1, explain:"Dividing by r! removes the ordering-within-the-selection that permutations count separately."},
{q:"Choosing 3 features to keep from a set of 10 (order doesn't matter) uses:", options:["P(10,3)", "C(10,3)", "10³", "10!"], correct:1, explain:"Feature SUBSETS are unordered selections -- combinations."}
],
core:"Whether you're counting neural architecture search spaces, feature subsets, or possible train/test splits, the permutation-vs-combination distinction (does order matter?) is the very first question that determines which formula -- and which magnitude of search space -- you're actually dealing with.",
notes:[
"A PERMUTATION of n distinct objects is an ORDERED arrangement of them. The number of ways to arrange all n objects in a row is n! (n factorial: n×(n-1)×(n-2)×...×2×1), since there are n choices for the first position, n-1 remaining for the second, and so on.",
"More generally, P(n,r)=n!/(n-r)! counts the number of ordered arrangements of r objects chosen FROM a larger set of n (a 'partial permutation'). This is exactly the product rule from Day 13 applied r times: n choices, then n-1, then n-2, ..., down to n-r+1.",
"A COMBINATION, by contrast, counts UNORDERED selections: C(n,r)=n!/(r!(n-r)!) (also written (n choose r)) counts the number of size-r SUBSETS of an n-element set, with no regard to the order elements were chosen in. Since each unordered subset of size r corresponds to exactly r! different ordered arrangements, C(n,r)=P(n,r)/r!.",
"The deciding question before applying either formula is always: 'if I select the same r elements but in a different order, do I get a genuinely DIFFERENT outcome?' If yes (electing a president, VP, and secretary from a group -- swapping who gets which role matters) use permutations; if no (selecting a 3-person committee with no distinct roles, or a subset of features) use combinations.",
"<strong>Worked example:</strong> From a pool of 8 candidate features, how many size-3 feature subsets exist? Order doesn't matter (it's just a subset kept for the model), so C(8,3)=8!/(3!5!)=56. If instead you needed to rank your TOP 3 features from 1st to 3rd most important, order WOULD matter: P(8,3)=8!/5!=336, exactly 3!=6 times larger, matching the C(n,r)=P(n,r)/r! relationship.",
"<strong>Self-check:</strong> when unsure, try a tiny concrete case (n=3, r=2) by hand-listing every outcome -- if swapping the two chosen elements' order produces something you'd count as 'the same' result, you need combinations; if it's 'different,' you need permutations.",
"<strong>Application:</strong> The number of possible feature subsets to evaluate in feature selection is C(n,k) for each subset size k -- summed over all k this is 2^n (matching Day 8's power-set count exactly), which is precisely why exhaustive feature selection is intractable beyond a few dozen features, motivating greedy or regularization-based alternatives in real ML pipelines."
],
formulas:["n! = n×(n-1)×...×1","P(n,r) = n!/(n-r)!","C(n,r) = n!/(r!(n-r)!) = P(n,r)/r!"],
questions:[
{type:"Conceptual", q:"Explain, using the relationship C(n,r)=P(n,r)/r!, precisely WHY dividing by r! is the correct correction to go from counting ordered arrangements to counting unordered subsets."},
{type:"CS reasoning", q:"A neural architecture search must choose an ORDERED sequence of 4 distinct layer types from a palette of 10 available layer types (order defines the network's structure, so distinct orderings ARE distinct architectures). Compute the number of possible architectures, and identify which formula you used and why."},
{type:"Reasoning", q:"Explain why C(n,k)=C(n,n-k) is always true (e.g. C(10,3)=C(10,7)) using a combinatorial argument about 'choosing k to keep' versus 'choosing n-k to discard' -- rather than by expanding the factorial formula algebraically."}
]},

{d:15,week:3,title:"Pigeonhole Principle & the Binomial Theorem",big:true,steps:6,
diagram:"pigeonhole",
facts:[{tag:"KEY FACT", text:"Pigeonhole Principle: if n items are placed into m containers and n>m, at least one container holds more than one item -- deceptively simple, surprisingly powerful."}, {tag:"INSIGHT", text:"The Binomial Theorem expands (x+y)^n using exactly the combination counts C(n,k) as coefficients -- counting and algebra turn out to be the same thing in disguise."}],
mcqs:[
{q:"The Pigeonhole Principle guarantees a collision when:", options:["n items are placed into n containers", "n items are placed into m containers with n>m", "Items are placed randomly", "n=m exactly"], correct:1, explain:"More items than containers forces at least one container to hold 2+ items."},
{q:"If you hash 20 keys into a table with 15 buckets, the Pigeonhole Principle guarantees:", options:["No collisions occur", "At least one bucket has 2+ keys", "All buckets are equally full", "The table will resize"], correct:1, explain:"20>15 forces at least one collision, regardless of hash quality."},
{q:"The Binomial Theorem states (x+y)^n expands to a sum of terms of the form:", options:["C(n,k)·x^k·y^(n-k)", "n·x^k·y^k", "x^n+y^n only", "k!·x^k"], correct:0, explain:"Each term's coefficient is exactly the combination count C(n,k)."},
{q:"The coefficients in a row of Pascal's Triangle correspond to:", options:["Factorials", "C(n,0), C(n,1), ..., C(n,n) for that row's n", "Permutation counts", "Prime numbers"], correct:1, explain:"Pascal's Triangle IS the binomial coefficients, arranged by row."},
{q:"The Generalized Pigeonhole Principle guarantees at least ⌈n/m⌉ items in some container when n items fill m containers. If n=100 items fill m=9 containers, some container holds at least:", options:["9 items", "11 items", "12 items", "100 items"], correct:2, explain:"⌈100/9⌉=⌈11.11⌉=12."}
],
core:"An idea so simple it sounds almost like a joke turns out to guarantee hash collisions, bound the compression ratio of any lossless algorithm, and explain the 'curse of dimensionality' -- closing Week 3 by connecting pure counting directly to the limits of real computational systems.",
notes:[
"The PIGEONHOLE PRINCIPLE states: if n items are distributed among m containers and n>m, then at least one container must hold MORE than one item. The proof is a one-line proof by contradiction (Day 6): if every container held at most one item, the total would be at most m items -- contradicting that there are n>m items to place.",
"The GENERALIZED version sharpens this: if n items fill m containers, some container holds AT LEAST ⌈n/m⌉ items (the ceiling of n/m). This turns a binary 'a collision exists' guarantee into a quantitative lower bound on how crowded the worst container must be.",
"The BINOMIAL THEOREM states (x+y)^n = Σ(k=0 to n) C(n,k)·x^(n-k)·y^k -- expanding a binomial power produces exactly one term per subset size k, with the combination count C(n,k) as its coefficient. This is not a coincidence: expanding (x+y)^n by hand corresponds to choosing, for each of the n factors, EITHER an x OR a y, and C(n,k) counts the number of ways to choose exactly k of the y's.",
"Arranging these coefficients by row (row n holds C(n,0) through C(n,n)) produces PASCAL'S TRIANGLE, where each entry is the sum of the two entries diagonally above it -- itself a beautiful, separately provable combinatorial identity (C(n,k)=C(n-1,k-1)+C(n-1,k)).",
"<strong>Worked example (pigeonhole):</strong> A hash table with 1000 buckets stores 1500 keys. By the Generalized Pigeonhole Principle, some bucket holds at least ⌈1500/1000⌉=2 keys -- guaranteed, regardless of how 'good' the hash function is, purely from the item-to-container counting mismatch.",
"<strong>Self-check:</strong> the Pigeonhole Principle only guarantees THAT a collision exists somewhere -- it says nothing about WHICH container, or how many collisions total; don't over-interpret it as a precise distribution result, only a guaranteed-minimum result.",
"<strong>Application:</strong> Every hash table's load factor analysis, every proof that lossless compression cannot shrink EVERY possible input file (there are more possible files than shorter output codes, so by pigeonhole some file must map to an output at least as long), and intuitions behind the curse of dimensionality (sparse high-dimensional data has 'more pigeonholes than pigeons,' making nearest-neighbor structure break down) all trace back to this one simple counting argument."
],
formulas:["Pigeonhole: n>m ⟹ some container holds ≥2 items","Generalized: some container holds ≥⌈n/m⌉ items","(x+y)^n = Σ C(n,k)x^(n-k)y^k"],
questions:[
{type:"Conceptual", q:"Write out, in your own words, the proof-by-contradiction argument establishing the basic Pigeonhole Principle, explicitly identifying what assumption is contradicted and how."},
{type:"CS reasoning", q:"A hash table has 500 buckets and currently stores 650 keys. Using the Generalized Pigeonhole Principle, compute the guaranteed minimum number of keys in the most-crowded bucket, and explain why this number is a GUARANTEE rather than merely a likely estimate."},
{type:"Reasoning", q:"Explain, at an intuitive level, how the Pigeonhole Principle relates to the 'curse of dimensionality' in machine learning -- as the number of features (dimensions) grows, why does a fixed amount of training data start to look increasingly 'sparse,' and what pigeonhole-style counting mismatch is happening here?"}
]},

{d:16,week:4,title:"Graph Theory Basics — Vertices, Edges & Degree",big:false,steps:5,

mcqs:[

core:"Neural networks, knowledge graphs, social networks, and dependency structures in data are all literally graphs -- vertices and edges are the single most common way both data AND computation itself get represented in machine learning systems.",
notes:[

"The DEGREE of a vertex v, deg(v), is the number of edges incident to (touching) it. In a directed graph this splits into IN-DEGREE (edges pointing in) and OUT-DEGREE (edges pointing out). Vertices with degree 0 are called ISOLATED.",
"The HANDSHAKE THEOREM states that in any undirected graph, Σ(v∈V) deg(v) = 2|E| -- the sum of all degrees is always exactly twice the number of edges, because every single edge is counted once from each of its two endpoints. An immediate corollary: the number of ODD-degree vertices in any graph must always be EVEN (an elegant, non-obvious consequence provable directly from this sum).",
"A graph can also be represented as an ADJACENCY MATRIX -- an n×n matrix where entry (i,j)=1 if there's an edge between vertex i and vertex j (and 0 otherwise) -- the exact same representation style used for relations on Day 11, since a graph's edge set IS a relation on its vertex set.",

mcqs:[
{q:"A tree is defined as a graph that is:", options:["Connected and contains at least one cycle", "Connected and acyclic (no cycles)", "Disconnected with cycles", "Any graph with exactly one vertex"], correct:1, explain:"Trees are the minimally-connected, cycle-free graphs."},

{q:"A DAG is a graph that is:", options:["Undirected and acyclic", "Directed and MAY contain cycles", "Directed and acyclic (no directed cycles)", "Always a tree"], correct:2, explain:"DAG = Directed Acyclic Graph: edges have direction, and following them can never loop back."},
{q:"Why can't a value in a computation graph depend (even indirectly) on itself?", options:["It's allowed and common", "It would create a directed cycle, making the computation order undefined/impossible", "Graphs don't support this concept", "It only matters for undirected graphs"], correct:1, explain:"A cycle would mean computing A requires B, which requires A -- no valid order exists."},
{q:"A Bayesian network, where nodes are random variables and edges represent direct dependencies, is structured as:", options:["An undirected cycle", "A DAG", "A tree only, never more general", "A complete graph"], correct:1, explain:"Dependencies must have a direction (cause→effect style) and no cycles, so a DAG."}
],
core:"Decision trees, Bayesian networks, and the backpropagation computation graph inside every neural network are all specific, named instances of tree and DAG structures -- the acyclic property isn't a mathematical curiosity, it's the exact property that makes 'compute this in a well-defined order' possible at all.",
notes:[
"A TREE is a connected, undirected graph with NO cycles. This single constraint has a precise numerical consequence: a tree with n vertices has EXACTLY n-1 edges -- any fewer and it couldn't be connected; any more and a cycle would necessarily appear. A ROOTED tree additionally designates one vertex as the root, giving every other vertex a well-defined parent and depth.",
"A CYCLE is a path that starts and ends at the same vertex without repeating any other vertex or edge along the way. A graph is ACYCLIC if it contains no cycles at all -- trees are the connected special case of acyclic graphs.",
"A DIRECTED ACYCLIC GRAPH (DAG) generalizes the acyclic idea to directed graphs: edges have direction, but following directed edges can never lead back to a vertex you've already visited. DAGs are precisely the structure needed whenever a valid 'processing order' (a topological sort) must exist -- a cycle would make no consistent order possible.",
"Trees and DAGs are not unrelated -- every tree, once you orient all its edges away from a chosen root, IS a DAG (specifically, one where every non-root vertex has exactly one parent). But general DAGs are strictly more flexible than trees, since a DAG vertex can have MULTIPLE parents (multiple incoming edges), which a tree vertex (aside from the root) cannot.",
"<strong>Worked example:</strong> A decision tree for classification has a root question, branching into child questions, ultimately reaching leaf nodes (class labels). With 15 total nodes, it has exactly 14 edges (n-1), confirming it's a valid tree -- no node is ever reachable by two different paths from the root.",
"<strong>Self-check:</strong> to verify a directed graph is truly acyclic (a valid DAG), attempt a topological sort (repeatedly remove a vertex with in-degree 0); if you ever get stuck with remaining vertices but no in-degree-0 vertex among them, a cycle exists and it is NOT a DAG.",
"<strong>Application:</strong> A neural network's backpropagation graph is a DAG (a value can never depend on its own future computation); a Bayesian network's structure IS a DAG expressing conditional dependencies between random variables; and a decision tree is, unsurprisingly, literally a tree in the graph-theoretic sense defined today."
],

{d:18,week:4,title:"Discrete Probability & Bayes' Theorem",big:true,steps:6,
diagram:"bayesdiagram",
facts:[{tag:"KEY FACT", text:"P(A|B) = P(A∩B)/P(B) -- conditional probability rescales the sample space down to just the outcomes where B already happened."}, {tag:"INSIGHT", text:"Bayes' Theorem lets you FLIP a conditional probability: P(A|B) = P(B|A)P(A)/P(B) -- go from 'how likely is evidence given a cause' to 'how likely is the cause given the evidence.'"}],
mcqs:[
{q:"For a finite sample space with equally likely outcomes, P(A) equals:", options:["|A|/|S|", "|A|+|S|", "|S|/|A|", "|A|×|S|"], correct:0, explain:"Classical probability: favorable outcomes over total outcomes."},
{q:"P(A|B), the conditional probability of A given B, is defined as:", options:["P(A)×P(B)", "P(A∩B)/P(B)", "P(A∪B)", "P(A)-P(B)"], correct:1, explain:"Restrict to the world where B is true, then ask how much of that world is also A."},
{q:"Bayes' Theorem states P(A|B) equals:", options:["P(A)/P(B)", "P(B|A)P(A)/P(B)", "P(A∩B)+P(B)", "P(A)+P(B|A)"], correct:1, explain:"Bayes' Theorem inverts the direction of conditioning using the definitions of conditional probability."},
{q:"Events A and B are INDEPENDENT if:", options:["P(A∩B)=P(A)+P(B)", "P(A∩B)=P(A)×P(B)", "P(A|B)=0", "A and B cannot both occur"], correct:1, explain:"Independence means knowing B occurred gives no information about A -- multiplicatively separable probabilities."},
{q:"In Naive Bayes classification, 'naive' refers to the assumption that:", options:["The classes are equally likely", "Features are conditionally independent given the class", "Only one feature is used", "Probabilities are always 0.5"], correct:1, explain:"Naive Bayes simplifies computation by (naively) assuming features don't interact given the class label."}
],
core:"Bayes' Theorem is not just a formula -- it's the mathematical engine behind an entire family of machine learning models (Naive Bayes, Bayesian networks, Bayesian inference broadly) that reason from observed evidence back to the most probable underlying cause.",
notes:[
"A PROBABILITY SPACE consists of a sample space S (all possible outcomes) and a probability function P assigning each event (subset of S) a number in [0,1], satisfying P(S)=1 and P(A∪B)=P(A)+P(B) for disjoint events. For equally-likely finite outcomes, P(A)=|A|/|S| -- directly reusing Week 3's counting rules to compute probabilities.",
"CONDITIONAL PROBABILITY P(A|B) ('probability of A given B') is defined as P(A∩B)/P(B), assuming P(B)>0. Intuitively, once you know B has occurred, you restrict your entire universe of possible outcomes down to just B, then ask what fraction of THAT restricted universe also satisfies A.",
"BAYES' THEOREM follows directly from the definition of conditional probability applied twice (once for P(A|B), once for P(B|A)) and solving algebraically: P(A|B) = P(B|A)·P(A) / P(B). This lets you INVERT a conditional probability -- going from 'how likely is this data GIVEN a hypothesis' (often easy to model) to 'how likely is the hypothesis GIVEN this data' (often what you actually want to know).",
"Two events A and B are INDEPENDENT if P(A∩B)=P(A)×P(B), equivalently if P(A|B)=P(A) -- knowing B occurred gives you zero new information about A's likelihood. This is a strong assumption, and 'Naive Bayes' classifiers get their name from naively ASSUMING all features are independent given the class label, which is rarely exactly true but works surprisingly well in practice.",
"<strong>Worked example:</strong> A rare disease affects 1% of a population (P(D)=0.01). A test is 95% accurate for sick people (P(+|D)=0.95) and has a 5% false positive rate for healthy people (P(+|¬D)=0.05). Given a positive test, P(D|+) = P(+|D)P(D) / [P(+|D)P(D)+P(+|¬D)P(¬D)] = (0.95×0.01)/(0.95×0.01+0.05×0.99) ≈ 0.161 -- only about 16%, a famously counterintuitive result driven by the disease's rarity.",
"<strong>Self-check:</strong> when a probability calculation 'feels' surprising (like the 16% result above), recompute the DENOMINATOR of Bayes' Theorem explicitly -- P(B) itself, expanded via the Law of Total Probability -- since forgetting to properly weight by the base rate P(A) is the single most common Bayes' Theorem error.",
"<strong>Application:</strong> Naive Bayes spam filters compute P(spam | words in email) using exactly this theorem, treating each word's presence as (naively) independent evidence; Bayesian neural networks and Bayesian hyperparameter optimization both use Bayes' Theorem to update a belief distribution as new data arrives, rather than committing to a single point estimate."
],
formulas:["P(A) = |A|/|S|  (equally likely outcomes)","P(A|B) = P(A∩B)/P(B)","Bayes: P(A|B) = P(B|A)P(A)/P(B)"],
questions:[
{type:"Conceptual", q:"Explain, using the disease-testing worked example, why a positive result on a 95%-accurate test for a RARE disease can still leave the true probability of having the disease quite low -- what role does the base rate P(D) play here?"},
{type:"CS reasoning", q:"A Naive Bayes spam filter assumes the presence of each word in an email is conditionally independent given whether the email is spam. Explain in plain terms what this independence assumption means concretely, and give an example of two words where this assumption is likely to be a poor approximation of reality."},
{type:"Reasoning", q:"Derive Bayes' Theorem yourself starting only from the definition of conditional probability P(A|B)=P(A∩B)/P(B), by writing P(A∩B) two different ways (once via P(A|B) and once via P(B|A)) and setting them equal."}
]},

{d:19,week:4,title:"Random Variables & Discrete Distributions",big:false,steps:5,
diagram:"distribution",
facts:[{tag:"KEY FACT", text:"A random variable X maps each outcome in a sample space to a number; its Expected Value E[X] = Σ x·P(X=x) is the long-run average value."}, {tag:"CAUTION", text:"Expected value is a WEIGHTED average, not the 'most likely' outcome -- E[X] can even be a value X can never actually equal (e.g. E[die roll]=3.5)."}],
mcqs:[
{q:"A random variable is formally a function that maps:", options:["Numbers to outcomes", "Outcomes in the sample space to real numbers", "Probabilities to events", "Events to other events"], correct:1, explain:"X assigns a numeric value to each possible outcome."},
{q:"For a fair coin flip X (1=heads, 0=tails), E[X] equals:", options:["1", "0", "0.5", "Undefined"], correct:2, explain:"E[X]=1×0.5+0×0.5=0.5, the average even though X itself never equals 0.5."},
{q:"A Bernoulli random variable models:", options:["A sequence of n independent trials", "A single trial with two outcomes (success/failure)", "A continuous measurement", "Only fair outcomes"], correct:1, explain:"Bernoulli(p) is the simplest discrete distribution: one trial, success probability p."},
{q:"A Binomial(n,p) random variable counts:", options:["The value of a single trial", "The number of successes in n independent Bernoulli(p) trials", "The probability of failure", "Always exactly n"], correct:1, explain:"Binomial sums n independent Bernoulli trials, using exactly the C(n,k) combination counts from Day 14."},
{q:"In machine learning, cross-entropy loss is directly derived from:", options:["The Pigeonhole Principle", "Expected value of negative log-probability under a distribution", "Graph theory", "Set complements"], correct:1, explain:"Cross-entropy is literally an expected value computation over predicted vs. true probability distributions."}
],
core:"The moment you compute a model's average loss over a dataset, or the expected reward in reinforcement learning, or cross-entropy loss itself, you're computing E[X] -- expected value is the single most-used concept from all of discrete probability inside working machine learning systems.",
notes:[
"A RANDOM VARIABLE X is a function mapping each outcome in a sample space to a real number. It's a way of numerically summarizing outcomes that might not themselves be numbers (e.g., X='number of heads' turns a sequence like HTH into the number 2).",
"The EXPECTED VALUE (or mean) of a discrete random variable is E[X] = Σ(all x) x·P(X=x) -- a probability-WEIGHTED average of every possible value X can take. Crucially, E[X] need not be a value X can ever actually equal (a fair six-sided die has E[X]=3.5, even though no roll ever shows 3.5).",
"Two of the most important discrete distributions: BERNOULLI(p) models a single trial with two outcomes, success (1) with probability p and failure (0) with probability 1-p, so E[X]=p. BINOMIAL(n,p) models the COUNT of successes across n independent Bernoulli(p) trials, with P(X=k)=C(n,k)p^k(1-p)^(n-k) -- directly reusing the combination counts and binomial coefficients from Day 15.",
"Expected value is LINEAR: E[X+Y]=E[X]+E[Y] always, even when X and Y are NOT independent -- a surprisingly strong and widely-used property. This is what justifies computing an average loss over a dataset as simply the (linear) average of per-example losses, without needing to worry about how examples relate to each other statistically.",
"<strong>Worked example:</strong> A binary classifier is correct on each of 100 independent test examples with probability p=0.9 each (Bernoulli(0.9) per example). The number of correct predictions X follows Binomial(100, 0.9), with E[X]=np=90 -- you'd expect about 90 correct predictions on average, with the Binomial formula giving the exact probability of any specific count.",
"<strong>Self-check:</strong> when a computed E[X] surprises you (a fractional value, or a value 'outside' what a single trial could produce), remember E[X] is a long-run AVERAGE across many repetitions, not a single-instance prediction -- this is the same conceptual trap as expecting a die to literally roll 3.5.",
"<strong>Application:</strong> Cross-entropy loss, the standard loss function for classification, is precisely E[−log P(true class)] -- an expected value computed over the true label distribution; and the expected reward that reinforcement learning agents try to maximize is, again, literally E[X] applied to a random variable representing cumulative reward."
],
formulas:["E[X] = Σ x·P(X=x)","Bernoulli(p): E[X]=p","Binomial(n,p): P(X=k)=C(n,k)p^k(1-p)^(n-k), E[X]=np"],
questions:[
{type:"Conceptual", q:"Explain why E[X] for a fair six-sided die (3.5) is a value the die can never actually show, and why this is not a contradiction but rather exactly what 'expected value' is designed to mean."},
{type:"CS reasoning", q:"A model makes independent binary predictions on 50 test examples, each correct with probability 0.8. Using the Binomial distribution's expected value formula, compute the expected NUMBER of correct predictions, and explain what additional information the full Binomial formula (not just E[X]) would tell you that the expected value alone does not."},
{type:"Reasoning", q:"Explain, in your own words, why cross-entropy loss being 'an expected value of negative log-probability' connects directly back to Day 18's conditional probability and Bayes' Theorem material -- what is the loss function fundamentally trying to measure about a model's predicted probability distribution?"}
]},

function conceptMapSVG(nodes){
  const n = nodes.length, totalW = 420, boxW = Math.min(110, (totalW-(n-1)*16)/n), gap = (totalW-n*boxW)/(n-1);
  let x = 10, boxes='', arrows='';
  nodes.forEach((label,i)=>{
    boxes += `<rect x="${x}" y="68" width="${boxW}" height="38" rx="3" fill="#121D2C" stroke="#1F5FA8" stroke-width="1.5"/><text x="${x+7}" y="91" style="font:9.5px 'IBM Plex Mono',monospace;fill:#E7EDF3">${label.length>15?label.slice(0,15):label}</text>`;
    if(i<n-1){ arrows += `<line x1="${x+boxW}" y1="87" x2="${x+boxW+gap-4}" y2="87" stroke="#1F8A57" stroke-width="2" marker-end="url(#ac)"/>`; }
    x += boxW+gap;
  });
  return svg(boxes+arrows);
}

function diagramHTML(spec){
  if(typeof spec === 'string') return DIAGRAMS[spec] || '';
  if(spec.type === 'conceptmap') return conceptMapSVG(spec.nodes);
  return '';
}

// ---------- Rendering ----------
const weekListEl = document.getElementById('week-list');
const contentEl = document.getElementById('content');
const crumbEl = document.getElementById('crumb');
const TOTAL_DAYS = 20;
let currentDay = 1;

/* ---------------- progress persistence (real account, via storage-shim.js) ---------------- */
// progress[day] = { answers: { qi: chosenOptionIndex }, correct: n, total: n }
let progress = {};
async function loadProgress(){
  if(!(window.storage && typeof window.storage.get === 'function')) return;
  try{
    const res = await window.storage.get('progress', false);
    if(res && res.value){ progress = JSON.parse(res.value); }
  }catch(e){ /* start fresh if anything's malformed */ }
}
async function saveProgress(){
  if(!(window.storage && typeof window.storage.set === 'function')) return;
  try{ await window.storage.set('progress', JSON.stringify(progress), false); }catch(e){}
}
function isDayComplete(dayNum){
  const day = DAYS.find(x=>x.d===dayNum);
  const entry = progress[dayNum];
  return !!(day && entry && entry.total === day.mcqs.length && entry.correct !== undefined);
}

function buildSidebar(){
  WEEKS.forEach(w=>{
    const det = document.createElement('details');
    det.className = 'week';
    det.open = (w.n===1);
    const sum = document.createElement('summary');
    sum.innerHTML = `<span>Week ${w.n} — ${w.title}</span><span class="wk-range">${w.range}</span>`;
    det.appendChild(sum);
    const list = document.createElement('div');
    list.className = 'day-list';
    DAYS.filter(d=>d.week===w.n).forEach(d=>{
      const btn = document.createElement('button');
      btn.className = 'day-btn';
      btn.id = 'nav-' + d.d;
      btn.innerHTML = `<span class="num">${String(d.d).padStart(2,'0')}</span><span>${d.title}</span>${d.big?'<span class="flag">7-STEP</span>':''}<span class="flag" id="done-${d.d}" style="display:${isDayComplete(d.d)?'':'none'};">✓</span>`;
      btn.onclick = ()=>renderDay(d.d, true);
      list.appendChild(btn);
    });
    det.appendChild(list);
    weekListEl.appendChild(det);
  });
}

function renderDay(n, scrollNav){
  const d = DAYS.find(x=>x.d===n);
  if(!d) return;
  currentDay = n;
  document.querySelectorAll('.day-btn').forEach(b=>b.classList.remove('active'));
  const activeBtn = document.getElementById('nav-'+n);
  if(activeBtn){
    activeBtn.classList.add('active');
    const parentDetails = activeBtn.closest('details');
    if(parentDetails) parentDetails.open = true;
    if(scrollNav) activeBtn.scrollIntoView({block:'nearest'});
  }
  const week = WEEKS.find(w=>w.n===d.week);
  crumbEl.textContent = `WEEK ${d.week} · ${week.title.toUpperCase()}`;

  const notesHtml = d.notes.map(p=>`<p>${p}</p>`).join('');
  const formulaHtml = d.formulas.map(f=>`<div class="formula">${f}</div>`).join('');
  const qHtml = d.questions.map(q=>`<div class="qcard"><div class="qtype">${q.type}</div><p>${q.q}</p></div>`).join('');
  const diagramSvg = diagramHTML(d.diagram);
  const factsHtml = d.facts.map(f=>{
    const cls = f.tag==='INSIGHT' ? 'insight' : (f.tag==='CAUTION' ? 'caution' : 'key');
    return `<div class="fact ${cls}"><span class="tag">${f.tag}</span>${f.text}</div>`;
  }).join('');
  const mcqHtml = d.mcqs.map((m,qi)=>{
    const opts = m.options.map((opt,oi)=>
      `<button class="mcq-opt" data-day="${d.d}" data-q="${qi}" data-o="${oi}">${String.fromCharCode(65+oi)}. ${opt}</button>`
    ).join('');
    return `<div class="mcq-card" id="mcq-${d.d}-${qi}">
      <div class="mcq-q">${qi+1}. ${m.q}</div>
      <div class="mcq-options">${opts}</div>
      <div class="mcq-explain" id="exp-${d.d}-${qi}">${m.explain}</div>
    </div>`;
  }).join('');

  contentEl.innerHTML = `
    <div class="day-meta">
      <span class="day-tag">DAY ${String(d.d).padStart(2,'0')} / ${TOTAL_DAYS}</span>
      <span class="step-tag ${d.big?'big':''}">${d.steps}-step ${d.big?'(big topic)':''}</span>
    </div>
    <h2 class="day-title">${d.title}</h2>
    <p class="core-idea">${d.core}</p>
    <div class="diagram-wrap">${diagramSvg}<div class="diagram-cap">figure — Day ${d.d} concept sketch (animated)</div></div>
    <section class="block">
      <h3>KEY FACTS</h3>
      <div class="facts">${factsHtml}</div>
    </section>
    <section class="block notes">
      <h3>NOTES</h3>
      ${notesHtml}
    </section>
    <section class="block">
      <h3>IMPORTANT FORMULAS</h3>
      <div class="formula-list">${formulaHtml}</div>
    </section>
    <section class="block">
      <h3>CRITICAL-THINKING &amp; CS REASONING</h3>
      <div class="qlist">${qHtml}</div>
    </section>
    <section class="block">
      <h3>QUICK CHECK — 5 MULTIPLE CHOICE</h3>
      <div class="mcq-score" id="mcq-score-${d.d}">0 / ${d.mcqs.length} answered</div>
      <div class="mcq-list">${mcqHtml}</div>
    </section>
    <div class="daynav">
      <button id="prevBtn" ${n<=1?'disabled':''}>&larr; Day ${n-1}</button>
      <button id="nextBtn" ${n>=TOTAL_DAYS?'disabled':''}>Day ${n+1} &rarr;</button>
    </div>
  `;
  const prevBtn = document.getElementById('prevBtn');
  const nextBtn = document.getElementById('nextBtn');
  if(prevBtn) prevBtn.onclick = ()=>{renderDay(n-1,true); window.scrollTo(0,0);};
  if(nextBtn) nextBtn.onclick = ()=>{renderDay(n+1,true); window.scrollTo(0,0);};
  restoreAnswerState(d);
  window.scrollTo(0,0);
}

// Re-applies the same visual "answered" state (correct/incorrect
// highlighting + explanation shown) that the click handler below applies
// live — used here so revisiting a day, or reloading the page, shows your
// past answers instead of a blank quiz every time.
function restoreAnswerState(d){
  const entry = progress[d.d];
  if(!entry || !entry.answers) return;
  Object.keys(entry.answers).forEach(qiStr=>{
    const qi = parseInt(qiStr);
    const oi = entry.answers[qiStr];
    const m = d.mcqs[qi];
    if(!m) return;
    const card = document.getElementById('mcq-'+d.d+'-'+qi);
    if(!card || card.classList.contains('answered')) return;
    card.classList.add('answered');
    const opts = card.querySelectorAll('.mcq-opt');
    opts.forEach((o,i)=>{
      o.classList.add('disabled');
      if(i===m.correct) o.classList.add('correct');
      else if(i===oi) o.classList.add('incorrect');
    });
    const exp = document.getElementById('exp-'+d.d+'-'+qi);
    if(exp) exp.classList.add('show');
  });
  const scoreEl = document.getElementById('mcq-score-'+d.d);
  if(scoreEl && entry.total !== undefined){
    scoreEl.textContent = `${entry.total} / ${d.mcqs.length} answered — ${entry.correct} correct so far`;
  }
}

(async function init(){
  await loadProgress();
  buildSidebar();
  renderDay(1, true);
})();

// ---------- MCQ interaction (event delegation, session-only state) ----------
contentEl.addEventListener('click', function(e){
  const btn = e.target.closest('.mcq-opt');
  if(!btn) return;
  const card = btn.closest('.mcq-card');
  if(card.classList.contains('answered')) return;
  card.classList.add('answered');

  const dayNum = parseInt(btn.dataset.day);
  const qi = parseInt(btn.dataset.q);
  const oi = parseInt(btn.dataset.o);
  const day = DAYS.find(x=>x.d===dayNum);
  const m = day.mcqs[qi];

  const opts = card.querySelectorAll('.mcq-opt');
  opts.forEach((o,i)=>{
    o.classList.add('disabled');
    if(i===m.correct) o.classList.add('correct');
    else if(i===oi) o.classList.add('incorrect');
  });
  const exp = document.getElementById('exp-'+dayNum+'-'+qi);
  if(exp) exp.classList.add('show');

  const scoreEl = document.getElementById('mcq-score-'+dayNum);
  let answered = 0, correctCount = 0;
  if(scoreEl){
    answered = card.parentElement.querySelectorAll('.mcq-card.answered').length;
    correctCount = Array.from(card.parentElement.querySelectorAll('.mcq-card.answered')).reduce((acc,c)=>{
      const chosenIncorrect = c.querySelector('.mcq-opt.incorrect');
      return acc + (chosenIncorrect ? 0 : 1);
    },0);
    scoreEl.textContent = `${answered} / ${day.mcqs.length} answered — ${correctCount} correct so far`;
  }

  // Save this answer to the real account (see storage-shim.js) — not just
  // this browser tab, so progress picks up correctly on any device.
  if(!progress[dayNum]) progress[dayNum] = { answers: {} };
  progress[dayNum].answers[qi] = oi;
  progress[dayNum].total = answered;
  progress[dayNum].correct = correctCount;
  saveProgress();
  if(answered === day.mcqs.length){
    const doneFlag = document.getElementById('done-'+dayNum);
    if(doneFlag) doneFlag.style.display = '';
  }
});
</script>
